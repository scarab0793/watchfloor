name: Collect news candidates (staging only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,18 * * *'
permissions:
  contents: write
concurrency:
  group: watchfloor-news-candidates
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automated-news-ingestion
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect feeds
        run: python automation/collect.py
      - name: Commit staging candidates only
        run: |
          git config user.name "watchfloor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update staged news candidates"
            git push origin HEAD:feature/automated-news-ingestion
          fi
