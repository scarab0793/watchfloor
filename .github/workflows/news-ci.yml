name: News collector tests
on:
  pull_request:
    paths:
      - 'automation/**'
      - '.github/workflows/news-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s automation -p 'test_*.py' -v
