name: WatchFloor News preflight (no AI cost)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/*.py'
      - 'automation/sources.json'
      - 'automation/editorial_config.json'
      - '.github/workflows/news-preflight.yml'
      - 'template.html'
      - 'build.py'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check rollout readiness without revealing secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITORIAL_ENABLED: ${{ vars.WATCHFLOOR_EDITORIAL_ENABLED }}
          RELEASE_ENABLED: ${{ vars.WATCHFLOOR_NEWS_RELEASE_ENABLED }}
        run: |
          {
            echo "## WatchFloor rollout readiness"
            if test -n "$OPENAI_API_KEY"; then
              echo "- OpenAI API secret: configured"
            else
              echo "- OpenAI API secret: missing"
              echo "::warning::OPENAI_API_KEY missing; AI publishing remains blocked, but source diagnostics will continue"
            fi
            if test "$EDITORIAL_ENABLED" = "true"; then
              echo "- Editorial schedule: enabled"
            else
              echo "- Editorial schedule: disabled (WATCHFLOOR_EDITORIAL_ENABLED must be true)"
            fi
            if test "$RELEASE_ENABLED" = "true"; then
              echo "- Manual release gate: enabled"
            else
              echo "- Manual release gate: disabled (WATCHFLOOR_NEWS_RELEASE_ENABLED must be true)"
            fi
            echo "- Live automatic deployment: not configured"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run offline tests
        run: python -m unittest discover -s automation -p 'test_*.py' -v
      - name: Collect live public sources without AI
        run: |
          python automation/collect.py
          python automation/select.py
      - name: Validate selection and multilingual preview
        run: |
          python build.py index.html watchfloor-news-preview.html
          python - <<'PY'
          import json
          from pathlib import Path
          candidates=json.loads(Path("automation/candidates.json").read_text())
          selected=json.loads(Path("automation/selected.json").read_text())
          preview=Path("watchfloor-news-preview.html").read_text()
          assert isinstance(candidates,list) and isinstance(selected,list)
          assert all(x.get("status")=="staging_unverified" for x in selected)
          assert "loadAutomatedNews" in preview
          print(f"Candidates: {len(candidates)}; selected: {len(selected)}; preview OK")
          PY
      - name: Upload diagnostic artifacts (no publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchfloor-news-preflight
          path: |
            automation/candidates.json
            automation/selected.json
            watchfloor-news-preview.html
          if-no-files-found: warn
          retention-days: 7
