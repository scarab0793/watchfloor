name: Update Watchfloor
on:
  schedule:
    - cron: "17 6,17 * * *"   # 2x daily (UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency: watchfloor-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install Pillow
      - name: Collect and write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
          MAX_NEW: "4"
        run: python3 tools/auto_update.py
      - name: Share pages
        run: python3 tools/gen_share.py
      - name: Commit and push
        run: |
          git config user.name "watchfloor-bot"
          git config user.email "watchfloor-bot@users.noreply.github.com"
          git add index.html a img
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Auto-update Watchfloor $(date -u +'%d %b %Y %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
