{id:"elbit-puls",r:"Middle East",c:"Artillery",st:"Confirmed",time:"19 Oct",
t:"Elbit wins $235 million for PULS launchers and EXTRA-MR rockets",
s:"The three-year government-to-government deal went to an unnamed European customer. Israeli reports say it is Azerbaijan.",
p:["Elbit Systems announced on 19 October that it had won a contract worth about $235 million to supply EXTRA-MR rockets and Precise & Universal Launching System (PULS) rocket artillery to a European country. The agreement is between Israel’s Ministry of Defense and the customer’s ministry, runs over three years, and also covers additional rocket-artillery platforms and integrated logistics support. Elbit did not name the customer, but Israeli outlet Globes, cited by The Defense Post, identified it as Azerbaijan.",
"Elbit’s president and CEO, Bezhalel Machlis, said the award strengthens the company’s position in rocket artillery and reflects growing international demand, and that a growing number of customers, including European and NATO states, have chosen PULS.",
"PULS is a modular launcher that can fire guided and unguided rockets, tactical ballistic missiles and loitering munitions. Its reported range is up to 300 km, and it can launch loitering munitions to 100 km. It can fire from fixed positions or on the move in under a minute, reportedly with a circular error probable below 5 metres, and it can sit on wheeled or tracked vehicles. EXTRA-MR is a precision-guided rocket for high-value targets up to 80 km away.",
"The Defense Post links the deal to renewed Israel–Azerbaijan defence ties. Azerbaijan used many Israeli weapons in the 2020 Nagorno-Karabakh war, including Elbit’s Hermes 900 drones, IAI’s LORA ballistic missile and Harop loitering munition, and Spike anti-tank missiles. Elbit reported an order backlog of $32.0 billion at 30 June 2026."],
cav:"The contract is confirmed by Elbit’s own release, but the customer’s identity rests on Globes’ reporting. The performance figures for PULS are reported ones and have not been verified, and the possible maintenance benefits of mounting it on different vehicles are described only as a possibility.",
src:[["Elbit press release (PR Newswire)","https://www.prnewswire.com/news-releases/elbit-systems-awarded-235-million-contract-to-supply-extra-mr-rockets-and-puls-launchers-to-a-european-country-302912363.html"],[DP,"https://thedefensepost.com/2026/10/21/elbit-puls-launchers/"]]},

{id:"israel-apache",r:"Middle East",c:"Helicopters",st:"Reported",time:"14 Oct",
t:"Israel signs a $1 billion deal for 12 AH-64E Apache helicopters",
s:"Deliveries are expected between 2030 and 2033. The contract was finalised six days after Israel missed a US ordering deadline over financing.",
p:["On 14 October Israel’s Ministry of Defense signed an agreement with the United States for 12 Boeing AH-64E Apache Guardian attack helicopters, valued at about $1 billion. Deliveries are expected between 2030 and 2033, and squadron assignments and exact dates have not been announced. The 12 aircraft cover 40% of the 30 helicopters authorised in a potential $3.8 billion US Foreign Military Sales package earlier in 2026.",
"The purchase was delayed. Israel missed the US ordering deadline after the Defense and Finance ministries disagreed over $288 million in financing, and three US deadline extensions did not resolve it. The government then approved extra funds: NIS 1 billion moved to defence procurement, reportedly from a 2027–2029 Arab community development programme, plus NIS 68 million from the 2026 state budget. The contract was finalised six days after the missed deadline on the instruction of Defense Ministry Director General Amir Baram. The package averages about $83.3 million per helicopter, against $126.7 million under the earlier authorisation, although both figures include related equipment and are not direct production prices.",
"The helicopters are the Version 6 standard. They bring the AN/APG-78 Longbow radar, with a stated detection range of 16 km against 8 km on earlier versions, maritime targeting for surface vessels, improved engines and manned-unmanned teaming with drones. Israel flies 23 AH-64A Petens and 20 AH-64D Sarafs, so the 12 new aircraft equal about 28% of that fleet, and by 2032 the oldest AH-64As will have been in service for 42 years."],
cav:"Israel has not confirmed its missile inventory or weapons configuration, the US authorisation does not specify missile quantities, and compatibility with Israel’s own drones has not been stated. The financing dispute and the budget transfers are as reported by Army Recognition.",
src:[[AR,"https://www.armyrecognition.com/news/aerospace-news/2026/israel-signs-1-billion-deal-for-12-new-us-ah-64e-apache-attack-helicopters-with-maritime-strike-capabilities"],[DP,"https://thedefensepost.com/2026/10/20/israel-ah-64e-apache/"]],
img:"https://www.armyrecognition.com/images/stories/news/2026/october/Israel%20signs%201%20billion%20deal%20for%2012%20US%20AH-64E%20Apache%20attack%20helicopters%20with%20maritime%20strike%20capabilities%20925%20001.jpg",cr:"US Department of Defense, as credited by Army Recognition (US government work, public domain)"},

{id:"us-made-tamir",r:"Middle East",c:"Air defence",st:"Reported",time:"9 Oct",
t:"Raytheon-Rafael plant delivers the first US-made Tamir interceptor to Israel",
s:"The Camden, Arkansas line is described as the first outside Israel able to build complete Iron Dome interceptors.",
p:["A Raytheon–Rafael Advanced Defense Systems facility in Camden, Arkansas, has delivered its first fully US-made Tamir interceptor to Israel, The Defense Post reported on 9 October. The article presents it as a milestone in creating a second production source for the Iron Dome air-defence system. The US has supplied Tamir components for years, but Camden is described as the first plant outside Israel able to produce complete Iron Dome interceptors, with the aim of speeding up deliveries and strengthening US–Israeli missile defence.",
"The same line will also build SkyHunter, the US version of the Tamir, for the US Marine Corps’ Medium-Range Intercept Capability system. Rafael developed Tamir with Raytheon’s support. It intercepts rockets and other short-range threats at 4 to 70 km, using radar guidance, a command datalink and a blast warhead.",
"Moshe Patel, director of the Israel Missile Defense Organization, was reported as saying Israel’s multi-layered defence, especially Iron Dome, has repeatedly saved lives and reduced damage, and that the new line is a significant step in shared production capacity. Shlomo Toaff, head of Rafael’s Air and Missile Defense Division, said the company was proud to turn the facility into a working production line, and that it gives Tamir customers another reliable supplier and supports SkyHunter for the Marines."],
cav:"The article does not give how many interceptors were delivered, the contract value, production rates or a timeline for full-rate output. Patel’s remarks are reported secondhand.",
src:[[DP,"https://thedefensepost.com/2026/10/09/us-made-tamir-israel/"]]},

{id:"arad-argentina",r:"Middle East",c:"Small arms",st:"Reported",time:"1 Oct",
t:"Israel ships the first ARAD rifles to Argentina",
s:"Argentina’s armed forces received 250 rifles from Israel Weapon Industries, the start of an expected 1,600-rifle contract.",
p:["The Argentine Armed Forces have received an initial batch of 250 ARAD modular assault rifles from Israel Weapon Industries, The Defense Post reported on 1 October. The rifles begin replacing the service’s ageing FN FAL and M16 weapons. The Argentine Joint Chiefs of Staff led the purchase, signed as a government-to-government contract in June 2026, and the Ministry of Defence said on 29 September that reception and acceptance testing of the first lot was complete.",
"The batch has 200 ARAD-5 rifles in 5.56×45 mm for the Air Force and Naval Infantry and 50 ARAD-7 rifles in 7.62×51 mm for Army security units. Both use short-stroke gas pistons, ambidextrous controls and Picatinny rails, and carry MEPRO M-5 red-dot sights. Argentina tested the rifles against US and European alternatives in 2024–2025 before choosing them.",
"The handover is part of an expected 1,600-rifle contract, with the next tranche due in early 2027 after instructor training later in October. Officials are considering a local assembly line. Defence Minister Carlos Presti said at a ceremony in Buenos Aires that a rifle stays in service for decades and accompanies soldiers through training and operations. The purchase is part of a wider recapitalisation under President Javier Milei that also includes F-16 jets, P-3 Orion patrol aircraft and Stryker vehicles."],
cav:"No unit cost or full timeline is given. Cost figures, about 2 billion pesos for ARAD-5 rifles and 2.7 billion for ARAD-7 rifles through August, come from local press reports, not official statements.",
src:[[DP,"https://thedefensepost.com/2026/10/01/argentina-arad-rifles-israel/"]]},

{id:"fire-storm-250",r:"Middle East",c:"Drones",st:"Company claim",time:"13 Oct",
t:"IAI and SIG Sauer fire an M250 machine gun from the Fire Storm 250 drone",
s:"The live-fire test, announced on 13 October, put a remotely controlled weapon station on an armed quadcopter derived from IAI’s APUS.",
p:["Israel Aerospace Industries and SIG Sauer carried out a live-fire test of the Fire Storm 250 unmanned aircraft armed with the US-made M250 machine gun. IAI announced the test on 13 October and Army Recognition reported it the next day. IAI presents the reusable aircraft as a way to give ground forces their own persistent airborne surveillance and direct-fire capability.",
"In the trial the drone hovered over the test area, found and identified targets with its electro-optical sensor, then engaged them through a SIG Sauer Microlight remote weapon station carrying the M250. IAI said it fired in single-shot and semi-automatic modes from different ranges and altitudes, and the operator received imagery, tracking data and fire-control information. A human stays in the loop and keeps authority over weapons release. The test took place in a simulated battlefield environment.",
"The Fire Storm 250 builds on IAI’s APUS armed vertical take-off design. IAI states it can stay airborne for up to three hours while carrying 200 rounds, and its combat-ready weight is 53 lb including the weapon station, the M250 and ammunition. The US Army describes the standard M250 as a lightweight belt-fed 6.8×51 mm light machine gun developed under the Next Generation Squad Weapon programme to replace the M249. Intended missions include close air support, border security, suppressive fire, force protection, route overwatch and protecting strategic sites. The idea is to shorten the sensor-to-shooter cycle by putting surveillance and direct fire on one aircraft."],
cav:"IAI has not disclosed accuracy, engagement ranges, target sizes, hit probability or performance against moving targets, and has not announced a customer, contract or fielding schedule. Datalink resilience, navigation without satellite signals, electronic attack and survivability against counter-drone systems are open questions.",
src:[[AR,"https://www.armyrecognition.com/news/aerospace-news/2026/iai-and-sig-sauer-test-m250-armed-fire-storm-250-unmanned-aircraft-for-tactical-airborne-fire-support"]]},

{id:"idf-battlefield-care",r:"Middle East",c:"Medical",st:"Reported",time:"15 Oct",
t:"US Army urges forces to study how the IDF halved battlefield fatality rates",
s:"An Army medical command report says the IDF’s fatality rate fell from 15% in 2006 to 7.1% in the conflict after 7 October 2023.",
p:["The US Army is encouraging American forces to study and adopt Israel Defense Forces battlefield medicine after the IDF roughly halved its fatality rate among casualties, The Defense Post reported on 15 October. A report from the Army’s 68th Theater Medical Command, the Europe and Africa component, published earlier in 2026, says the IDF cut its casualty fatality rate from 15% in the 2006 Lebanon War to 7.1% in the multi-front conflict that followed the 7 October 2023 attacks.",
"The report credits changes in frontline care. Medical personnel and physicians were embedded in combat companies, advanced life-support response time was cut from 20 minutes to four, and helicopters evacuated casualties quickly. Digital networks tracked patients along the chain of care, and bleeding was controlled aggressively. Plasma and whole blood were given early, at the point of injury, with refrigerated coolers carried in backpacks to move blood units forward under fire.",
"The report argues that the time to prepare is now: clinical and tactical skills are not enough without rapid change in the system, which it links to the Army’s need to win large-scale combat operations and preserve force health. Dr. Marc Siegel, a senior medical analyst at Fox News, told the outlet that Israeli advances, including surgical techniques and the NexoBrid burn treatment, could also help civilian medicine."],
cav:"The article does not explain how the fatality figures were calculated or whether the two conflicts can be compared directly. The numbers are cited from the Army document without independent verification.",
src:[[DP,"https://thedefensepost.com/2026/10/15/us-battlefield-care-israel/"]]},

{id:"arrow-3-explainer",r:"Middle East",c:"Missile defence",st:"Analysis",time:"17 Oct",
t:"Explainer: how Arrow 3 sits at the top of Israel’s layered air defence",
s:"The analysis argues that Iron Dome is one of the lowest tiers, with Arrow 3 handling long-range ballistic missiles outside the atmosphere.",
p:["Aerospace Global News argues that Israel’s air defence is widely misunderstood. Iron Dome is the best known system, and the US Golden Dome name echoes it, but Iron Dome is among the lowest layers. The top layer is Arrow 3, built by Israel Aerospace Industries, which intercepts long-range ballistic missiles outside the atmosphere in mid-course flight and gives Israel an early chance to engage. It is aimed at newer long-range threats, especially those that could carry weapons of mass destruction, and the article calls it Israel’s counterpart to the US THAAD.",
"The other layers are Iron Beam, a new directed-energy weapon for rockets, mortars and drones whose effectiveness is not yet clear; Iron Dome, a mature system against short-range and artillery rockets, some drones and some cruise missiles; David’s Sling, the middle layer that replaced Patriot in Israeli service; and Arrow 2, which defends against ballistic missiles at high altitude and in the final phase. Arrow 3 uses Green Pine and Super Green Pine radars, a battle-management element, fire control and interceptors in sealed launcher canisters that destroy targets by hit-to-kill.",
"The article says Arrow 3 took part in the June 2025 war with Iran and the 2026 conflict and reportedly shot down a large number of Iranian missiles, but the count and success rate have not been disclosed. On exports, Germany is the only confirmed foreign Arrow 3 customer, having signed in 2023 for about €3.8 billion, and it expanded its order after Israel delivered the first systems in December 2025. Greece bought the Achilles Shield package, reported at $3.5 billion, which includes David’s Sling and BARAK MX, and Finland is a David’s Sling customer. The main Western alternatives are THAAD and the SM-3/Aegis family. The US takes part substantially, keeps export controls and supplies critical components."],
cav:"Public data is limited. Arrow 3’s kill count is undisclosed, Iron Beam’s effectiveness is unknown, and the claim that Israel’s defences led Iran to target Arab neighbours more heavily in 2026 is the analyst’s interpretation.",
src:[["Aerospace Global News","https://aerospaceglobalnews.com/news/israels-arrow-weapon-system-explained"]]},

{id:"idf-ai-branch",r:"Middle East",c:"Military AI",st:"Official claim",time:"22 Sep",
t:"IDF creates a branch for unmanned systems and artificial intelligence",
s:"Chief of Staff Eyal Zamir says the new branch will oversee drones, robotics and AI across air, land and sea.",
p:["The Israel Defense Forces is bringing artificial intelligence, drones, robotics and other autonomous capabilities under one new branch, the Unmanned Systems and Artificial Intelligence Branch, The Defense Post reported on 22 September. IDF Chief of Staff Lt. Gen. Eyal Zamir described its remit.",
"According to Zamir, the branch will oversee capabilities in the air, land and maritime domains, including systems that work alongside human teams and systems that carry out missions on their own. The article frames the move as part of the IDF’s growing use of emerging technology, with AI and autonomy at its centre."],
cav:"The report is short and gives no budget, personnel numbers, start date, commander, named systems or operational reasons. It includes no criticism or outside comment.",
src:[[DP,"https://thedefensepost.com/2026/09/22/israel-military-ai-branch/"]]},


{id:"elbit-sweden-lws",r:"Middle East",c:"Electronic warfare",st:"Company claim",time:"14 Oct",
t:"Elbit plans its first European laser-warning factory in Sweden, opening in 2027",
s:"Elbit Systems Sweden will assemble, integrate and support next-generation passive laser warning systems for European customers.",
p:["Elbit Systems plans a Laser Warning System (LWS) centre in Sweden, run by Elbit Systems Sweden and due to open in 2027, European Security & Defence reported. It would be the company’s first European facility dedicated to these systems and would handle local assembly, integration, maintenance and lifecycle support. Elbit says the investment deepens its industrial presence in Europe and reduces reliance on sites outside the region.",
"The centre will focus on the next generation of Elbit’s passive LWS, which detect and locate laser emissions aimed at a platform without transmitting signals of their own. A detected laser can suggest that a vehicle is being observed, ranged or designated for a laser-guided weapon, giving the crew time to respond. The new generation reportedly uses a decentralised architecture, which Elbit says cuts the number of installation components and the modifications needed to retrofit vehicles.",
"Elbit Systems Sweden was founded in 2020, employs more than 100 people and serves as the group’s hub for Northern Europe. Its CEO, Tobias Wennberg, called the plan an important step in developing, delivering and producing locally for Swedish, European and NATO customers."],
cav:"Elbit has not named customers or platforms, and it is unclear whether the site will manufacture components or mainly assemble parts supplied from elsewhere. No performance specifications or contract values were given.",
src:[["European Security & Defence","https://euro-sd.com/2026/10/news/exclusive-news/54332/elbit-laser-warning-sweden/"]]},

{id:"egypt-saudi",r:"Middle East",c:"Air defence",st:"Official claim",time:"21 Oct",
t:"Egypt pledges “necessary” defensive support to Saudi Arabia against Houthi attacks",
s:"President Sisi says Cairo will not allow Saudi security to be harmed. Parliament is meeting in emergency session and Egypt is weighing membership of the Mecca defence pact.",
p:["Egypt has committed to give Saudi Arabia all necessary defensive support against escalating Houthi missile and drone attacks, The Defense Post reported on 21 October. President Abdel Fattah el-Sisi announced it after a national defence meeting in Cairo, where the council agreed to back Riyadh’s security, territorial integrity and holy sites. The New York Times quoted him as saying it is inconceivable that Egypt would allow Saudi Arabia, its security or its stability to be harmed.",
"Egyptian lawmakers then arranged an emergency session to debate authorising military assistance, and officials stressed that any action would be strictly defensive. Houthi officials warned Cairo that military involvement could endanger Egypt’s internal stability. Foreign Minister Badr Abdelatty said Egypt is considering joining the Mecca Defence Alliance, also called the Makkah pact, which links Saudi Arabia, Pakistan and Turkey.",
"The Iran-backed group has carried out deadly strikes on Saudi infrastructure during the wider regional conflict, with reported targets including King Khalid International Airport in Riyadh and oil facilities in Dhahran. The attacks have disrupted regional energy routes and prompted partners to strengthen Saudi defences, as with the RAF Typhoon deployment announced this week. The article also cites a Wall Street Journal report that the Houthis are trying to build advanced medium-range ballistic missiles with Chinese-sourced components."],
cav:"“Necessary” support is not defined: no equipment, personnel or locations were named, and the outcome of the emergency session was not reported. Alliance membership is under consideration, not decided, and the missile-manufacturing claim is second-hand.",
src:[[DP,"https://thedefensepost.com/2026/10/21/egypt-protect-saudi-iran-houthi/"]]},

{id:"lids-gulf",r:"Middle East",c:"Air defence",st:"Company claim",time:"16 Oct",
t:"Raytheon wins $729 million for counter-drone systems for the US, Qatar and Jordan",
s:"The awards cover components of the LIDS system, which pairs a 360-degree radar with Coyote interceptors, in fixed-site and mobile versions.",
p:["Raytheon has won $729 million in contracts to supply counter-drone equipment to the US Army, Qatar and Jordan, The Defense Post reported on 16 October. The awards cover components for the Low, Slow, Small, Unmanned Aircraft Integrated Defeat System (LIDS), in fixed-site and mobile configurations.",
"LIDS pairs the Ku-band Radio Frequency Sensor (KuRFS), which gives 360-degree detection and tracking, with Coyote interceptors that destroy or disrupt hostile drones. Kinetic versions physically destroy a target, while non-kinetic versions defeat drones without a conventional explosive warhead. Operators choose a countermeasure once a drone has been identified. The mobile variant, M-LIDS, mounts the sensors and defeat systems on tactical vehicles so troops can respond while moving with deployed forces.",
"Raytheon says the Coyote family has recorded hundreds of intercepts in combat and is being produced at a higher rate to meet demand. Tom Laliberty, president of Land and Air Defense Systems at Raytheon, called LIDS a proven and cost-effective layer of defence. The article says the underlying announcement appears to be an RTX release dated 13 October."],
cav:"Raytheon did not say how the $729 million is split between the three customers, and gave no quantities or delivery schedules. Performance and cost claims are the company’s and unverified.",
src:[[DP,"https://thedefensepost.com/2026/10/16/raytheon-counter-drone-us-qatar-jordan/"]]},

{id:"kuwait-marss",r:"Middle East",c:"Air defence",st:"Reported",time:"14 Oct",
t:"Kuwait agrees to buy a £370 million UK counter-drone system from MARSS",
s:"The sensor and effector network will be integrated over 24 months and is part of the UK’s Task Force Sabre for Gulf partners.",
p:["Kuwait has agreed to buy a £370 million (about $490 million) air-defence system from the British firm MARSS, a subsidiary of Australia’s Electro Optic Systems, to counter drone incursions, The Defense Post reported on 14 October.",
"The system will use a network of optical, radar and sonar sensors linked to MARSS’s NiDAR platform. An AI-based command system will merge tracking data and assess threats across air and sea to shorten response times. Operators will have layered responses: electronic jammers for soft-kill effects and interceptors for hard-kill effects. MARSS will integrate the sensors and effectors over the next 24 months, and the project is said to support 100 engineering and manufacturing roles at its Bristol plant and in the UK supply chain.",
"MARSS chief executive Johannes Pinl said countering drones is not about any single system and needs an integrated, multi-layered architecture. UK Defence Readiness and Industry Minister Luke Pollard called the deal a clear demonstration of the UK delivering on its promise to support regional partners. The contract adds to Task Force Sabre, an initiative that coordinates equipment for Gulf defence partners, set up in response to Iran’s missile and drone attacks during the wider Middle East war."],
cav:"The signing date and cost breakdown were not given, the dollar value is a conversion, and interceptor types, quantities and locations were not disclosed. The job and timeline figures come from company and government statements.",
src:[[DP,"https://thedefensepost.com/2026/10/14/kuwait-air-defense-uk/"]]},

{id:"turkey-f35",r:"Middle East",c:"Air",st:"Official claim",time:"14 Oct",
t:"US restates the conditions for transferring six F-35s to Türkiye",
s:"Secretary of State Rubio says the sale cannot proceed until the S-400 issue is resolved. Ankara says talks are intensive and a fix is near.",
p:["The United States is in talks about supplying F-35 fighters to Türkiye, and the main obstacle remains Ankara’s purchase of Russian S-400 air-defence systems, The Defense Post reported on 14 October. Secretary of State Marco Rubio confirmed that President Trump wants to move forward with the transfer of F-35s Turkey has already paid for, but told the Greek outlet Kathimerini that until the conditions are met the sale cannot go ahead.",
"US law bars the sale until security criteria linked to Turkey’s 2017 arms deal with Moscow are satisfied. The S-400 contract was worth about $2.5 billion and in 2020 triggered sanctions under the Countering America’s Adversaries Through Sanctions Act (CAATSA). The article says the S-400 is incompatible with NATO networks and could expose Western aircraft to Russian intelligence gathering. Washington suspended Türkiye from the F-35 programme in 2019.",
"Turkish Deputy Defence Minister Alpaslan Kavaklıoğlu was optimistic after meetings in Washington. He told CNN that intensive work is under way on outstanding US issues, including CAATSA, and that problems would be resolved in a short time. He said talks cover the first six F-35s, which are in US storage and were built for pilot training."],
cav:"There is no stated timeline and no US commitment to lift sanctions. The article does not say how the S-400 question would be settled, for instance by divestment or disabling, and rests mainly on the two officials’ statements.",
src:[[DP,"https://thedefensepost.com/2026/10/14/turkey-f35-transfer-us/"]]},

{id:"usv12-sagan",r:"Middle East",c:"Drones",st:"Company claim",time:"20 Oct",
t:"Türkiye’s HAVELSAN launches an armed drone from the USV-12 uncrewed boat",
s:"The SAGAN UAV took off from the vessel and released a 60 mm mortar round at a designated target, with an operator keeping control of the engagement.",
p:["Türkiye’s HAVELSAN demonstrated a coordinated maritime and air operation in which an uncrewed surface vessel, the USV-12, launched an armed SAGAN UAV that released a 60 mm mortar round on a designated target. Army Recognition reported it on 20 October. VN Maritime Technologies builds the USV-12 with HAVELSAN, and ASİSGUARD developed the SAGAN.",
"According to HAVELSAN the boat navigated autonomously, the SAGAN took off from it, released its round against the assigned target and completed the mission. The demonstration used HAVELSAN’s command and control, mission-management and autonomous-navigation technologies, and engagement stayed under operator control. The architecture is described as aligned with NATO standards so equipment from different makers can operate in one mission structure.",
"The USV-12 is designed for reconnaissance, surveillance, patrol and search and rescue, with a hull emphasising speed, seakeeping and endurance and modular payloads. It uses AI-supported sensing and collision avoidance intended to comply with COLREG and can communicate by line-of-sight radio, LTE/5G, satellite and low-Earth-orbit links, depending on infrastructure. The article’s author argues that the pairing could let a boat approach an area and launch a drone to hit targets beyond line of sight, in confined waters or around islands where crewed warships are exposed to shore-based weapons. Those are analytical judgments, not HAVELSAN statements."],
cav:"HAVELSAN has not disclosed the SAGAN’s endurance, engagement range or sensors, or whether the drone was recovered aboard the boat. The test shows autonomous take-off and weapon release, not the system’s wider operational performance.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/tuerkiye-demonstrates-naval-drone-strike-as-usv-12-launches-armed-sagan-uav-at-designated-target"]]},

{id:"eusm-lebanon",r:"Middle East",c:"Training",st:"Official claim",time:"13 Oct",
t:"EU approves a three-year mission to train Lebanon’s army and security forces",
s:"The mission covers border control, maritime security and counter-smuggling as the UN force UNIFIL nears the end of its mandate on 31 December.",
p:["The Council of the European Union has approved a three-year mission to advise and train Lebanon’s armed forces and internal security services, The Defense Post reported on 13 October. The European Union Support Mission in Lebanon (EUSM Lebanon) will combine military and civilian teams under the Common Security and Defence Policy and focus on border control, maritime security and counter-smuggling.",
"Military personnel will advise and train the Lebanese Armed Forces on monitoring land borders, maritime security and coordinating operations, including intelligence, surveillance and reconnaissance. Civilian specialists will help the Internal Security Forces with operational training, including cybercrime investigations and anti-smuggling work, and will help build sustainable training structures. A civilian strand will address port security, including at the Port of Beirut. EU foreign policy chief Kaja Kallas said it would help Lebanese institutions strengthen territorial control and border security and restore the state’s full sovereignty.",
"The mission complements assistance financed through the European Peace Facility. The UN Interim Force in Lebanon (UNIFIL), with about 7,500 personnel from nearly 50 countries, is to end its mandate on 31 December 2026 under a Security Council decision from last year. Kallas warned that leaving no force in place could create a monitoring gap for the US-backed ceasefire arrangements that Israel and Lebanon agreed in June."],
cav:"This is a preparatory decision: operational planning continues and a further Council decision is needed before the mission starts. No deployment date, budget or personnel numbers were given.",
src:[[DP,"https://thedefensepost.com/2026/10/13/eu-mission-support-lebanon/"]]},

{id:"ghost-shark-armed",r:"Oceania",c:"Underwater",st:"Analysis",time:"19 Oct",
t:"Ghost Shark to carry up to 12 mines, kamikaze drone swarms and covert supply caches",
s:"Defence Industry Minister Pat Conroy named three payloads for Australia’s extra-large uncrewed submarine, which is being bought under a A$1.7 billion contract.",
p:["At Anduril Australia’s Sydney factory on 19 October, Defence Industry Minister Pat Conroy announced that the Royal Australian Navy’s Ghost Shark extra-large autonomous underwater vehicles will carry three new payload types: naval mines, Altius kamikaze drones and underwater supply caches for special forces. Army Recognition analysed the announcement.",
"Each vehicle can carry up to 12 mines. The article’s own arithmetic gives a theoretical 120 mines for ten vehicles, 288 for 24 and 432 for 36, and it cautions that real minefield effectiveness depends on water depth, currents, seabed conditions, traffic, spacing and the type of sensor in the mine. Altius drones, each carrying up to 4 kg of explosives, can scout or attack exposed ship sensors, antennas, communications gear and smaller vessels at ranges from 160 km to more than 440 km, depending on the model. The caches would let special forces collect supplies later without a crewed ship staying near a hostile coast.",
"Dozens of vehicles are being bought under a five-year A$1.7 billion contract signed on 10 September 2025, part of a ten-year A$5.8 billion autonomous undersea warfare investment, and the first production unit was delivered in January 2026. Dividing the contract by hypothetical fleets of 24 or 36 gives A$70.8 million or A$47.2 million a vehicle, but these are not unit prices because sustainment and development costs are included. The programme began in 2022 as a A$140 million effort with Anduril Australia, the Navy and the Defence Science and Technology Group; the first prototype was unveiled at Garden Island on 18 April 2024. Anduril’s 7,400 m² Sydney factory opened on 31 October 2025, more than 40 Australian companies supply parts and deliveries run through 2030.",
"The Navy’s Maritime Autonomous Systems Unit, set up on 14 April 2026, integrates Ghost Shark with C2 Robotics’ Speartooth and Ocius’s solar- and wave-powered Bluebottle surface vessel, and Australia plans 55 Bluebottles after a March 2026 order. The announcement coincided with Maritime Big Play Pacific, an AUKUS exercise running 5 to 25 October."],
cav:"Fleet size, dimensions, speed, endurance and depth are classified, so the article uses a larger US vehicle only as a reference. Torpedo integration is being pursued but unconfirmed, and neither the US Navy nor the Royal Navy has committed to buy Ghost Shark. The mine totals are the author’s illustrations.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/australia-arms-ghost-shark-submarine-drones-to-launch-kamikaze-drones-and-lay-sea-mines"]]},

{id:"hmas-sydney",r:"Oceania",c:"Naval",st:"Official claim",time:"20 Oct",
t:"HMAS Sydney returns after a 131-day deployment, firing an NSM and a Hellfire at RIMPAC",
s:"The Hobart-class destroyer visited Hawaii, Guam and the South China Sea and exercised with forces from nine countries.",
p:["The Royal Australian Navy destroyer HMAS Sydney has completed a 131-day Indo-Pacific deployment and returned to Fleet Base East, the Australian Department of Defence said in a statement dated 18 October, according to Army Recognition. The route ran from Australian waters to Hawaii, Guam and the South China Sea, and took in the exercises Rim of the Pacific (RIMPAC), Pacific Dragon, Pacific Vanguard and Nichi-Gou Trident with the United States, Japan, Canada, New Zealand, South Korea, Spain, Chile, Italy and Indonesia.",
"During RIMPAC near Hawaii the ship fired a Kongsberg Naval Strike Missile, which the article puts at a range above 185 km with an imaging infrared seeker, and its embarked MH-60R Seahawk made a live AGM-114 Hellfire engagement. In the South China Sea Sydney worked with the Anzac-class frigate HMAS Stuart on anti-submarine training, aviation activity, boarding drills and ship-handling. It carried out 17 replenishments at sea, two of them by helicopter.",
"Sydney is the third and last Hobart-class air warfare destroyer, commissioned in May 2020. It is 147 m long and carries the Aegis combat system, an AN/SPY-1D(V) radar and a 48-cell Mk 41 vertical launcher for SM-2 and ESSM missiles. The article attributes to the Department of Defence a claim that Aegis with SM-2 can engage aircraft and missiles beyond 150 km. It links the deployment to Australia’s National Defence Strategy, its long-range strike priorities and AUKUS."],
cav:"The article is commentary built on a Defence statement and photo. It gives no firing dates, targets or results for the NSM and Hellfire shots, and the 185 km range is not attributed to a source. Its remarks on deterrence and navigation rights are the author’s interpretation.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/australia-readies-hmas-sydney-guided-missile-destroyer-for-allied-naval-warfare-in-indo-pacific"]]},

{id:"ssn-aukus-hii",r:"Oceania",c:"Submarines",st:"Reported",time:"16 Oct",
t:"US Navy gives HII $56 million for SSN-AUKUS design support for Britain and Australia",
s:"The 13 October award can grow to $91 million. Army Recognition sets it against Virginia-class production shortfalls.",
p:["On 13 October the US Navy awarded Huntington Ingalls Industries’ Newport News Shipbuilding $56 million for engineering and design work on the AUKUS nuclear submarine programme, Army Recognition reported. A $35 million option, equal to 62.5% of the base award, could raise the total to $91 million. About 88% of the work will be done in Virginia and 12% overseas, through September 2027 with a possible extension to September 2028.",
"The work has two parts: Foreign Military Sales support for the UK and Australia, covering engineering, technology integration, supply chains, workforce and digital transformation, and US industry support engineering for SSN-AUKUS. The article reads the award as an extension of an existing relationship, not as assigning Newport News to build British or Australian hulls.",
"SSN-AUKUS is based on the British SSNR design, with a submerged displacement above 10,000 tonnes. BAE Systems leads development and construction at Barrow-in-Furness, ASC takes part in Australian production at Osborne in South Australia, and Rolls-Royce in Derby will build the propulsion. The expected PWR3 reactor would not need refuelling during the submarine’s life. The combat system uses the American AN/BYG-1 architecture, and weapons are expected to include 533 mm torpedoes and Tomahawk missiles.",
"The article stresses pressure on US yards: the target for Virginia-class output is 2.33 boats a year, against 1.15 in 2024, and 14 boats were under contract but undelivered in June 2025 with schedules two to three years late. On 30 May 2026 AUKUS partners agreed that Australia would receive three in-service US submarines. Australia has committed A$8.5 billion to Osborne and expects its first domestically built boats in the early 2040s; the UK has allocated about £6 billion to raise capacity and BAE plans to start cutting steel in 2027."],
cav:"The split of the award between its two parts and the engineer numbers were not given. Production figures and the analysis of US submarine inventory after 2032 are the article’s own assessments.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/u-s-navy-awards-hii-56-million-for-british-and-australian-ssn-aukus-nuclear-submarine-development"]]},

{id:"nz-mh60r",r:"Oceania",c:"Helicopters",st:"Reported",time:"21 Oct",
t:"New Zealand signs a NZ$1.6 billion deal for five MH-60R Seahawk helicopters",
s:"The ship-borne helicopters replace the Seasprites, with deliveries expected from 2030.",
p:["New Zealand has signed an agreement worth NZ$1.6 billion (about US$910 million) to buy MH-60R Seahawk maritime helicopters from the United States, The Defense Post reported on 21 October. Washington approved the sale earlier in 2026. The package covers five aircraft, plus weapons, spares and ancillary equipment, and deliveries are expected to begin by 2030. The government estimates the purchase will add NZ$110 million a year in operating funding over the next decade, and later phases may include autonomous systems, infrastructure and training.",
"The helicopters replace New Zealand’s ageing SH-2 Seasprites and will improve surface combat and aerial surveillance on frigates and patrol vessels. Missions include anti-submarine warfare, search and rescue, logistics and counter-insurgency. Naval aviators will fly them and air force teams will maintain them at RNZAF Base Auckland at Whenuapai. Then-Defence Minister Judith Collins said in 2025 that the purchase supports defence goals alongside Australia, which already flies the type.",
"Reported specifications from the article: the Sikorsky-built helicopter is 20 m long with a 16 m rotor, carries about 1,500 kg, is powered by two General Electric T700 engines of about 1,900 hp each, and has a top speed of up to 180 knots, an operational radius of 520 nautical miles and a service ceiling of 19,000 feet. Weapons include lightweight torpedoes, guided bombs, anti-surface missiles and machine guns."],
cav:"The headline gives four helicopters but the body says five, and the article does not explain the difference. The 2030 delivery date is an expectation, and specifications may vary by configuration.",
src:[[DP,"https://thedefensepost.com/2026/10/21/new-zealand-seahawk-helicopters/"]]},

{id:"nz-unimog",r:"Oceania",c:"Land",st:"Company claim",time:"18 Oct",
t:"Daimler Truck to supply 61 Unimog trucks to the New Zealand Defence Force",
s:"Deliveries start in 2027 under a fleet renewal programme to modernise the force’s logistics and support vehicles.",
p:["Daimler Truck Defence will supply 61 Mercedes-Benz Unimog vehicles to the New Zealand Ministry of Defence and the New Zealand Defence Force, European Security & Defence reported on 18 October, citing Daimler Truck. The order is part of a fleet renewal programme funded by a New Zealand government investment aimed at modernising the force’s logistics and support fleet. Phased delivery is due to begin in 2027.",
"According to the article the vehicles will support everyday training, the movement of personnel and equipment within and between military sites, search and rescue, domestic humanitarian assistance and disaster relief, and emergency operations within New Zealand.",
"Daniel Zittel, chief sales officer at Daimler Truck Defence, said the selection reflects confidence in the Unimog’s capability, versatility and reliability. The article says the force is once again relying on the Unimog, which implies it already operates the vehicle, but gives no details of the existing fleet."],
cav:"Everything comes from the supplier’s announcement and the quoted executive has a commercial interest. The contract value, the specific Unimog variant and the end date and pace of deliveries were not disclosed.",
src:[["European Security & Defence","https://euro-sd.com/2026/10/news/land/54357/daimler-truck-unimog/"]]},

{id:"belgium-f16",w:"Ukraine",c:"Air",st:"Reported",time:"15 Oct",
t:"Belgium raises its 2026 F-16 pledge to Ukraine to ten jets",
s:"The increase responds to Russia’s faster jet-powered Geran drones. Belgium and Ukraine are also discussing 20 mm cannon ammunition.",
p:["Belgium plans to deliver 10 F-16 fighters to Ukraine by the end of 2026, up from the seven planned before. Prime Minister Bart De Wever announced the increase on 15 October after meeting President Zelenskyy at a European summit in Brussels. The earlier package was three combat-capable jets and four for spare parts, and Belgium has not said how many of the new aircraft will be fully operational.",
"The move responds to faster Russian jet-powered Geran drones. Army Recognition cites speeds of 300 km/h for the Geran-3, 350 km/h for the Geran-4, 500 km/h for the Geran-5 and about 600 km/h for faster variants, and says Ukrainian interceptor drones at 460 to 500 km/h cannot catch a Geran-5 in a straight chase. Ukraine’s F-16s have reportedly destroyed more than 3,150 aerial targets since August 2024, according to the Ukrainian Air Force commander, and on 29 September Ukraine reportedly shot down 18 of 29 jet-powered drones.",
"Talks also cover Belgian-made 20 mm ammunition from FN Herstal for the F-16’s cannon, which is cheaper than using missiles against drones. The article estimates about 150 rounds per drone kill, and De Wever confirmed further talks without giving quantities. Belgium’s wider plan covers up to 53 jets through 2029, and it is moving to the F-35A.",
"Constraints remain. Belgium applies an 8,000-flight-hour retirement threshold, and the three operational fighters are approaching it. Defence Minister Theo Francken said on 14 October that the transfer needs US and French third-party approvals, including French approval for some electronic warfare equipment."],
cav:"Figures on drone speeds and kill counts are as cited in the article and Ukrainian statements, and the cannon-ammunition estimate is the author’s own. Ukraine is developing faster interceptor drones, but required quantities are not expected before late November.",
src:[[AR,"https://www.armyrecognition.com/news/aerospace-news/2026/belgium-to-transfer-10-f-16-fighter-jets-to-ukraine-to-counter-russias-fastest-jet-powered-drones"]]},

{id:"hohenfels-drones",w:"Ukraine",c:"Land",st:"Analysis",time:"7 Oct",
t:"US Army analysis: Ukrainian drone unit caused 70% of simulated brigade casualties in a German exercise",
s:"At Hohenfels, drone operators from Ukraine’s 412th Nemesis formation exposed how vulnerable an armoured brigade is to drones.",
p:["A US Army analysis published on 7 October found that Ukrainian drone operators from the 412th Nemesis formation caused more than 70% of the simulated casualties suffered by the 3rd Armored Brigade Combat Team, 1st Cavalry Division, in the first three days of exercise Combined Resolve 26-07. The ten-day exercise ran in April and May 2026 at the Joint Multinational Readiness Center in Hohenfels, Germany. The opposing force was reinforced by Ukrainians with combat experience, and its drones made more than 750 contacts across 378 km², about 75 a day.",
"Ukrainian operators watched an American mechanised company pass through the area’s single entrance before its vehicles could spread out. By the third day the drone share of casualties had fallen below 30% after US forces changed concealment, movement and electronic-warfare practices. Electronic warfare systems protected areas up to 2 km from fixed positions but had to be moved one after another, leaving advancing vehicles exposed, while fibre-optic drones were less affected by jamming. Crews disabled Blue Force Tracker links and cut radio traffic to reduce their signature, which also hurt coordination, and resupply took twice as long as planned.",
"The brigade used more than 700 unmanned aircraft of its own, but the data volume overwhelmed conventional intelligence and airspace management. Its proposed changes include UAV reconnaissance platoons, bomber drones, relay-supported strike drones and a shared operational picture. Army Recognition adds background on the Nemesis unit, which flew its first combat mission on 8 February 2024 and became the 412th Separate Brigade on 1 November 2025."],
cav:"The 70% figure comes from a simulation, not real losses. Ukrainian unit claims, such as 10,000 sorties and 100 destroyed Russian tanks by April 2025, are not independently verified, and drones alone are not proven as the cause of tank losses in combat.",
src:[[AR,"https://www.armyrecognition.com/news/army-news/2026/u-s-army-analysis-reveals-ukrainian-drone-unit-caused-70-of-simulated-brigade-casualties-in-german-exercise"]]},

{id:"ukraine-drone-spending",w:"Ukraine",c:"Drones",st:"Official claim",time:"19 Oct",
t:"Ukraine says its 2026 drone spending is already up more than 300% on last year",
s:"The Defence Ministry reports a 54% rise in FPV acquisitions and about 3.7 times more deliveries.",
p:["Ukraine says its drone spending in 2026 has already risen by more than 300% compared with all of 2025, The Defense Post reported on 19 October. The contracts cover a range of systems, including first-person-view drones, and the figures come from a report by Ukraine’s Ministry of Defense.",
"According to the same report, acquisitions of FPV systems so far in 2026 are 54% higher than for the whole of 2025, and deliveries over the period have increased about 3.7 times."],
cav:"The article does not give spending in currency terms, unit numbers or suppliers, offers no reasons for the increase, and does not verify the ministry’s numbers independently.",
src:[[DP,"https://thedefensepost.com/2026/10/19/ukraine-drone-spending-up/"]]},

{id:"kometa-components",w:"Ukraine",c:"Electronic warfare",st:"Official claim",time:"21 Oct",
t:"Ukrainian intelligence lists 37 foreign components in Russia’s Kometa anti-jamming navigation",
s:"HUR says 28 of the parts come from US makers and that Russian industry has ordered more than 100,000 Kometa modules this year.",
p:["Ukraine’s military intelligence service, HUR, has identified 37 foreign electronic components used in Russia’s Kometa anti-jamming navigation systems. Of these, 28 come from US manufacturers, three each from Japanese and Chinese makers, two from Swiss companies and one from a Taiwanese manufacturer. The agency published the list on its War&Sanctions portal along with a map of 28 Russian and Chinese companies that make Kometa modules or supply the electronics. The Defense Post reported it on 21 October.",
"HUR says Russian defence manufacturers have ordered more than 100,000 Kometa modules in several configurations this year. The main maker, VNIIR-Progress, fills the orders in its parent group ABS Electro and through outside contractors. Sanctions and tighter export controls have made key parts harder to get, and Kyiv says VNIIR-Progress is seeking alternative supply routes and substitutes for products from Altera and Analog Devices.",
"Kometa modules help Russian missiles, drones and guided bombs keep satellite navigation working under jamming. Their controlled-reception-pattern antennas, paired with signal-processing electronics, separate navigation signals from interference. HUR reports that Moscow is widely using 16-element arrays and preparing production of 20-element versions, and that 32-element antennas are made in China and at Russia’s Alabuga industrial zone."],
cav:"All figures and claims come from Ukrainian intelligence and are not independently verified by the article.",
src:[[DP,"https://thedefensepost.com/2026/10/21/ukraine-russia-anti-jamming-systems/"]]},

{id:"ah1z-dhow",w:"Iran and Gulf",c:"Naval air",st:"Official claim",time:"14 Oct",
t:"US Marine helicopters destroy an Iranian-affiliated surveillance boat in the Gulf of Oman",
s:"CENTCOM released footage on 14 October of a strike it says took place on 6 October against a dhow helping to target US Navy warships.",
p:["Two US Marine Corps AH-1Z Viper attack helicopters destroyed an Iranian-affiliated surveillance vessel in the Gulf of Oman, according to US Central Command. CENTCOM released footage on 14 October and said the strike took place on 6 October. It said the boat, a traditional wooden dhow, was conducting surveillance and helping to target US Navy warships. Army Recognition published its analysis on 19 October.",
"The footage shows a missile hitting the vessel, then an explosion, fire and thick black smoke. American forces evacuated the crew before destroying the boat, and efforts to repatriate the sailors were still under way. CENTCOM says Iranian forces, including the Islamic Revolutionary Guard Corps, have repeatedly threatened commercial shipping and US warships over the past seven months. The article places the strike within a wider confrontation in which Washington seeks freedom of navigation through the Strait of Hormuz while limiting Tehran’s military capabilities, and argues that removing an observation point could complicate Iranian preparations for attacks on moving warships.",
"The AH-1Z is a twin-engine attack helicopter built by Bell for the Marines, with a two-person crew, an electro-optical and infrared targeting system with laser designation, a stated combat radius of 131 nautical miles, a 20 mm cannon, Hellfire missiles, 70 mm rockets and in some configurations the AGM-179 JAGM."],
cav:"CENTCOM did not disclose the intelligence behind its assessment or the munition used, and the footage does not show which missile was fired. No radar, launcher or communications system has been publicly identified on the dhow, and a dhow does not necessarily carry weapons, so its value may lie in the information it gathers and relays.",
src:[[AR,"https://www.armyrecognition.com/news/army-news/2026/u-s-marine-ah-1z-viper-attack-helicopters-destroy-iranian-surveillance-boat-targeting-navy-warships"]]},

{id:"moab-option",w:"Iran and Gulf",c:"Air",st:"Reported",time:"19 Oct",
t:"US reportedly weighs using the GBU-43 MOAB against Iranian nuclear and energy sites",
s:"CNN reported the option on 16 October. Army Recognition explains why the bomb is a poor fit for deeply buried targets.",
p:["The US military is considering using the GBU-43/B MOAB against Iranian nuclear facilities and energy infrastructure, according to Army Recognition, which cites a CNN report of 16 October. The option would apply if President Trump authorises further strikes. Named targets include the underground Pickaxe Mountain facility, where Washington and Israel believe Tehran stored nuclear programme components, and Iranian oil and energy installations. The plans come before the 3 November midterm elections and amid discussion of reducing US deployments in CENTCOM’s area.",
"The bomb weighs 9,850 kg and carries 8,500 kg of H-6 explosive, with an estimated yield of 11 tons of TNT. Its airburst design limits its effect on deeply buried structures. At Pickaxe Mountain, granite cover protects internal chambers, so a MOAB could damage entrances, ventilation outlets and surface buildings without necessarily reaching deep equipment. Energy targets such as refineries and substations are more exposed to blast pressure, though their dispersed layout limits the effect of one detonation.",
"The MOAB has no propulsion and was designed for release from MC-130E and MC-130H aircraft, both now retired, so delivery aircraft would have to approach the target, which is risky if Iranian fighters or air defences remain active. Its only confirmed combat use was against an ISIS-K tunnel complex in Afghanistan on 13 April 2017. The article contrasts it with the GBU-57 Massive Ordnance Penetrator, which carries 2,423 kg of explosive but has a steel body designed to penetrate, and notes that on 22 June 2025 B-2 bombers dropped 14 GBU-57s on Iranian sites."],
cav:"This is a reported option, not a decision. The status of Pickaxe Mountain is uncertain and there is no confirmed evidence of uranium enrichment inside it. Strikes near populated areas would raise the risk to civilian infrastructure.",
src:[[AR,"https://www.armyrecognition.com/news/aerospace-news/2026/us-considers-using-gbu-43-moab-bomb-to-strike-irans-nuclear-facilities-and-energy-infrastructure"]]},

{id:"raf-typhoons-saudi",w:"Iran and Gulf",c:"Air defence",st:"Official claim",time:"20 Oct",
t:"UK says RAF Typhoons will defend Saudi cities against Houthi drones and missiles",
s:"The jets will fly defensive missions only. Britain will also send an A400M, advisers and air-to-air refuelling.",
p:["The UK Ministry of Defence will use RAF Typhoon fighters to protect Saudi Arabian cities and critical infrastructure from Houthi air attacks, Defence Industry Europe reported on 20 October. The Typhoons will fly defensive counter-air missions only and will not carry out offensive strikes against the Houthis.",
"The deployment adds to British air-defence help already in Saudi Arabia, including equipment against missiles and drones. The UK will also provide an RAF A400M transport aircraft to move defence materiel within the country, military advisers to assist Saudi staff officers, and extended air-to-air refuelling for Saudi defensive air operations. The ministry said those Saudi operations include action to degrade Houthi military targets in Yemen that threaten Saudi and Yemeni people.",
"The move follows escalating Houthi attacks, including one aimed at King Khalid International Airport in Riyadh. Defence Secretary Wes Streeting said the Typhoons will fly defensive missions to help protect Saudi airspace and called the attacks “absolutely despicable”. The government argued that instability in the Gulf threatens British economic and security interests, including through energy supplies and household costs, and is deepening Yemen’s humanitarian crisis."],
cav:"The announcement gave no aircraft numbers, operating locations or mission timetable. The article is a short report based on the Ministry of Defence statement and has no independent reporting on the operation’s scope or effectiveness.",
src:[[DIE,"https://defence-industry.eu/uk-ministry-of-defence-says-raf-typhoons-will-defend-saudi-cities-against-houthi-drones-and-missiles/"]]}
,{id:"drone-evac",w:"Ukraine",c:"Drones",st:"Official claim",time:"19 Oct",
t:"Ukraine says a wounded soldier was flown off the front line hanging from a heavy drone",
s:"The 30th Mechanized Brigade released footage. The claim of a world first has not been independently verified.",
p:["Ukraine’s Armed Forces say they carried out the first frontline evacuation of a wounded soldier by aerial drone, The War Zone reported on 19 October. The infantryman from the 30th Mechanized Brigade was reportedly recovered and is undergoing treatment and rehabilitation. Mines and heavy Russian drone activity prevented a conventional ground evacuation.",
"He attached himself with a harness to the underside of a heavy-lift hexacopter built by the Ukrainian company Gurzuf Defense, which supplied the drone free of charge, and hung below its rigid landing legs. A UAV operator from the 30th Brigade flew the drone while the soldier stayed in contact. The 92nd, 30th and 14th Mechanized Brigades, the 10th Army Corps and Gurzuf Defense were involved. Janes reportedly identified the drone as possibly an Audag-6, rated for a 200-pound payload over up to 15 miles, which is unconfirmed.",
"The article puts the event in context. Ukrainian ground robots reportedly made about 112,000 logistics and evacuation missions between January and August 2026, but struggle with mines, mud, cratered ground and drones. SkyFall’s StarGate, a heavy hexacopter with a covered stretcher and a reported payload of about 330 pounds, is in Ukrainian testing, and the Flowcopter FC-100 was tested for medical evacuation at NATO’s Saber Strike exercise in Poland in May 2026. Small drones cannot carry a medic, and have limited range and speed."],
cav:"The date, location, distance and flight time were not disclosed, and the footage could show a staged demonstration rather than a combat evacuation. The platform was improvised and the casualty had to be able to strap in.",
src:[["The War Zone","https://www.twz.com/air/aerial-drones-appear-to-be-picking-up-wounded-off-the-battlefield-in-ukraine"]]},
{id:"us-iran-losses",w:"Iran and Gulf",c:"Air",st:"Reported",time:"12 Oct",
t:"US aircraft losses in the Iran war: 81 reported lost or damaged, up to $3.3 billion to replace",
s:"Congressional analysts list 45 MQ-9 drones, 12 F-15Es and seven tankers among the casualties since 28 February.",
p:["The Congressional Budget Office estimates that replacing US equipment lost in the war with Iran could cost up to $3.3 billion, while the Congressional Research Service lists 81 aircraft as reportedly lost or damaged, The Defense Post reported on 12 October. The tally draws on military statements, Pentagon inspector-general findings and media reports covering operations since 28 February.",
"The largest category is the MQ-9 Reaper, with at least 45. Twelve F-15E Strike Eagles are listed, including three destroyed by friendly fire over Kuwait and one lost over Iran. There are seven KC-135 tankers, two A-10s, one F-35A, two MC-130J special operations aircraft destroyed during rescue operations, and four AH-6 helicopters deliberately destroyed by US forces. Eight aircraft were lightly damaged in an attack on Jordan’s Muwaffaq Salti Air Base and returned to service.",
"US Central Command told Congress that spending on the war reached an estimated $43.6 billion by September, and that continued operations could cost $2 billion to $3 billion a month. In June the government asked for $87.6 billion in supplemental funding for the Iran campaign and other purposes, including $67.1 billion for the Pentagon: $21 billion for munitions, $17.3 billion for operations, $12.1 billion for classified programmes, $5.1 billion for cybersecurity and autonomous systems, $4 billion for airborne moving-target tracking and a space data network, and $2.4 billion for drones."],
cav:"The 81 count includes the eight lightly damaged jets that returned to service, so it overstates permanent losses, and the article does not itemise how the categories add up. $3.3 billion is an upper bound, and the spending figures are estimates.",
src:[[DP,"https://thedefensepost.com/2026/10/12/us-loses-damages-aircraft-iran/"]]},
{"id": "e130j-first", "r": "USA", "c": "Air", "st": "Company claim", "time": "20 Oct", "t": "Lockheed delivers the first C-130J that will become the Navy’s E-130J nuclear command aircraft", "s": "The aircraft will be converted into the Phoenix II and eventually replace the Boeing E-6B Mercury in the TACAMO mission.", "p": ["Lockheed Martin has delivered a newly built C-130J-30 Super Hercules from Marietta, Georgia, to the US Navy. It will be converted into the E-130J Phoenix II, the Navy’s future nuclear command, control and communications aircraft. Northrop Grumman, the prime contractor, will lead mission-systems integration and Collins Aerospace will supply the very-low-frequency communications that can send emergency messages to submerged ballistic-missile submarines.", "The E-130J will take over the TACAMO (“Take Charge and Move Out”) mission from the Boeing E-6B Mercury, a 707 derivative that entered service in 1997 with the last aircraft delivered in 2006. Planned improvements include better avionics, more electrical power, greater range, better fuel efficiency and a higher payload. Lockheed’s Trish Pagan called the delivery a historic milestone for the Navy and the nation’s strategic communications network."], "cav": "The article gives no contract value, number of aircraft, or schedule for conversion, testing and fielding, and the upgrade benefits are described without performance figures.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/20/us-navy-c-130j/"]]},
{"id": "mpml-spike", "r": "USA", "c": "Land", "st": "Company claim", "time": "20 Oct", "t": "Leonardo DRS launcher lets TOW vehicles fire Spike LR2 missiles", "s": "The field-reconfigurable Multi-Purpose Missile Launcher is meant to extend the life of ageing launch systems.", "p": ["Leonardo DRS has developed the Multi-Purpose Missile Launcher (MPML), a field-reconfigurable launcher intended to extend the service life of ageing missile launch systems and widen the anti-armour reach of vehicles already in service. It allows platforms fitted with conventional TOW launchers, which fire tube-launched, optically tracked, wire-guided missiles, to also fire Rafael’s Spike LR2 precision-guided missile while remaining compatible with TOW.", "A photo caption in the article shows a Bradley fighting vehicle launching a Spike LR2. The piece is a short summary that points to a fuller report on NextGen Defense."], "cav": "No price, contract, schedule, range, reload time, test status or list of compatible vehicles was given beyond the Bradley picture.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/20/leonardo-tow-one-missile/"]]},
{"id": "nerve-agent-antidote", "r": "USA", "c": "Medical", "st": "Official claim", "time": "20 Oct", "t": "Pentagon moves ahead with a $40 million nerve-agent antidote programme", "s": "Battelle and CMC Pharmaceuticals are developing a reactivator to restore a key enzyme after nerve-agent exposure.", "p": ["The Defense Threat Reduction Agency’s Joint Science and Technology Office has launched a five-year, $40 million programme to develop medical countermeasures against nerve agents. Ohio-based Battelle leads the research and CMC Pharmaceuticals handles chemistry, manufacturing and controls, including formulation, testing and regulatory oversight.", "The candidate is a reactivator meant to restore acetylcholinesterase, an enzyme that regulates neurotransmitters, after nerve-agent exposure. The programme is working towards an Investigational New Drug submission to the US Food and Drug Administration, and finished reactivators are expected to be supplied in sealed vials to US forces and allies."], "cav": "The article gives no efficacy or safety data, does not say which agents are covered, and names no dates for the FDA submission, trials or fielding. How the $40 million is divided is not stated.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/20/pentagon-chemical-warfare-antidote/"]]},
{"id": "oshkosh-vipk", "r": "USA", "c": "Land", "st": "Company claim", "time": "19 Oct", "t": "Oshkosh and Michigan Tech develop a 120 kW vehicle power kit for drone defence and directed energy", "s": "The Vehicle Integrated Power Kit is meant to feed counter-drone gear, lasers and command posts from a truck.", "p": ["Oshkosh Defense and Michigan Technological University’s Advanced Power Systems Research Center are developing the Vehicle Integrated Power Kit (VIPK), designed to generate up to 120 kilowatts at 600 volts DC. Four prototypes are planned: the first two will be validated for government assessment and soldier evaluation, and the next two will support further testing and demonstrations.", "Possible uses include counter-drone equipment, directed-energy weapons, missile defences, command posts and field hospitals. The kit is being prepared for Oshkosh’s Family of Medium Tactical Vehicles A2 and is designed to meet the Tactical Microgrid Standard so it can work with other compatible field power systems. Jeff Heggemeier, Oshkosh Defense vice president and general manager, said it would let soldiers run critical systems with more flexibility and reliability."], "cav": "No timeline, contract value, test results, weight or fuel-saving figures were given, and the article does not explain what the microgrid standard requires.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/19/oshkosh-battlefield-power-system/"]]},
{"id": "ibcs-van", "r": "USA", "c": "Air defence", "st": "Reported", "time": "19 Oct", "t": "Northrop to build a van-mounted version of the Army’s IBCS battle command system", "s": "A $21 million contract covers design and prototype of an expandable shelter intended to be more mobile and survivable than tents.", "p": ["Northrop Grumman is developing a new variant of the US Army’s Integrated Battle Command System (IBCS) with an expandable vehicle-mounted shelter that adds operator workspace and improves mobility. The contract is worth $21 million.", "The company will design the configuration to improve survivability and mobility and deliver prototypes of an integrated collaborative environment housed in an expandable van. The headline frames the move as going “from tents to vans”."], "cav": "No prototype schedule, follow-on production, quantity or breakdown of the $21 million was given, and the article does not describe the current shelters or quantify the mobility gain.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/19/northrop-variant-battle-command/"]]},
{"id": "bae-space-terminals", "r": "USA", "c": "Space", "st": "Reported", "time": "19 Oct", "t": "Space Force picks BAE to develop compact radio terminals for a space data network", "s": "The software-defined terminals are meant to keep working despite jamming, interference and radiation from low Earth orbit to geosynchronous orbit.", "p": ["BAE Systems has a US Space Force contract, awarded by Space Systems Command, to design and demonstrate compact radio terminals for a space-based network that moves data between payloads. The terminals build on BAE’s family of space-hardened software-defined radios and are meant to keep communications going despite jamming, electromagnetic interference and space radiation, in orbits from low Earth to geosynchronous.", "BAE will also work with government partners on a software interface that helps payloads point accurately at one another to set up links. The article notes related awards: York Space Systems holds task orders for the Space Data Network, and Redwire joined the NITE-STAR framework, worth more than $980 million across participating companies over 10 years."], "cav": "No dollar value for the BAE award, no timetable for tests or operational use, and no number of terminals or programmes served was given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/19/us-space-force-bae-satellite/"]]},
{"id": "flir-ranger-r10", "r": "USA", "c": "Air defence", "st": "Company claim", "time": "19 Oct", "t": "Teledyne FLIR shows a compact counter-drone radar with one panel covering a quarter of the horizon", "s": "The Ranger R10-3DX uses digital beamforming and was launched around the AUSA 2026 show.", "p": ["Teledyne FLIR Defense has introduced the Ranger R10-3DX, a compact mid-range radar for counter-drone work. The article, which ties its launch to AUSA 2026, says it provides continuous drone detection and tracking for military, security and critical-infrastructure missions. A single panel is said to cover a quarter of the horizon.", "The radar uses digital beamforming, which the article links to wide-area coverage, fast threat detection and low power requirements."], "cav": "No range, detection or tracking figures, power draw, dimensions, price or customers were given, and the coverage and size claims are not backed by measurements or independent testing.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/19/teledyne-flir-new-radar/"]]},
{"id": "gbrd-raytheon", "r": "USA", "c": "Space", "st": "Company claim", "time": "19 Oct", "t": "Raytheon to digitise the Space Force’s early-warning radars", "s": "The Ground-Based Radar Digitization programme aims for open architecture, easier upgrades and better missile detection.", "p": ["Raytheon (RTX) will digitise the US Space Force’s long-serving early-warning radars under the Ground-Based Radar Digitization (GBRD) programme, part of the US missile-defence network. The aims are better reliability, faster upgrades and stronger missile detection. The approach replaces or modernises digital systems and sets up a common, open architecture, which Raytheon says will ease maintenance and reduce reliance on single vendors. It begins with prototype solutions before wider fielding at the remaining sites.", "The radars give early warning of missile launches, characterise detected objects and track activity in space. Sam Deneke, president of Air and Space Defense Systems at Raytheon, said digitising them is essential to staying ahead of increasingly complex threats. Related programmes the article lists include the Upgraded Early Warning Radar, the Long Range Discrimination Radar in Alaska, accepted in December 2025, and the Space Fence on Kwajalein Atoll, operating since 2020."], "cav": "Contract value, number of sites and fielding timeline were not given, and the benefits come from Raytheon’s own description. The remaining locations are not named.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/19/raytheon-us-radar-digitization/"]]},
{"id": "bae-hpm", "r": "USA", "c": "Air defence", "st": "Company claim", "time": "16 Oct", "t": "BAE Systems unveils a high-power microwave weapon built from 99% off-the-shelf parts", "s": "The system emits pulses that disable drone electronics and is pitched as a way to counter swarms without spending missiles.", "p": ["BAE Systems has revealed a high-power microwave (HPM) weapon for countering drones. Instead of firing projectiles, it emits microwave pulses that disable electronics, which the article says can knock out components at the speed of light. The company says 99 percent of the parts are off-the-shelf, intended to speed production and avoid procurement cost overruns and delays.", "The pitch is that HPM offers a way to deal with drone swarms without depleting missile stocks. The article links to a BAE announcement of directed-energy and kinetic defence systems at AUSA."], "cav": "Range, power output, engagement distance and success rates against swarms were not given, and there is no test result, price, delivery schedule or customer. The parts claim and the swarm-defence benefit rest on company framing.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/16/bae-systems-microwave-weapon/"]]},
{"id": "nomad-fast-pack", "r": "USA", "c": "Drones", "st": "Company claim", "time": "16 Oct", "t": "Sikorsky packs four VTOL drones into a 20-foot container", "s": "The Nomad 100 Fast Pack is meant to put drones into remote places with little infrastructure.", "p": ["Sikorsky, a Lockheed Martin company, has introduced the Nomad 100 Fast Pack, a drone-in-a-box system. A standard 20-foot (6 m) container holds four Nomad VTOL drones plus mission-command software, power supplies, communications equipment and maintenance tools. It is meant to deploy VTOL aircraft quickly in remote areas with limited infrastructure.", "The article links to a Lockheed Martin announcement dated 12 October and appears to rest largely on the manufacturer’s own description."], "cav": "No range, endurance, payload, speed or autonomy figures, set-up time, crew size, price or customers were given, and there is no independent verification.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/16/sikorsky-four-drone-box/"]]},
{"id": "lockheed-grand-prairie", "r": "USA", "c": "Industry", "st": "Company claim", "time": "16 Oct", "t": "Lockheed invests $300 million in its Grand Prairie missile plant", "s": "The Texas site supporting PAC-3 MSE, THAAD and PrSM gets about 100,000 sq ft of new space and an automated machining cell.", "p": ["Lockheed Martin is investing $300 million to expand its missile plant in Grand Prairie, Texas. The site will total about 735,000 sq ft, including roughly 100,000 sq ft of new space, with administrative areas converted for high-precision machining, automation and digital manufacturing. The plant supports the PAC-3 MSE, THAAD, Precision Strike Missile and JATM programmes, and operations are scheduled to start in early 2027.", "California start-up Hadrian will install an automated 24-machine cell that Lockheed’s workforce will operate. The project is part of a plan to invest up to $9 billion through the end of the decade at more than 20 US sites, supporting 6,000 jobs. Lockheed CEO Jim Taiclet credited a mix of commercial speed and proven combat performance, and Hadrian CEO Chris Power said wartime needs cannot wait for peacetime schedules."], "cav": "The article does not say how the money will be spent, how many of the 6,000 jobs are in Texas, what output gain is expected, or whether the work is customer-funded.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/16/us-missile-plant-lockheed/"]]},
{"id": "palladyne-brain", "r": "USA", "c": "Drones", "st": "Company claim", "time": "16 Oct", "t": "Palladyne AI’s BRAIN flight computer named a finalist in an Army interceptor competition", "s": "The edge computer handles guidance, navigation and flight control without relying on a continuous data link.", "p": ["Palladyne AI’s BRAIN edge flight computer has been named a finalist in a US Army competition on low-cost interceptors and fire-control technologies. BRAIN handles guidance, navigation and flight control on airborne platforms and supports autonomous decisions and real-time mission changes. It runs on board without central processing or continuous connectivity, which the article suggests could help platforms keep working in contested environments.", "The linked press release names the contest as the FUZE/XTECH APEX Intercept competition. The photo in the article shows the BRAIN X2 model."], "cav": "The number of finalists, contract value, timeline, test results and comparison with rivals were not given, and it is unclear when winners will be named or whether BRAIN will be fielded.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/16/palladyne-ai-brain-interceptor-competition/"]]},
{"id": "skydio-l3harris", "r": "USA", "c": "Drones", "st": "Company claim", "time": "21 Oct", "t": "L3Harris and Skydio put anti-jam tactical radios into the X10D drone", "s": "Falcon IV radios with the Wraith waveform are meant to keep control and data links alive under electronic warfare.", "p": ["L3Harris and Skydio have integrated tactical radios into the Skydio X10D drone to help keep control and data links working under electronic warfare. The setup combines the autonomous aircraft with L3Harris’s Falcon IV embeddable radios and the Wraith waveform, which L3Harris says gives multiple layers of protection against jamming. Operators can stay connected and share mission and location data over military networks when communications are disrupted, and more than 150,000 tactical radios in US and allied service can support Wraith, potentially linking the drone to existing networks.", "Skydio says the X10D reaches 45 mph (72 km/h), deploys in under 40 seconds and navigates without GPS using camera imagery and motion sensors. Payload options include a 64-megapixel camera, a Teledyne FLIR Boson+ thermal sensor (640 × 512), a 48-megapixel telephoto camera and a wide-angle camera with a light."], "cav": "There are no test results or independent data on the anti-jamming layers, no word on whether the integration is fielded or under contract, and no range, endurance or encryption details.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/21/l3harris-skydio-tactical-radios/"]]},
{"id": "gm-silverado-ugv", "r": "USA", "c": "Land", "st": "Company claim", "time": "21 Oct", "t": "GM Defense proposes a driverless Chevrolet Silverado for logistics and casualty evacuation", "s": "The concept image shows a heavy-duty truck with an open flatbed, and the company targets functional trials in 2027.", "p": ["GM Defense proposes converting the Chevrolet Silverado pickup into a driverless unmanned ground vehicle for military logistics and casualty evacuation. A conceptual image shows a heavy-duty truck with dual rear wheels and an open flatbed that could carry injured personnel or other payloads. The company is targeting 2027 for functional trials and has not disclosed technical details."], "cav": "The autonomy system, payload, range, speed and power source are not described, the image is conceptual, and there is no funding, contract, customer or production decision. The article is a short summary of a company release.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/21/gm-defense-chevy-military/"]]},
{"id": "heaviside-tyr", "r": "USA", "c": "Drones", "st": "Company claim", "time": "21 Oct", "t": "Heaviside’s TYR loitering munition packs anti-armour capability into about 5 pounds", "s": "The company says it flies more than 25 miles at over 150 mph. It was shown at the AUSA meeting on 12 October.", "p": ["Heaviside Industries’ TYR loitering munition weighs just over 5 lb (2.3 kg) and, according to the company, flies more than 25 miles (40 km) at over 150 mph (241 km/h) for more than 60 minutes. It comes with four warhead options and is aimed at striking armoured vehicles, fortified structures and other targets, giving US forces what the article calls a lightweight way to hit armour. It was introduced at the AUSA Annual Meeting in Washington on 12 October."], "cav": "The speed and endurance figures come from the company without independent testing. The article does not name the warheads, explain guidance, show performance against specific armour, or confirm any pricing, contract or military order.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/21/heaviside-tank-busting-munition/"]]},
