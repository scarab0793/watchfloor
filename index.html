{"id": "taiwan-stinger-sims", "r": "Far East", "c": "Air defence", "st": "Reported", "time": "24 Sep", "t": "Taiwan’s army shows Stinger simulators for drone-defence training", "s": "Instructors can vary weather, terrain and targets, including drones. Operator training takes 30 to 45 days.", "p": ["Taiwan’s Army Artillery Training Command showed simulators for shoulder-fired and dual-mounted Stinger systems, according to the Taipei Times. The portable simulator replicates a launcher weighing nearly 16 kg, which requires strength and balance, and the dual-mounted version uses a screen to recreate Jioupeng Bay in southern Taiwan, a live-fire drill site. Instructors can vary weather, terrain and target type, including drones, and operator training takes 30 to 45 days.", "Taiwan received several dozen portable FIM-92 Stingers through a $500 million US aid package in 2023, and in 2024 US officials reportedly weighed local assembly or production. Taiwan also fields Stingers on dual launchers, Avenger vehicles and Apache helicopters."], "cav": "The article does not give the number of simulators, personnel trained or costs, local production is only “reportedly” considered, and dual-mounted deliveries are not confirmed. It does not assess training effectiveness against drones.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/24/taiwan-army-stinger-simulators/"]]},
{"id": "taiwan-attack-drones-drill", "r": "Far East", "c": "Drones", "st": "Official claim", "time": "23 Sep", "t": "Taiwan shows attack drones in a joint live-fire drill days before the Trump–Xi summit", "s": "The three-day exercise in Pingtung County linked drones, radars and precision weapons into a full kill chain.", "p": ["Taiwan’s armed forces used several types of attack drones in a joint live-fire exercise in Pingtung County, which the article describes as a first for these systems. The three-day drill came days before a meeting between US President Donald Trump and Chinese leader Xi Jinping. It linked attack uncrewed aircraft and precision weapons with reconnaissance assets and command networks, using shipborne and mobile radars, drones and a battlefield awareness system to practise finding, identifying, assigning and striking targets."], "cav": "No drone models, quantities or ranges are given. The photo is labelled representative and shows a Coast Guard VTOL launch, so it is not confirmed as part of the drill. The summit date and any signalling intent are not addressed, and the “first” claim is unsourced.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/taiwan-attack-drones-trump-xi/"]]},
{"id": "edge-mk82-penetrator", "r": "Middle East", "c": "Missiles", "st": "Company claim", "time": "8 Oct", "t": "UAE’s EDGE completes a MK 82 penetrator bomb for hardened targets", "s": "The 500 lb bomb is designed to defeat more than a metre of reinforced concrete. An MK 83 version is in advanced development.", "p": ["EDGE has completed development of the MK 82 Penetrator, an aircraft munition designed to penetrate reinforced concrete more than 1 m (3.28 ft) thick. It is based on the 500 lb (227 kg) US-built MK 82 general-purpose bomb and keeps compatibility with its aircraft and precision-guidance kits. EDGE subsidiary LAHAB develops and makes it, and it supports guidance kits from EDGE’s AL TARIQ and THUNDER families. Unlike general-purpose versions aimed at soft targets such as troops, fuel and radars, it targets hardened structures such as bunkers.", "EDGE reports that trials showed no “J” effect, meaning the munition kept its trajectory after penetration without significant deflection. In February 2025 the UAE Ministry of Defence awarded EDGE a 4.36 billion dirham (about $1.19 billion) contract for MK 81 to MK 84 general-purpose munitions, and EDGE says an MK 83 Penetrator is at an advanced stage. LAHAB chief executive Mohammed Arbabi said the product expands capabilities while remaining familiar and easy to use."], "cav": "The penetration and trajectory results are EDGE’s own, with no independent test data or target specifications. No production, delivery or export timeline is given, and the article does not say whether the 2025 contract covers the Penetrator.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/08/edge-mk-82-munition/"]]},
{"id": "us-arms-egypt-uae-kuwait", "r": "Middle East", "c": "Missiles", "st": "Official claim", "time": "6 Oct", "t": "US approves $2.27 billion in possible arms sales to the UAE, Egypt and Kuwait", "s": "The packages are 10,000 APKWS guidance sections, 2,020 Javelins with 200 launch units, and Patriot repair services.", "p": ["The US State Department approved three possible sales totalling $2.27 billion. The UAE could buy up to 10,000 APKWS II guidance sections, estimated at $1.041 billion, in air-to-air and air-to-ground configurations with warheads, rocket motors, fuzes, training and technical support. Egypt could buy up to 2,020 FGM-148F Javelin missiles and 200 Lightweight Command Launch Units for $832 million, plus training, spares and system integration.", "Kuwait could receive $400 million of Patriot missile repair and return services with repair parts, support equipment, training and technical help. Kuwait also received a separate $800 million Patriot sustainment proposal in January, and RTX says 19 countries use Patriot."], "cav": "These are proposed approvals, not signed contracts, and the article does not give final pricing or delivery timelines. It does not discuss the effect on US stockpiles or regional security implications.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/06/us-arms-sales-egypt-uae-kuwait/"]]},
{"id": "us-airstrike-civilians", "r": "Middle East", "c": "Air", "st": "Analysis", "time": "2 Oct", "t": "Investigation counts at least 3,336 civilian casualties from US-led airstrikes in four countries", "s": "An ARIJ-supported study of 884 operations in Yemen, Syria, Iraq and Somalia from 2007 to May 2025 found the highest civilian-to-combatant ratio early in Trump’s second term.", "p": ["US airstrikes and coalition operations killed or wounded at least 3,336 civilians in Yemen, Syria, Iraq and Somalia between 2007 and May 2025, according to an investigation supported by ARIJ that analysed 884 air operations using Airwars data. By country the toll is 1,336 in Syria, 991 in Yemen, 793 in Iraq and 216 in Somalia. Attacks against Islamic State produced the largest civilian toll, and children accounted for 1,286 documented casualties.", "In the early months of Donald Trump’s second term the study found about 2.3 civilians dying for every combatant killed, the highest ratio in the period. Night and early-morning operations were linked to heavier civilian losses, and former Pentagon official Wes Bryant said targets are easier to locate at home, where families also are. The article recalls a 2009 strike at Al-Ma’jalah in Yemen in which a parliamentary committee recorded 41 civilian deaths."], "cav": "Using the lowest casualty estimates and excluding disputed incidents may understate the total. The article says children are 42 percent of casualties, but 1,286 of 3,336 is about 39 percent, and researcher Nour Kelzi notes the figures alone do not establish unlawful attacks. The links to policy and night tactics are interpretation.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/02/civilian-casualties-us-airstrikes/"]]},
{"id": "uvision-lendurai", "r": "Middle East", "c": "Drones", "st": "Company claim", "time": "30 Sep", "t": "Uvision and Estonia’s Lendurai partner on AI autonomy for loitering munitions", "s": "Lendurai’s software uses computer vision to cut reliance on satellite navigation and radio control.", "p": ["Israel’s Uvision and Estonia’s Lendurai announced a partnership to add AI-enabled autonomy to Uvision’s unmanned systems. Lendurai will develop the autonomy software and Uvision will integrate it into its platforms. Lendurai’s technology uses computer vision and machine learning to aid navigation and reduce operator workload, and its Neocortex stack reduces reliance on satellite navigation and continuous radio control.", "Uvision makes the Hero loitering-munition family, used against armoured vehicles and personnel. Lendurai says Neocortex has been combat-tested in Ukraine, and the companies say the project supports the armed forces of an unnamed NATO member."], "cav": "The NATO customer and Uvision platform are not named, no value or delivery timeline is disclosed, and the Ukraine combat-testing claim is Lendurai’s own.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/30/uvision-lendurai-ai-drones/"]]},
{"id": "korkut-35", "r": "Middle East", "c": "Air defence", "st": "Company claim", "time": "30 Sep", "t": "Aselsan live-fires its Korkut 35 air-defence system against drones", "s": "The 35 mm wheeled system engaged several drone types in motion before delegations from 12 countries.", "p": ["Turkish firm Aselsan live-fired its Korkut 35 air-defence system against drones. Targets included fixed-wing, delta-wing, mini and micro UAVs, with a focus on kamikaze drones. The system fired at a moving ground target while both it and the target were moving. It is mounted on an 8×8 tactical wheeled vehicle, and delegations from 12 countries attended.", "Aselsan says the system can also engage fighters, cruise missiles, air-to-ground missiles, helicopters and other UAVs. Korkut 35 uses a 35 mm automatic cannon firing programmable airburst ammunition with sensors and fire-control equipment. The original Korkut is a tracked vehicle with twin 35 mm guns in service with Türkiye’s armed forces."], "cav": "No hit rates, outcomes or effective ranges are given and “representative operational conditions” are undefined. The information comes largely from Aselsan, the claimed capability against jets, cruise missiles and helicopters was not shown, and the 12 countries are not named.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/30/aselsan-korkut-35-drone-test/"]]},
{"id": "karaok-air-hit", "r": "Middle East", "c": "Missiles", "st": "Company claim", "time": "25 Sep", "t": "Roketsan says its KARAOK anti-tank missile hit an air target for the first time", "s": "The shoulder-fired, 2.5 km fire-and-forget missile has an imaging infrared seeker and a tandem warhead.", "p": ["Turkish firm Roketsan said its KARAOK anti-tank missile hit an aerial target for the first time, in a company post dated 23 September, calling it a direct hit on land and in the air. KARAOK uses an imaging infrared seeker and fire-and-forget guidance, has a range of 2.5 km with direct and top-attack profiles, is 125 mm in diameter, is designed for shoulder firing and carries a tandem anti-tank warhead.", "Roketsan began development in 2016. The missile was used in a military exercise by May 2026 and appeared in a December 2025 strike involving several uncrewed ground vehicles."], "cav": "Roketsan did not disclose the aerial target type, engagement range or other test details. The “first air hit” claim is the manufacturer’s, and the article does not say whether the test was part of an acceptance or operational programme.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/turkey-karaok-missile-air-target/"]]},
{"id": "arbe-alerion", "r": "Middle East", "c": "Air defence", "st": "Company claim", "time": "18 Sep", "t": "Israel’s Arbe unveils a 4D radar for fibre-optic and FPV drones", "s": "The Alerion tracks the aircraft itself, so it can spot drones that fly without a radio link.", "p": ["Israeli firm Arbe Robotics has unveiled the Alerion Radar, a 4D imaging radar designed to detect first-person-view and fibre-optic drones in difficult environments. It tracks the aircraft itself rather than the signals it emits, so it can detect fibre-optic drones that fly without a radio link, and the company says these drones cannot hide from it. It has a compact solid-state design that reportedly meets size, weight, power and cost requirements."], "cav": "No detection range, resolution or update rate is given despite the “ultra-high-resolution” label. Performance claims are the vendor’s with no independent testing, and the size, weight, power and cost compliance is only “reportedly” met, with no price, availability or customers.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/18/israeli-4d-radar-drones/"]]},
{"id": "egypt-intel-ai", "r": "Middle East", "c": "Military AI", "st": "Official claim", "time": "17 Sep", "t": "Egypt’s military-production ministry signs an AI localisation memorandum with Intel", "s": "Intel would provide training and technology transfer, with possible local assembly of edge AI systems.", "p": ["Egypt’s Ministry of Military Production is working to build domestic AI capabilities, and Intel has signed a memorandum of understanding with Toya Technology, a company affiliated with the ministry. The agreement covers AI training, technology transfer and possible local assembly of edge AI systems. Intel would provide training, technical guidance and knowledge transfer to help set up an AI ecosystem across the ministry’s affiliated organisations."], "cav": "No financial value, no commitment on when or whether local assembly will happen, and no word on which military applications the AI would serve or what oversight governs the technology transfer.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/17/egypt-local-military-ai-production/"]]},
{"id": "skystriker-germany", "r": "Middle East", "c": "Drones", "st": "Company claim", "time": "15 Sep", "t": "Elbit and Diehl demonstrate the SkyStriker loitering munition for Germany", "s": "Launched from a canister, the electric drone engaged targets autonomously and handed over at 80 km, the companies say.", "p": ["Elbit Systems and Diehl Defence jointly offer the SkyStriker loitering munition to Germany under a June 2026 partnership. In a live demonstration the drone launched from a canister and autonomously recognised, tracked and engaged targets, performed a hand-over function at 80 km and interacted with the SkyLark 1 reconnaissance drone. Electric propulsion gives it an extremely low acoustic and thermal signature, with a stated range over 200 km and loiter time over two hours. One operator can run it, and it can launch from ground vehicles, aircraft and the EuroPULS rocket artillery system.", "Diehl would manufacture, assemble, integrate and qualify the drone in Germany, with Elbit driving market development. Diehl’s Gunnar Pappert said the demonstration confirms the system’s maturity, and Elbit Systems Germany chief Marian Rachow called it a milestone toward German production."], "cav": "No contract value, order size or German procurement decision is reported. Performance figures come from the companies, and no production timeline, payload details or demonstration date and place are given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/15/elbit-diehl-demonstrate-skystriker/"]]},
{"id": "dominion-x", "r": "Middle East", "c": "Military AI", "st": "Company claim", "time": "14 Sep", "t": "Elbit unveils Dominion-X, an AI operating system for large autonomous formations", "s": "The FUSE unit’s software would coordinate drones and ground vehicles in real time and support manned-unmanned teaming.", "p": ["Elbit Systems’ FUSE unit has unveiled Dominion-X, an AI-powered operating system meant to bring large formations of autonomous aircraft and ground vehicles under real-time coordinated control. Autonomous platforms exchange mission data and carry out distributed operations over a shared network. It supports manned-unmanned teaming, linking autonomous systems with manoeuvre forces and crewed vehicles, and militaries would not need to reorganise existing formations or command structures."], "cav": "There are no figures on how many platforms it can coordinate or on latency, no word on testing, fielding or customers, and nothing on cybersecurity or the decision authority left to human operators.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/14/elbit-ai-operating-system/"]]},
{"id": "aselsan-arsus-poland", "r": "Middle East", "c": "Land", "st": "Reported", "time": "10 Sep", "t": "Türkiye’s Aselsan and Poland’s AMZ-Kutno expand a surveillance-systems deal", "s": "Industry reports put the new order at 24 ARSUS sets for the Kleszcz light reconnaissance vehicle.", "p": ["Aselsan signed a new deal with AMZ-Kutno for more ARSUS reconnaissance and surveillance systems. Neither company disclosed the value, but industry reports put the order at 24 sets. ARSUS uses sensors and other equipment to help vehicle crews detect, identify and track objects at longer ranges, and it is being integrated into Poland’s Kleszcz light reconnaissance vehicle, built on AMZ-Kutno’s 4×4 platform. A 2024 contract for radar and electro-optical systems on the same vehicles was valued at €16.6 million.", "Aselsan plans to expand in Poland through a local office, existing projects and partnerships with Polish firms. In July 2026 Türkiye’s defence industry chief Haluk Görgün met Poland’s defence minister in Warsaw, following a December 2025 security cooperation agreement."], "cav": "The 24-set figure comes from industry reports, not from either company. The deal’s value is undisclosed and no delivery timeline is given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/10/poland-turkey-aselsan-arsus/"]]},
{"id": "space-ai-constellation", "r": "Middle East", "c": "Space", "st": "Company claim", "time": "16 Sep", "t": "UAE-led group plans a $1 billion, 50-satellite constellation with AI processing in orbit", "s": "Marlan Space and Loft Orbital describe it as the world’s largest AI infrastructure in space.", "p": ["A planned constellation of 50 satellites would use AI to analyse sensor data in orbit and transmit results to Earth. The $1 billion initiative is led by UAE-based space investor Marlan Space and space-systems company Loft Orbital, and the companies call the goal the world’s largest AI infrastructure in space. Intended uses include maritime domain awareness, disaster response and critical-infrastructure security for government and commercial customers."], "cav": "No launch or deployment schedule is given, France’s role appears only in the headline, and the split of the $1 billion is not explained. “World’s largest” is the companies’ claim, and the AI models, sensors and orbits are not described.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/16/ai-satellite-space-constellation/"]]},
{"id": "iran-captures-dive-ld", "w": "Iran and Gulf", "c": "Underwater", "st": "Official claim", "time": "28 Sep", "t": "Iran says it will reverse-engineer a captured US underwater drone", "s": "The IRGC says its navy holds an Anduril Dive-LD recovered near the Strait of Hormuz.", "p": ["The Islamic Revolutionary Guard Corps plans to reverse-engineer a captured American uncrewed underwater vehicle recovered near the Strait of Hormuz. IRGC spokesperson Brig. Gen. Hossein Mohebbi said the navy has taken possession of the submersible, which Tehran says holds advanced military technology. Iranian state media identified it as an Anduril Industries Dive-LD, a platform about 6 m (19 ft) long."], "cav": "No date, precise recovery location or account of the capture is given. The identification and the “advanced technology” claim rest on Iranian statements, with no US confirmation or response and no assessment of what reverse engineering could achieve.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/28/iran-drone-submarine-us/"]]},
{"id": "amnesty-tehran", "w": "Iran and Gulf", "c": "Air", "st": "Analysis", "time": "11 Sep", "t": "Amnesty says US-Israeli strikes on Tehran neighbourhoods may amount to war crimes", "s": "The group documents at least 41 civilian deaths in three districts between 1 and 13 March.", "p": ["Amnesty International says US-Israeli strikes on the Tehran neighbourhoods of Niloufar, Resalat and Javadieh killed at least 41 civilians between 1 and 13 March 2026 and may constitute war crimes. In Niloufar a strike on a police station killed at least 20 civilians and damaged buildings about 100 m away. In Resalat a site linked to an IRGC Basij battalion was hit and Amnesty counted at least 16 civilian deaths, including 13 members of one family and a building caretaker. In Javadieh a police-station strike killed five members of one family and injured dozens.", "Evidence included satellite imagery, 60 verified videos, official statements and two interviews, and weapons experts linked debris to a US-made JDAM guidance kit. Amnesty calls for independent probes and an international fact-finding inquiry into all sides."], "cav": "Neither the US nor Israel has confirmed responsibility for the three attacks. The findings rely on remote sources and two interviews, and “may constitute” and the debris link are not legal rulings; no court or body has determined that war crimes occurred.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/11/us-israeli-iran-war-crimes/"]]},
{"id": "russia-iran-c430l", "w": "Iran and Gulf", "c": "Missiles", "st": "Reported", "time": "10 Sep", "t": "Financial Times: Russia is helping Iran develop a supersonic cruise missile", "s": "The covert C430L programme centres on a ramjet engine and reportedly continued after the 2026 war began.", "p": ["The Financial Times reports that Russia is helping Iran develop supersonic cruise-missile technology through a covert programme called C430L that began in 2023. It centres on a ramjet propulsion system that could let a missile fly above Mach 1. Rosoboronexport reportedly arranged the work with missile maker NPO Mashinostroyenia, and Russian engineers reportedly visited Iran and reviewed propulsion and flight-test data. A June 2026 Rosoboronexport letter reportedly shows cooperation continuing after the US-Israeli war with Iran began, and the company reportedly proposed sending about two dozen specialists in April 2025.", "Iran showed a domestic ramjet engine in 2019 and the IRGC reportedly tested a prototype supersonic cruise missile in 2023. Fabian Hinz of Conflict Armament Research said Russia is transferring technology Iran has sought for decades, former CIA analyst Jim Lamson warned it could threaten US Navy ships, and Nicole Grajewski of Sciences Po argued the aim is to widen the Ukraine war and draw in the US."], "cav": "The report found no evidence that an operational Russian-assisted missile has been deployed. Russia, Rosoboronexport, NPO Mashinostroyenia and Iran did not comment, the claims rest on documents the FT reviewed, and it is unconfirmed whether the 2025 specialist deployment happened.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/10/russia-iran-cruise-missile/"]]},
{"id": "denmark-mh60r", "r": "Europe", "c": "Helicopters", "st": "Official claim", "time": "23 Sep", "t": "US clears a $425 million package of three more MH-60R Seahawks for Denmark", "s": "Denmark already flies nine of the anti-submarine helicopters from Karup.", "p": ["The US State Department has cleared a $425 million foreign military sale to Denmark covering three MH-60R Seahawk multi-mission helicopters and ancillary equipment: navigation devices, magnetic anomaly detection systems, multi-mode radars, missile-warning suites, spare T700-GE-401D engines and communications security gear. Support includes integration, testing, logistics, training and obsolescence engineering.", "Denmark already operates nine MH-60Rs, delivered in 2016–2018 and flown by Squadron 723 at Air Base Karup, for anti-submarine warfare, land attack and maritime patrol. The State Department said the sale would strengthen Denmark’s homeland defence. Elsewhere, South Korea’s roughly $2.4 billion MH-60R deal covers 24 airframes, and a $1.5 billion transfer to New Zealand was authorised in June."], "cav": "The agreements are not finalised, so this is approval, not a binding contract. No delivery timeline or item-by-item breakdown is given, and it is not said how the new aircraft fit with the existing fleet.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/denmark-seahawk-us/"]]},
{"id": "greenland-deal", "r": "Europe", "c": "Policy", "st": "Reported", "time": "23 Sep", "t": "US, Denmark and Greenland sign an updated defence agreement giving the US more access", "s": "The pact replaces the 1951 arrangement, widens operations at Pituffik and allows new US defence areas.", "p": ["The United States, Denmark and Greenland signed a defence agreement on the sidelines of the UN General Assembly in New York, the BBC reported. It updates a 1951 agreement governing US military operations in Greenland. Possible US defence areas include Narsarsuaq in the south and Mestersvig on the east coast, and the pact expands US operations at Pituffik Space Base in the northwest, Greenland’s only active US base. No territory transfers to Washington, but US aircraft, vessels and forces gain broader travel rights through Greenland and its waters.", "Non-NATO countries cannot maintain military installations or a persistent force in Greenland unless all three governments agree. The deal follows more than a year of tension after Donald Trump repeatedly said the US should take control of Greenland, citing Russia and China and his proposed Golden Dome missile defence."], "cav": "Washington, Copenhagen and Nuuk have not agreed how the sites will be developed or used. The pact sets no troop numbers or construction timeline, and further sites depend on future agreement.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/us-military-greenland-deal-denmark/"]]},
{"id": "poland-15000", "r": "Europe", "c": "Land", "st": "Official claim", "time": "23 Sep", "t": "Poland aims to host about 15,000 US troops as base plans advance", "s": "Deputy Defence Minister Wziątek describes 4,000–5,000 at a permanent base and up to 11,000 on rotation.", "p": ["Poland seeks about 15,000 US troops long term, according to Deputy Defence Minister Stanisław Wziątek as reported by local media. The total would include 4,000 to 5,000 at a proposed permanent base and 10,000 to 11,000 on rotation. The build-up would be staged, since Poland must first build infrastructure for a brigade-sized force, and 15,000 could be reached before 2039 if threats accelerate it.", "Preparing the base would need special legislation and dedicated funding of over 15 billion zloty (about $4 billion). Warsaw previously offered up to $2 billion for facilities for North American forces, and Donald Trump said the two countries are making progress and could announce a location soon."], "cav": "Washington has not announced a final decision. It is unclear whether the $4 billion includes the earlier $2 billion offer or how the rest would be funded, no site is named, and the 2039 timeline is conditional.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/poland-15000-us-troops/"]]},
{"id": "indra-squall", "r": "Europe", "c": "Missiles", "st": "Company claim", "time": "23 Sep", "t": "Indra reveals SQUALL, a low-cost cruise missile with 300 km range", "s": "The Spanish firm says the low-flying missile has a high degree of stealth and several jam-resistant navigation systems.", "p": ["Spanish defence firm Indra has revealed SQUALL, a cheap cruise missile with a range of over 300 km (186 miles) into hostile territory, aimed at important targets. It flies at low altitude to reduce radar detection, the company claims a high degree of stealth, and several navigation systems are meant to hold course against jamming and spoofing."], "cav": "No price is given, so “budget” is unquantified. The stealth and anti-jamming claims are the company’s with no independent testing, and the article reports no development status, test results or customers; the swarm angle in the headline is not discussed.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/indra-squall-missile-swarms/"]]},
{"id": "uk-space-squadron", "r": "Europe", "c": "Space", "st": "Official claim", "time": "24 Sep", "t": "RAF launches its first space squadron to counter hostile threats", "s": "No. III Space Effects Squadron joins two existing space units. The government adds £50 million to extend Skynet 5.", "p": ["The RAF has launched No. III Space Effects Squadron, the UK’s first dedicated unit against hostile activity targeting British space interests, announced by Air Chief Marshal Sir Harv Smyth. It complements No. I Space Operations and No. II Space Warning Squadrons, draws specialists from across the armed forces and uses tools such as electronic warfare. It aims to protect satellites that support missile warning, weather forecasting, navigation and mobile communications, and squadrons 4, 5 and 6 plus a Space Tactics and Training Squadron are planned.", "Smyth cited Russian satellites approaching two British commercial satellites in May and a Russian constellation disrupting GPS across Europe, Greenland and Canada in June, and said space has become a warfighting domain. The government added £50 million to extend Skynet 5’s service life while Skynet 6 is developed."], "cav": "Squadron size, budget and personnel are not disclosed, nor are the limits on electronic-warfare actions. The Russian incidents rest on Smyth’s speech without independent verification, and no timelines are given for the new squadrons.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/24/uk-first-space-squadron/"]]},
{"id": "project-zodiac", "r": "Europe", "c": "Military AI", "st": "Company claim", "time": "23 Sep", "t": "Thales, BAE, Frazer-Nash and CACI team up on the British Army’s Project ZODIAC", "s": "The tactical system fuses ISTAR data and command and control to speed up decisions for deployed forces.", "p": ["Thales UK has signed a memorandum of understanding with BAE Systems Digital Intelligence, Frazer-Nash Consultancy and CACI to support Project ZODIAC, a tactical British Army system that combines digitised ISTAR, data-fusion analysis and command and control to help deployed forces decide faster. Thales chief technology officer Mike Sewart said the aim is to link sensors, data and decision-makers so commanders can act faster, and the work will draw on AI-enabled decision-making and open system architectures. Land ISTAR aims to create centrally coordinated sensors that remain compatible with current and future communications."], "cav": "No contract value, award or timeline is disclosed and it is unclear whether the memorandum is binding. Each partner’s role is not described, and testing, fielding and integration with systems such as Watchkeeper and Ajax are not addressed.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/thales-bae-uk-zodiac/"]]},
{"id": "lithuania-nuclear-ban", "r": "Europe", "c": "Policy", "st": "Reported", "time": "23 Sep", "t": "Lithuania moves closer to lifting its constitutional ban on nuclear weapons", "s": "Parliament advanced the deletion of Article 137, which also bars foreign bases. Two more votes needing 94 of 141 members are required.", "p": ["Lithuania’s parliament has advanced a plan to delete Article 137 of the constitution, which currently bars weapons of mass destruction and foreign military bases. Two more votes are needed, each requiring at least 94 of the 141 members. Supporters say the change would give Lithuania more flexibility in NATO’s nuclear deterrence, including if allies wanted to move nuclear-capable forces through the country, while opponents say deleting the whole article is unnecessary because it also covers foreign bases and warn Russia and Belarus could use it for propaganda.", "President Gitanas Nausėda said there are no immediate plans to store nuclear weapons in Lithuania and that it would remain bound by the Non-Proliferation Treaty. In March French President Emmanuel Macron proposed temporarily deploying parts of France’s strategic air forces to allies, with Paris keeping control over any nuclear use."], "cav": "The article does not explain why the foreign-bases provision must go with the weapons ban, what deployments or transit would be allowed, or whether the remaining votes will pass.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/lithuania-lifting-ban-nuclear-weapons/"]]},
{"id": "ukraine-350k-drones", "w": "Ukraine", "c": "Drones", "st": "Official claim", "time": "23 Sep", "t": "Ukraine says it has neutralised over 350,000 Russian drones in 2026", "s": "The Defence Ministry cites about 220,000 fixed-wing and 100,000 multirotor drones, plus 31,000 Shahed-type aircraft shot down.", "p": ["Ukraine’s Defence Ministry says its forces have neutralised more than 350,000 Russian drones since the start of 2026. About 220,000 were fixed-wing drones and about 100,000 multirotor. Ukrainian unmanned-systems units, mobile fire groups and army aviation reportedly shot down 31,000 Shahed-type drones."], "cav": "The article does not define “neutralised” or explain how the counts were made, or say whether the 31,000 Shahed-type drones are part of the 350,000. The figures are Kyiv’s own with no independent verification or Russian response, and there is no breakdown over time.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/ukraine-russian-drones-2026/"]]},
{"id": "varkhan-ugv", "w": "Ukraine", "c": "Land", "st": "Official claim", "time": "7 Oct", "t": "Ukraine’s Varkhan ground robot is built for heavy logistics over rough terrain", "s": "The four-wheel-drive vehicle is described as carrying hundreds of kilograms over tens of kilometres.", "p": ["Ukraine is developing the Varkhan, an unmanned ground vehicle described as designed to carry hundreds of kilograms of cargo over tens of kilometres. It uses a four-wheel-drive platform with independent suspension and more than 200 mm of ground clearance and is said to handle mud, bogs, sand and other rough terrain. The image is credited to Ukraine’s Ministry of Defence."], "cav": "No exact payload or range, nothing on autonomy level, control method, speed or endurance, and nothing on production numbers, fielding or cost. The article relies heavily on the ministry’s material.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/07/varkhan-ugv-heavy-logistics/"]]},
{"id": "uds-ukraine-jv", "w": "Ukraine", "c": "Drones", "st": "Company claim", "time": "7 Oct", "t": "Lithuania’s Unmanned Defense Systems sets up a joint venture in Ukraine", "s": "A permanent local team will support deployments, train operators and gather feedback from units.", "p": ["Lithuanian defence firm Unmanned Defense Systems (UDS) has set up a Ukrainian joint venture to deploy its unmanned systems. UDS makes reconnaissance and strike drones plus command-and-control software that integrates with third-party platforms and battle-management systems. A permanent local team will support deployments, train operators and gather feedback from military users, and UDS aims to shorten the time between identifying battlefield needs and delivering technical changes.", "CEO Vytenis J. Buzas said Ukraine has sharply accelerated how fast defence technology must evolve and that a local presence brings engineering closer to users. The move fits Kyiv’s Build in Ukraine initiative, which encourages foreign firms to manufacture locally and form joint ventures with Ukrainian companies."], "cav": "The ownership split, investment size and Ukrainian partners are not disclosed, and there are no details on customers, units, contracts or deliveries. The article relies on company statements.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/07/lithuanias-joint-venture-ukraine/"]]},
{"id": "spectr-ai", "w": "Ukraine", "c": "Military AI", "st": "Official claim", "time": "29 Sep", "t": "Ukraine tests SPECTR, an AI platform that predicts enemy moves", "s": "The Defence Ministry’s AI centre says several combat units are trialling the system.", "p": ["Ukraine is testing SPECTR, an AI platform developed by the Defence AI Center A1 under the Ministry of Defence. It analyses battlefield data, identifies patterns and helps planners anticipate enemy actions, and several combat units are already testing it. Danylo Tsvok, head of the centre, calls it an operating system for warfighting and a tool for choosing courses of action and forecasting how a battle could unfold."], "cav": "The article does not say how many units are testing it or where, offers no accuracy data, and does not explain what data feeds it, how much human oversight applies or when wider deployment might come.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/29/ukraine-spectr-battlefield-ai/"]]},
{"id": "uforce-f1", "w": "Ukraine", "c": "Drones", "st": "Company claim", "time": "25 Sep", "t": "Ukrainian maker UFORCE recruits Formula 1 engineers for next-generation drones", "s": "Its CEO wants experts in composites, carbon fibre, sensors and engine performance.", "p": ["Ukrainian defence firm UFORCE is recruiting Formula 1 engineers to help develop its next generation of drones. CEO Oleg Rogynskyy told DOU the company wants engineers with experience in composite materials, carbon fibre, sensors and engine performance, and believes F1 teams’ approach to cutting weight while preserving reliability could improve drone performance. The article’s image is a representative photo of UFORCE’s MAGURA drone boat."], "cav": "No hiring targets, budget or schedule, no named drone programmes, and no word on whether any F1 engineers have been hired. Rogynskyy’s view on performance gains is not backed by data and the piece relies on a single interview.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/ukraine-formula-engineers-drones/"]]},
{"id": "finland-ukraine-drones", "w": "Ukraine", "c": "Drones", "st": "Official claim", "time": "25 Sep", "t": "Finland and Ukraine sign a drone cooperation agreement", "s": "The deal covers technology transfer, joint research and simpler export procedures.", "p": ["Finland and Ukraine signed a drone cooperation agreement aimed at strengthening both countries’ defence industries and supporting Kyiv’s security. The deal covers technology transfers and joint research and development on uncrewed systems, and seeks to streamline administrative procedures for exporting equipment and technology between the two countries. The accompanying photo is representative only and shows an aerial drone tested in Finland."], "cav": "No financial value, contract size or timeline. The signatories, signing place and specific systems are not named, the details appear to rest on a Finnish government release, and it is not explained when the export-procedure changes take effect.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/finland-drone-deal-ukraine/"]]},
{"id": "center-2026", "w": "Ukraine", "c": "Land", "st": "Reported", "time": "7 Oct", "t": "Russia’s Center 2026 war games rehearsed a counter-offensive and a foothold in Central Asia", "s": "More than 47,000 personnel took part. About 800 soldiers with Ukraine experience will deploy to the war zone afterwards.", "p": ["Russia’s quadrennial Center 2026 exercise rehearsed a cross-border counter-offensive and a foothold in neighbouring Central Asian territory. Drills ran across 11 training grounds and the Caspian Sea with more than 47,000 personnel, 2,000 military vehicles, 90 aircraft and 77 vessels, and contingents from Belarus, China, Kyrgyzstan, Mongolia, Pakistan and Tajikistan took part. Deputy Defence Minister Yunus-Bek Yevkurov, quoted by TASS, described a scenario in which a coalition repelled an attack in the South Urals and then moved to liberate captured territory.", "More than 2,000 troops and 600 vehicles with Ukraine battlefield experience took part, and afterwards 800 soldiers and nearly 300 pieces of equipment will deploy to the war zone. Four long-range aircraft simulated strikes and the Caspian Flotilla practised anti-landing operations with uncrewed surface vessels."], "cav": "Moscow did not name the hypothetical adversary; unnamed sources suggest Kazakhstan could fit but there is no official confirmation. Most figures come from Russian state sources and are not independently verified, and it is not explained how the later deployment relates to the drills.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/07/russia-central-asia-war-games/"]]},
{"id": "raaf-triton-peregrine-ioc", "r": "Oceania", "c": "Air", "st": "Official claim", "time": "23 Sep", "t": "RAAF declares initial operational capability for the MQ-4C Triton and MC-55A Peregrine", "s": "Four Tritons will be based at Tindal and flown remotely from Edinburgh. The 14-aircraft Poseidon fleet is complete.", "p": ["Defence Minister Richard Marles and Chief of Air Force Air Marshal Stephen Chappell announced on 22 September that the Royal Australian Air Force has reached initial operational capability for the MQ-4C Triton and MC-55A Peregrine. Four MQ-4Cs will be stationed at RAAF Base Tindal and operated remotely by No. 9 Squadron at Edinburgh with Northrop Grumman Australia support. Three of four MC-55A Peregrine aircraft, converted from Gulfstream G550s, have been delivered and the fourth is due later this year.", "The 14-aircraft P-8A Poseidon fleet is complete, with upgrades for the remaining 12 aircraft to be carried out at Edinburgh with Boeing Defence Australia. The milestones align with a National Defence Strategy plan of about A$5.5 billion (US$3.8 billion) over ten years. Chappell called them a significant step forward for Air Force capability."], "cav": "The article does not define what initial operational capability requires, gives no timeline for the remaining Poseidon upgrades, and does not break down the A$5.5 billion between ISR and electronic warfare.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/australia-triton-peregrine-poseidon/"]]},
{"id": "hunter-insulation", "r": "Oceania", "c": "Naval", "st": "Company claim", "time": "23 Sep", "t": "Tasmanian firm CBG Systems wins an $83 million insulation contract for the first three Hunter-class frigates", "s": "BAE Systems Maritime Australia picked CBG for HMAS Hunter, Flinders and Tasman. The first keel was laid in August.", "p": ["Hobart-based CBG Systems has won an $83 million contract from BAE Systems Maritime Australia covering fire, thermal and acoustic insulation, linings and pinning for the first three Hunter-class frigates: HMAS Hunter, HMAS Flinders and HMAS Tasman. CBG has supplied insulation for prototype blocks since 2023 and will set up staff, a workshop and offices at Osborne Naval Shipyard, where the first frigate’s keel was laid in August. Managing director Javier Herbon called it a landmark contract for the firm and Tasmania’s defence industry.", "BAE is building six frigates in Australia, formerly through ASC Shipbuilding, with commissioning planned for the early 2030s. Other suppliers include BlueScope Steel, L3Harris, Babcock and STS Defence."], "cav": "The currency is unspecified, and the contract duration and payment terms are not stated. It is unclear whether CBG’s role extends to the other three frigates, and no delivery schedule or performance details are given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/australian-hunter-frigate-insulation-cbg/"]]},
{"id": "mk45-sustainment", "r": "Oceania", "c": "Naval", "st": "Company claim", "time": "23 Sep", "t": "BAE Systems Australia wins $32 million to sustain the Navy’s Mk 45 guns", "s": "The five-year contract covers Hobart-class destroyers, Anzac frigates and the future Hunter class, with work in Henderson, Western Australia.", "p": ["BAE Systems Australia has won a $32 million, five-year contract to sustain the Royal Australian Navy’s Mk 45 5-inch naval guns. It covers preventative, corrective and priority maintenance for guns on the Hobart-class destroyers, Anzac-class frigates and future Hunter-class frigates, and BAE will also refurbish the Hobart-class guns. The work takes place at BAE’s Henderson workshop in Western Australia, which the company calls one of only two sites in the world able to both refurbish and replace bespoke components on the guns.", "David Shepherd, BAE’s managing director for surface ships, said the guns support the fleet’s firepower and will stay ready for years. Babcock Australia separately won an Anzac-frigate sustainment contract earlier in September, and the Anzacs will eventually be replaced by Japan’s upgraded Mogami-class design."], "cav": "It is not said whether the $32 million includes the Hobart refurbishment or how it is priced, and no start date, contracting authority or timing for Hunter-class guns is given. How long the Anzacs keep their Mk 45 guns is also not stated.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/bae-systems-australia-mk45-guns/"]]},
{"id": "tomahawk-planning-australia", "r": "Oceania", "c": "Missiles", "st": "Official claim", "time": "20 Oct", "t": "US approves a potential $300 million Tomahawk mission-planning sale to Australia", "s": "The package covers a Theater Mission Planning Center, planning systems, communications gear and support.", "p": ["The US State Department approved a potential $300 million sale to Australia of Tomahawk mission-planning systems, communications equipment and support. The package includes a Theater Mission Planning Center, a TMPC Mission Planning System, and programme management, engineering, training and logistics support. The State Department said the sale would strengthen Australia’s Tomahawk capability, help deter regional threats and improve interoperability with US and allied maritime forces. Principal contractors are BAE Systems (San Diego), Tapestry Solutions (St. Louis), Peraton (San Jose) and Leidos (Virginia Beach).", "Raytheon developed the Tomahawk, with a reported range of up to 1,000 miles. In 2023 Australia agreed to buy more than 200 Tomahawks for $830 million, and a 2024 US Navy contract for 131 Block V missiles included 11 for Australia."], "cav": "A potential sale is an approval, not a signed contract. The exact missile count in the 2023 deal was never disclosed, and the article gives no delivery timeline or independent assessment of regional deterrence.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/20/us-tomahawk-australia/"]]},
{"id": "tiger-retired", "r": "Oceania", "c": "Helicopters", "st": "Official claim", "time": "30 Sep", "t": "Australian Army ends Tiger helicopter flying after 22 years", "s": "The 1st Aviation Regiment moves from Darwin to Townsville. 29 AH-64E Apaches are replacing the type.", "p": ["The Australian Army has ended flying operations of its Airbus ARH Tiger helicopters after 22 years of service that began in 2001. The 1st Aviation Regiment marked the end in Darwin and is relocating 1,860 km east to Townsville, Queensland. Sustainment and readiness setbacks led Canberra to speed up the phase-out under its latest National Defence Strategy.", "The Tigers are being replaced by 29 Boeing AH-64E Apaches bought through a $3.5 billion US foreign military sale; six have arrived and the rest are due through late 2029. Commander Army Aviation Maj. Gen. David Hafner called it a significant moment for the regiment. Disposal options for the retired airframes are under review, including a possible transfer to Ukraine."], "cav": "The article does not say how many Tigers were in service at retirement, the Ukraine transfer is only potential with no decision or terms, and it does not explain how the capability gap will be covered until Apache deliveries finish.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/30/australia-decommissions-tiger-helicopters/"]]},
{"id": "lite-coms-land4140", "r": "Oceania", "c": "Land", "st": "Company claim", "time": "25 Sep", "t": "Lite Coms to supply more than 100 tactical satellite terminals for Australia’s LAND 4140", "s": "Boeing Defence Australia selected the 1.3 m LITE SAT terminals, with early units shipping and deliveries due by late 2027.", "p": ["Boeing Defence Australia has selected Lite Coms to supply tactical satellite-communication terminals for the Australian Defence Force’s LAND 4140 programme, a multi-year effort to consolidate battlefield management, targeting and real-time data systems that Boeing is integrating. Lite Coms will deliver more than 100 LITE SAT 1.3A terminals for multi-band networks, and early production units have begun shipping, with initial deliveries due by late 2027, according to Janes.", "The 1.3 m terminal has a carbon-fibre reflector, tool-free assembly and automatic signal acquisition in under 10 minutes. Lite Coms CEO Bob Jacobson said the company is ready to provide top-tier performance and support."], "cav": "Contract value and duration are not disclosed. The late-2027 timeline comes from Janes, not the companies, and the set-up time and performance claims are vendor statements without independent testing.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/australia-satcom-dishes-lite-coms/"]]},
{"id": "f35-parts-hong-kong", "r": "Oceania", "c": "Air", "st": "Reported", "time": "24 Sep", "t": "Australian F-35 parts bound for the US end up in Chinese hands after a shipping mishap", "s": "A cockpit canopy and weapons-bay door were diverted to Hong Kong. Two congressional committees have opened inquiries.", "p": ["Chinese authorities seized F-35 components after a shipment from Australia was rerouted to Hong Kong. The UPS-carried package, sent on behalf of Lockheed Martin, contained a cockpit canopy and a weapons-bay door from an Australian F-35 sent to the US for maintenance, and made an unscheduled stop in South Korea before diverting. US officials reportedly confirmed to Bloomberg that the parts are coated with classified radar-absorbing material, and at least two congressional committees have launched inquiries.", "Lockheed Martin told CNN the components are unserviceable and deemed low risk for exploitation. Australian Defence Minister Richard Marles said Canberra is investigating its part of the logistics chain. The incident comes amid congressional scrutiny of a $24.3 billion F-35 sale to Saudi Arabia."], "cav": "The article does not say when or whether Beijing will return the parts or why the shipment was rerouted. The low-risk assessment is Lockheed Martin’s, with no independent evaluation.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/24/china-f35-parts-us-australia/"]]},
{"id": "redback-40mm", "r": "Far East", "c": "Land", "st": "Company claim", "time": "1 Oct", "t": "Hanwha’s Redback fighting vehicle gets a 40 mm turret and a counter-drone role", "s": "The new turret is from Lockheed Martin UK and carries the SkyKeeper command and control system.", "p": ["Hanwha Aerospace’s Redback infantry fighting vehicle has received a firepower upgrade. The hull now carries a new turret from Lockheed Martin UK with a 40 mm cannon and the SkyKeeper command-and-control system. The vehicle keeps its conventional combat role and can also support counter-uncrewed-aircraft operations from one platform."], "cav": "No timeline, contract or customer, so it is unclear whether this is a demonstrator or fielded configuration. There are no engagement ranges, fire rates or drone-defeat data, and SkyKeeper’s capabilities are not explained.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/01/redback-fighting-vehicle-weapon/"]]},
{"id": "indonesia-carrier", "r": "Far East", "c": "Naval", "st": "Reported", "time": "22 Sep", "t": "Indonesia receives its first aircraft carrier, ex-Italian Giuseppe Garibaldi, amid cost criticism", "s": "The 41-year-old ship will be commissioned as KRI Sriwijaya. Lawmakers warn retrofit costs could reach $900 million.", "p": ["Indonesia has taken delivery of its first aircraft carrier, the former Italian Navy ITS Giuseppe Garibaldi (C-551), which is 41 years old. Two Thaon di Revel-class offshore patrol boats escorted it from Europe. Rome transferred the ship in March 2026 and Jakarta will commission it in late September as KRI Sriwijaya (100). The Finance Ministry approved $450 million, but lawmakers warn retrofit costs could reach $900 million.", "At 180 m it would be Indonesia’s second carrier in Southeast Asia after Thailand’s in the late 1990s. Planned uses are disaster relief, peatland firefighting and maritime surveillance rather than long-range strike. President Prabowo Subianto says revamps will allow up to 14 helicopters and uncrewed aircraft, and 310 personnel are being prepared to crew it."], "cav": "The article does not explain how the $900 million estimate was calculated or how the gap with $450 million would be funded. It warns the overhaul could divert resources from frigates and submarines but does not quantify that.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/22/indonesia-first-carrier-backlash/"]]},
{"id": "kaplan-harimau", "r": "Far East", "c": "Land", "st": "Company claim", "time": "21 Sep", "t": "Indonesia’s Kaplan armoured personnel carrier passes pre-delivery tests in Türkiye", "s": "FNSS and Pindad completed preliminary acceptance tests of the 30-tonne tracked vehicle, called Harimau APC in Indonesia.", "p": ["FNSS of Ankara and Indonesia’s state firm Pindad have finished preliminary acceptance tests in Türkiye for the Indonesian Army’s first Kaplan APC, called the Harimau APC in Indonesia. The 30-tonne tracked vehicle will ship to Jakarta for final user trials, and Pindad is assembling a second vehicle locally under a technology-transfer initiative. Subsystems are shared with Indonesia’s Harimau tank and Türkiye’s ZAHA amphibious assault vehicle to ease logistics.", "The programme launched in 2024. The vehicle carries 13 personnel plus a driver, commander and gunner, and has 360-degree cameras, automatic fire suppression, modular ballistic armour, mine protection and an optional active shield against anti-tank missiles. Weapon options include 30 and 35 mm cannons and 120 mm mortars, and it can be converted for medical evacuation, command or engineering roles. Expected top speed is about 70 km/h with a 450 km range."], "cav": "No delivery schedule or contract value. Speed and range are expectations, not verified results, and the preliminary test outcomes and Indonesia’s final weapon fit are not detailed.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/21/indonesia-kaplan-tests-turkey/"]]},
{"id": "china-military-ai-oversight", "r": "Far East", "c": "Military AI", "st": "Official claim", "time": "21 Sep", "t": "China’s defence minister calls for international oversight of military AI", "s": "Dong Jun urged countries to assess AI risks and set rules at the Xiangshan Forum in Beijing.", "p": ["Chinese Defence Minister Dong Jun called for stronger international oversight of military AI, according to The Straits Times as cited by The Defense Post. Speaking at the Xiangshan Forum in Beijing, he urged countries to assess AI’s risks and set rules for its military use, arguing that concerns about misuse should prompt more security dialogue and cooperation. The remarks come as the US and China compete for AI leadership and influence over global rules."], "cav": "The article does not say what oversight mechanisms would look like or who would enforce them, includes no US or other government response, and does not address China’s own military AI programmes or how compliance could be verified.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/21/china-military-ai-oversight/"]]},
{"id": "miyako-hiroshima", "r": "Far East", "c": "Naval", "st": "Reported", "time": "19 Sep", "t": "Mitsubishi hands over the seventh Miyako-class patrol vessel to the Japan Coast Guard", "s": "JCG Hiroshima is one of 11 large cutters planned to counter Chinese activity near the Senkakus.", "p": ["The Japan Coast Guard has taken delivery of its seventh Miyako-class large patrol vessel, JCG Hiroshima (PL-207), from Mitsubishi Heavy Industries at Tamano, Okayama Prefecture. Deputy Director General Wataru Sasaki attended the handover. The Hiroshima Coast Guard Office will operate it under the 6th Regional Coast Guard Headquarters for territorial defence, public safety, rescue and resource conservation.", "The programme began in 2016 and currently covers 11 vessels, and PL-207 is the sixth that Mitsubishi has built. The ship is 117 m long with a 15 m beam, four 6,000 hp diesels, a speed above 25 knots, one helicopter, two 40 mm cannons and remote water cannons. Japan launched the programme to counter Chinese activity near the Senkaku Islands, which Japan administers but Beijing and Taipei also claim."], "cav": "Crew capacity and helicopter count come from unnamed sources, the stated 20,000-nautical-mile range is unusually high for the class and unexplained, and no cost, commissioning date or schedule for the remaining hulls is given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/19/japan-miyako-patrol-vessel-3/"]]},
{"id": "thai-lanza-phuket", "r": "Far East", "c": "Air defence", "st": "Company claim", "time": "25 Sep", "t": "Thailand orders an Indra Lanza 3D long-range radar for Phuket", "s": "It is the Royal Thai Air Force’s third Lanza 3D. Indra gives a range of 470 km.", "p": ["Thailand has ordered a Lanza 3D long-range radar from Spain’s Indra for Phuket Air Base, near maritime routes linking the Indian Ocean and the Strait of Malacca. It is the third Lanza 3D the Royal Thai Air Force has contracted. Indra gives a maximum range of 470 km (255 nautical miles) and a 360-degree antenna scan every 10 to 12 seconds, with altitude coverage of about 900 m to 30 km and 20-degree elevation (30 degrees in ballistic-missile tracking mode).", "Indra says the radar is designed to detect targets from small drones to missiles and includes an identification friend-or-foe system. The contract includes Indra’s AIRDEF command-and-control system, which supports threat assessment, aircraft or weapon assignment, data recording and coordination with civilian air traffic control."], "cav": "No contract value, delivery schedule or operational date. The performance figures are Indra’s own, and the article does not say what happened to the other two radars or whether AIRDEF must be bought with the radar.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/thailand-indra-long-range-radar/"]]},
{"id": "korea-ai-kjccs", "r": "Far East", "c": "Military AI", "st": "Company claim", "time": "1 Oct", "t": "South Korea runs AI on its military battlefield network for the first time", "s": "MakinaRocks demonstrated its Runway platform inside the closed KJCCS command system during Ulchi Freedom Shield.", "p": ["South Korea ran AI on its military battlefield network for the first time during the 2026 Ulchi Freedom Shield exercise. The demonstration was carried out by MakinaRocks with the Joint Chiefs of Staff, using the company’s Runway AI operating system within the Korea Joint Command and Control System (KJCCS), described as a closed battlefield network with tighter security controls, separate from the broader network used for administrative and support tasks. It let AI models and services run directly inside that secured environment."], "cav": "The article does not name the models, the tasks they performed or any results. The “first time” claim and the details appear to rest mainly on a company LinkedIn post, and it is not said whether this leads to operational use or how security approval was handled.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/01/south-korea-ai-battlefield-network/"]]},
{"id": "k2-upgrade", "r": "Far East", "c": "Land", "st": "Official claim", "time": "12 Aug", "t": "South Korea plans a 3.43 trillion won upgrade of K2 tanks to counter drones", "s": "DAPA’s project from 2028 to 2046 adds active protection, a drone and IED jammer and a remote weapon station.", "p": ["South Korea plans a 3.43 trillion won (about $2.43 billion) upgrade of its Hyundai Rotem-built K2 tanks, according to the Defense Acquisition Program Administration. The K2 Tank Performance Upgrade Project would add an active protection system, a drone and IED jammer and a remote-controlled weapon station, and run from 2028 to 2046. The main driver is North Korea’s suicide-drone programme, reportedly aided by Russia, since drones can strike tanks from above where armour is thinner. North Korea’s Chonma-20 tank already has an active protection system.", "A separate programme would develop the Haeseong-II ship-to-ship missile, with 1.63 trillion won (about $1.15 billion) planned through 2039. Its expected range is in the mid-300 km range, against about 150–180 km for the current Haeseong."], "cav": "Russian help with North Korea’s drone programme is described only as reported and likely. The article does not say how many tanks will be upgraded or how effective the jammer and protection system will be, and the Haeseong-II range is an expectation.", "src": [["The Defense Post", "https://thedefensepost.com/2026/08/12/south-korea-k2-tank-2/"]]},
{"id": "taiwan-drone-audit", "r": "Far East", "c": "Air defence", "st": "Reported", "time": "12 Aug", "t": "Audit says Taiwan’s drone defences cannot handle fibre-optic and AI-guided drones", "s": "Reliance on jamming may fail against drones that need no radio link, and China is developing 5.1 GHz systems.", "p": ["A recent audit, reported by the Taipei Times on 26 July, found that Taiwan’s drone defences are not equipped to counter fibre-optic and AI-guided systems. Taiwan relies heavily on electronic warfare, signal disruption and jamming, which may be ineffective against fibre-optic links or autonomous guidance that does not depend on radio-frequency communication. Most drones in service use the 2.4 GHz and 5.8 GHz bands, while China is developing systems that can operate on 5.1 GHz, and the audit also flags gaps in detecting and countering drones across different bands."], "cav": "The article does not name the body behind the audit or give its full findings, and its details come second-hand through the Taipei Times. It does not quantify the gap, say when Chinese 5.1 GHz systems might be fielded or describe Taiwan’s planned response.", "src": [["The Defense Post", "https://thedefensepost.com/2026/08/12/taiwan-drone-defenses/"]]},
{"id": "taiwan-navy-strike-drone", "r": "Far East", "c": "Drones", "st": "Reported", "time": "12 Aug", "t": "Taiwan’s Navy flies a new medium one-way strike drone during Han Kuang", "s": "It flew over a beach for about 30 minutes, simulating an attack on Tsoying, home of the largest naval base.", "p": ["The Taiwanese Navy flew a new medium-class one-way strike drone for the first time during the Han Kuang exercise, according to the original reporting by Business Insider as relayed by The Defense Post. The drone flew over a beach for about 30 minutes, simulating an attack on Tsoying, home to Taiwan’s largest naval base. The Ministry of National Defence’s Armament Bureau provided the platform for testing, and the article describes it as another locally developed autonomous weapon in Taiwan’s drone arsenal."], "cav": "No specifications such as range, payload or speed, and no name or maker. The number of units, procurement plans and entry into service are not given, and the “Ukraine-style” label and the degree of autonomy are not explained.", "src": [["The Defense Post", "https://thedefensepost.com/2026/08/12/taiwan-ukraine-style-drone/"]]},
{"id": "japan-palantir-anduril", "r": "Far East", "c": "Military AI", "st": "Reported", "time": "11 Aug", "t": "Japan weighs Palantir and Anduril AI for its military command and control", "s": "Tokyo could combine both firms’ systems under a homegrown AI platform, Nikkei Asia reports.", "p": ["Japan is weighing US-made AI from Palantir and Anduril, according to a Nikkei Asia report cited by The Defense Post. The systems would support Self-Defense Forces command and control, helping process information and act faster. Tokyo could combine both companies’ systems and place a homegrown AI platform above them to oversee their use. The push is part of broader defence modernisation amid concerns about China, North Korea and Russia, and the article’s metadata flags data sovereignty and reliance on foreign technology as issues."], "cav": "The plan is still under consideration with no contract, budget or timeline. The story rests on a single second-hand report without Japanese government confirmation, and the homegrown platform is unnamed.", "src": [["The Defense Post", "https://thedefensepost.com/2026/08/11/japan-military-ai-palantir-anduril/"]]},
{"id": "pal-kamikaze-usv", "r": "Far East", "c": "Naval", "st": "Company claim", "time": "13 Aug", "t": "Indonesia’s PT PAL shows a kamikaze drone boat with AI target identification", "s": "The uncrewed surface vessel reaches up to 55 knots and carries a 150 kg warhead.", "p": ["State-owned shipbuilder PT PAL has developed an indigenous kamikaze uncrewed surface vessel for the Indonesian Navy, meant to boost maritime strike capability. It reaches up to 55 knots (about 102 km/h) and carries a 150 kg (331 lb) warhead. It uses AI for real-time identification friend or foe, so it can tell potential targets apart without depending entirely on remote operators."], "cav": "The article does not say how much human oversight remains or when a person must approve an engagement. No accuracy or error rates are given for the identification system, and the number of units, service status, range, endurance and propulsion are not stated.", "src": [["The Defense Post", "https://thedefensepost.com/2026/08/13/indonesian-usv-brings-ai/"]]},
{"id": "iran-missiles-carrier-tankers", "w": "Iran and Gulf", "c": "Naval", "st": "Official claim", "time": "7 Sep", "t": "Iran fires ballistic missiles at US carrier and destroyer; CENTCOM hits three tankers", "s": "CENTCOM says both warships evaded the 5 September attack unharmed and that it struck three Iranian crude tankers in response.", "p": ["According to US Central Command, Iran’s Revolutionary Guard fired ballistic missiles on 5 September at an aircraft carrier and a guided-missile destroyer in Middle Eastern waters. The US says both ships evaded the attacks without casualties.", "CENTCOM then struck three Iranian crude tankers: the M/T Downy off Kharg Island was permanently disabled, the M/T Stark 1 near Jask was disabled, and the unladen M/T Kylo, also called Noxen, was destroyed in the Gulf of Oman. On 6 September the Guard claimed it had hit the carrier and destroyer and forced them to leave, and said it attacked three tankers and three US-linked vessels. Defense Secretary Pete Hegseth warned that more attacks on US ships would bring more action against Iran’s tanker fleet."], "cav": "The Guard’s damage claims are unverified. CENTCOM did not name the carrier or destroyer, nor the number and type of missiles fired.", "src": [["Army Recognition", "https://www.armyrecognition.com/news/navy-news/2026/iran-fires-ballistic-missiles-at-u-s-navy-carrier-and-destroyer-as-u-s-strikes-3-oil-tankers"]]},
{"id": "us-destroys-five-iranian-tankers", "w": "Iran and Gulf", "c": "Naval", "st": "Official claim", "time": "11 Sep", "t": "CENTCOM says it destroyed five Iranian oil tankers on 8 September", "s": "The strikes followed two Guard missile attacks on a US warship; eight tankers have now been hit since 5 September.", "p": ["CENTCOM says it destroyed five Iranian crude-oil tankers on 8 September: Kaviz, Charminar, Horizon 1 and Riesco in the Gulf of Oman, and Derya near Kharg Island. The strikes came after two Guard ballistic-missile attacks on a US Navy warship over two days, which the ship reportedly evaded without casualties.", "CENTCOM says crews were ordered to abandon the tankers before they were struck and rendered inoperable, and links the vessels to a shadow oil network that funds the Guard. The article counts eight Iranian tankers hit since 5 September and argues that going after oil shipping widens retaliation beyond military targets, at the cost of higher escalation risk around the Strait of Hormuz."], "cav": "CENTCOM did not disclose which aircraft, ships or weapons were used, and the targeted warship is unnamed. The funding-network claim rests largely on CENTCOM statements.", "src": [["Army Recognition", "https://www.armyrecognition.com/news/navy-news/2026/u-s-naval-forces-destroy-5-iranian-oil-tankers-after-irgc-missile-attacks-on-u-s-navy-warship"]]},
{"id": "iran-saildrone-claim", "w": "Iran and Gulf", "c": "Naval", "st": "Official claim", "time": "12 Sep", "t": "Iran claims strike on a US Saildrone Explorer near Hormuz", "s": "The Guard says it hit the 7 m wind-powered drone on 10 September; Washington has not commented.", "p": ["Iran’s Guard Navy claims it struck a US-operated Saildrone Explorer, hull 5838, near the Strait of Hormuz on 10 September. The type is a 7 m wind-propelled surface vessel that can stay at sea for over a year at about 1 to 3 knots, and the US Navy has used it in the Gulf with Task Force 59 from Bahrain since January 2022.", "Two days earlier the Guard said it recovered an Anduril Dive-LD underwater drone, which CENTCOM acknowledged had malfunctioned while saying it carried no classified radar or sonar. On 6 September the Guard claimed an attack on another US remotely operated vessel, which CENTCOM called a “total lie.”"], "cav": "The strike claim comes only from Iranian sources and the timing is unclear. Iranian media say the Saildrone now operates from Khasab, Oman, which no US information confirms.", "src": [["Army Recognition", "https://www.armyrecognition.com/news/navy-news/2026/iran-claims-strike-on-u-s-saildrone-explorer-during-surveillance-mission-near-strait-of-hormuz"]]},
{"id": "iran-kingfish-claim", "w": "Iran and Gulf", "c": "Underwater", "st": "Official claim", "time": "2 Oct", "t": "Iran claims capture of a US Navy MK 18 Kingfish mine-hunting vehicle", "s": "CENTCOM rejects the 27 September claim and says US forces still control their drone assets.", "p": ["The Guard Navy says it seized a US Navy MK 18 Mod 2 Kingfish unmanned underwater vehicle in the Strait of Hormuz, announced by spokesman Hossein Mohebbi on 27 September. It would be Iran’s second claimed US underwater drone recovery in September after the Dive-LD on 8 September. CENTCOM spokesman Capt. Tim Hawkins rejected the claim.", "The Kingfish is about 3.5 m long, weighs up to 272 kg and is rated to 600 m. Hydroid built more than 90 for the Navy before production ended in February 2023. The article argues the main intelligence value of a recovered vehicle would be its stored sonar data and payload configuration. Hormuz traffic was roughly 18 transits a day in late September."], "cav": "The claim is unverified and disputed. The article’s speed and range figures are inconsistent and it once mislabels the vehicle as an aerial one.", "src": [["Army Recognition", "https://www.armyrecognition.com/news/navy-news/2026/iran-us-navy-mk18-kingfish-drone-strait-of-hormuz"]]},

{"id": "houthi-strikes-saudi-jazan", "w": "Iran and Gulf", "c": "Missiles", "st": "Reported", "time": "8 Sep", "t": "Houthi strikes hit Saudi Aramco’s Jazan refinery, threatening the kingdom’s Red Sea lifeline", "s": "Brent neared $98 as Saudi Arabia leaned on its Yanbu port after the attacks.", "p": ["Houthi missiles and drones hit Saudi Aramco’s Jazan refinery on the Red Sea, which was engulfed in flames. Houthi spokesman Yahya Saree claimed dozens of ballistic missiles and drones struck Aramco sites in Abha, Najran and Jizan, plus Khamis Mushait Air Base. Coalition spokesman Turki Al-Maliki reported 73 civilians injured, and the Saudi Energy Ministry said the attacks caused fires at several locations and temporarily halted some operations.", "Saudi Arabia has diverted millions of barrels a day to its Yanbu Red Sea port. Brent crude neared $98, about $10 above its 26 August level. The same report notes CENTCOM’s tanker strikes and Iran’s Dive-LD claim."], "cav": "Casualty and damage claims come from parties to the conflict. Fire extent relies on social media video and NASA thermal data, and the report is a live update.", "src": [["The War Zone", "https://www.twz.com/news-features/saudis-remaining-energy-lifeline-to-the-world-under-threat-after-successful-houthi-strikes"]]},
{"id": "ukraine-nato-ai-drone-forecast", "w": "Ukraine", "c": "Drones", "st": "Official claim", "time": "15 Oct", "t": "Ukraine and NATO build AI tools to forecast Russian drone activity", "s": "Two models from the joint JATEC centre target drone forecasting and artillery planning.", "p": ["Ukraine and NATO developed two AI tools through the NATO-Ukraine Joint Analysis, Training and Education Centre, with Allied Command Transformation and Ukraine’s armed forces. Model No. 13 forecasts the intensity, location, timing and types of enemy drone activity near the front from historical data, weather and battlefield conditions; Ukraine’s defence ministry says it was validated on real datasets and is ready for integration into situational awareness systems. Model No. 32 generates and ranks feasible artillery plans against mission constraints.", "In September the ministry said its forces had neutralised over 350,000 Russian drones since the start of 2026, at least 220,000 of them fixed-wing, and that the UK became the first international partner to join its Avengers Labs platform."], "cav": "Model No. 32 is a prototype. The validation claims and the 350,000 figure are Ukraine’s own, and no accuracy metrics are given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/15/ukraine-nato-ai-russian-drones/amp/"]]},

const fig=i=>{let u=i.img,c=i.cr;const k=typeof IMG!=="undefined"&&IMG[i.id];if(k){u=CM(k,640);c=`<a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(k.replace(/ /g,"_"))}" target="_blank" rel="noopener">${esc(k.replace(/\.[A-Za-z]+$/,""))}</a>, Wikimedia Commons (free licence, author on the file page)`}
 else if(u&&u.indexOf("Special:FilePath")>0)u=u.replace("width=1200","width=640");

 return u?`<figure><img src="${u}" alt="Photo for: ${esc(i.t)}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption>Photo: ${c}</figcaption></figure>`:""};

 h+='<main id="list"></main>';

}
function list(){
 const el=document.getElementById("list");if(!el)return;
 const l=items.filter(i=>(cat=="All"||(cat=="Wars"?i.w&&(sub=="All wars"||i.w==sub):i.r==cat))&&(i.t+i.s).toLowerCase().includes(term));
 if(!l.length){el.innerHTML='<p class="empty">No stories match. Clear the search or pick another region.</p>';return}
 const lead=l.find(i=>i.lead)||null;let h="";
 if(lead){const n=r=>items.filter(i=>i.r==r).length;
  h+=`<section class="lead">${card(lead,true)}</section>`}
 h+='<section class="grid">'+l.filter(i=>i!==lead).map(i=>card(i)).join("")+"</section>";
 el.innerHTML=h;
}
function article(id){
 const i=items.find(x=>x.id==id);if(!i){location.hash="#/";return}
 app.innerHTML=`<div class="full"><a class="back" href="#/">← All stories</a>${meta(i)}<h2>${i.t}</h2><p class="lede">${i.s}</p>${fig(i)}${i.p.map(p=>`<p>${p}</p>`).join("")}
 <div class="srcs"><b>Sources</b><ul>${i.src.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join("")}</ul></div>
 </div>`;
 document.title=i.t+" – Watchfloor";window.scrollTo(0,0);
}
function route(){const m=location.hash.match(/^#\/(.+)$/);m?article(m[1]):home()}
window.addEventListener("hashchange",route);route();
