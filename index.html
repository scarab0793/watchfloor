{"id":"cmsi-report-59-plan-submariners","r":"Far East","c":"Research","st":"Analysis","time":"24 Oct","t":"CMSI report looks at career, organisation and training of PLA Navy submariners, and the cost of dual command","s":"China Maritime Report #59 is by retired US Rear Admiral Philip Yu and Benjamin Rosen; this summary rests on the publication notice, not the full paper.","p":["The US Naval War College's China Maritime Studies Institute (CMSI) has published China Maritime Report #59, titled \"Be Focused, Be Humble, Be Happy: Career Progression, Organization, & Training of PLAN Submariners\". The authors are Rear Admiral Philip Yu, US Navy (retired), and Benjamin Rosen. Andrew Erickson's blog announced it on 24 October.","According to the announcement, the paper examines the costs of the PLA Navy's dual command arrangement, in which a commanding officer shares authority with a political commissar, and of Party committee meetings, particularly when decisions are time-sensitive. It sits within CMSI's series on how the PLA Navy is organised, recruited and trained, which has also covered discipline inspection (Report #58) and amphibious exercises.","The report is research and judgement, not a disclosure of PLA data; readers should consult the full text on the Naval War College's publication site for its evidence and method."],"cav":"Only the publication notice was read; the paper's evidence, sample and conclusions are not independently reviewed here.","src":[["Andrew Erickson (CMSI archive)","https://www.andrewerickson.com/2026/10/china-maritime-report-59-be-focused-be-humble-be-happy-career-progression-organization-training-of-plan-submariners/"]]},
{"id":"greece-israel-spike-bouboulina","r":"Europe","c":"Naval","st":"Reported","time":"24 Oct","t":"Greek and Israeli navies fire SPIKE missiles at the old frigate Bouboulina in the Cretan Sea","s":"Naval News says the 21 October acceptance firings used SPIKE NLOS and SPIKE ER2; a Greek Type 214 submarine finished the target with a torpedo.","p":["The Hellenic Navy carried out its first SPIKE missile firings in a joint exercise with the Israeli Navy on 21 October in the northern Cretan Sea, Naval News reported on 24 October. The shots were acceptance firings of Rafael's SPIKE NLOS and SPIKE ER guided missiles. SPIKE NLOS was fired from a Machitis-class patrol vessel and SPIKE ER2 from a Mark V Special Operations Craft. Two Israeli Navy missile boats took part and also fired missiles, whose details were not disclosed.","The target was the decommissioned frigate Bouboulina (F463), built in 1983 as the Dutch Pieter Florisz and in Greek service from 2001 to 2013. After the missile hits, a Papanikolis-class (Type 214HN) submarine sank her with an SUT torpedo.","Greece has eight SPIKE-armed craft. Four Machitis-class vessels carry eight NLOS missiles each, with a 32 km range, and four Mk V SOCs carry four ER2 missiles each, with a 10 km range. The chiefs of the Greek and Israeli navies met aboard the frigate Psara, and Naval News links the drills to Libya's eastern parliament ratifying a maritime memorandum with Turkey on 20 October."],"cav":"Naval News relies on Hellenic Navy information; hit results and the Israeli missile types were not detailed. The regional-context link to Turkey is the outlet's framing.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/hellenic-navy-conducts-inaugural-spike-missile-firings-during-joint-drills-with-israel/"]]},
{"id":"spain-f110-iamd-frigate","r":"Europe","c":"Naval","st":"Company claim","time":"23 Oct","t":"Spain's Navy and Navantia show the F110 IAMD, an air-defence development of the new frigate","s":"A scale model was shown at DALO Industry Days 2026; the release gives no schedule, cost or number of ships.","p":["The Spanish Navy and Navantia are defining a frigate called the F110 IAMD (integrated air and missile defence), Naval News reported on 23 October from a Navantia release. It is an evolution of the F110 Bonifaz class and responds to the Navy's Armada 2050 requirements. A model was displayed at DALO Industry Days 2026.","The ship is meant to counter aircraft, ballistic missiles and cruise missiles, escort high-value ships and coordinate air defence within a task group. Navantia describes more vertical launch cells, a cloud-hosted evolution of the SCOMBA NG combat system, a digital twin for maintenance, and space for a second helicopter and uncrewed vehicles, while keeping the F110's anti-submarine and anti-surface roles.","It would complement the five F110 frigates now being built. The final configuration depends on the Navy, the Ministry of Defence and Navantia, and Navantia says more than 500 companies would be involved."],"cav":"Capabilities are Navantia's design aims. No contract, price, quantity or timeline is given and no sensor or missile type is named.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/spanish-navy-and-navantia-design-an-iamd-frigate-aiming-to-extend-f110-class/"]]},
{"id":"diu-armed-usv-counter-uas-sprint","r":"USA","c":"Counter-drone","st":"Official claim","time":"22 Oct","t":"Pentagon and DIU open a 120-day sprint for armed uncrewed boats that shoot down drones","s":"The 19 October solicitation offers up to $100m in prizes over a 12-month challenge, with $200m more budgeted for follow-on deals.","p":["The Pentagon and the Defense Innovation Unit have begun a 120-day effort to acquire and field armed uncrewed surface vessels for counter-drone missions, Naval News reported on 22 October. DIU announced the search on 19 October under solicitation PROJ00721 with the Pentagon's unmanned-systems portfolio office. It says the cost of defeating cheap threats is heavily skewed in the adversary's favour.","Vessels must carry existing weapons such as the Longbow Hellfire, JAGM, APKWS or Stinger, engage Group 1–3 drones and helicopters at more than three nautical miles, travel at least 200 nautical miles at 10 knots or more, and navigate autonomously with a human supervising weapon use. Rearming by a two-person crew is highly desired. Bidders must demonstrate integrated systems within 30 days of selection, with operational testing planned for early 2027 at Joint Expeditionary Base Little Creek, Virginia.","The sprint is phase two of a three-phase, 12-month prize challenge worth up to $100 million, with up to $40 million for the counter-air phase and another $200 million budgeted for prototyping and production agreements. Naval News points to Saildrone's JAGM test at RIMPAC 2026, BlackSea's Comet USV and L3Harris's VAMPIRE kit as relevant technologies."],"cav":"These are requirements and budget figures, not awards. No winner has been named, and the 120-day fielding goal is the Pentagon's aim.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/pentagon-diu-sprint-counter-uas-armed-usvs/"]]},
{"id":"nikitin-project-23130-trials","r":"Russia","c":"Naval","st":"Reported","time":"22 Oct","t":"Russian tanker Vasily Nikitin moves toward sea trials, Brazilian naval blog reports","s":"The source, Poder Naval, is a Portuguese-language blog; the ship is the second Project 23130 tanker and has not been delivered.","p":["Poder Naval, a Portuguese-language Brazilian naval blog, reported on 22 October that the Russian Navy tanker Vasily Nikitin was recorded moving on 20 October to the base from which its builder will start sea trials. The post stresses that this is preparation and not delivery to the navy.","Built by the Nevsky shipyard in Shlisselburg and launched on 5 October 2023, it is the second ship of Project 23130, after Akademik Pashin, commissioned in the Northern Fleet in January 2020. The third, Alexey Shein, was launched in July 2026. The design is about 130 m long with a 21.5 m beam, about 9,000 tonnes deadweight, 16 knots, 60 days' endurance and a 24-person crew, and the shipyard says it can refuel up to three ships at once at sea.","The blog notes that such tankers affect how long Russian naval units can stay at sea; without them operations depend more on onboard fuel and port access."],"cav":"Based on a Portuguese-language blog summarised in English here; the ship movement is a tracked sighting and the specifications are design figures, not trial results.","src":[["Poder Naval (Portuguese)","https://www.naval.com.br/blog/2026/10/22/russia-prepara-navio-tanque-vasily-nikitin-do-projeto-23130-para-testes-de-mar/"]]},
{"id":"cmsi-note-25-preclusion","r":"Far East","c":"Research","st":"Analysis","time":"15 Oct","t":"CMSI note: the PLA's 'preclusion' concept joins deterrence and denial against US intervention over Taiwan","s":"Ryan Martinson's CMSI Note 25 traces the term to a 2019 internal article by a PLA Navy admiral; findings are the institute's summary.","p":["The China Maritime Studies Institute at the US Naval War College published CMSI Note 25, \"Precluding the Powerful Enemy: A New PLA Concept for a Taiwan Conflict\", by Ryan D. Martinson. The blog of Andrew Erickson posted it on 15 October. The note's introduction by CMSI Director Christopher Sharman says the PLA's word is shezu (慑阻), meaning deterring US military intervention and, if that fails, denying it.","The key findings say the earliest identified use is a 2019 internal article by a PLA Navy admiral responsible for commanding forces in a Taiwan campaign, and that the term has become common in PLA reporting and academic writing since operations around Taiwan intensified in 2022. Preclusion would combine defensive operations on interior lines, using shore-based cruise and ballistic missiles, with offensive operations on exterior lines, using long-range air and naval forces. It is also central to PLA thinking on cognitive warfare, and appears to shape carrier strike group development and PLA Air Force training beyond the First Island Chain.","Only the introduction and key points were read for this item; the evidence is in the full note on the Naval War College Digital Commons."],"cav":"Reading limited to the institute's key findings. This is a US research interpretation of PLA writing, not a PLA statement.","src":[["Andrew Erickson (CMSI archive)","https://www.andrewerickson.com/2026/10/cmsi-note-25-precluding-the-powerful-enemy-a-new-pla-concept-for-a-taiwan-conflict/"]]},
{"id":"fortress-bases-90-days","r":"USA","c":"Strategy","st":"Official claim","time":"26 Oct","t":"Pentagon's FORTRESS initiative wants major US bases to run alone for 90 days of war","s":"Spokesperson Parnell says reliance on civilian infrastructure is 'an unacceptable risk'; no budget, timeline or base list has been given.","p":["The Pentagon has begun preparing US bases to operate independently for at least 90 days in a major war, Militarnyi reported on 26 October, citing Fox News. The effort is called FORTRESS. Major mainland installations would have to cover their own electricity, water, fuel and communications for three months, with measures that include portable small nuclear reactors, large-scale energy storage and local power grids.","Pentagon spokesperson Sean Parnell said the US can no longer rely on the Atlantic and Pacific oceans for protection and that dependence on municipal civilian infrastructure is 'an unacceptable risk'. The plan also covers strategic stocks of ammunition, fuel, critical minerals, electronics, spare parts and medical supplies, at least two independent supply channels for the most critical components, and a Civil Reserve Manufacturing Network of civilian firms identified in advance to switch to defence production."],"cav":"Second-hand report relayed from Fox News; no official Pentagon document is cited. 'Major war' is undefined and no funding, schedule or list of bases is given. The reactor photo shows a NuScale design but the article does not say that model is planned.","src":[["Militarnyi","https://militarnyi.com/en/news/u-s-prepares-bases-for-three-months-of-combat/"]]},
{"id":"pinckney-spy6-phase2","r":"USA","c":"Naval","st":"Reported","time":"25 Oct","t":"USS Pinckney starts second modernisation phase: SPY-6 radar and Aegis Baseline 10","s":"The $149.6m availability at NASSCO San Diego runs to September 2028; the headline's counter-drone EW claim is not borne out by the text.","p":["The US Navy has begun the second phase of modernising the destroyer USS Pinckney (DDG 91), Militarnyi reported on 25 October, citing Naval News. The ship will receive the AN/SPY-6(V)4 radar and the Aegis Baseline 10 combat system at General Dynamics NASSCO in San Diego under the DDG MOD 2.0 programme. The contract is worth $149.6 million with completion planned for September 2028.","Phase one, completed in 2024, installed the AN/SLQ-32(V)7 electronic-warfare suite (SEWIP Block III) and hull changes, after which the ship made an eight-month deployment. DDG MOD 2.0 covers four destroyers: Pinckney, Chung-Hoon, James E. Williams and Halsey. The Navy intends eventually to fit radar and EW upgrades in one shipyard period, and the staged approach lets it refine installation."],"cav":"The source headline mentions a counter-drone EW system, but the article does not describe any counter-drone function. SPY-6 performance is only described qualitatively and the ship specifications are uncited.","src":[["Militarnyi","https://militarnyi.com/en/news/counter-drone-ew-system-and-modern-radar-u-s-navy-begins-second-phase-of-uss-pinckney-modernization/"]]},
{"id":"france-atl2-black-sea","r":"Europe","c":"Maritime","st":"Reported","time":"25 Oct","t":"French Atlantique 2 patrol aircraft reportedly deployed to Romania to cover Black Sea shipping","s":"Flight-tracking data points to Constanța from 18 October; the French foreign minister said it also helped rescue crews after ship attacks.","p":["France has sent an Atlantique 2 maritime patrol aircraft to the Black Sea after drone attacks on merchant ships near Romania and Bulgaria, Militarnyi reported on 25 October. After two Romanian F-16s shot down two Geran-type drones on 17 October, the French aircraft reportedly reached Constanța on 18 October, and a US Navy P-8A flew from Sigonella over the western Black Sea on 19 October. The North Atlantic Council met on 20 October at Romania's request and NATO decided to add patrol aircraft, radar, drones and reconnaissance units.","Foreign Minister Jean-Noël Barrot, visiting Varna on 24 October, said the aircraft had worked in the region for two weeks within NATO missions and helped in rescues after attacks on three vessels, one of which sank within minutes about 100 km from Varna."],"cav":"The deployment rests on flight-tracking data reported by one Romanian outlet. Barrot's 'two weeks' does not match an 18 October arrival, and no vessel names, casualty figures or size of NATO's reinforcement are given.","src":[["Militarnyi","https://militarnyi.com/en/news/france-deploys-maritime-patrol-aircraft-to-protect-black-sea-shipping/"]]},
{"id":"lithuania-x12-interceptor","r":"Europe","c":"Counter-drone","st":"Company claim","time":"25 Oct","t":"Lithuanian-led alliance presents X-12 jet interceptor drone, said to be tested in Ukraine","s":"Developers claim 700 km/h and a 126 km range; the combat-test claim comes from Delfi and the alliance itself.","p":["The Strategic Defense Alliance, a grouping of Ukrainian, Lithuanian and Latvian defence-tech firms, has presented the X-12 turbojet interceptor drone, Militarnyi reported on 25 October, citing Lithuanian outlet Delfi. It is meant to destroy fast targets such as Russian Geran-5 drones. Quoted figures are up to 700 km/h, about 350 km/h cruise, a range of up to 126 km, a ceiling of 10 km and endurance beyond 12 minutes.","Alliance representative Richardas Savickas says the aim was a price below that of Shahed-type targets, that engines were assembled in Lithuania and other parts made in Latvia and Ukraine with no Chinese components, and that Ukrainian operators who tested it were very satisfied. Lithuania's defence ministry is considering integrating it into national air defence. Ukraine has its own jet interceptor based on the Bars missile-drone, planned for joint production with Germany."],"cav":"Performance, cost and 'no Chinese parts' statements are developer claims. No engagement numbers, results, price, volumes or delivery dates are given.","src":[["Militarnyi","https://militarnyi.com/en/news/lithuania-develops-x-12-jet-powered-interceptor-drone-already-tested-in-ukraine/"]]},
{"id":"serbia-m25-203mm","r":"Europe","c":"Land","st":"Official claim","time":"25 Oct","t":"Serbia shows its 203 mm TSMB M-25 self-propelled mortar firing for the first time","s":"The Defence Ministry video gives a 6–12 km range and up to three rounds a minute; test dates and results were not disclosed.","p":["Serbia's Ministry of Defence released video dated 21 October showing the TSMB M-25 203 mm self-propelled mortar firing for the first time, Militarnyi reported on 25 October. The Military Technical Institute developed it using design solutions from the 155 mm M-65 howitzer, a Yugoslav version of the US M114. It was first shown at the Partner 2025 exhibition in Belgrade.","The weapon has a 24-calibre barrel with automated loading, mounted on a FAP 2026 6x6 truck of about 19 tonnes with an armoured cab for four. The ministry gives a range of 6–12 km. A standard bomb weighs about 100 kg with roughly 27 kg of explosive; rocket-assisted rounds and PGK guidance kits are planned. Fire control uses inertial navigation and a ballistic computer."],"cav":"Specifications are ministry figures and are not independently verified. The video does not show when the tests occurred or their results, and the three-rounds-a-minute rate is unconfirmed.","src":[["Militarnyi","https://militarnyi.com/en/news/serbia-shows-tsmb-m-25-203mm-self-propelled-mortar-firing-for-the-first-time/"]]},
{"id":"avisma-berezniki-strike","w":"Ukraine","c":"Strikes","st":"Reported","time":"25 Oct","t":"Drones reportedly hit the AVISMA titanium plant in Berezniki; Perm governor confirms 'minor damage'","s":"The plant is part of VSMPO-AVISMA, which USGS data put at about 96% of Russian titanium sponge; the damage extent is unknown.","p":["Ukrainian drones attacked the AVISMA plant in Berezniki, Perm Krai, on 25 October, Militarnyi reported, with video published by the Exilenova+ community. Governor Dmitry Makhonin said air defences shot down 11 drones and an unnamed industrial facility suffered 'minor damage'; preliminary information says five employees were hurt.","AVISMA belongs to VSMPO-AVISMA, which the article says produced about 33,500 tonnes of titanium sponge in 2024, around 96% of Russia's total, citing USGS. Titanium alloys from the group are used in aircraft such as the Su-34 and Su-35 and, per Ukrainian sources, in missiles and armour. Before 2021 it exported about 70% of its output to Western aerospace firms."],"cav":"Documented by community video and the governor's statement; the target hit and output impact are unverified. The 96% share is a 2024 estimate, and end-use claims rely on Ukrainian government sources and a 2023 investigation. Militarnyi is a Ukrainian outlet.","src":[["Militarnyi","https://militarnyi.com/en/news/ukraine-strikes-avisma-plant-which-produces-96-of-russia-s-titanium-sponge/"]]},
{"id":"ru-titan-ugv-demining","r":"Russia","c":"Land","st":"Official claim","time":"25 Oct","t":"Russia presents Titan tracked robot with roller mine-clearing gear","s":"The developer, quoted by TASS, claims 2.3 tonnes, 1 tonne of payload and 7 km/h while clearing; no production date exists.","p":["Russia has shown a tracked unmanned vehicle called Titan, built to clear paths through minefields, Militarnyi reported on 25 October, relying on TASS and a developer representative. Two rollers at the front clear a 2-metre strip of anti-personnel mines by triggering pressure fuzes, with a third roller at the rear. The developer says it can also deal with tripwire fuzes.","Quoted figures are a mass of 2.3 tonnes, a 1-tonne payload, 7 km/h with the mine gear (14 km/h without), at least 3.5 hours of autonomy and radio control from at least 500 m. It has an electric drive, all-round fragmentation protection and can carry anti-drone EW. Video reportedly shows it surviving three small charges, one under each roller. Testing is said to be complete, but no serial production or delivery timeline was announced."],"cav":"All performance and protection figures are developer claims relayed by state media and unverified. Rollers cannot clear every mine, especially those with non-contact fuzes. The article's video credits are inconsistent.","src":[["Militarnyi","https://militarnyi.com/en/news/russia-develops-tracked-titan-ugv-equipped-with-roller-type-mine-clearing-devices/"]]},
{"id":"ru-valdai-air-defence-towers","r":"Russia","c":"Air defence","st":"Reported","time":"25 Oct","t":"Satellite imagery shows more than 50 air-defence positions around Putin's Valdai residence","s":"Radio Liberty and an OSINT researcher counted 16 new towers in October; system types are described only as 'likely' Pantsir or Tor.","p":["More than 50 air-defence positions now ring Vladimir Putin's residence at Valdai, Militarnyi reported on 25 October, drawing on a Radio Liberty satellite-imagery analysis done with OSINT researcher jembob. Sixteen new towers were built in October within 50 km south of the residence, on the side facing Ukraine, forming an outer ring that likely hosts Pantsir-S1 or Tor systems.","Some positions are at Khotilovo airbase, which handles the president's flights, and on the Vyshny Volochyok Reservoir near Lisiy Island, where military personnel built a laboratory complex that Radio Liberty investigated in September. Militarnyi compares the count with roughly twice as many positions around Moscow and its region of over 20 million people, whereas fewer than 100,000 live near Valdai."],"cav":"Position types are unconfirmed and there is no Russian confirmation. The comparison with Moscow is the outlet's own, and any link between the island laboratory and a weapons programme is only suggested.","src":[["Militarnyi","https://militarnyi.com/en/news/more-than-50-air-defense-turrets-built-around-putin-s-residence/"]]},
{"id":"energia-yelets-storm-shadow","w":"Ukraine","c":"Strikes","st":"Reported","time":"25 Oct","t":"Storm Shadow missiles reportedly hit the Energia battery plant in Yelets","s":"Videos show at least three impacts and a fire; the plant supplies power sources for Russian guided bombs and missiles, per Ukrainian intelligence.","p":["Militarnyi reported on 25 October that the Energia plant in Yelets, Lipetsk region, was struck by Storm Shadow cruise missiles. Video from the Exilenova+ community shows at least three impacts and a fire, and the outlet's own analysis identifies Workshop No. 4 as the building hit. It describes this as the second reported Storm Shadow strike on a plant linked to Russian missile production within days, after the Proton electronics factory in Oryol on 23 October.","Energia makes lithium-ion and other batteries and capacitors. Militarnyi says it supplies power sources for UMPK glide-bomb kits, and, citing Ukraine's Defence Intelligence, components for Iskander, S-400, Zircon, Kinzhal and Pantsir systems. The plant was reportedly hit by drones in May, July and January 2026 and earlier."],"cav":"No official claimant is named; the Storm Shadow identification rests on videos and the outlet's analysis. Damage, casualties and production impact are unknown, the component-supply claims are Ukrainian intelligence statements, and no Russian response is quoted.","src":[["Militarnyi","https://militarnyi.com/en/news/russia-s-energia-plant-struck-by-storm-shadow-missiles-fire-breaks-out/"]]},
{"id":"black-sea-570-ships","w":"Ukraine","c":"Maritime","st":"Reported","time":"25 Oct","t":"Black Sea shipping attacks top 570 since January, FT-based report says","s":"Insurance costs reportedly run at about twice Persian Gulf rates; the counting method is not explained.","p":["More than 570 ships have been attacked in the Black Sea since January 2026 and at least 40 sailors killed, according to a Financial Times report relayed by Militarnyi on 25 October. The outlet says 387 attacks fell between July and September, more than five times the previous quarter, and that security firm Ambrey attributes about 90% of attacks over the past 45 days to Russia.","War-risk insurance is reported at up to about 15% of hull value, roughly double the Persian Gulf rate, and fewer than ten vessels called at greater Odesa ports in the last month against about 400 in July. The cargo ship Khoryv was hit off Romania on 23 October, with one sailor killed and three missing. NATO is reportedly planning to send more patrol aircraft, radars and drones."],"cav":"Figures come second-hand from the FT and Ambrey and no methodology is given, so the 'more dangerous than the Persian Gulf' comparison is the FT's framing. The article describes the Khoryv as both sunk and capsized.","src":[["Militarnyi","https://militarnyi.com/en/news/black-sea-becomes-more-dangerous-than-persian-gulf-with-over-570-ships-attacked-since-january/"]]},
{"id":"italy-kf51-lynx-3-7bn","r":"Europe","c":"Land","st":"Reported","time":"25 Oct","t":"Italy reportedly orders 30 KF51-based tanks and 48 Lynx-based vehicles in €3.7bn contracts","s":"The report is second-hand from Italian press; no official release has been cited.","p":["Italy has ordered KF51 Panther-based tanks and KF41 Lynx armoured vehicles from Leonardo Rheinmetall Military Vehicles in two contracts worth about €3.7 billion, Militarnyi reported on 25 October, citing Germany's Hartpunkt, which in turn cites Milano Finanza.","The package reportedly covers 30 tanks under the New Main Battle Tank programme to replace the Ariete and 48 tracked Lynx-based vehicles under A2CS to replace the Dardo. Italy plans to complete the programme by 2038 and eventually buy 1,050 Lynx-family vehicles. Preliminary plans give Italian industry about 60% of the work. An earlier contract in November 2025 covered 21 Lynx with an option for 30 more."],"cav":"The €3.7bn value comes from media reports, not a government announcement. It is unclear how it relates to the €5.14bn tender published in September, or how the 48 vehicles relate to the earlier Lynx order. The industrial split is preliminary.","src":[["Militarnyi","https://militarnyi.com/en/news/italy-orders-kf51-panther-based-tanks-and-lynx-armored-vehicles-worth-3-7-billion/"]]},
{"id":"rhino-titan-airborne","r":"Europe","c":"Exercise","st":"Official claim","time":"25 Oct","t":"UK and France stage Exercise Rhino Titan, with 600 paratroopers dropping in Germany","s":"The UK MoD describes more than 2,500 troops over seven weeks, its largest airborne effort in about two decades.","p":["British and French forces have held Exercise Rhino Titan at the Sennelager training area in Germany, Militarnyi reported on 25 October, citing the UK Ministry of Defence via Sky News. More than 2,500 troops took part over seven weeks, and about 600 British and French paratroopers jumped from four RAF A400M aircraft. Heavy equipment was dropped from low altitude on a scale not tried before.","The main UK contingent was 16 Air Assault Brigade, with three RAF Chinooks practising the airlift of a casualty reception station against an opposing force using drones and electronic warfare. Defence Secretary Wes Streeting said it shows the UK can deliver rapid, large-scale airborne power to defend NATO territory."],"cav":"The 'largest in 20 years' framing is the UK MoD's claim about British airborne operations, not a verified comparison with France. The national split of troops, exact dates and German participation are not given.","src":[["Militarnyi","https://militarnyi.com/en/news/uk-and-france-hold-one-of-their-largest-airborne-exercises-in-20-years/"]]},
{"id":"nk-122mm-sp-border","r":"Far East","c":"Land","st":"Reported","time":"25 Oct","t":"North Korean self-propelled guns seen near the border with barrels pointed south, Yonhap says","s":"Yonhap observed the vehicles from Aegibong on 25 October; the 122 mm identification is hedged and the number is unknown.","p":["Yonhap journalists at the Aegibong observatory in Gimpo saw North Korean self-propelled artillery, apparently armed with 122 mm guns, in the coastal area of Kaepung County on 25 October, Militarnyi reported. The barrels pointed toward South Korea and personnel were seen raising and lowering small red flags, possibly during drills. Yonhap puts the range of such systems at roughly 15–24 km.","Shin Jong-woo of the Korea Defense and Security Forum reads the open positioning as a possible show of force, noting that Kim Yo Jong said on 21 October new units were going to firing positions. On 23 October Seoul proposed military talks to clarify the demarcation line and prevent accidental clashes."],"cav":"The calibre is qualified ('apparently') and one social media post cited by the article suggested the barrels look like a 100 mm gun. The vehicle count and the intent behind the deployment are unknown.","src":[["Militarnyi","https://militarnyi.com/en/news/north-korea-deploys-122-mm-self-propelled-guns-near-south-korean-border-with-barrels-pointed-south/"]]},
{"id":"ru-corvette-grozny-launch","r":"Russia","c":"Naval","st":"Official claim","time":"25 Oct","t":"Russia launches Project 20380 corvette Grozny at the Amur shipyard","s":"The Pacific Fleet says the crew began training on 5 October; commissioning is only promised 'in the coming years'.","p":["The Amur Shipbuilding Plant launched the Steregushchiy-class corvette Grozny on 24 October, Militarnyi reported on 25 October, citing Interfax and the Pacific Fleet press service. It is the fifth serial corvette of the project built at the yard and the ninth Project 20380 vessel overall, laid down on 23 August 2021.","The class displaces about 2,200 tonnes and carries a 100 mm gun, eight Kh-35 anti-ship missiles, twelve 9M96 surface-to-air missiles and a Ka-27PL helicopter. The Pacific Fleet already operates Sovershenny, Gromkiy, Aldar Tsydenzhapov and Rezkiy. The ship is only partly complete and will enter service in the coming years."],"cav":"Details come from Russian official sources relayed by Interfax and are unverified. Specifications are general class data, not confirmed for this hull, and no commissioning date is given.","src":[["Militarnyi","https://militarnyi.com/en/news/russia-launches-steregushchiy-class-corvette-grozny/"]]},
{"id":"ru-navy-absent-med","r":"Russia","c":"Naval","st":"Reported","time":"25 Oct","t":"No Russian warships in the Mediterranean for two months, NATO official tells Breaking Defense","s":"The gap ran from early July to early September; the claim rests on one anonymous official and sources disagree on the previous precedent.","p":["The Russian Navy had no vessels in the Mediterranean from early July to early September 2026, Militarnyi reported on 25 October, relaying Breaking Defense and an anonymous NATO official. The official said the last comparable absence was in 2016, though other assessments point to 2013.","Reasons cited are the loss of access to Tartus in Syria, the need to protect shadow-fleet tankers elsewhere, and a shortage of tankers and auxiliary ships. Lancaster University's Basil Germond agrees Russia is shifting limited surface ships toward escorting commercial shipping, but warns against assuming it will abandon Mediterranean routes."],"cav":"One unnamed NATO official is the source and the tracking method is not explained. Submarines and non-naval assets may not be covered, and the article's photo is from 2019.","src":[["Militarnyi","https://militarnyi.com/en/news/no-russian-navy-ships-in-mediterranean-for-two-months-for-first-time-in-over-a-decade/"]]},
{"id":"ru-laser-emp-counter-drone","r":"Russia","c":"Air defence","st":"Official claim","time":"25 Oct","t":"Rosoboronexport says laser and EMP counter-drone weapons are in final testing","s":"No system names, ranges or production numbers were given; Army Recognition cautions that performance is unproven.","p":["Russia's state arms exporter Rosoboronexport said on 23 October that it plans to add laser and electromagnetic-pulse weapons to its counter-drone range and that they are in the final stages of testing, Army Recognition reported on 25 October.","The announcement named no systems and gave no engagement ranges, quantities or delivery dates. The outlet notes that lasers need steady tracking and are affected by smoke, dust and weather, and that EMP results depend on energy delivered and the target's shielding. It suggests NATO should watch for test results, production orders and confirmed deliveries."],"cav":"This is an exporter's statement carried by a Western trade outlet; deployment or serial production has not been confirmed and no evidence of effectiveness was provided.","src":[["Army Recognition","https://www.armyrecognition.com/news/army-news/2026/russia-plans-mass-production-of-laser-and-electromagnetic-pulse-weapons-that-could-challenge-nato-drones"]]},
{"id":"bumblebee-v2-macdill","r":"USA","c":"Counter-drone","st":"Official claim","time":"25 Oct","t":"US Air Force security forces train with the Bumblebee V2 interceptor drone at MacDill","s":"The 6th Security Forces Squadron trained with it on 8 October; no live base-defence interception has been reported.","p":["Security forces of the 6th Air Refueling Wing trained with the Bumblebee V2 interceptor and Joint Interagency Task Force 401 at MacDill Air Force Base, Florida, on 8 October, Army Recognition reported on 25 October after the wing published photos on 23 October.","Bumblebee V2 is a first-person-view multirotor that stops a small hostile drone by colliding with it and carries no warhead. It has three cameras and automated target recognition under operator control. A $5.2 million agreement went to Perennial Autonomy in January, with deliveries from March, and Army units assessed it at Fort Bragg and Fort Benning. A net-firing Paladin system was also present."],"cav":"The release confirms training, not permanent deployment or a successful interception at the base. It does not show how Bumblebee and Paladin were integrated, and falling debris is a noted risk.","src":[["Army Recognition","https://www.armyrecognition.com/news/aerospace-news/2026/u-s-air-force-trains-to-defend-air-base-against-drones-with-new-bumblebee-v2-interceptor"]]},
{"id":"rcaf-first-cf35a","r":"USA","c":"Air","st":"Official claim","time":"25 Oct","t":"Canada receives its first two CF-35A fighters at Luke Air Force Base","s":"The RCAF announced the delivery; the first jets will not reach Canada until about 2028 and the government's purchase review is unresolved.","p":["The Royal Canadian Air Force has received its first two CF-35A jets at Luke Air Force Base, Arizona, Militarnyi reported on 25 October, citing an RCAF announcement on X. The first aircraft, AR-1, made its maiden flight on 23 September from Fort Worth, Texas. The first eight aircraft will be based at Luke for pilot training.","Canada agreed in January 2023 to buy 88 F-35As to replace its CF-188 Hornets, after choosing the type over Saab's Gripen E in 2022. Militarnyi says 37 Canadian firms hold F-35 contracts. Prime Minister Mark Carney ordered a review of the purchase in March 2025, which the article says was still under way in May 2026 with no final decision."],"cav":"The announcement itself was made on X and relayed by Militarnyi. The industrial figures and the explanation for the review are the outlet's framing, and Canadian basing is not expected before 2028.","src":[["Militarnyi","https://militarnyi.com/en/news/royal-canadian-air-force-receives-first-two-cf-35a-fighter-jets/"]]},
{"id":"ru-532-drones-25oct","r":"Russia","c":"Air defence","st":"Official claim","time":"25 Oct","t":"Russian MoD says air defences downed 532 Ukrainian drones overnight over 23 regions","s":"The ministry's list runs from Moscow and Perm to Crimea and the Sea of Azov; the figure is unverified and no damage is given.","p":["The Russian Defence Ministry said on 25 October that its air defence systems intercepted and destroyed 532 Ukrainian fixed-wing drones overnight, state agency TASS reported. The ministry says they were downed over Russian territory.","It named Belgorod, Bryansk, Kursk, Voronezh, Tula, Oryol, Lipetsk, Kaluga, Ryazan, Rostov, Saratov, Samara, Penza, Volgograd, Ulyanovsk, Moscow, Perm and Krasnodar regions, the republics of Tatarstan, Adygea, Mari El, Udmurtia and Crimea, and the Sea of Azov. For comparison, the ministry claimed 616 drones the previous night and 1,297 over a 24-hour period."],"cav":"A Russian Defence Ministry claim carried by state media and not independently verified. No damage, casualties or Ukrainian comment are included.","src":[["TASS","https://tass.com/defense/2207429"]]},
{"id":"ru-unmanned-t72-units","r":"Russia","c":"Land","st":"Reported","time":"24 Oct","t":"Russia weighs dedicated remote-controlled tank units for the Ukraine front","s":"A deputy defence minister discussed the Shturm and a BMPT-style support vehicle; no decision or timetable has been announced.","p":["Russia is considering forming units of remotely operated tanks to support operations in Ukraine, Army Recognition reported on 24 October, drawing on Russian state media. Deputy Defence Minister Yunus-Bek Yevkurov discussed the trials in an interview broadcast on 20 October by the Zvezda channel. President Putin watched a demonstration of unmanned armoured vehicles at the Chebarkul range on 2 October, during the Tsentr-2026 exercise.","Two designs are described, both on modified T-72-series chassis: the Shturm from Uralvagonzavod, with a shortened 125 mm gun, a 22-round autoloader, panoramic cameras and a front blade, and a support variant in the BMPT mould with two automatic cannons. Both are operated by personnel through a remote control station; TASS cites a multichannel control system with redundant components.","The outlet notes that fully autonomous navigation or targeting has not been shown publicly. It argues remote tanks could preserve firepower while reducing crew exposure, but depend on video links that can be jammed, and cannot replace infantry, engineers or drone cover."],"cav":"No official decision or timetable exists. TASS published no results of tests against electronic jamming, and the performance claims come from Russian state sources.","src":[["Army Recognition","https://www.armyrecognition.com/news/army-news/2026/russia-considers-unmanned-t-72-tank-units-to-support-future-assaults-in-ukraine"]]},
{"id":"l3harris-xrc-ramjet","r":"USA","c":"Air defence","st":"Company claim","time":"24 Oct","t":"L3Harris wins up to $60m to develop a ramjet interceptor against drones for the US Army","s":"The three-year Extended Range Counter-UAS Missile contract funds development, not production; no range or speed has been released.","p":["L3Harris Technologies has received a three-year contract worth up to $60 million from the US Army's DEVCOM Aviation & Missile Center to develop a ramjet-powered counter-drone missile, Army Recognition reported on 24 October. The company announced it on 23 October. The work is in the second phase of the Extended Range Counter-UAS Missile (XRC) programme and is moving toward flight-performance tests of an integrated weapon.","L3Harris says the design pairs advanced seeker technology with new propulsion to counter small and medium drones as well as traditional short-range air-defence threats. A ramjet uses atmospheric oxygen, which can extend reach, but needs high forward speed before it produces thrust. The company is pursuing compatibility with existing launchers.","The outlet points out that no successful interception, verified range or deployment has been disclosed, and that nothing shows XRC beating Stinger or RTX's Coyote on range, reaction time or cost."],"cav":"Performance goals are L3Harris statements. The contract is a ceiling for development, not an order for missiles, and no cost data exist.","src":[["Army Recognition","https://www.armyrecognition.com/news/army-news/2026/l3harris-develops-new-long-range-ramjet-missile-for-u-s-army-to-intercept-drones"]]},
{"id":"f16-ngmc-computer","r":"USA","c":"Air","st":"Official claim","time":"24 Oct","t":"USAF seeks a new mission computer to keep Block 40/50 F-16s relevant into the 2040s","s":"Industry talks were set for 20–21 October; the Next-Generation Mission Compute is a requirement, not an awarded programme.","p":["The US Air Force wants a Next-Generation Mission Compute (NGMC) computer for selected F-16s, Army Recognition reported on 24 October. The Air Force Life Cycle Management Center issued a sources-sought notice in May 2026 and scheduled industry discussions at Wright-Patterson AFB on 20–21 October. The requirement covers Block 40/42 and 50/52 jets, not the older Block 30/32.","The notices call for a modular open architecture that separates safety-critical flight functions from mission software, while preserving compatibility with existing installations where practical. The existing Modular Mission Computer dates from the 2000s, and some jets already carry the AN/APG-83 AESA radar, which adds processing load. NGMC sits within the Post Block Integration Team effort of up to 22 modifications across 608 aircraft, worth about $6.3 billion in total.","Former F-16 pilot Heather Penney warned Air & Space Forces Magazine of a possible gap between older and newer aircraft."],"cav":"No processor, performance gain, fleet size, cost or schedule is set. The 608-aircraft and $6.3 billion figures cover the whole modernisation effort, not NGMC alone.","src":[["Army Recognition","https://www.armyrecognition.com/news/aerospace-news/2026/u-s-air-force-seeks-f-16-fighter-jet-computing-upgrade-to-sustain-combat-role-alongside-f-35-and-f-22"]]},
{"id":"us-guyana-defense-partnership","r":"USA","c":"Diplomacy","st":"Official claim","time":"23 Oct","t":"US and Guyana sign an \"Enhanced Defense Partnership\" focused on counter-narcotics","s":"Hegseth hosted President Ali at the Pentagon; no funding, troop numbers or equipment were announced.","p":["The United States and Guyana signed a joint declaration to expand military cooperation and address regional security threats, The Defense Post reported on 23 October. Defense Secretary Pete Hegseth hosted Guyanese President Mohamed Irfaan Ali at the Pentagon. Pentagon spokesperson Sean Parnell called it a \"landmark\" Enhanced Defense Partnership in a 21 October post.","Both sides committed to deeper joint training, multi-domain operations and air domain awareness, with the agreement mainly reinforcing drug-interdiction efforts. It builds on membership of the Americas Counter Cartel Coalition, also called the Shield of the Americas, which Ali helped found. Hegseth tied it to the Monroe Doctrine."],"cav":"Almost all information comes from US officials' statements. The declaration's legal form, obligations, funding and timeline were not published.","src":[["The Defense Post","https://thedefensepost.com/2026/10/23/us-guyana-defense-accord/"]]},
{"id":"moldova-geran4-crash","r":"Europe","c":"Security","st":"Reported","time":"24 Oct","t":"Russian Geran-4 drone crashes near an energy facility in Moldova; embassy employee expelled","s":"The jet-powered drone came down under 100 m from homes; Moldova says 102 drones and missiles have crossed its territory since 2022.","p":["A Russian Geran-4 jet-powered strike drone crashed on 23 October in the Moldovan village of Kistelnitsa, near an energy facility, Militarnyi reported on 24 October. President Maia Sandu condemned the incident as dangerous, and a Russian embassy employee was declared persona non grata. Moldovan Police supplied the crash photograph.","The village head told Teleradio-Moldova that residents saw the drone, which apparently hit a tree and came down in a field less than 100 m from houses. The Moldovan Defence Ministry says 102 aerial vehicles, drones and missiles, have flown over Moldova since Russia's full-scale invasion of Ukraine, and some crashed or exploded there.","Militarnyi links a separate wreckage study that reportedly found more than three-quarters of the Geran-4's electronic components came from US firms."],"cav":"The village head's account is hedged and the article does not say whether the drone exploded, what the facility was or whether anyone was hurt. No Russian response is quoted, and the component figure comes from a separate investigation.","src":[["Militarnyi","https://militarnyi.com/en/news/rus-geran-4-crash-energy-facility-moldova/"]]},
{"id":"navantia-multiverse-ai","r":"Europe","c":"Industry","st":"Company claim","time":"23 Oct","t":"Navantia and Multiverse Computing sign an MoU on AI for naval systems","s":"The framework covers embedded AI, signal processing, mission planning and C4I; no value, deadlines or projects are given.","p":["Spanish shipbuilder Navantia and San Sebastián-based Multiverse Computing have signed a memorandum of understanding on artificial intelligence and quantum-inspired solutions for naval defence, Naval Today reported on 23 October. It was signed by Multiverse CEO Enrique Lizaso and Navantia COO Gonzalo Mateo-Guerrero.","Planned areas include efficient AI for embedded surface and submarine systems, signal processing and situational awareness, mission planning and logistics, and command-and-control systems, plus joint proposals for European defence programmes. Multiverse will supply its CompactifAI model-compression technology for low-power, low-connectivity environments, and Navantia will contribute naval architecture, integration and life-cycle expertise."],"cav":"An MoU is a cooperation framework, not a contract. The benefits are the partners' own claims and no products or funding are named.","src":[["Naval Today","https://www.navaltoday.com/2026/10/23/navantia-multiverse-computing-join-hands-on-ai-for-naval-defense/"]]},
{"id": "omsk-kauchuk-ozon", "w": "Ukraine", "c": "Strikes", "st": "Reported", "time": "24 Oct", "t": "Drones reportedly hit the Omsky Kauchuk rubber plant and an Ozon warehouse in Omsk, over 2,400 km from Ukraine", "s": "Omsk's governor confirmed a drone attack and a large fire was reported; damage and the attacker are not officially confirmed.", "p": ["Drones struck the Omsky Kauchuk petrochemical plant and an Ozon logistics centre in Omsk, Russia, Militarnyi reported on 24 October. A large fire broke out at the plant, one of Russia's biggest synthetic rubber makers, and eyewitnesses reported a fire at the warehouse. The Telegram channel Exilenova+ posted video of the damage and described Ozon as a company linked to the Russian Defence Ministry. Omsk governor Vitaliy Khotsenko confirmed that drones reached the city's northern industrial zone and that emergency services were at work.", "It was the second rubber plant hit that day: Tolyattikauchuk in Samara region was reportedly attacked earlier in the morning. Militarnyi says Omsky Kauchuk, part of the Titan Group, made 25% of Russia's SKMS synthetic rubber in the first nine months of 2024, and argues that such rubbers are components of solid rocket propellant. It cites a Verstka study saying orders for military and dual-use goods on the Ozon marketplace exceeded 25 billion roubles between August 2025 and July 2026."], "cav": "No casualty figures, damage assessment or cause of the fire are given. The governor did not name an attacker, so attribution to Ukraine rests on the outlet's framing. The Ozon military-affiliation claim comes from a monitoring channel and the propellant link is the outlet's argument.", "src": [["Militarnyi", "https://militarnyi.com/en/news/drones-omsky-kauchuk-ozon-2400-km-ukraine/"]]},
{"id": "patriot-24-missiles", "w": "Ukraine", "c": "Air defence", "st": "Official claim", "time": "24 Oct", "t": "Zelensky: Ukraine got only 24 Patriot missiles from the US in 90 days", "s": "He also confirmed reports that Washington is slow to sign off interceptors that European allies have already paid for.", "p": ["Ukraine received just 24 Patriot interceptors from the United States over the past 90 days, President Volodymyr Zelensky said in an ABC News interview, Militarnyi reported on 24 October. He contrasted this with roughly 2,000 missiles he said countries used in the first 48 hours of the Middle East war.", "Zelensky also confirmed earlier reports that the US is delaying documents for interceptors Europe has funded. An unnamed Ukrainian official told the Kyiv Independent that Defense Secretary Pete Hegseth has the Patriot contracts \"on his desk\" and is not signing them, and officials described the delay as political pressure that could endanger civilians."], "cav": "The 24-missile figure is Zelensky's own and is not independently verified. The delay claim rests on an anonymous official, no contract details are given and the article quotes no US government response.", "src": [["Militarnyi", "https://militarnyi.com/en/news/ukraine-only-24-patriot-usa-past-90-days/"]]},
{"id": "iran-cable-plan", "w": "Iran and Gulf", "c": "Cyber and infrastructure", "st": "Reported", "time": "24 Oct", "t": "Iran reportedly plans to cut Gulf undersea cables if US and Israeli strikes resume", "s": "Two anonymous Iranian security officials told Reuters that Tehran would also delay repairs to prolong outages.", "p": ["Iran has drawn up a detailed plan to attack undersea telecommunications cables in the Persian Gulf if the US and Israel resume strikes, Militarnyi reported on 24 October, relaying a Reuters report from 23 October that cites two senior Iranian security officials speaking anonymously. They did not give methods or locations, but said Tehran would also slow repairs to prolong disruption. On 21 October the deputy head of the IRGC political department said seven major cables on the Strait of Hormuz seabed could be targets.", "The article notes that about 99% of global internet traffic travels by undersea cable, but under 1% of international bandwidth passes through Hormuz, so worldwide impact would be limited. Gulf states could see slower internet and disruption to payments, e-commerce and cloud services, depending on rerouting. Iran is also reportedly weighing strikes on US-linked data centres and AI facilities; the article says Iranian strikes in March 2026 damaged two Amazon Web Services facilities in the UAE."], "cav": "The core claim rests on anonymous officials and is not independently verified. The March 2026 damage claim is not sourced in the article, and Tehran may be signalling to deter a new round of strikes.", "src": [["Militarnyi", "https://militarnyi.com/en/news/iran-plan-destroy-submarine-cables-in-persian-gulf/"]]},
{"id": "uk-france-nuclear-drill", "r": "Europe", "c": "Strategic forces", "st": "Official claim", "time": "24 Oct", "t": "UK and France hold first joint nuclear air-strike drill over the Mediterranean", "s": "French Rafales and RAF Typhoons rehearsed a simulated strike on 20–21 October under the Northwood Declaration.", "p": ["The French Air and Space Force and the Royal Air Force carried out a joint simulated nuclear air strike, exercise Rummy, over the Mediterranean on 20–21 October, Militarnyi reported on 24 October, citing the UK Ministry of Defence. Rafale fighters flew from Saint-Dizier air base to simulate the strike while Eurofighter Typhoons covered the group. Crews practised coordinating the two countries' air operations.", "The article calls it the first such joint drill and links it to the July 2025 Northwood Declaration on closer nuclear-deterrence cooperation, while each state keeps independent control of its arsenal. It adds that the Rafale can carry the ASMP-A cruise missile, that the UK deterrent rests on Vanguard-class submarines with Trident II, and that London plans to buy 12 F-35A jets for NATO's nuclear mission. France's own exercise Poker was held in late September."], "cav": "This is a simulation, with no live weapons used. The 'first' framing and the missile range are the outlet's, relayed second-hand from the UK MoD.", "src": [["Militarnyi", "https://militarnyi.com/en/news/united-kingdom-france-joint-nuclear-airstrike-drill/"]]},
{"id": "denmark-anthem-jsm", "r": "Europe", "c": "Missiles", "st": "Official claim", "time": "24 Oct", "t": "Denmark to buy US-made Anthem ground-launched cruise missiles and Joint Strike Missiles", "s": "The Danish ministry gave no value, quantities or delivery dates; Covenant's Anthem was unveiled only on 9 September.", "p": ["Denmark will buy Kongsberg Joint Strike Missiles for its F-35s and Anthem cruise missiles from US firm Covenant for ground launchers, Militarnyi reported on 24 October, citing the Danish defence ministry, which says the aim is stronger national and collective deterrence. The War Zone described it on 23 October as a dual long-range strike push.", "Covenant, founded in 2024 with a base in northern Israel, says Anthem carries a payload above 200 kg and has flown over 200 tests, with about $150 million in orders from the US Army and Navy and unnamed partners. It targets a price of several hundred thousand dollars at scale. The JSM is a 350 km, 120 kg-warhead derivative of the NSM that fits in the F-35A's internal bay."], "cav": "Anthem's range, price and production plans are company claims or targets, and the JSM figures are the manufacturer's. No contract details were published.", "src": [["Militarnyi", "https://militarnyi.com/en/news/denmark-purchase-new-anthem-cruise-missiles/"], ["The War Zone", "https://www.twz.com/air/denmark-to-buy-anthem-munitions-joint-strike-missiles-in-dual-long-range-strike-push"]]},
{"id": "norway-nsm-container", "r": "Europe", "c": "Missiles", "st": "Company claim", "time": "24 Oct", "t": "Kongsberg tests a four-missile container launcher for the Naval Strike Missile", "s": "The 20-foot module holds twice the ready rounds of one US Marine NMESIS launcher; the test was not a full engagement.", "p": ["Kongsberg has test-fired a Naval Strike Missile from a containerised launcher that holds up to four missile canisters in a standard 6.1 m shipping container, Army Recognition reported on 24 October. The company says it can fire from ships, trucks or the ground. Stated test goals were launch safety, handling and loading, and pressure and blast management; NSM range is advertised as over 300 km.", "The article compares it with the US Marine Corps NMESIS, which carries two NSMs on a remotely operated carrier, and says NMESIS equipment reached Okinawa in June 2026. It also notes that a US Army Typhon launcher has four cells, so capacity alone does not equal equal reach or mission range."], "cav": "The test did not demonstrate a complete operational engagement and the launcher remains in development. No US Marine adoption is indicated, and the article notes more missiles per site do not by themselves mean more lethality.", "src": [["Army Recognition", "https://www.armyrecognition.com/focus-analysis-conflicts/navy/naval-technology/norway-tests-nsm-anti-ship-missile-container-launcher-with-twice-the-capacity-of-u-s-marines-nmesis"]]},
{"id": "sf260-collision-philippines", "r": "Far East", "c": "Aviation accident", "st": "Official claim", "time": "24 Oct", "t": "Two Philippine Air Force SF-260 trainers collide at Lipa, reportedly killing four pilots", "s": "The air force grounded its SF-260 fleet and opened an investigation; the cause is unknown.", "p": ["Two SF-260 trainers of the Philippine Air Force collided at Fernando Air Base in Lipa City, Batangas, at about 3:51 p.m. local time on 23 October, Militarnyi reported on 24 October, citing an air force statement. Spokesperson Col. Elvin Kapingwian said both aircraft crashed inside the base perimeter and that no other casualties were reported. Local broadcaster DZRH reported four pilots dead and described the flight as a formation exercise.", "The Air Force Command has started an investigation and temporarily suspended flights of the whole SF-260 fleet. The pilots' names are withheld at their families' request. The SF-260 is a two-seat SIAI-Marchetti trainer used for initial pilot training."], "cav": "The cause is unknown. The quoted air force statement does not itself give the death toll, which comes from local media, as does the formation-flight detail.", "src": [["Militarnyi", "https://militarnyi.com/en/news/2-sf-260-collided-philippines-4-pilots-dead/"]]},
{"id": "f22-tsuiki-keen-sword", "r": "Far East", "c": "Air", "st": "Official claim", "time": "24 Oct", "t": "US F-22s deploy to Tsuiki in southern Japan during Keen Sword 27", "s": "The 525th Expeditionary Fighter Squadron added a second Japanese base beyond Kadena; the number of jets is undisclosed.", "p": ["US Air Force F-22 Raptors have deployed to Tsuiki Air Base in Fukuoka Prefecture on Kyushu during exercise Keen Sword 27, which runs to 29 October, Army Recognition reported on 24 October. The jets arrived on 19 October from Joint Base Elmendorf-Richardson, Alaska, with the 525th Expeditionary Fighter Squadron, and the 18th Wing released photos on 22 October. The move widens operations beyond Kadena on Okinawa.", "No aircraft count and no basing change were announced. The article notes that Tsuiki is farther from Taiwan than Kadena, and that fixed bases are exposed to long-range missile strikes, which the 2024 Pentagon China report said Chinese forces increasingly threaten."], "cav": "Published material does not show a Taiwan-specific mission, sustainment capacity or the detachment's tasks in the exercise. Risk and range comments are the outlet's analysis.", "src": [["Army Recognition", "https://www.armyrecognition.com/news/aerospace-news/2026/u-s-air-force-deploys-f-22-raptors-to-another-base-in-japan-as-chinas-missile-threat-grows"]]},
{"id": "thaad-guam-battalion", "r": "Oceania", "c": "Air defence", "st": "Official claim", "time": "24 Oct", "t": "US Army activates a THAAD battalion on Guam", "s": "3rd Battalion, 43rd ADA took over from Task Force Talon at a 16 October ceremony; it is an organisational step, not new equipment.", "p": ["The US Army activated the 3rd Battalion, 43rd Air Defense Artillery Regiment, a THAAD unit, on Guam in a ceremony at Andersen Air Force Base on 16 October, announced on 20 October and covered by Army Recognition on 24 October. It sits under the 38th ADA Brigade and 94th Army Air and Missile Defense Command, and is commanded by Lt. Col. Joshua Urness. It replaces Task Force Talon, which had held the Army's air-defence role on Guam since 2013 and operated THAAD until July 2026.", "The article gives published THAAD figures: truck launchers with eight interceptors each, an AN/TPY-2 radar, engagement range of about 200 km and altitude up to 150 km, using hit-to-kill interceptors. It serves as the Army's part of the Guam Defense System."], "cav": "The Army announcement confirms only the unit's establishment: no new THAAD deployment, additional systems or timeline. THAAD is for ballistic missiles, not aircraft, drones or low-flying cruise missiles.", "src": [["Army Recognition", "https://www.armyrecognition.com/news/army-news/2026/u-s-army-activates-new-thaad-air-defense-missile-battalion-on-guam-to-strengthen-indo-pacific-defenses"]]},
{"id": "ru-1297-drones-24oct", "r": "Russia", "c": "Air defence", "st": "Official claim", "time": "24 Oct", "t": "Russian MoD claims 1,297 Ukrainian drones and five missiles downed in 24 hours", "s": "The ministry also claims about 1,190 Ukrainian casualties and strikes across 147 areas; none of it is independently verified.", "p": ["The Russian Defence Ministry said its air defences shot down 1,297 Ukrainian fixed-wing drones over the past 24 hours, along with four Neptune cruise missiles and one French-made SCALP, TASS reported on 24 October.", "The ministry also claimed Ukrainian losses of about 1,190 troops, split by group: Centre over 350, West over 215, East over 205, North over 200, South up to 180 and Dnepr up to 40. It said aviation, drones, missile forces and artillery hit energy and transport infrastructure used by Ukrainian forces, long-range drone sites and troop concentrations across 147 areas."], "cav": "These are Russian Defence Ministry claims carried by state agency TASS and are unverified. Ukraine's own account of the same period is not included.", "src": [["TASS", "https://tass.com/defense/2207273"]]},
{"id": "ru-knights-pilots-dead", "r": "Russia", "c": "Aviation accident", "st": "Reported", "time": "24 Oct", "t": "Russian Knights aerobatic team reportedly loses two pilots in a training crash", "s": "The report traces to one regional outlet citing an unnamed source; the date and place are unconfirmed.", "p": ["Two pilots of the Russian Knights aerobatic team have died, Militarnyi reported on 24 October, citing the Russian outlet amic.ru. They are named as Col. Oleg Erofeev, deputy head of the Aviation Technology Demonstration Center with 3,300 flight hours, and Lt. Col. Kochetov, a flight-safety inspector with 1,500 hours. Amic.ru said it was a training flight on 22 October, citing preliminary information from an unnamed source.", "Militarnyi believes the date may be 21 October, when Russia reportedly lost two Su-30SM fighters, but says this is its inference and another incident cannot be ruled out. The team formed in 1991, flies mainly Su-35S fighters and is based at Kubinka near Moscow."], "cav": "No official Russian statement is cited. Location, cause and date are unconfirmed, and one pilot's first name is spelt inconsistently in the source.", "src": [["Militarnyi", "https://militarnyi.com/en/news/russia-death-russian-knights-aerobatic-team/"]]},
{"id": "c4ads-russia-china-subs", "r": "Russia", "c": "Naval", "st": "Analysis", "time": "24 Oct", "t": "Think-tank report says Russia supplied submarine test data to China", "s": "C4ADS trade-data analysis shows 12 Rubin deliveries worth over $80 million between 2015 and 2023; what they were for is inferred.", "p": ["Russia passed technical documentation and submarine test materials to China, including after the full-scale invasion of Ukraine, according to a C4ADS report titled \"A Marriage of Convenience?\", relayed by Militarnyi on 24 October. Areas named include noise reduction, non-nuclear propulsion, automated command systems and hull design. The trade data show Russia's sanctioned Rubin design bureau made 12 deliveries to PLA Navy purchasers and China Shipbuilding and Offshore International (CSOC) between August 2015 and April 2023, worth over $80 million.", "Two CSOC deliveries, in October 2019 and January 2020, included submarine test documentation such as cavitation evaluations. CSOC supplied Rubin with test-console components from December 2019 to September 2022, and a September 2022 shipment references a joint design and production contract."], "cav": "Militarnyi did not have the C4ADS report itself. The delivery descriptions are vague, the purpose is inferred, and claims of help for China's nuclear submarines come from unnamed US sources.", "src": [["Militarnyi", "https://militarnyi.com/en/news/russia-transfer-submarine-technology-china/"]]},
{"id":"epic-fury-round-two","w":"Iran and Gulf","c":"Escalation","st":"Analysis","time":"23 Oct","t":"Signs point to a possible new round of US–Israeli strikes on Iran, TWZ says","s":"A US ambassador called a weekend strike possible and Israeli jets drilled near Iran's border; President Trump said he knew nothing of it.","p":["The War Zone reported on 23 October that several signals suggest a renewed US and/or Israeli campaign against Iran may be near. US Ambassador to Turkey Tom Barrack said a strike could come \"this weekend\" and called it \"absolutely\" possible; President Trump replied that he knew nothing about it. Israel's air force flew dozens of fighters and tankers through Syrian and Iraqi airspace toward the Iranian border on Monday, which Israel called a \"power projection\" training exercise.","The outlet also points to the USS Theodore Roosevelt carrier group and the 13th Marine Expeditionary Unit heading to the region, due by late November with about 10,000 sailors and Marines, and to a New York Times report that planners have options for three- to five-day strikes on energy, nuclear, missile and drone sites after the US midterms. Meanwhile Ambrey counted 11 and then 13 vessels damaged near the Strait of Hormuz in two recent weeks, against three to four a week before, Brent crude topped $114, and the US naval blockade of Iranian ports reached day 100 on 22 October.","Israel votes on 27 October. TWZ notes that the IDF chief reportedly saw no need to strike before then, that an IDF official cautioned war is not inevitable, and that Trump has said the war would end \"immediately after the election\"."],"cav":"This is an assessment built on indirect signals and anonymous reporting. TWZ could not verify some claims, such as Russian evacuations from Bushehr, and the State Department disputed a related NBC report. No government has announced a strike.","src":[["The War Zone","https://www.twz.com/news-features/on-the-brink-of-epic-fury-round-two"]]},
{"id":"houthi-riyadh-strikes","r":"Middle East","c":"Strikes","st":"Reported","time":"24 Oct","t":"Houthis reported to strike Saudi Arabia again, with oil above $113","s":"Reports from Riyadh describe explosions and air-defence fire; the number of weapons and any damage are unconfirmed.","p":["Military Review (en.topwar.ru), the English edition of a Russian military outlet, reported on 24 October new missile strikes on Saudi Arabia by the Yemeni Houthi movement (Ansar Allah). Reports from Riyadh describe \"new powerful explosions and the operation of air defense systems\", and preliminary accounts suggest the city may have been hit again. Official confirmation of the type and number of weapons, damage and casualties is still pending.","The article says Saudi forces reportedly intercepted a ballistic missile fired toward Riyadh on 20 October and claims missiles struck the Saudi Ministry of Defense complex, and cites recent attacks on energy and transport infrastructure. TWZ separately reported on 23 October that Houthi attacks killed two people near the Shaybah oilfield.","Brent crude was quoted above $113 a barrel; the article warns of wider escalation on the Arabian Peninsula."],"cav":"Single secondary report from a Russian outlet with no official Saudi or Houthi statement quoted; damage claims are unverified and the framing may reflect the outlet's perspective.","src":[["Military Review","https://en.topwar.ru/292171-novye-udary-husitov-po-saudovskoj-aravii-vyzvali-ocherednoj-rost-cen-na-neft.html"],["The War Zone","https://www.twz.com/news-features/on-the-brink-of-epic-fury-round-two"]]},
{"id":"west-bank-large-operation","r":"Middle East","c":"Operations","st":"Reported","time":"23 Oct","t":"Israel prepares a \"very large-scale\" West Bank operation after Hebron shootout","s":"Two Israeli soldiers and two Palestinians died; Netanyahu ordered Hebron surrounded and a full lockdown from 23 October.","p":["Israel has begun preparing a \"very large-scale\" operation in the occupied West Bank, Militarnyi reported on 23 October, citing The Guardian. The trigger was a shootout at a temporary checkpoint near Hebron: the IDF says two attackers fired on soldiers in a firefight of more than 20 minutes, five Israelis were wounded and two later died, and two Palestinians were killed.","Prime Minister Benjamin Netanyahu convened an emergency security cabinet, said Hamas had planned a large attack, and ordered forces to surround Hebron and prepare a full West Bank lockdown from 23 October. He said troops would search homes and demolish buildings on a scale not seen in decades, pointing to the model used in northern refugee camps; the UN human rights office says the 'Iron Wall' operation begun in January 2025 displaced tens of thousands.","OCHA figures for 29 September to 12 October record five Palestinians killed by forces or settlers, 246 injured, 244 incidents in 113 communities, and more than 2,060 settler attacks since January. Israel votes on 27 October."],"cav":"Secondary report relaying the Guardian, the IDF and the Prime Minister's Office. The operation is announced as being prepared, not confirmed under way, and the attackers' affiliation is not established beyond Israeli statements.","src":[["Militarnyi","https://militarnyi.com/en/news/israel-very-large-scale-operation-west-bank/"]]},
{"id":"ru-geran5-new-variants","r":"Russia","c":"Drones and missiles","st":"Reported","time":"23 Oct","t":"Russia fielding two new Geran-5 derivative cruise missiles, Ukrainian sources say","s":"One variant aims at around 900 km/h and relies on optical navigation; performance claims are unverified.","p":["Russia has begun deploying two new small cruise missiles that are probably derived from the Geran-5, Militarnyi reported on 23 October, citing Ukrainian military sources and Serhii 'Flash' Beskrestnov, an adviser on defence technology. The Geran-5 K5-K, first reported in late September, has swept wings, a smaller span, an engine inside the fuselage and autonomous optical navigation that reduces reliance on satellite signals. Developers reportedly want speeds near 900 km/h, similar to classic cruise missiles, though range is doubtful because speed burns fuel.","A second, unidentified missile photographed on 22 October has a box-shaped fuselage, diamond wing, V-tail and side intake, which may reduce radar visibility. The base Geran-5, used since January 2026, is described by Ukrainian intelligence as 6.5 m long with a 3.2 m span, a Chinese turbojet, 450–600 km/h cruise and range up to 950 km; interceptor drones can catch it at the low end of that speed.","The report adds a claim that Russia reached 4,000 Geran-4 and Geran-5 drones a month by the end of October, mostly Geran-4."],"cav":"All performance, deployment and production figures come from Ukrainian sources and unnamed officials; no measured data exist for the new variants and Russia has made no statement.","src":[["Militarnyi","https://militarnyi.com/en/news/russia-deploys-two-new-variants-of-geran-5/"]]},
{"id":"ru-616-drones-24oct","r":"Russia","c":"Air defence","st":"Official claim","time":"24 Oct","t":"Russian MoD says air defences destroyed 616 Ukrainian drones overnight over 22 regions","s":"The ministry lists regions from Moscow and Crimea to Tatarstan; the figures are unverified and no damage is reported.","p":["The Russian Defence Ministry said on 24 October that its air defence systems shot down 616 Ukrainian fixed-wing drones overnight, between 20:00 Moscow time on 23 October and 08:00 on 24 October, TASS reported. The ministry says they were destroyed over Russian territory and over the Sea of Azov and the Black Sea.","It named regions including Belgorod, Bryansk, Volgograd, Voronezh, Kaluga, Kursk, Lipetsk, Oryol, Rostov, Ryazan, Samara, Saratov, Smolensk, Tula, the Moscow region, Crimea, Tatarstan and Krasnodar. The previous day's equivalent claim, on 22 October, was 808 drones.","Militarnyi separately reported that drones and balloons halted traffic at all four Moscow airports, and that missiles hit the Proton plant in Oryol."],"cav":"This is a Russian Defence Ministry claim relayed by state agency TASS and is unverified; no independent confirmation, damage or casualty figures are given. Ukraine has not commented in the source.","src":[["TASS","https://tass.com/defense/2207257"]]},
{"id":"oryol-proton-strike","w":"Ukraine","c":"Strikes","st":"Reported","time":"23 Oct","t":"Missiles reportedly hit the Proton electronics plant in Oryol","s":"Militarnyi says Storm Shadow was 'likely' used; damage, casualties and any official statements are missing.","p":["Missiles struck the Proton plant in Oryol, Russia, Militarnyi reported on 23 October, with strike footage from analysts at the Telegram channel Exilenova+. The outlet describes Proton as a maker of optoelectronic equipment and military-grade components, including diode modules, switch-inverters and electronics for onboard weapon systems.","The article says the plant was 'likely' hit by Storm Shadow cruise missiles, and links Proton parts to the S-71 Kover air-launched cruise missile, the 9M723 Iskander-M ballistic missile and the Pantsir-S1 system, citing component markings on a Russian missile. Military Review (en.topwar.ru), a Russian outlet, separately reported a Ukrainian missile strike on a plant in Oryol at rush hour."],"cav":"The missile type is inferred, and the report gives no casualties, damage extent or production impact. No Russian or Ukrainian official statement is cited, and the weapon links rely on the outlet's own reading of component markings.","src":[["Militarnyi","https://militarnyi.com/en/news/missile-strike-rus-proton-electronics-plant/"],["Military Review","https://en.topwar.ru/292235-vsu-nanesli-raketnyj-udar-po-predprijatiju-proton-v-orle-v-chas-pik.html"]]},
{"id":"f35-850-framework","r":"USA","c":"Air","st":"Official claim","time":"23 Oct","t":"US and Lockheed Martin sign ten-year framework for at least 850 F-35s","s":"The deal is subject to Congress and funding; Lockheed will spend at least $7 billion of its own money on programme measures.","p":["The US Department of War and Lockheed Martin have finalised a ten-year framework agreement that sets a minimum purchase of 850 F-35 Lightning II fighters for the United States, Militarnyi reported on 23 October, citing a department release. It also covers initial spares, modernisation kits and support for the global fleet. In exchange, Lockheed Martin will fund measures supporting the programme at its own expense, totalling at least $7 billion.","Implementation is subject to congressional approval and appropriations. As of 27 September 2026 Lockheed had delivered 1,387 production F-35s (989 F-35A, 255 F-35B, 143 F-35C), with a backlog of 274 more aircraft at the end of September.","The article does not give the total dollar value, signing date or funding schedule."],"cav":"A framework is not a contract for specific aircraft; the 850 figure is a planned minimum that depends on Congress. Value and timeline were not disclosed.","src":[["Militarnyi","https://militarnyi.com/en/news/850-f-35s-usa-agreement-lockheed-martin/"]]},
{"id":"fq42-spirit-partner","r":"USA","c":"Air","st":"Company claim","time":"23 Oct","t":"General Atomics adds Boeing's Spirit Defense as fuselage partner for the FQ-42A drone","s":"The aim is more production capacity as the Air Force seeks at least 500 collaborative combat aircraft by 2032.","p":["General Atomics Aeronautical Systems has chosen Spirit Defense, a Boeing subsidiary, as a fuselage design-and-build partner for its FQ-42A Vengeance collaborative combat aircraft, The War Zone reported on 23 October. The Air Force announced in September that it wants at least 500 CCAs by 2032, split between the FQ-42A and Anduril's FQ-44A Fury, with a possible Increment 2 adding designs.","GA-ASI says Spirit adds manufacturing capacity and reduces single points of failure; its Mike Shortsleeve said in September, 'We're ready to do that production'. The company says it can build CCAs using Reaper parts and hybrid metal-and-composite structures, while MQ-9B demand is also growing.","TWZ notes Spirit AeroSystems had heavy losses and quality lapses before Boeing reacquired it in a deal finalised in 2025, and that Boeing still faces challenges stabilising it."],"cav":"Largely company statements. The 500-aircraft goal is a plan rather than a contracted quantity, and the Air Force has not finished its operating concept for CCAs.","src":[["The War Zone","https://www.twz.com/air/general-atomics-fq-42-cca-drone-production-ramp-up-to-be-boosted-by-boeing-subsidiary"]]},
{"id":"denmark-fire-point-loan","r":"Europe","c":"Industry","st":"Reported","time":"23 Oct","t":"Denmark guarantees a $113m loan to Fire Point's Danish subsidiary","s":"The 750 million kroner guarantee from EIFO supports Ukrainian defence production in Denmark and the planned Freyja air-defence system.","p":["Denmark will provide a state guarantee for a 750 million kroner (about $113 million) loan to the Danish subsidiary of Ukrainian arms maker Fire Point, The Defense Post reported on 23 October, citing the Kyiv Independent. The Export and Investment Fund (EIFO) will issue the guarantee, and Copenhagen says the war prevents the firm from getting financing on standard commercial terms.","The move supports Denmark's plan to host Ukrainian defence production abroad, away from Russian strikes. Defence Minister Jeppe Bruus said it could also create cooperation with Danish companies. Fire Point has agreements with more than a dozen European firms for its planned Freyja air-defence system, which aims to cost well under $1 million per ballistic-missile interception, with a first interception planned by the end of 2027. Denmark announced in September 2025 that Fire Point would set up a Danish facility to make fuel for long-range missiles."],"cav":"The report is secondary, via the Kyiv Independent. The Freyja cost and 2027 interception goals are company targets, not demonstrated performance.","src":[["The Defense Post","https://thedefensepost.com/2026/10/23/denmark-loan-fire-point/"]]},
{"id": "usaf-bombers-air-to-air", "r": "USA", "c": "Air", "st": "Reported", "time": "22 Oct", "t": "USAF weighs giving bombers an air-to-air role, fighter force-structure report says", "s": "The unclassified report to Congress lists air-to-air capability on bombers among options; the B-21 is the likely candidate, but no decision is reported.", "p": ["The US Air Force is studying whether to add air-to-air combat capability to its bombers, The War Zone reported on 22 October, following a first report by Aviation Week. The idea appears in a new long-term fighter force-structure report to Congress, which lists “developing air-to-air capabilities on bombers” alongside greater reliance on Collaborative Combat Aircraft (CCA) drones and a possible “new capacity fighter”. The B-21 Raider is the most discussed candidate, though other bombers could be included.", "The report sets a goal of 1,509 combat-coded fighters by 2035 from F-35A, F-15EX and F-47 aircraft, and says the fighter fleet averages more than 31 years of age with falling availability. It names the F-16C/D, F-15E and A-10C as ageing types and points to China’s J-20 and J-16 as a reason for a mixed crewed and uncrewed force. Lt Gen David Tabor said a new-build F-16 option could come later but was not “urgent”; he did not discuss bombers. The first CCA phase involves the General Atomics FQ-42 and Anduril FQ-44, with a target of at least 500 CCAs by 2032.", "TWZ’s own analysis suggests roles such as launching long-range air-to-air missiles, controlling CCAs, supporting air-defence suppression or acting as an “arsenal” aircraft. These are the outlet’s speculation, not Air Force statements."], "cav": "TWZ had not seen the full report. How bombers would be used in air combat is unclear, and the idea is framed as a hedge under study, not a programme decision. The listed roles are the outlet’s analysis.", "src": [["The War Zone", "https://www.twz.com/air/usaf-confirms-bombers-could-have-a-major-air-to-air-combat-role"]]},
