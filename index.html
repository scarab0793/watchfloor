insulation": "Artist rendering of the Royal Navy Type 26 frigate.jpg", "tiger-retired": "Australian Army ARH Tiger front view.jpg", "raaf-triton-peregrine-ioc": "Northrop Grumman MQ-4C Triton Surveillance UAV (11364139084).jpg", "mk45-sustainment": "Mk 45 Gun.JPG", "tomahawk-planning-australia": "USS Barry (DDG-52) launching a Tomahawk missile in support of Operation Odyssey Dawn.jpg", "indonesia-carrier": "Italian carrier Giuseppe Garibaldi (C551) underway in 1990.jpg", "hawk-grounded": "British Aerospace Hawk T1, UK - Air Force AN1355498.jpg", "ddx-destroyer": "Italian destroyer Caio Duilio (D 554) undeway in the Atlantic Ocean, on 21 May 2022 (220521-N-TC847-001).JPG", "greece-fremm": "F593 Nave Carabiniere.jpg", "jaguar-r3": "EBRC Jaguar armoured reconnaissance vehicle.jpg", "nz-unimog": "Mercedes Benz Unimog Military Truck.jpg", "perch-2": "Switchblade 600 Loitering Munitions Training (8767574).jpg", "av-thundertiger-mou": "Switchblade 300 launch.jpg", "canada-globaleye": "SAAB Erieye AESA radar - Embraer 145SA (Hellenic Air Force).jpg", "globaleye-sweden": "SAAB Erieye AESA radar - Embraer 145SA (Hellenic Air Force).jpg"};
const items=[
{id:"iran-new-war-prep",w:"Iran and Gulf",c:"Escalation",st:"Reported",time:"22 Oct",t:"US and Israel reportedly prepare a short, intense new campaign against Iran",s:"Trump says the US is “not negotiating” with Iran, while press reports describe strike options, Israeli show-of-force flights and a thinning of US forces in some Gulf bases.",p:["The Defence Blog reported on 22 October that Washington and Israel appear to be preparing for renewed fighting with Iran, possibly within days. The report draws on official statements, unnamed sources and analyst commentary. On 21 October President Trump said: “No, I think we’re not negotiating… we are going to have something, one way or the other.” That cuts across his 8 October pledge that the US would not attack Iran before the 3 November midterm elections.", "According to the New York Times, as cited in the article, officials say the two governments are finalising a short, intense campaign aimed at Iran’s energy infrastructure, nuclear facilities and missile and drone stocks, and there is a chance Trump could order strikes before the end of October. NBC News reported that the options include hitting tunnel entrances at nuclear sites such as Pickaxe Mountain, and Kharg Island, which handles most of Iran’s oil exports, and Qeshm.", "NBC, citing two US officials and two other people, said US forces have recently left bases in Jordan, Qatar and Kuwait. US Central Command said it regularly moves personnel and assets “to optimize mission readiness”. The State Department has ordered staff reductions at the US embassy in Saudi Arabia, citing Houthi attacks including on civilian airports. Axios reporter Barak Ravid reported that dozens of Israeli fighter jets and tankers flew towards Iran through Syrian and Iraqi airspace and turned back near the border; Israel told Washington it was an exercise and show of force. Analyst Tyler Rogoway called it a possible dry run for a large integrated strike.", "At sea, Iran’s Revolutionary Guard navy said it hit four vessels accused of illegal oil transfers in the northern Persian Gulf and that three more ships struck mines west of the Strait of Hormuz, and it warned of a wider response against US bases. Saudi Arabia is facing a sustained Houthi missile and drone campaign, the UK has sent RAF Typhoons to guard Saudi cities, and Türkiye is reported to be preparing forces under its defence pact with Riyadh and Pakistan."],cav:"Much rests on anonymous sources. Strike options are not decisions and no date has been announced; Israel calls its flight an exercise and CENTCOM calls the troop moves routine. The “days rather than months” timeline is the author’s assessment.",src:[["The Defence Blog", "https://defence-blog.com/u-s-and-israel-prepare-for-a-new-war-with-iran/"]]},
{id:"tornado-s-kherson",w:"Ukraine",c:"Strikes",st:"Official claim",time:"21 Oct",t:"Ukrainian military intelligence says drones destroyed a Russian Tornado-S rocket launcher in Kherson region",s:"HUR released footage of its Prymary unit hitting the 300 mm launcher near Skadovsk with several kamikaze drones in succession.",p:["Ukraine’s Defence Intelligence directorate (HUR) published video on 20 October of its Prymary drone unit destroying a Russian 9K515 Tornado-S heavy multiple rocket launcher in occupied Kherson Oblast. HUR did not give the date, saying only that the strike happened “over the past month”. An OSINT analyst geolocated the launcher to Ulyanivka, just outside Skadovsk, near the Black Sea coast and well behind the Dnipro front line. Several kamikaze drones hit it one after another, a method meant to ensure a second or third drone finishes a target that survives the first. Russia has not commented.", "The Tornado-S is a modernised version of the Soviet Smerch. It fires 300 mm rockets from a 12-tube launcher on an eight-wheeled Kamaz truck, can be fired from the cab by a three-person crew using digital fire control and GLONASS navigation, and its guided rockets are credited with a reach of up to 120 km. The article says Russian crews have used it against Kherson and other towns along the Dnipro. After a July strike on another Tornado-S, a Ukrainian border guard brigade valued such a vehicle at more than $15 million, a figure not independently verified.", "Ukraine has claimed several earlier hits in 2026: one in Zaporizhzhia Oblast in February, three launchers and a loader near Karakul in Crimea in March, two near Melitopol in late April and one in the Huliaipole sector in July. HUR said Prymary also hit a Buk-M3 air-defence system, an Orion drone, a Kasta-2E radar, a Nebo-U radar, two P-18 radars, a drone assembly site and a building housing troops of the 108th Air Assault Regiment, without giving dates, places or whether each target was destroyed or damaged."],cav:"The main evidence is HUR’s own video, which the outlet did not independently verify. The date, the $15 million valuation and the status of the other targets come from Ukrainian sources, and the geolocation is by an OSINT analyst.",src:[["The Defence Blog", "https://defence-blog.com/ukraine-hits-russian-heavy-rocket-launcher-near-black-sea-coast/"]]},
{id:"tpy2-extension",r:"USA",c:"Air defence",st:"Reported",time:"22 Oct",t:"Missile Defense Agency adds $394 million to Raytheon’s deal to run AN/TPY-2 radars",s:"The sole-source modification lifts the contract ceiling to $2.999 billion and extends orders to October 2028, as the radars face combat damage in the Iran war.",p:["The US Missile Defense Agency has extended Raytheon’s contract to operate and maintain the military’s AN/TPY-2 missile-defence radars for two years, The Defence Blog reported on 22 October, citing a Department of War announcement. The change adds $394 million and raises the ceiling from about $2.6 billion to $2.999 billion. The ordering period now runs to 31 October 2028, and $112.3 million was obligated at award from fiscal 2027 funds. The original award dates from 2018, and this is a sole-source modification issued without competition.", "The AN/TPY-2 is a transportable X-band radar at the heart of the THAAD system and can also operate alone as a forward early-warning sensor. Raytheon will run and support the radars from Woburn, Massachusetts, and from US and overseas sites using field teams. The work mixes cost-plus-incentive-fee, cost-plus-fixed-fee and firm-fixed-price items, and the agency is also extending the task orders that fund individual radar sites.", "The US Army fields eight THAAD batteries, each with one radar, including at Fort Bliss, in South Korea and on Guam, and forward-based radars have been stationed in Japan, Türkiye, Israel and Qatar. In 2020 Raytheon won a contract worth up to $2.3 billion for seven radars for Saudi Arabia. The article says the radars have come under fire in the war with Iran: citing CNN satellite analysis, it says a THAAD radar at Muwaffaq Salti Air Base in Jordan was apparently destroyed by an Iranian strike in early March, with damage also described near Prince Sultan Air Base in Saudi Arabia and in the UAE. Each radar costs hundreds of millions of dollars and takes years to build."],cav:"The Jordan damage assessment rests on third-party satellite imagery and is hedged. The article quotes no statement from Raytheon or MDA and does not say how the radars will be sustained after October 2028.",src:[["The Defence Blog", "https://defence-blog.com/pentagon-extends-raytheon-deal-for-missile-defense-radars/"]]},
{id:"rocket-cargo-starfall",r:"USA",c:"Logistics",st:"Reported",time:"22 Oct",t:"Air Force lab flies military cargo pods in a SpaceX Starfall capsule",s:"The Rocket Cargo test on 20 October carried trackers, batteries and survival gear to check how equipment withstands launch and reentry.",p:["The Air Force Research Laboratory flew its own cargo pods inside a SpaceX Starfall capsule on a commercial rideshare launch from Cape Canaveral on 20 October, The Defence Blog reported. The pods held satellite trackers, batteries, survival gear, a water desalinator and emergency medical equipment, with sensors recording temperature, shock and vibration during launch and reentry. Engineers also checked whether a UNI-PAC III life raft would fit in the capsule for later tests. The outlet suggests this points to missions such as dropping rescue kits to downed aircrew, but that is its inference, not a stated plan.", "Starfall is SpaceX’s uncrewed reentry capsule, about 3.1 metres across and roughly 2,100 kg, able to return up to 1,000 kg of payload under parachutes, with recovery planned in the Pacific. The first demonstration flew in June. AFRL commander Brig. Gen. Douglas Wickert said: “Any day you launch a rocket is a good day, but today was more than just another big rocket launch.”", "The work belongs to Rocket Cargo, an AFRL project studying whether large commercial rockets could move materiel worldwide on tactical timelines, to places without runways or roads. Stated goals are delivery almost anywhere within about an hour and a half and eventually C-17-class loads. Geneva Technologies received $4.3 million in June, Blue Origin’s study contract is now worth about $13 million, and other partners include Rocket Lab, Sierra Space, Anduril, Inversion Space and Outpost Space. Possible uses include resupply in contested areas, rescue and disaster relief."],cav:"The article does not say whether the cargo survived or what the sensors recorded, and the life-raft work was only a fit check. The 90-minute and C-17-class targets are long-term goals, not demonstrated capabilities.",src:[["The Defence Blog", "https://defence-blog.com/u-s-air-force-tests-shipping-military-cargo-by-rocket/"]]},
{id:"bofors-57mk3-sweden",r:"Europe",c:"Naval",st:"Reported",time:"21 Oct",t:"Sweden orders four Bofors 57Mk3 naval guns and programmable ammunition from BAE Systems",s:"Deliveries are due in 2028–2029 to replace guns on some existing navy vessels; the value was not disclosed.",p:["Sweden has ordered four Bofors 57Mk3 naval guns and 3P programmable ammunition from BAE Systems Bofors, Defence Industry Europe and European Security & Defence reported on 21 October. Deliveries are scheduled for 2028–2029 and the contract includes training and services. The contract value was not disclosed. The Defence Materiel Administration (FMV) said the guns will replace systems on some existing vessels, without naming them.", "BAE describes the 57Mk3 as suited to air defence, anti-surface warfare and naval fire support, and the pre-fragmented, programmable, proximity-fused 3P round as able to engage drones, aircraft, missiles and surface targets. Stefan Löfström of BAE Systems Bofors said the order shows Sweden’s “absolute confidence in the Bofors 57Mk3”. Sweden already uses the gun on five Visby-class corvettes, two Gävle-class corvettes and two Stockholm-class patrol vessels.", "Sweden’s new Luleå-class frigates, based on the French FDI, are also planned to carry the 57Mk3 alongside Saab RBS15 Mk3 missiles and Aster 30 and CAMM-ER air-defence missiles. Naval Group began cutting steel for the first ship at Lorient on 1 October, with HMS Luleå due by end-2030 and the fourth ship in 2034."],cav:"The article does not confirm the new guns are meant for the Luleå class. The ammunition capabilities are BAE’s claims and were not independently verified.",src:[["Defence Industry Europe", "https://defence-industry.eu/sweden-orders-four-bofors-57mk3-naval-guns-and-programmable-ammunition-from-bae-systems/"], ["European Security & Defence", "https://euro-sd.com/2026/10/news/sea/54402/bae-systems-57mk3/"]]},
{id:"armenia-skyfox",r:"Europe",c:"Air",st:"Reported",time:"21 Oct",t:"Armenia’s defence minister says Czech Skyfox jets will “soon” fly in Armenian skies",s:"Suren Papikyan toured the Aero Vodochody plant on 20 October; the number of aircraft and the price remain unofficial.",p:["Armenian Defence Minister Suren Papikyan visited Aero Vodochody outside Prague on 20 October and said: “These marvels will soon be flying in Armenian skies.” The Defence Blog, which reported it on 21 October, says Armenia’s Defence Ministry published photos of the visit. President Vahagn Khachaturyan toured the same plant on 4 September. Armenia already flies the older L-39 Albatros, which the Skyfox replaces on Aero’s line.", "Neither Yerevan nor Aero has disclosed the number of jets, the contract value or delivery dates. Czech industry trackers reported in September that Armenia ordered four aircraft, but neither side has confirmed that.", "Aero renamed the L-39NG the Skyfox in October 2024. It keeps the Albatros layout but adds a composite wing, modern avionics and a Williams FJ44-4M turbofan. The subsonic jet reaches about 900 km/h and has five hardpoints for up to 1,640 kg of stores, for light attack, reconnaissance and training. Hungary received its first three of 12 in May 2025, and Vietnam ordered 12. In October Aero agreed with Thales Belgium to offer a drone-hunter version with 70 mm laser-guided rockets, though there is no indication Armenia will get that configuration."],cav:"The four-aircraft figure, contract value, delivery timeline and weapons package are unofficial or unknown. The minister’s remark is the only official confirmation in the article.",src:[["The Defence Blog", "https://defence-blog.com/czech-skyfox-jets-will-soon-fly-in-armenia-minister-says/"]]},
{id:"japan-scrambles",r:"Far East",c:"Air",st:"Official claim",time:"21 Oct",t:"Japan’s jet scrambles hit a four-year high for the April–September half-year",s:"The Joint Staff counted 442 intercept launches, 285 against Chinese aircraft and 152 against Russian ones.",p:["Japan’s Air Self-Defense Force launched fighters 442 times between 1 April and 30 September 2026, up from 265 a year earlier and the highest first-half total since fiscal 2022, when there were 446. The Defence Blog reported the figures on 21 October, based on Joint Staff Office data first reported by USNI News. Chinese aircraft and drones accounted for 285 launches, up from 198, and Russian aircraft for 152, up from 59. Five were classed as other.", "By sector, the Southwestern force remained busiest with 201 (189 a year earlier), the Northern force rose to 112 from 53, the Central to 27 from 9, and the Western force to 102 from 14, the steepest rise. USNI linked that to Chinese activity over the East China Sea and Russian aircraft joining Chinese formations there.", "The report notes Russian Il-20 intelligence flights, Chinese Y-9 flights, and long-range joint bomber flights. On 27 June two H-6s and two J-16s joined Tu-95s, Tu-142s and a Su-35 in the Sea of Japan and later flew through the Okinawa–Miyako gap; South Korea scrambled its own fighters and protested to both countries. Beijing and Moscow call such patrols normal cooperation, while Japan’s 2026 defence white paper calls repeated joint activity “obviously intended as demonstration activities against Japan”."],cav:"No Japanese sovereign airspace violations were recorded. Scrambles respond to approaching aircraft and are not in themselves incursions.",src:[["The Defence Blog", "https://defence-blog.com/china-and-russia-push-japans-jet-scrambles-to-4-year-high/"]]},
{id:"austal-lch-loan",r:"Oceania",c:"Naval",st:"Company claim",time:"21 Oct",t:"Austal secures $245 million loan to build facilities for Australia’s heavy landing craft",s:"The National Reconstruction Fund Corporation financing supports the A$4 billion order for eight LCH vessels, with the Commonwealth covering the loan costs.",p:["Austal has secured $245 million in debt financing from the National Reconstruction Fund Corporation to build the infrastructure needed to deliver Australia’s landing craft heavy (LCH), Naval Today reported on 21 October. The company won a $4 billion contract in February 2026 to build eight of the ships under a Strategic Shipbuilding Agreement. Austal CEO Paddy Gregg said the funding showed the agreement “in practice”.", "Modules will be built at existing and new facilities, and the roughly 100-metre ships will be assembled and launched at the Australian Marine Complex in Henderson, Western Australia. The loan will pay for additional dedicated shipbuilding facilities there. Under the agreement the Commonwealth covers all costs of the facility, which Austal says reduces its working-capital needs.", "The design is based on the Damen LST100: about 16 metres wide, 3,900 to 4,000 tonnes, with space for more than 200 personnel and up to six M1A2SEP3 Abrams tanks or nine Redback infantry fighting vehicles. Construction is due to begin in 2026 and the eighth ship to be delivered in 2038. The vessels are intended for amphibious operations, logistics and disaster relief."],cav:"Loan terms, conditions precedent and a cost breakdown were not disclosed. Delivery dates depend on the shipbuilding agreement.",src:[["Naval Today", "https://www.navaltoday.com/2026/10/21/austal-secures-dollar245-million-loan-for-lch-infrastructure"]]},

{id:"sm6-contract",r:"USA",c:"Missiles",lead:1,st:"Reported",time:"1 Oct",
t:"Navy awards Raytheon up to $24.4 billion to scale up SM-6 production",
s:"A five-year contract with two option years is meant to keep Standard Missile-6 output above 500 a year, about four times the pace implied by an earlier authorisation.",
p:["On 1 October the US Navy gave Raytheon a five-year contract, with two further option years, worth up to $24.4 billion to expand production of the Standard Missile-6 interceptor. According to Army Recognition, the aim is to sustain output above 500 missiles a year.",
"The figure is a ceiling, not money already committed, and it depends on future appropriations. The Navy’s FY2027 plan asks for 540 SM-6 missiles at $4.3 billion, which works out to about $7.96 million of procurement funding per missile. The article stresses that this is not a flyaway unit price. A rate of 500 a year is roughly four times the 125 a year implied by a 2019 authorisation of 625 missiles over five years. Held for five years it would produce at least 2,500 missiles, 700 more than the original 1,800-missile objective, although the contract itself does not state a quantity. Raytheon has added staff and automation and finished a $115 million expansion of its Alabama site.",
"The SM-6 is a two-stage missile about 6.6 metres long and 1,500 kg, with a 64 kg blast-fragmentation warhead. The Block IA flies at about Mach 3.5 and uses an active radar seeker derived from the AMRAAM air-to-air missile. Published ranges run from 240 to 460 km. Because the seeker can take mid-course updates from the Aegis combat system, a ship can fire at targets tracked by other ships, aircraft or networked sensors.",
"The missile does several jobs. It defends against aircraft and cruise missiles, it has intercepted ballistic-missile targets in tests, and it has been used against ships: an SM-6 fired by USS John Paul Jones sank the decommissioned USS Reuben James in January 2016. Every missile used that way occupies a vertical launch cell that could hold an air-defence round. A Block IB variant with a wider 0.53 m motor is meant to add range and speed. The Army chose the SM-6 in 2020 for its Typhon-launched Mid-Range Capability, and an air-launched AIM-174B version serves on the F/A-18E/F."],
cav:"Exact engagement ranges are classified, and the 500-a-year rate is not written into the contract. The $24.4 billion is a maximum value.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/us-navy-raytheon-sm-6-24-billion-contract-2026"]],
img:"https://commons.wikimedia.org/wiki/Special:FilePath/USS_John_Paul_Jones_(DDG-53)_launches_RIM-174_June_2014.JPG?width=1200",cr:"US Navy photo, USS John Paul Jones (DDG 53) firing an SM-6 during a live-fire test, 19 June 2014, via Wikimedia Commons (US government work, public domain)"},

{id:"er-gmlrs",r:"USA",c:"Artillery",st:"Reported",time:"19 Oct",
t:"US Army clears the 150 km ER GMLRS rocket for production",
s:"The extended-range rocket reaches about twice as far as earlier GMLRS rounds and fits the HIMARS and M270 launchers already in service.",
p:["The US Army has cleared the Extended-Range Guided Multiple Launch Rocket System, ER GMLRS, for production after operational tests. The rocket reaches 150 km, against about 70 km for earlier GMLRS rockets, and it fits the HIMARS and M270 launchers already in service, so units gain reach without buying new launchers.",
"In a statement dated 19 October, Lockheed Martin said both warhead versions, Unitary and Alternative, completed operational testing. Firings took place at White Sands Missile Range in New Mexico in September and October, with soldiers launching several rockets in succession from an M270A2. The Army also approved Milestone C, the step that moves the programme into production and deployment.",
"The rocket has a larger motor and a revised tail-controlled flight design, keeps GPS guidance, and is meant to work by day, by night and in poor weather. The Unitary version carries a high-explosive warhead of about 200 pounds for single targets. The Alternative Warhead uses preformed fragments against people and equipment spread over an area. Both can detonate at a set height above ground.",
"Earlier steps included a December 2025 firing of an Alternative Warhead round over 112 km from a HIMARS and early-2026 tests that confirmed integration with the upgraded M270A2. Army Recognition argues that the longer range could let artillery strike command posts, ammunition depots and air-defence sites from further back, which may reduce exposure to counter-battery fire. ER GMLRS joins the standard GMLRS, ATACMS and the Precision Strike Missile in the US precision-fires family. For NATO and other HIMARS or M270 users it could add deep-strike capability without new launcher fleets. Lockheed is reportedly expanding capacity and its supply chain."],
cav:"Long-range fires still depend on finding targets, dependable communications and resupply. Production volumes and delivery schedules for allies have not been announced.",
src:[[AR,"https://www.armyrecognition.com/news/army-news/2026/u-s-army-clears-150-km-er-gmlrs-rockets-for-production-to-extend-himars-and-m270-strike-range"]],
img:"https://www.armyrecognition.com/images/stories/news/2026/october/U.S.%20Army%20Clears%20150-km%20ER%20GMLRS%20Rockets%20for%20Production%20to%20Extend%20HIMARS%20and%20M270%20Strike%20Range.jpg",cr:"US Department of Defense, as credited by Army Recognition (US government work, public domain)"},

{id:"zumwalt-cps",r:"USA",c:"Naval",st:"Reported",time:"19 Oct",
t:"Navy adds $99 million for Zumwalt destroyer sea trials as it is rebuilt for hypersonic missiles",
s:"USS Lyndon B. Johnson is being converted to carry 12 Conventional Prompt Strike missiles, with commissioning now expected in 2027.",
p:["On 19 October the US Navy gave HII’s Ingalls Shipbuilding a $99 million contract modification for system testing and sea trials of USS Lyndon B. Johnson (DDG-1002), the third and last Zumwalt-class destroyer. The ship is at Pascagoula, Mississippi, where it is being converted to carry 12 Conventional Prompt Strike (CPS) hypersonic missiles. The money pays for ship trials and delivery preparation, not for missiles or operational qualification.",
"The ship was ordered in September 2011 under a $1.826 billion award to General Dynamics Bath Iron Works that also covered USS Michael Monsoor. It moved to Ingalls in January 2022 and entered drydock in January 2025, where its two 155 mm Advanced Gun Systems were replaced with four 87-inch launch tubes, each holding three CPS missiles. The guns had been left without usable ammunition after the LRLAP round was cancelled in 2016, which is also why the class was cut from 32 planned ships to three.",
"The schedule has slipped. Commissioning has moved from 2024 to 2027, and the first CPS flight test from a Zumwalt-class ship has moved from 2025 to 2027. CPS uses a two-stage solid booster and a Common Hypersonic Glide Body, flies faster than Mach 5, and has published ranges of 2,700 to 3,500 km. Its test record includes an end-to-end test at Cape Canaveral in May 2025, but qualification at sea is still outstanding.",
"Cost is a concern. The Navy’s lifecycle estimate rose from $31 billion for 262 missiles in 2020 to $41 billion for 224 in 2024, an increase of 32.3%. Lockheed Martin received a $1.35 billion production and integration modification in April 2026. Production runs at six to seven rounds a year against a goal of 12. The article’s author calculates roughly $118 million to $183 million per missile in lifecycle terms and estimates that building 200 missiles at seven a year would take about 28.6 years. Those calculations are the author’s own."],
cav:"Targeting, launch-control integration and performance against defences remain unresolved, and the per-missile costs are the article author’s estimates.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/us-navy-awards-99-million-for-zumwalt-class-uss-lyndon-b-johnson-sea-trials-amid-cps-hypersonic-missile-conversion"]]},

{id:"javelin-lwclu",r:"USA",c:"Land",st:"Reported",time:"19 Oct",
t:"Javelin joint venture wins $215 million for lightweight command launch units",
s:"The Army contract follows first deliveries of the new launcher five months earlier. It is said to be 30% smaller and 25% lighter than the Block I unit.",
p:["The US Army has awarded the Raytheon and Lockheed Martin Javelin Joint Venture a $215 million contract to produce Lightweight Command Launch Units, the reusable part of the Javelin anti-tank system that holds the sight and fires the missile. Defence Industry Europe reported the award on 19 October.",
"The new launcher replaces the older command launch unit. It works with all past, current and future Javelin missile variants, and the first units went to the Army about five months before this contract. Raytheon says the unit is 30% smaller and 25% lighter than the Block I launcher and that it doubles target detection and recognition capability, with day and night surveillance and engagement. These performance figures come from Raytheon and are not independently verified.",
"Jenna Hunt Frazier, joint venture president and Javelin programme director at Raytheon, said the award reflects close cooperation between industry and the Army, and that modernising the factory and strengthening the production line would give soldiers a lighter, more capable launcher. Rich Liccion, joint venture vice president and Javelin programme director at Lockheed Martin, credited the result to innovation driven by mission focus.",
"The partnership builds Javelin at two sites, Raytheon in Tucson, Arizona, and Lockheed Martin in Orlando, Florida. According to the article it has made more than 55,000 missiles and more than 12,000 reusable command launch units."],
cav:"The article does not give the contract’s period of performance, the number of launchers ordered, the unit price or a delivery schedule, and it does not include an Army assessment of the launcher’s performance.",
src:[[DIE,"https://defence-industry.eu/javelin-joint-venture-receives-215-million-u-s-army-contract-to-produce-lightweight-launchers/"]],
img:"https://defence-industry.eu/wp-content/uploads/2026/10/Javelin-Joint-Venture-receives-215-million-U.S.-Army-contract-to-produce-lightweight-launchers.jpeg",cr:"US Army, as credited by Defence Industry Europe (US government work, public domain)"},

{id:"mq25-remote",r:"USA",c:"Naval air",st:"Reported",time:"19 Oct",
t:"Carrier crew flies an MQ-25A tanker drone from more than 2,100 miles away",
s:"USS Ronald Reagan controlled a Boeing Stingray over a satellite link, a step towards replacing fighter-based refuelling with unmanned tankers.",
p:["The US Navy announced on 19 October that the aircraft carrier USS Ronald Reagan, operating in the Pacific, remotely controlled a Boeing MQ-25A Stingray unmanned tanker over more than 2,100 statute miles (3,379 km). The link reached Boeing’s facility in Mascoutah, Illinois.",
"The test used an MD-5C ground control station and a low-Earth-orbit satellite network to keep command connectivity beyond direct radio range. Ronald Reagan’s Unmanned Air Warfare Center combines the MD-5C, Lockheed Martin’s MDCX mission-control software, Navy-developed equipment and communications gear. Fitting it took 11 concurrent ship modifications over 17 months. The first MD-5C went aboard USS Theodore Roosevelt in March 2026 and the second aboard Ronald Reagan in August.",
"The MQ-25A is meant to move 6,350 kg of fuel to aircraft 926 km from its carrier. The Navy plans to buy 76 Stingrays, 67 of them operational tankers, at an estimated $19.4 billion, with initial operational capability planned for 2029. The article ties the effort to the Western Pacific threat picture: Chinese anti-ship ballistic missiles reach beyond 1,500 km, so tankers that extend fighter range would let carriers stay further away. By its arithmetic, moving a carrier 200 nautical miles away adds 400 nautical miles to a fighter’s round trip, about 53 extra minutes at 450 knots.",
"The article also lists comparable efforts elsewhere, including China’s Fujian carrier and KJ-600 aircraft, Türkiye’s Bayraktar TB3 on TCG Anadolu, French orders for Camcopter S-100F and VSR700 drones, and Japan’s ¥76.5 billion allocation for four MQ-9B SeaGuardians."],
cav:"Operational MQ-25 integration is not complete. Control handoffs between shore and ship stations, interrupted-link procedures and command continuity during busy launch and recovery cycles still have to be worked out, and the article’s sortie arithmetic assumes full availability.",
src:[[AR,"https://www.armyrecognition.com/news/aerospace-news/2026/us-navy-tests-long-range-control-of-mq-25a-tanker-drone-from-aircraft-carrier-to-extend-fighter-combat-range"]]},

{id:"red-wolf",r:"USA",c:"Helicopters",st:"Company claim",time:"19 Oct",
t:"L3Harris Red Wolf missile flies from an MH-60 helicopter for the first time",
s:"The Army’s special operations aviation unit tested a long-range missile that could let Black Hawks strike from outside air-defence range.",
p:["The US Army has, for the first time, flown L3Harris’s Red Wolf long-range strike missile from an MH-60 Black Hawk helicopter. The demonstration was run by the Systems Integration Management Office of the US Army Special Operations Aviation Command. It confirmed that the Red Wolf launch system is compatible with the MH-60 and assessed the missile’s flight behaviour under operational conditions. Army Recognition says it gives a first technical basis for extending integration to other H-60 variants.",
"L3Harris said in a statement dated 13 October that the test belongs to its Wolf Pack family of systems for long-range precision strike and electronic warfare. The company did not disclose the distance flown, the flight time or the payload configuration. Army Recognition reports the missile’s demonstrated range as 200 nautical miles, about 370 km. In principle that would let helicopters attack from outside the engagement envelope of an air-defence system.",
"The missile is about 1.8 metres long, has folding wings that open after launch, flies at high subsonic speed and can stay airborne for more than 60 minutes. It combines GPS navigation with a seeker for fixed and moving targets and accepts targeting data over beyond-line-of-sight links. Its electronic-warfare sibling, Green Wolf, is built for electronic attack and for finding and locating hostile emissions.",
"The test follows earlier work. In September 2025 the US Marine Corps fired a Red Wolf from an AH-1Z Viper at a maritime target over the Atlantic Test Range. L3Harris says the Wolf Pack portfolio has completed 60 flight demonstrations from aircraft and ground launchers. In January 2026 the Naval Air Systems Command selected L3Harris to develop, test and produce Red Wolf for the Marine Corps’ Precision Attack Strike Munition programme."],
cav:"The demonstration sets no date for operational use. Effectiveness would depend on good targeting intelligence, uninterrupted communications and mission planning. Range and performance figures come from the company and the article, not from an Army test report.",
src:[[AR,"https://www.armyrecognition.com/news/aerospace-news/2026/u-s-army-expands-long-range-strike-options-with-first-red-wolf-missile-flight-from-mh-60-helicopter"]]},

{id:"nmesis-battalion",r:"USA",c:"Marines",st:"Reported",time:"16 Oct",
t:"Marines stand up their first medium missile battalion for land-based anti-ship fire",
s:"A Camp Lejeune artillery battalion has been redesignated to operate NMESIS, a launcher carrying two Naval Strike Missiles.",
p:["On 9 October at Camp Lejeune, North Carolina, 1st Battalion, 10th Marine Regiment, part of the 2nd Marine Division, was redesignated from an artillery battalion to a medium missile battalion. The 2nd Marine Division announced the change through the Defense Visual Information Distribution Service. Army Recognition covered it on 16 October.",
"The battalion is built around the Navy-Marine Expeditionary Ship Interdiction System, NMESIS, a land-based anti-ship system. It pairs a remotely operated expeditionary fires carrier with a launcher holding two Naval Strike Missiles. The Marine Corps says the missile’s effective range is more than 130 nautical miles and that it can hit ships and fixed land targets. NMESIS first reached the 3rd Marine Littoral Regiment in 2024, and a Naval Strike Missile hit a surface target at sea during Large Scale Exercise 2021 off Hawaii.",
"The stated purpose is to give the 2nd Marine Division dedicated land-based maritime fires. Marine leaders link it to sea denial, littoral access and sea control, and to supporting maritime commanders. From expeditionary positions ashore the battalion can support forces moving on land and at sea. As a service-retained unit it can also be used by II Marine Expeditionary Force or the wider Corps in a crisis. The article places the move within the Marines’ Force Design modernisation and a shift towards a more distributed, maritime-focused force.",
"The official announcement stresses that NMESIS complements cannon artillery rather than replacing it, and the 10th Marines keep artillery capability in another battalion."],
cav:"The article gives no details of unit size, equipment numbers or deployment timelines. It links to a separate story on a $404 million Kongsberg award to expand the NMESIS missile force but does not cover that award itself.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/u-s-marine-corps-establishes-first-medium-missile-battalion-for-nmesis-land-based-anti-ship-operations"]],
img:"https://www.armyrecognition.com/images/stories/news/2026/october/U.S.%20Marine%20Corps%20Establishes%20First%20Medium%20Missile%20Battalion%20for%20NMESIS%20Land-Based%20Anti-Ship%20Operations.jpg",cr:"US Marine Corps, as credited by Army Recognition (US government work, public domain)"},

{id:"f22-fury",r:"USA",c:"Air",st:"Reported",time:"16 Oct",
t:"F-22 pilot commands an Anduril Fury combat drone in flight",
s:"The Air Force says the pilot gave mission-level orders to a YFQ-44A over California while the drone handled its own flying.",
p:["On 16 October the US Air Force announced that an F-22 Raptor pilot gave in-flight tactical commands to Anduril’s YFQ-44A Fury, a collaborative combat aircraft, during a demonstration over California earlier in the month. One F-22 and one Fury took part. The pilot set mission-level objectives while the drone’s onboard autonomy managed flight path, speed, altitude and manoeuvres. The pilot did not fly the drone with direct controls, and the test showed the aircraft being retasked in real time rather than following a fixed route.",
"The units involved were the 412th Test Wing, the 422nd Test and Evaluation Squadron, the 309th Software Engineering Group, the CCA Experimental Operations Unit, the F-22 System Program Office and the CCA Software Autonomy and Teaming Branch.",
"The Air Force aims to field 500 semi-autonomous combat aircraft by 2032 within an eventual inventory of 1,000. Increment 1 involves Anduril’s Fury and General Atomics’ FQ-42 Vengeance, and both received engineering, manufacturing development and production contracts in June 2026. Exercise Emerald Flag in December 2026 is expected to be their first large-force employment exercise. At a target ceiling of $20 million per air vehicle, the article estimates about $10 billion for 500 aircraft and $20 billion for 1,000, excluding sensors, weapons and support.",
"The Fury began as a Blue Force Technologies design, was selected for Increment 1 in April 2024, first flew in October 2025 and moved to weapons integration in 2026. In July 2026 a Fury launched an AIM-120 using targeting data supplied from outside, without a confirmed intercept. Earlier crewed-uncrewed experiments include an F-22 directing an MQ-20 Avenger in October 2025 and an F-35 controlling an MQ-20 from the ground in May 2026."],
cav:"The Air Force did not disclose the maximum command distance, response delay, task-completion rate or number of pilot interventions, which matter for whether one pilot could supervise several drones. Engagements would still depend on target identification, missile guidance and human authorisation, and jamming could block mission updates.",
src:[[AR,"https://www.armyrecognition.com/news/aerospace-news/2026/us-f-22-raptor-stealth-fighter-commands-yfq-44a-fury-combat-drone-in-simulated-air-combat-for-first-time"],[DIE,"https://defence-industry.eu/u-s-air-force-says-f-22-pilot-directed-anduril-yfq-44a-fury-through-flight-maneuvers-and-simulated-combat-tasks-in-airborne-test/"]],
img:"https://www.armyrecognition.com/images/stories/news/2026/october/US%20F-22%20Raptor%20stealth%20fighter%20commands%20YFQ-44A%20Fury%20combat%20drone%20in%20simulated%20air%20combat%20for%20first%20time%20925%20001.jpg",cr:"US Department of Defense, as credited by Army Recognition (US government work, public domain)"},


{id:"ngj-lb",r:"USA",c:"Electronic warfare",st:"Reported",time:"20 Oct",
t:"L3Harris wins $876 million Navy award to continue Next Generation Jammer Low Band development",
s:"NAVAIR funds the next engineering and manufacturing phase of the airborne jammer, which targets radars and communications in lower frequency bands.",
p:["On 20 October the US Navy gave L3Harris Technologies a contract modification worth $876 million for the next engineering and manufacturing development phase of the Next Generation Jammer Low Band (NGJ-LB) programme, Naval Today reported. The customer is the Naval Air Systems Command.",
"The system is meant to disrupt and degrade enemy radar and communications by combining advanced jamming with faster processing. L3Harris says it counters adversaries operating in lower-frequency bands. The design is modular and open-architecture, intended to simplify maintenance, allow upgrades, support joint and allied operations and leave room for future technology. The company links it to its earlier work on the Navy’s airborne electronic attack mission, including the AN/ALQ-99 tactical jamming system.",
"The award covers non-recurring tooling and equipment with associated labour, delivery of system demonstration test-article pods, added cybersecurity and system-security development, and product, logistics, test and evaluation, and software support. The article says the programme is on an accelerated timeline in line with the Department of War’s push for faster capability delivery.",
"Chris Aebli, president of Communications and Spectrum Dominance at L3Harris, said the programme helps counter adversaries in lower-frequency bands. Utah lawmakers Senators John Curtis and Mike Lee and Representative Celeste Maloy praised the work, which the article says is supported by hundreds of people in Salt Lake City."],
cav:"The report is short and relies mainly on company and lawmaker statements. It gives no end date, delivery dates, pod quantities or total programme ceiling, and does not explain why the award is described as “undefined”.",
src:[["Naval Today","https://www.navaltoday.com/2026/10/20/l3harris-secures-dollar876m-us-navy-contract-for-next-gen-jammer"]]},

{id:"apkws-framework",r:"USA",c:"Missiles",st:"Company claim",time:"20 Oct",
t:"BAE Systems signs a framework deal to lift APKWS output to 35,000 kits a year",
s:"The multi-year agreement with the US Department of War runs for up to seven years and is aimed in part at counter-drone missions.",
p:["BAE Systems has signed a multi-year framework agreement with the US Department of War to expand production of its APKWS laser-guidance kits. European Security & Defence published BAE’s announcement, dated 19 October from Falls Church, Virginia, and Hudson, New Hampshire.",
"The framework allows up to seven years of multi-year procurement and a production capacity of up to 35,000 units a year. BAE will ramp up output while negotiating a multi-year contract within the framework. The stated purpose is readiness for changing operational demands, including counter-unmanned-aircraft missions.",
"APKWS kits turn unguided 2.75-inch rockets into precision-guided munitions. They are fielded by the US Air Force, Army, Marine Corps and Navy and are available to US allies. BAE says they can be used from many platforms in air-to-surface, surface-to-surface, surface-to-air and air-to-air engagements. The kits are built at Hudson, New Hampshire, and Austin, Texas, and BAE says it has invested in advanced manufacturing, materials and workforce, and continues to develop upgrades and mission-specific variants.",
"Tom Arseneault, president and CEO of BAE Systems, Inc., said APKWS delivers proven, reliable and affordable precision at scale, and framed sustained investment in critical munitions as a way to strengthen readiness."],
cav:"This is a framework, not a firm order. No contract value, firm quantities, delivery schedule or unit price was given, “up to” figures are ceilings, and the reliability and affordability claims are BAE’s own.",
src:[["European Security & Defence","https://euro-sd.com/2026/10/allgemein/54398/bae-systems-apkws/"]]},

{id:"army-balloons",r:"USA",c:"Balloons",st:"Official claim",time:"19 Oct",
t:"US Army wants hundreds of stratospheric balloons over a European battlefield",
s:"A senior Army commander describes decoys, relays and launch platforms for air-launched effects floating at 60,000 to 80,000 feet.",
p:["Brig. Gen. Steven Carpenter, commanding general of Multi-Domain Command Europe, told The War Zone at the Association of the US Army conference in Washington that the Army plans to release high-altitude balloons in large numbers in a future European conflict, “200, 300 at a time”. In his words the goal is to “proliferate the stratosphere”, and a European scenario could involve hundreds or possibly thousands of balloons sent east.",
"The balloons would act as decoys, communications relays, electronic-sensing and attack platforms, and launch points for air-launched effects, which are drones used for surveillance or strike. They would form a network over the battlefield that could fill gaps if satellite communications are degraded, and many would carry the NATO Link 16 datalink. Carpenter focused on the stratosphere, roughly 60,000 to 80,000 feet, which he said is very hard to target without fifth-generation fighters or S-400-class missiles. Options range from low-yield attacks on a radar to longer-range, higher-yield strikes, with Russian S-400 launchers cited as possible targets.",
"He said the operating concept has been proven against modern adversary systems, but the article gives no detail of the tests. The Army had planned a Pacific swarm demonstration last year, but the balloons were redirected to the Middle East, where an Army official said they were “effective”. Fielding at scale depends on money to bring systems into theatre, the Army will choose vendors, and the systems would have to be in place before a crisis becomes a conflict. Seasonal weather also affects flight paths and launch sites.",
"Other users are cited for context: Ukraine has used balloons to carry out attacks and launch drones, Russia has used them as decoys, and China’s balloons became widely known after the 2023 spy balloon crossed North America."],
cav:"The claims come from one commander’s interview. Test results, vendors, costs and timelines were not disclosed, and the Army has talked about this concept publicly for at least six years.",
src:[["The War Zone","https://www.twz.com/air/armys-plan-to-launch-hundreds-of-balloons-into-enemy-territory-if-a-future-conflict-breaks-out"]],
img:"https://www.twz.com/wp-content/uploads/2026/10/Drone-Balloon-Army.jpg?w=1200",cr:"US Army photo by Master Sgt. Ray Boyington, as credited by The War Zone (US government work, public domain)"},

{id:"denmark-nsm",r:"Europe",c:"Missiles",st:"Reported",time:"19 Oct",
t:"Denmark orders more Naval Strike Missiles from Kongsberg",
s:"A contract worth about NOK 400 million adds to Denmark’s existing order for its frigates and coastal batteries.",
p:["Denmark has ordered additional Naval Strike Missiles from Norway’s Kongsberg to expand the strike capability of its navy and coastal defence. Kongsberg Defence & Aerospace and Denmark’s Defence Acquisition and Logistics Organisation announced the order on 19 October. Kongsberg puts its value at about NOK 400 million. The number of missiles was not disclosed, and the contract is a government-to-government arrangement with Norway.",
"It builds on earlier purchases. In March 2025 Denmark placed a major order for its Iver Huitfeldt-class frigates, valued by Kongsberg at about NOK 2.1 billion, including missiles and equipment. Denmark became the 14th country to select the NSM, choosing it to replace the Harpoon missiles it gave to Ukraine. In December 2025 it ordered the NSM Coastal Defence System in a contract worth more than €100 million, with deliveries from 2026. Kongsberg says Denmark is the fifth NATO country to buy that system, and Danish authorities named the Danish Straits and the western Baltic as strategically important waters for it.",
"The NSM is a high-subsonic missile with a published range above 300 km, weighing about 407 kg and measuring 3.96 m. It can hit ships and land targets, flies low over the sea and carries an imaging infrared seeker with automatic target recognition. The article says the order is meant to help Denmark deny hostile warships access to the Baltic and North Sea approaches, and that using one missile family at sea and ashore simplifies training, logistics and interoperability. Using the existing Norwegian channel is described as a quick way to expand an established system.",
"At NATO’s Military Committee Conference in Copenhagen in September, Alliance leaders described Denmark as the gateway between the Baltic Sea, the North Atlantic and the High North."],
cav:"The quantity is undisclosed and the contract values are Kongsberg’s figures. The article’s views on deterrence and NATO’s push for faster delivery are the author’s interpretation, not official statements.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/denmark-expands-maritime-strike-capability-with-new-kongsberg-naval-strike-missile-order"]]},

{id:"prince-of-wales",r:"Europe",c:"Naval",st:"Reported",time:"19 Oct",
t:"Royal Navy sends HMS Prince of Wales to the Arctic and North Atlantic",
s:"The carrier strike group, with more than 1,200 personnel, will work under NATO command in the second phase of Operation Firecrest.",
p:["The Royal Navy has sent the aircraft carrier HMS Prince of Wales to the Arctic and North Atlantic, where it will operate under NATO command to reinforce the Alliance’s northern flank. Army Recognition, citing a Royal Navy statement of 17 October, says this is the second phase of Operation Firecrest. The first phase ended in July, when the carrier worked with the Type 45 destroyer HMS Duncan and the tanker RFA Tidespring.",
"The strike group has more than 1,200 personnel and mixes fixed-wing aircraft, helicopters and uncrewed systems. HMS Dauntless is the main escort, and Commodore Richard Hewitt commands the group. Norway, Denmark and Germany are among the countries taking part. The air group includes F-35B fighters, Merlin Mk2 anti-submarine helicopters, Merlin Mk4 Commando helicopters, Wildcat helicopters and Malloy uncrewed aircraft. The carrier displaces about 65,000 tonnes, is 284 metres long and uses a ski-jump ramp rather than catapults for F-35B take-offs. Dauntless carries the Sea Viper air-defence system.",
"Planned activities include NATO’s Neptune Strike exercise series, along with the Atlantic Future Forum and the International Sea Power Conference in Oslo. The article argues that the Arctic and North Atlantic matter because of transatlantic shipping, undersea cables, energy routes and Russian naval movements between the Arctic and the Atlantic. It also notes other British NATO commitments, such as personnel in Estonia, RAF Typhoons supporting air policing in Romania and P-8 Poseidon patrol aircraft."],
cav:"This is an analysis piece. The phase-two dates and the length of the deployment are not given, there are no direct quotations from officials, and the author’s descriptions of sensor and intelligence roles are not independently verified.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/uk-deploys-hms-prince-of-wales-carrier-strike-group-to-strengthen-nato-defenses-in-arctic-waters"]]},

{id:"rubis-launch",r:"Europe",c:"Submarines",st:"Reported",time:"16 Oct",
t:"France moves its fifth Suffren-class attack submarine Rubis towards launch",
s:"Naval Group and the DGA shifted the boat from the Cherbourg construction hall to the launch basin on 16 October.",
p:["On 16 October Naval Group and the French armaments agency DGA moved Rubis (S639), the fifth Suffren-class nuclear-powered attack submarine, from the construction hall in Cherbourg to the Cachin basin launch site. The move comes before first flotation, outfitting, dockside and propulsion checks, and sea trials, after which the Navy will accept the boat. Armed Forces Minister Catherine Vautrin and DGA chief Patrick Pailloux attended, along with senior naval commanders. Naval Group builds the hull and TechnicAtome supplies the nuclear propulsion plant.",
"The Barracuda programme is costed at €9.1 billion for six boats. It began in October 1998, entered design in 2002 and construction in 2007, and delivered its lead boat after 13 years. Army Recognition gives an indicative recurring cost of about €1 billion per submarine, excluding development and infrastructure.",
"Suffren was delivered in November 2020 and entered service in 2022, Duguay-Trouin followed in 2024 and Tourville in 2025. De Grasse was delivered in June 2026 but still awaits operational admission, and Casabianca is under construction with delivery expected by 2030. The class is about 99.5 m long and displaces roughly 5,300 tonnes submerged, nearly double the Rubis class it replaces. A 150 MW reactor drives a pump-jet, and endurance rises from 45 to 75 days. Four 533 mm tubes can launch up to 24 weapons, including F21 torpedoes, SM39 Exocet missiles and naval cruise missiles reported to reach beyond 1,000 km.",
"The name Rubis has a history: the earlier minelayer of that name joined the Free French forces in 1940, is credited with sinking 22 ships and was scuttled in 1958."],
cav:"Several performance figures, including a 120% gain in time on station, rest on assumptions in the article and are theoretical. The first boat of the class needed nearly two years between delivery and active service.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/france-to-launch-fifth-suffren-class-nuclear-attack-submarine-rubis-in-normandy-for-long-range-strikes"],[DIE,"https://defence-industry.eu/french-nuclear-powered-attack-submarine-rubis-begins-transfer-to-launch-lift-at-naval-groups-cherbourg-shipyard/"]]},

{id:"sodermanland-poland",r:"Europe",c:"Submarines",st:"Reported",time:"15 Oct",
t:"Sweden agrees to lease HMS Södermanland to Poland until new A26 boats arrive",
s:"The six-year lease, signed on 12 October, gives Poland a second submarine from 2028 and a training boat for its future Saab A26 crews.",
p:["On 12 October Sweden’s Defence Materiel Administration and the Swedish Armed Forces signed an agreement to prepare the submarine HMS Södermanland for lease to Poland. The lease runs from October 2026 to October 2032, with Polish operational use starting in 2028. It implements a 29 June 2026 contract between the Swedish agency and Poland’s Armament Agency and covers refurbishment, crew training, maintenance, logistics, torpedoes and support. Polish sources put its value at SEK 1.9 billion.",
"The boat will supplement ORP Orzeł, a Kilo-class submarine commissioned in 1986 and Poland’s only remaining one. Poland’s submarine force fell from five boats to one after four Kobben-class boats retired between 2017 and 2021. Thirty Polish submariners began an 18-month course in Karlskrona on 24 August, and instruction aboard Södermanland starts in October.",
"Södermanland was commissioned in 1989 as the third of four Västergötland-class boats built by Kockums. A 2000–2004 rebuild lengthened the hull by 12 metres and added two Stirling air-independent propulsion units. It displaces about 1,500 tonnes submerged, has a crew of 24 to 28, and Sweden approved SEK 470 million in 2022 for life-extension work.",
"Poland’s long-term answer is three Saab A26 submarines under a SEK 47 billion (€4.26 billion) contract, with deliveries from 2031 to 2038. Poland chose the A26 in November 2025 and is its first export customer. The lease reduces Sweden’s own fleet from four boats to three."],
cav:"The SEK 1.9 billion lease value comes from Polish sources, not an official Swedish statement. The choice between Torped 62 and Torped 63 torpedoes is unresolved, and Sweden’s own A26 programme has been revised three times, with deliveries now set for 2031 and 2033.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/sweden-signs-new-agreement-to-lease-hms-soedermanland-submarine-to-poland-until-new-a26-class-arrives"]]},

{id:"challenger-3",r:"Europe",c:"Land",st:"Reported",time:"21 Oct",
t:"Challenger 3: seven prototypes delivered, but the in-service date is still open",
s:"The Ministry of Defence confirmed the deliveries in a parliamentary answer and gave no new production timetable.",
p:["The UK has confirmed that seven Challenger 3 main battle tank prototypes have been delivered, with an eighth in the final stage of construction. In a written parliamentary answer published on 19 October, Defence Minister Luke Pollard said the vehicles are being used to check performance and safety before production begins. He gave no new schedule for series production or entry into service. The programme aims to replace Challenger 2 with 148 upgraded tanks.",
"Rheinmetall BAE Systems Land, a joint venture of Rheinmetall and BAE Systems, is developing the tank. The Ministry of Defence gave it a contract worth more than £800 million in 2021, and assembly is mainly done at Telford. The first crewed live-fire trials in the UK took place in December 2025.",
"The upgrade combines Challenger 2 parts with new systems. Rheinmetall’s 120 mm L55A1 smoothbore gun replaces the rifled L30A1 and allows NATO-standard ammunition. A redesigned turret has better sights, independent thermal imagers for commander and gunner, and automatic target tracking. Protection includes upgraded modular armour, a laser warning system and provision for Rafael’s Trophy active protection system. Engine and suspension are improved.",
"The programme has had setbacks. In June 2026 the ministry acknowledged that supply-chain delays had disrupted hardware and software for the demonstration phase and that its initial and full operating capability dates were under review. An answer on 8 September said the programme was undergoing a performance review and a renewed approval process, with progress expected in the 2026–27 financial year."],
cav:"The latest answer does not say whether the reviews are finished. With only 148 tanks planned, availability and survivability matter a great deal, and Trophy is not designed mainly against FPV drones and loitering munitions, so its value against them is unproven.",
src:[[AR,"https://www.armyrecognition.com/news/army-news/2026/uk-pushes-british-army-challenger-3-tank-closer-to-combat-with-seven-prototypes-delivered"]]},

{id:"saab-luuv",r:"Europe",c:"Underwater",st:"Reported",time:"16 Oct",
t:"Saab and Sweden finish first sea trials of a large uncrewed undersea vehicle",
s:"The LUUV demonstrator is meant to scout Baltic waters before Swedish submarines enter them and to help protect undersea infrastructure.",
p:["Saab, the Swedish Defence Materiel Administration and the Swedish Armed Forces announced on 16 October that initial sea trials of the Large Uncrewed Undersea Vehicle (LUUV) demonstrator are complete. The work is a SEK 60 million development contract awarded on 29 August 2025, not a production price. The vehicle uses Saab’s Autonomous Ocean Core software and technology from its Autonomous Ocean Drone, which is 7 m long and weighs 6.5 tonnes.",
"Its job is to scout potentially dangerous waters before Sweden’s crewed submarines go in. The preliminary requirements describe a vehicle 6.5 m long and 1.4 m wide, with a top speed of 14 km/h and an operating depth of 500 m. Planned sensors include several sonars, a multibeam echo sounder and navigation aids. The Baltic covers 377,000 km², averages 55 m deep and reaches 459 m at Landsort Deep. Damage to undersea cables and pipelines, including the 2022 Nord Stream explosions and the 2023 Balticconnector damage, is part of the reason for the programme.",
"FMV project manager Martin Nyqvist said further trials will test autonomous functions, sensors and operations in representative environments. Sweden is also studying whether LUUVs could work from its A26-class submarines, and weapons were excluded from the first phase. Sweden joined NATO on 7 March 2024, and the Baltic Sentry mission began in January 2025."],
cav:"Endurance, depth, battery capacity and sonar performance of the Swedish vehicle have not been released. No production quantity, submarine recovery qualification or service-entry date has been announced. Satellite links need the vehicle to surface and acoustic links have little bandwidth, so data may be stored and sent later.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/sweden-and-saab-complete-first-sea-trials-of-new-luuv-undersea-vehicle-to-protect-baltic-sea-infrastructure"]]},

{id:"globaleye-sweden",r:"Europe",c:"Air",st:"Reported",time:"15 Oct",
t:"Saab presents Sweden’s first GlobalEye early-warning aircraft",
s:"Aircraft 061 was shown at Linköping before ground and flight testing. NATO has since decided to buy up to ten GlobalEyes.",
p:["On 15 October Saab presented the first S 106 GlobalEye airborne early warning and control aircraft for the Swedish Air Force at its Linköping site. The aircraft, numbered 061, will go through ground and flight testing before delivery. Defence Minister Pål Jonson, Air Force chief Major General Jonas Wikman and Saab CEO Micael Johansson attended.",
"Sweden ordered two GlobalEyes in June 2022 for SEK 7.3 billion, added a third in June 2024 for SEK 2.6 billion, and holds an option on a fourth. They replace the Saab 340 ASC 890 aircraft, two of which Sweden decided in 2024 to give to Ukraine, widening its surveillance gap. Stockholm brought the programme forward in October 2024, after an original plan for two aircraft in 2027 and one in 2029.",
"The aircraft is based on the Bombardier Global 6000 and carries an Erieye ER radar with a stated instrumented range of 650 km and an endurance above 11 hours. Saab attributes a 70% gain in detection range over earlier Erieye radars. It also carries a maritime radar, signals-intelligence receivers and identification systems. The first two Swedish aircraft will get an interim configuration, and the third will be built to the final standard.",
"The wider market is moving. On 7 July 2026 NATO decided to buy up to ten GlobalEyes for eleven countries, reversing its 2023 choice of six Boeing E-7 Wedgetails. France signed for two aircraft in December 2025, a Middle Eastern customer signed in July 2026, and the Netherlands signed a letter of intent in September for one. Saab has 12 firm orders and plans to lift production from two to six aircraft a year."],
cav:"Real detection ranges depend on target size, altitude and interference. Three aircraft must cover operational sorties, maintenance and training at once. Differences between the interim and final configurations and the cost of modifications were not disclosed.",
src:[[AR,"https://www.armyrecognition.com/news/aerospace-news/2026/saab-rolls-out-swedens-first-globaleye-early-warning-aircraft-to-guard-baltic-sea-and-natos-northern-flank"]]},

{id:"germany-ghost-bat",r:"Europe",c:"Drones",st:"Reported",time:"20 Oct",
t:"Germany drops plan to buy Boeing’s MQ-28 Ghost Bat directly",
s:"Berlin has told Boeing it will not buy the Australian-developed loyal wingman as planned, pushing its combat-drone goal into the 2030s.",
p:["Germany has changed course on its tactical unmanned aircraft plans and told Boeing it will no longer buy the MQ-28 Ghost Bat autonomous aircraft directly. Politico reported the decision first, and a Boeing spokesperson confirmed it to Breaking Defense, adding that the company stands ready to support Germany on next steps. The Defense Post reported it on 20 October.",
"Germany’s procurement agency declined to give the specific reason and pointed to contracting law and parliamentary review requirements. A social media post cited in the article said Berlin had formally dropped plans to buy the aircraft directly from Australia and that the air force had wanted it by 2029.",
"The decision delays Germany’s aim of fielding its own collaborative combat aircraft by 2029, which would have made it the first European nation to deploy loyal-wingman technology. The fast-track plan was a direct government purchase of the Australian-developed aircraft, combined with a local partnership involving Rheinmetall. According to unnamed sources, operational use has moved into the early 2030s, with competitive flight tests due to start in 2027.",
"Other bidders are interested in filling the gap: German firm Helsing with its CA-1 Europa, Airbus and Kratos with the XQ-58A Valkyrie airframe, and General Atomics with its Gambit family."],
cav:"The article gives no details of the bidding process or budget, and the reasons for the reversal are not stated. It relies on Boeing’s confirmation, the agency’s statement on procedure and anonymous sources.",
src:[[DP,"https://thedefensepost.com/2026/10/20/germany-ghost-bat-boeing/"]]},


{id:"kosmos-2612",r:"Europe",c:"Space",st:"Reported",time:"19 Oct",
t:"Russian satellite Kosmos 2612 closes in on the Finnish-built ICEYE X36 radar satellite",
s:"Public tracking data suggest a pass within tens of metres on 19 October. Analysts say intent is unknown.",
p:["Russia’s Kosmos 2612 may have passed about 26 metres from ICEYE X36, a US-registered commercial radar-imaging satellite, at about 16:07 UTC on 19 October, according to public tracking data cited by The War Zone. The private firm LeoLabs could not confirm or contradict those figures but said it had high confidence the objects came within about 500 metres of each other.",
"From around 30 September Kosmos 2612 made a series of manoeuvres that matched ICEYE X36’s orbital plane and altitude. Jonathan McDowell said a manoeuvre on 16 October left it within about 5 km, and Marco Langbroek put the gap at 1 to 2 km at one point. LeoLabs and others say the two satellites are now drifting apart, with Kosmos 2612 in a larger orbit. LeoLabs called it a sophisticated rendezvous and proximity operation but said it does not establish hostile intent. McDowell called it probably the first such rendezvous in low Earth orbit in which one owner did not approve. CSIS’s Clayton Swope said the aim could range from intimidation to sabotage.",
"ICEYE X36 was launched in 2024, was built in Finland and is now registered in the US. Reports that it may be owned or leased by Ukraine are unconfirmed, though Ukraine has used ICEYE imagery for years, including for targeting. ICEYE said it is aware of the situation and tracking it closely. Kosmos 2612 is one of six satellites, Cosmos 2609 to 2614, launched on a single Soyuz-2.1b rocket in April and appears to be an “inspector” type. In 2020 Kosmos 2542 came within 150 to 300 km of the US satellite USA 245, a far larger distance."],
cav:"Distances come from public data and differ between sources. Close approaches do not prove hostile action, and attribution in space is hard.",
src:[["The War Zone","https://www.twz.com/news-features/russias-satellite-unprecedented-shadowing-of-a-very-particular-radar-imaging-satellite-is-a-big-deal"]]},

{id:"mangalia",r:"Europe",c:"Shipbuilding",st:"Company claim",time:"19 Oct",
t:"Rheinmetall and MSC to buy the Mangalia shipyard in Romania for about €138 million",
s:"The dual-use yard is meant to build four Romanian government vessels and serve as a hub for naval projects in South-Eastern Europe.",
p:["Rheinmetall, through its Naval Systems division, and the Swiss shipping company MSC have won an auction to acquire the Mangalia shipyard south of Constanța in Romania. They will pay about €138 million jointly, and the deal is expected to close in a few weeks. The stated aim is a dual-use site where civil and military shipbuilding run in parallel for domestic and international customers, with the site later divided into sectors and security zones.",
"The yard is to build four vessels ordered by the Romanian government: two 96-metre offshore patrol vessels and two 43-metre diver-support vessels. It is also intended as a hub for further military shipbuilding. Tim Wagner, CEO of Rheinmetall Naval Systems, said the company plans to expand and upgrade the yard comprehensively, including infrastructure, production conditions and capacity, and called it a potential long-term base in South-Eastern Europe.",
"Rheinmetall has operated in Romania since 2024 through Rheinmetall Automecanica in Mediaș. Naval Today links the deal to a €5.7 billion Romania–Rheinmetall agreement from June 2026 covering defence systems and naval vessels."],
cav:"The sale is not yet complete and the price is approximate. The report does not describe the yard’s current workforce, capacity or ownership history, or the other bidders, and rests on the companies’ announcement.",
src:[["Naval Today","https://www.navaltoday.com/2026/10/19/rheinmetall-to-acquire-romanian-shipyard-to-boost-naval-shipbuilding"]]},
