{"id": "pentagon-cuas-approvals", "r": "USA", "c": "Air defence", "st": "Official claim", "time": "14 Oct", "t": "Pentagon orders faster approvals for counter-drone systems", "s": "A memorandum sets a 10-day review period and asks senior officials to set an expedited timeline for validated systems.", "p": ["The US Department of Defense has issued a memorandum directing officials to speed up approvals for counter-drone systems and remove bureaucratic obstacles that delay deployment. Senior officials must set an expedited approval timeline for validated counter-unmanned-aircraft systems, which the article says would shorten a process that typically takes months to weeks or days. Reviews of pending weapons and defence systems must also be expedited, with a 10-day review period starting when the Pentagon receives the required documentation."], "cav": "The article does not define “validated”, say which systems qualify, whether the 10-day limit covers all pending systems, or what happens if a review overruns. There is no industry reaction or implementation schedule.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/14/pentagon-approvals-counter-drone-systems/"]]},
{"id": "battelle-airbase", "r": "USA", "c": "Air", "st": "Official claim", "time": "14 Oct", "t": "Battelle wins up to $111.4 million Air Force research contract on airbase resilience", "s": "The four-year work for the Air Force Civil Engineer Center will find capability gaps and test prototypes and commercial systems.", "p": ["Battelle, a Columbus, Ohio nonprofit, received a US Air Force research and development contract worth up to $111.4 million over four years, with a base period of $51.6 million. The work supports the Air Force Civil Engineer Center’s Capability Requirements Branch, which oversees airbase infrastructure and engineering research.", "Battelle will identify capability gaps and build and assess solutions, including prototypes and commercially available systems, which may involve equipment or changes to procedures. Test results will help the Air Force decide which approaches advance. The stated goal is to help airbases remain operational and recover from disruptions. Battelle also holds a separate Defense Threat Reduction Agency biodefence contract with a $52.9 million base and up to $93.3 million in total."], "cav": "The article names no technologies, airbases or disruption scenarios, does not explain how the “up to” sum depends on options, and gives no performance criteria or timeline.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/14/battelle-us-airbase-resilience/"]]},
{"id": "pdw-revenant", "r": "USA", "c": "Drones", "st": "Company claim", "time": "14 Oct", "t": "PDW and Revenant to assess Ukrainian defence technology for US production", "s": "A memorandum of understanding covers drones, counter-drone and electronic-warfare gear. Production could take place in Huntsville, Alabama.", "p": ["Performance Drone Works (PDW) and Revenant Technologies have signed a memorandum of understanding to assess Ukrainian defence technologies for possible integration and production in the United States. Initial focus areas are unmanned systems, counter-drone technology, electronic warfare equipment, sensors and critical components.", "Revenant would identify and assess technologies, coordinate with Ukrainian partners and engage US military customers. PDW would handle engineering, adaptation to US requirements, supply-chain localisation, integration and testing, and selected technologies could be built at its 90,000 sq ft Drone Factory 01 in Huntsville. PDW CEO James Slider said Revenant’s ties to Ukrainian developers would help find systems suited to US needs. Revenant also expects the deal to support its ARENA force-on-force training environment."], "cav": "No contract values, funding or production schedule were given, no Ukrainian systems are named, and further work depends on customer demand and technical readiness. The article does not address export approvals or Ukrainian government involvement.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/14/pdw-revenant-ukraine-us/"]]},
{"id": "perch-2", "r": "USA", "c": "Land", "st": "Company claim", "time": "14 Oct", "t": "PERCH 2.0 would let Abrams tanks and Strykers launch Switchblade loitering munitions", "s": "General Dynamics and AeroVironment describe a bolt-on canister launcher that needs no permanent hull modification.", "p": ["The US Army’s M1A2 Abrams tanks and Stryker 8×8 vehicles are set to gain loitering-munition options through PERCH 2.0, short for Precision Effects and Reconnaissance, Canister-Housed. General Dynamics Land Systems and AeroVironment developed it as a bolt-on launcher that requires no permanent modification to a vehicle’s hull. Crews launch Switchblade loitering munitions from beneath the vehicle’s armour, so they stay protected while doing so."], "cav": "No quantities, contract value, delivery timeline, range or payload were given, the Switchblade variant is unconfirmed, and the article does not say whether testing is complete.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/14/perch-loitering-munitions-tanks/"]]},
{"id": "army-agentic-ai", "r": "USA", "c": "Military AI", "st": "Company claim", "time": "16 Oct", "t": "US Army takes agentic AI to Europe for faster target validation", "s": "Striveworks’ Chariot Forge platform will support intelligence analysis, target validation and fire-support coordination under Task Force RAVEN.", "p": ["The US Army is expanding its use of agentic AI in Europe by deploying Striveworks’ Chariot Forge platform. Stated uses are intelligence analysis, target validation and fire-support coordination. Under Task Force RAVEN, AI agents would process and analyse military intelligence, with human review and authorisation remaining central to operational decisions, according to the article.", "Chariot Forge links AI models to military data sources and existing systems, coordinates agents, automates information flows and checks model outputs before they reach the field."], "cav": "No deployment size, number of agents, budget, accuracy data or timeline was given, and the article does not explain how human review works in practice or name the locations and partners.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/16/us-army-striveworks-agentic-ai-europe/"]]},
{"id": "trichon", "r": "USA", "c": "Drones", "st": "Company claim", "time": "16 Oct", "t": "Red Cat unveils TRICHON, a hand-launched VTOL drone for long-endurance reconnaissance", "s": "The company pitches a small, cheap-to-operate aircraft built to be produced and deployed at scale.", "p": ["Red Cat has unveiled TRICHON, a vertical take-off and landing system for intelligence, surveillance and reconnaissance, which it describes as a hand-launched, long-endurance platform pairing an electronics core with technology already used by US and allied partners. It is aimed at small uncrewed aircraft that can be produced and deployed at scale rather than harder-to-build, feature-heavy systems, with the goal of keeping operating costs down. A linked Red Cat release ties the unveiling to AUSA 2026."], "cav": "Endurance, range, payload and weight are not given, so “long-endurance” is unquantified. The cost and scale claims come without prices or production volumes, no customers or contracts are named and there is no independent assessment.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/16/red-cat-long-endurance-trichon/"]]},
{"id": "eu-edip-195m", "r": "Europe", "c": "Industry", "st": "Official claim", "time": "20 Oct", "t": "EU allocates €168 million to boost missile, drone and ammunition production", "s": "Eight projects at 17 sites in 14 EU states and Norway aim to cut reliance on non-European suppliers.", "p": ["The European Commission has allocated €168.2 million (about $195 million) to expand production of energetic materials, propulsion systems, warheads and ammunition for missiles, drones and artillery. The money comes from the Industrial Reinforcement Action pillar of the €1.5 billion European Defence Industry Programme. Eight projects, backed at 17 sites across 14 EU states and Norway, aim to cut reliance on non-European suppliers: missile and drone propulsion in Norway and the Czech Republic, warheads in France and Poland among others, explosives in Finland and Germany, and small-calibre ammunition in Sweden.", "Targets include up to 90% shorter manufacturing times and annual output of more than 20,000 tonnes of energetic materials, 3,500 propulsion systems, 200,000 loitering-munition warheads and 60 million rounds of ammunition. Separately, on 9 October the Council approved the Omnibus V package, which caps defence permit procedures at 102 working days and generally treats applications as approved if authorities miss the deadline."], "cav": "The article gives no per-project funding or timelines. The output figures are goals without independent verification, and it does not explain how deemed approval will work across national authorities or when Omnibus V takes effect.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/20/eu-missile-ammunition-production/"]]},
{"id": "varan-ugv", "r": "Europe", "c": "Land", "st": "Company claim", "time": "20 Oct", "t": "British start-up pitches the low-signature VARAN ground robot", "s": "Stratonex Defence Technologies says its modular UGV maps its surroundings passively, without emitting radar or lidar.", "p": ["Stratonex Defence Technologies, a British start-up, is pitching VARAN, a modular unmanned ground vehicle built to cross rough ground while staying hard to spot. Intended roles include counter-drone work, logistics, electronic warfare and intelligence, surveillance and reconnaissance. According to the company, VARAN maps its surroundings passively and does not emit radar or lidar signals that hostile forces could pick up."], "cav": "No speed, range, payload, endurance or terrain limits are given. It is a concept or pitch with no trials, production timeline, price or contract, and the low-signature claim is the company’s, with no explanation of how passive mapping works.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/20/british-ground-drone-low-profile/"]]},
{"id": "netherlands-ir-sale", "r": "Europe", "c": "Air", "st": "Official claim", "time": "21 Oct", "t": "US approves a potential $294 million aircraft-protection sale to the Netherlands", "s": "The package covers 16 infrared countermeasure systems and 38 radar warning receivers.", "p": ["The US State Department has approved a potential $294 million sale of aircraft defensive systems and support to the Netherlands. The package includes 16 OT-228/U Common Infrared Countermeasure systems, which protect aircraft from heat-seeking missiles, and 38 AN/APR-39E(V)2 radar warning receivers, which alert crews to radar threats. Support covers technical assistance, engineering, training, transport and logistics. Northrop Grumman’s Rolling Meadows, Illinois, operation would be the principal contractor.", "The article adds that Kongsberg signed a roughly $155 million contract to expand the Dutch CITADEL air-defence programme, and that the Netherlands signed a letter of intent with Sweden in September to acquire a Saab GlobalEye aircraft."], "cav": "This is a potential sale, not a signed contract. No delivery timeline, cost split, aircraft types to be fitted or Dutch government response is given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/21/us-aircraft-defense-sale-netherlands/"]]},
{"id": "mbda-remote-carrier", "r": "Europe", "c": "Drones", "st": "Company claim", "time": "8 Oct", "t": "MBDA clears preliminary design review for the FCAS Remote Carrier Compact drone", "s": "France, Germany and Spain are developing the collaborative combat drone, with a first flight planned for 2029.", "p": ["MBDA has passed a preliminary design review for the Remote Carrier Compact demonstrator, a collaborative combat drone being developed by France, Germany and Spain. MBDA France and Germany lead the work with Spanish partner SATNUS under the Next Generation Weapon System programme, which is part of the wider European Future Combat Air System. Military pilots and representatives from all three countries reviewed the design at meetings in Spain, France and Germany. Completed work includes mock-ups, a digital twin, ground testing, wind-tunnel tests and simulations.", "The first flight is planned for 2029, although MBDA says the programme is on track for a first flight soon. The drone is meant to escort, reconnoitre and engage high-value targets while accompanying fighters, drones, weapons and crewed platforms rather than acting alone."], "cav": "The article gives no cost, funding or production figures, no performance specifications, and no results from the wind-tunnel and simulation work.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/08/mbda-fcas-drone-design-review/"]]},
{"id": "navantia-croatia", "r": "Europe", "c": "Naval", "st": "Reported", "time": "7 Oct", "t": "Navantia teams up with Croatian firms for the Croatian Navy’s corvette competition", "s": "Croatia wants two multi-role corvettes worth up to €1.6 billion, and Spain, France, Italy and South Korea are competing.", "p": ["Spain’s Navantia has signed agreements with the Croatian firms AITAC and Iskra Shipyard covering possible joint engineering, shipbuilding and lifecycle support for the Croatian Navy’s Multi-Role Corvette programme. They were signed at a defence and security convention in Šibenik. Croatia wants two modern surface combatants valued at up to €1.6 billion.", "AITAC would add digital engineering and logistics expertise, and Iskra would provide capacity and local assembly and testing at the 3. Maj shipyard in Rijeka, which it recently acquired. Navantia faces competition from France’s Naval Group, Italy’s Fincantieri and South Korea’s HD Hyundai Heavy Industries, which have also signed teaming agreements with Croatian partners. Earlier reports say the corvettes may carry anti-submarine torpedoes, anti-ship missiles and air-defence missiles and work mainly in the Adriatic."], "cav": "Croatia has not chosen a bidder or announced a decision date. The weapons list comes from unnamed earlier reports, financial terms and work shares are not given, and €1.6 billion is an upper valuation, not a contract price.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/07/croatia-corvette-spain/"]]},
{"id": "mikroglob-1", "r": "Europe", "c": "Space", "st": "Company claim", "time": "7 Oct", "t": "Poland’s Mikroglob-1 reconnaissance satellite returns its first images", "s": "Creotech released sample pictures taken during acceptance testing. It is the first of four satellites for the Polish armed forces.", "p": ["Creotech Instruments has released the first Earth-observation images from Mikroglob-1, the first of four reconnaissance satellites for Poland’s armed forces. The satellite was launched in July and the images were captured during acceptance testing. Samples include Los Angeles International Airport, a 24 km metro stretch with a refinery complex, New Orleans airport and the Mississippi River in visible and near-infrared, and the port and shipyard at Dalian in China in a panchromatic band covering about 5.3 × 7.4 km.", "Creotech is building the system for Poland’s defence procurement agency on its HyperSat platform. The Mikroglob satellites complement two higher-resolution Airbus Defence and Space satellites ordered in 2022 and due to launch in 2027."], "cav": "The satellite has not yet reached its intended orbit and its imaging and pointing calibration is incomplete, so target performance is unconfirmed. No image resolution, handover date or constellation launch schedule was given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/07/poland-mikroglob-satellite-first-images/"]]},
{"id": "rheinmetall-skoppum", "r": "Europe", "c": "Industry", "st": "Company claim", "time": "6 Oct", "t": "Rheinmetall opens a new electro-optics and fire-control site in Norway", "s": "The 4,579 m² Skoppum facility under a 15-year lease can hold more than 120 specialists.", "p": ["Rheinmetall Nordic has opened a new site in Skoppum, Norway, to expand development, production and systems integration. It covers 4,579 m² under a 15-year lease, can hold more than 120 specialists and can later be expanded to 5,000 m². The site brings together electro-optics, fire control, situational awareness and weapon accessories, and supports mortar and autonomous land systems under the Digital Systems division.", "Rheinmetall Nordic has worked with Norway’s defence sector for more than seven decades and bought Nøtterøy-based Simrad Optronics in 2010. Norway’s 12-year defence plan to 2036 totals about 1.624 trillion NOK ($169 billion), plus an extra 115 billion NOK. CEO Morten Kjørum called the site a major investment aimed at capacity, innovation and customer support."], "cav": "The cost of the facility is not disclosed, no customers or contracts are named, and it is unclear whether the specialists are new hires and when the site reaches full capacity.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/06/norway-defense-manufacturing-rheinmetall/"]]},
{"id": "fdi-sweden-steel", "r": "Europe", "c": "Naval", "st": "Company claim", "time": "6 Oct", "t": "Naval Group starts building Sweden’s first FDI frigate", "s": "HMS Luleå is due in 2030 under a 47 billion kronor contract for four ships.", "p": ["Naval Group has begun construction of the first FDI frigate for the Royal Swedish Navy at Lorient in France, following a 47 billion kronor (about $4.6 billion) contract signed about a month earlier for four multirole ships. The lead ship, HMS Luleå, is due in 2030 and Norrköping, Trelleborg and Halmstad are expected between 2032 and 2034. Sweden is the third NATO member to buy the FDI after France and Greece, bringing the programme to 13 ships, and the assembly line can deliver two frigates a year.", "The ships are 122 m long with an 18 m beam and a crew of more than 125. Twin MTU engines give a top speed of 26 knots and a 5,000-nautical-mile range, with 45 days of endurance. The Swedish version will use Saab torpedoes, RBS15 anti-ship missiles, Bofors naval guns and Aster 30 and CAMM-ER air-defence missiles."], "cav": "The article does not say what the contract covers beyond the four ships, gives no details of the planned partnership with Swedish suppliers, and does not discuss schedule risk for the 2030 delivery or weapons integration.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/06/sweden-fdi-frigate-france/"]]},
{"id": "poland-exercise-ukraine-force", "w": "Ukraine", "c": "Land", "st": "Reported", "time": "20 Oct", "t": "British, French and German troops to rehearse a post-war force for Ukraine in Poland", "s": "At least 1,500 troops will join Polish forces in November, according to The Times, to practise moving and sustaining a multinational force.", "p": ["At least 1,500 British, French and German troops will join Polish forces for exercises in Poland in November, The Times reported, as cited by The Defense Post. The drills will rehearse establishing a multinational force in Ukraine, including moving personnel and supplies and sustaining them with food and fuel. A British defence source described several countries operating together in a shared area, and a senior Polish official said the exercises also show European unity and continued support for Ukraine.", "The UK- and France-led Coalition of the Willing is planning security guarantees for Kyiv, including a possible deployment to uphold a future ceasefire with Moscow. Vladimir Putin has warned that Western forces in Ukraine would be legitimate targets. In June Latvian intelligence suggested Moscow could prepare a military provocation against the Baltic states or Poland, judging Russia unable to open a second front but capable of hybrid operations or limited missile and drone strikes."], "cav": "The deployment depends on a ceasefire that has not been reached, so the mission remains hypothetical. The scenario, unit contributions and locations are undisclosed, the Polish official is unnamed, and the Latvian assessment dates from June.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/20/europea-forces-train-poland-ukraine/"]]},
{"id": "trophylab", "w": "Ukraine", "c": "Land", "st": "Official claim", "time": "20 Oct", "t": "389 foreign arms makers apply for access to Ukraine’s captured-weapons platform", "s": "TrophyLab lets vetted companies study Russian equipment, and the UK will be the first partner in the Avengers Labs AI platform.", "p": ["Ukraine’s Defence Ministry has received applications from 389 foreign defence manufacturers seeking access to TrophyLab, a platform on captured Russian weapons. Applicants must pass checks on Russia links, sanctions and other eligibility rules. Approved users can browse a catalogue of captured equipment, read technical assessments online and request full samples or individual components for independent study. The database combines material from the armed forces, military intelligence, the Security Service and research institutions, and Kyiv says it should help researchers share findings and develop countermeasures.", "Separately, the UK is to be the first international partner in Avengers Labs, an AI training and testing platform for unmanned systems that holds more than 5 million annotated battlefield frames, mostly collected through Ukraine’s DELTA combat system. Up to 12 UK companies will be picked in a competition led by the UK Defence Ministry’s Rapid AI Delivery task force; they can run models in a secure environment but cannot download or directly access the dataset."], "cav": "The article does not say how many applications were approved or rejected, how sanctions checks work, how physical samples are transferred and controlled, or when the Avengers Labs selection will happen.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/20/foreign-defense-ukraine-captured-weapons/"]]},
{"id": "nato-black-sea", "w": "Ukraine", "c": "Naval", "st": "Reported", "time": "21 Oct", "t": "NATO reinforces the Black Sea after drone attacks on merchant ships near Romania and Bulgaria", "s": "More patrol aircraft, radars and drones are being sent. Analysts cited by Reuters suspect Russia, which has not acknowledged responsibility.", "p": ["NATO will send more maritime patrol aircraft, radar systems and drones to the Black Sea after deadly attacks on commercial shipping near Romania and Bulgaria, The Defense Post reported. The North Atlantic Council discussed the issue in Brussels. Military spokesperson Col. Martin O’Donnell said intelligence personnel and specialist teams will examine explosive remnants, with some deployments already under way, and spokesperson Allison Hart said the measures build on earlier eastern-flank efforts, including counter-drone defences.", "On 14 and 15 October the Comoros-flagged tanker Yara J caught fire after its crew reported a drone strike, and the next evening the San Marino-flagged chemical tanker Wine Trader caught fire near Sulina with seven sailors reported missing. Earlier in October three drones hit the Maltese-flagged, Ukrainian-owned Chelsea 3 off Byala in Bulgaria, and another vessel sank off Krapets with 11 reported missing. Military analysts cited by Reuters say Russia is the likely perpetrator; Moscow has not acknowledged responsibility."], "cav": "Russia’s responsibility is an analytical assessment, not a confirmed finding, and Romania’s defence minister said the cause of the Yara J fire had not been established. No numbers, aircraft types or timeline for the reinforcements were given, and missing-crew figures may be preliminary.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/21/nato-black-sea-presence/"]]},
{"id": "latvia-barracuda", "r": "Europe", "c": "Missiles", "st": "Official claim", "time": "28 Sep", "t": "Latvia says it intends to buy Anduril’s Barracuda cruise missiles", "s": "President Rinkēvičs announced the plan after visiting Anduril in California.", "p": ["Latvia has announced its intent to buy the Barracuda family of jet-powered cruise missiles from Anduril Industries. President Edgars Rinkēvičs announced the plan after visiting Anduril in California and meeting founder Palmer Luckey, and said he looked forward to complete acquisition of the missiles. Barracuda is subsonic and comes in surface- and air-launched versions, with warheads over 100 lb (45 kg), a stated range above 500 nautical miles (926 km) and speeds up to 500 knots.", "A Latvian firm, Origin Robotics, signed a separate deal with Anduril to integrate Lattice software into its BLAZE autonomous drone interceptor for counter-drone testing. The article ties the move to a push by European NATO members for mobile ground-launched weapons and anti-drone systems."], "cav": "No variant, quantity, cost or delivery timeline was given and an intention is not a signed contract. The performance figures and the claim of expanded eastern-flank strike capability are unsourced.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/28/latvia-barracuda-anduril/"]]},
{"id": "italy-mbt", "r": "Europe", "c": "Land", "st": "Reported", "time": "29 Sep", "t": "Italy launches a €5.1 billion procurement for a new main battle tank", "s": "The Panther KF51-based tank and a Lynx-based infantry vehicle are being developed by the Leonardo–Rheinmetall joint venture.", "p": ["Italy’s Defence Ministry has launched a €5.14 billion ($5.84 billion) procurement for a new main battle tank and derivative vehicles. Leonardo Rheinmetall Military Vehicles, a 50:50 joint venture formed in 2024, is developing the Panther KF51-based tank to replace the ageing Ariete fleet and the Lynx-based Army Armoured Combat System to replace the Dardo. Italian media reported that about 60% of the work will be done in Italy.", "The broader programme covers 272 tanks and about 1,050 tracked infantry vehicles, worth an estimated €23.2 billion through 2040. The Panther is 10 m long with a 130 mm smoothbore gun, a 1,100 hp engine, up to 70 km/h and about 500 km range; the Lynx is an 8 m tracked vehicle with a 30 or 35 mm autocannon."], "cav": "This is a procurement launch, not a contract award. The split of the €5.14 billion, a delivery timeline and the official basis of the 60% Italian-work figure are not given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/29/italy-panther-tanks/"]]},
{"id": "apollo-laser", "r": "Europe", "c": "Lasers", "st": "Company claim", "time": "29 Sep", "t": "Netherlands and EOS agree to develop the 100 kW Apollo counter-drone laser further", "s": "A letter of intent aims to turn the prototype into a full weapon and possibly move production to the Netherlands.", "p": ["The Dutch Defence Ministry has signed a letter of intent with Australia’s EOS to turn the Apollo laser prototype into a fully operational weapon and to explore domestic production. The Netherlands bought the system in 2025 for €71.4 million, EOS’s first export order, with deliveries scheduled for 2025–2028.", "Apollo turns electricity into a 100 kW beam to destroy or disable Group 1–3 drones. EOS says an internal magazine supports more than 200 kills, a shot costs under $1 and it can destroy 20 drones a minute. It fits in a 6 m ISO container and can be operational in under two hours. Production might move to the Netherlands, which would become EOS’s European headquarters."], "cav": "A letter of intent is not a binding contract and gives no total cost, order size or timeline. The cost-per-shot, kill-rate and magazine figures are unverified, and the production site is only under investigation.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/29/apollo-counter-drone-laser/"]]},
{"id": "excalibur-torpedo", "r": "Europe", "c": "Underwater", "st": "Official claim", "time": "29 Sep", "t": "British drone submarine fires a US Mk 48 torpedo in a first", "s": "The XV Excalibur launched the 3,700 lb heavyweight torpedo during Project Broadsword trials off Scotland.", "p": ["The US Navy and Royal Navy fired a Mk 48 heavyweight torpedo, which can be used against submarines and surface ships, from the experimental extra-large uncrewed underwater vehicle XV Excalibur. The torpedo weighs 3,700 lb (1,678 kg) and the 12 m drone submarine launched it at the British Underwater Test and Evaluation Centre off Scotland as part of Project Broadsword. Officials said the test validated the mechanical, electrical and software integration needed to deploy the weapon from a British autonomous underwater vehicle. A caption says Excalibur is expected to join the Atlantic Bastion programme."], "cav": "The article does not report whether the torpedo ran correctly or hit a target, gives no fielding timeline for Excalibur, and the “historic first” framing is the publication’s.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/29/uk-drone-submarine-us-torpedo/"]]},
{"id": "rift-chapsvision", "r": "Europe", "c": "Drones", "st": "Company claim", "time": "29 Sep", "t": "French firms Rift and ChapsVision team up on a signals-intelligence drone fleet", "s": "The partnership would fuse aerial imagery with signals intelligence on long-range VTOL aircraft.", "p": ["French firms Rift and ChapsVision have formed a strategic partnership to integrate communications signals intelligence into a sovereign fleet of long-range uncrewed aircraft. ChapsVision will supply signal monitoring, sensing and analysis hardware for Rift’s existing VTOL aircraft. The system is designed to fuse aerial imagery with signals intelligence and send real-time automated alerts to command-and-control systems, for security agencies, border authorities and critical-infrastructure operators."], "cav": "No contract value, order size or delivery timeline, no aircraft models or range, and no explanation of what “sovereign” means in practice or how oversight of intercepted communications would work.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/29/france-drone-intel-ops/"]]},
{"id": "eu-pcis", "r": "Europe", "c": "Industry", "st": "Official claim", "time": "29 Sep", "t": "EU states approve the first five European Defence Projects of Common Interest", "s": "Drones, maritime and seabed defence, space, air defence and an Eastern Flank Watch share €325 million of initial funding.", "p": ["EU member states have approved the first five European Defence Projects of Common Interest, a framework for countries to develop major military capabilities together. They cover drones and counter-drone (European Resolve), integrated maritime and seabed defence, space (including missile-launch warning satellites and rapid satellite replacement), EU federated integrated air and missile defence, and Eastern Flank Watch covering land, air, sea and cyber threats on the eastern border.", "The Commission has set aside €325 million of the €1.5 billion European Defence Industry Programme to establish and initially deploy the projects. On average 18 member states take part in each, Ukraine is involved in four of the five and Norway can join the framework."], "cav": "The article is unclear on whether approval is complete, does not say where funding beyond the current period will come from, and gives no milestones, per-project budgets or details of Ukraine’s and Norway’s roles.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/29/eu-joint-defense-projects/"]]},
{"id": "hawk-grounded", "r": "Europe", "c": "Air", "st": "Reported", "time": "28 Sep", "t": "RAF grounds its Hawk trainers after a crash in Wales", "s": "A Hawk T2 crashed near RAF Valley on 23 September. Both crew ejected with minor injuries.", "p": ["The Royal Air Force temporarily grounded all Hawk T1 and T2 operations after a Hawk T2 crashed into open fields near RAF Valley on Anglesey on 23 September, narrowly missing homes. Eyewitnesses and video reportedly showed flames from the rear during the take-off roll followed by unusual pitch movements. The trainee and a senior instructor ejected and are expected to recover fully. Station commander Group Capt. Gez Currie said the pilot aimed for open field to avoid built-up areas.", "The pause affects fighter-pilot training and the Red Arrows, who fly the T1. Unnamed sources linked the accident to reliability concerns with the fleet’s engines and support systems. London issued a request for information in August as a first step towards replacing both variants, and BAE Systems is supporting the investigation."], "cav": "The cause is unknown and the investigation is continuing. No end date for the grounding is given, and the reliability concerns come from unnamed sources and are not confirmed by the RAF or BAE.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/28/uk-grounds-hawk-jet/"]]},
{"id": "canada-globaleye", "r": "USA", "c": "Air", "st": "Company claim", "time": "28 Sep", "t": "Canada and Saab sign a framework for talks on six GlobalEye aircraft", "s": "Ottawa has not yet placed an order. The aircraft are wanted for Arctic surveillance and NORAD and NATO operations.", "p": ["Saab and Canada’s Defence Investment Agency have signed a preliminary agreement to negotiate the purchase of six GlobalEye airborne early warning and control aircraft for the Royal Canadian Air Force, following Canada’s May decision to name Saab its preferred supplier. The package would include associated systems, training and support. Canada wants long-range threat detection and response coordination, especially across the Arctic, and the aircraft would also support NORAD and NATO.", "GlobalEye is built on the Canadian-made Bombardier Global 6500, and Canadian firms could take part in production, mission-system integration and technology work; Saab has partnered with CAE on training and simulation. Saab says the aircraft can stay airborne for more than 12 hours, and its Erieye Extended Range radar has a 650 km instrumented range and can detect low-flying threats beyond 400 km at 10,700 m."], "cav": "No price, contract value or delivery timeline, and the final configuration depends on negotiations that have not started. The performance claims are Saab’s and unverified.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/28/canada-saab-talks-globaleye/"]]},
{"id": "s83-aip", "r": "Europe", "c": "Submarines", "st": "Company claim", "time": "28 Sep", "t": "Navantia completes air-independent propulsion tests for Spain’s S-83 submarine", "s": "The 12 m, 400-tonne section proved it can recharge batteries while submerged. S-83 will be the first S-80 to enter service with AIP.", "p": ["Navantia has finished tests of the air-independent propulsion (AIP) system installed in a section of Cosme García (S-83), the third of Spain’s four S-80 submarines. The tested section is about 12 m long and weighs 400 tonnes and remains separate from the rest of the boat at Cartagena. Since June engineers have tested it in its planned position using a facility that simulates depth and speed, and the trials showed it can generate electricity to recharge the batteries while submerged.", "The system uses bioethanol and liquid oxygen to make hydrogen on demand, which a fuel cell converts to power. Isaac Peral (S-81) is already in service and Narciso Monturiol (S-82) is in trials. Navantia says AIP will let S-80 submarines stay submerged for weeks, against a few days for lead-acid-only conventional boats."], "cav": "The “weeks” figure is Navantia’s claim with no test data or power output. Further acceptance trials follow launch but no launch or service-entry date is given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/28/navantia-propulsion-tests-submarine/"]]},
{"id": "agamemnon-trials", "r": "Europe", "c": "Submarines", "st": "Reported", "time": "28 Sep", "t": "Sixth Astute-class submarine HMS Agamemnon begins sea trials", "s": "The 97 m nuclear attack boat left Barrow-in-Furness for the Irish Sea and will later move to Clyde.", "p": ["HMS Agamemnon (S124), the Royal Navy’s sixth Astute-class submarine, has sailed for its first open-water sea trials. The 97 m nuclear-powered attack submarine was launched in October 2024, commissioned in September 2025 and made its maiden dive in October 2025. It left BAE Systems’ Barrow-in-Furness yard through the Walney Channel into the Irish Sea and will go to HM Naval Base Clyde after trials and training.", "Its roles include protecting the UK’s nuclear-deterrent submarines and long-range strike with Tomahawk missiles and Spearfish torpedoes. BAE has delivered five of seven Astute boats, the last, HMS Achilles, is in advanced construction, and SSN-AUKUS will eventually replace the class. First Sea Lord Gwyn Jenkins said the boat will be important to UK security and NATO’s shared defence."], "cav": "No trial duration or arrival date at Clyde was given. The report relies on BAE and Royal Navy statements with no independent verification or detailed capability data.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/28/hms-agamemnon-sea-trials/"]]},
{"id": "jaguar-r3", "r": "Europe", "c": "Land", "st": "Official claim", "time": "25 Sep", "t": "French Army receives its first R3-standard Jaguar reconnaissance vehicles", "s": "Nearly 25 vehicles had been delivered or retrofitted by September. KNDS plans to bring all earlier Jaguars to R3 by the end of 2027.", "p": ["The French Army has received its first R3-standard Jaguar reconnaissance and combat vehicles from KNDS France, with nearly 25 vehicles delivered or retrofitted as of September 2026. The procurement agency DGA certified the R3 standard on 8 April and the army authorised operational use on 20 July. The programme supports the SCORPION modernisation, more R3 deliveries and retrofits are planned through year-end, and KNDS says all earlier R2 Jaguars will be upgraded by the end of 2027.", "The Jaguar is a 25-tonne 6×6 vehicle replacing the AMX-10RC. Its T40 turret pairs a 40 mm cannon with Akeron MP anti-tank missiles with a stated engagement range up to 4,000 m. R3 adds new sensors, effectors and a better human-machine interface and can redirect missiles in flight. KNDS France, Arquus and Thales build it, and Belgium and Luxembourg have also selected it."], "cav": "“Nearly 25” is approximate and not split between new builds and retrofits. No contract value or total French order is given, and the 4,000 m range has no stated test conditions.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/france-r3-jaguar-knds/"]]},
{"id": "ddx-destroyer", "r": "Europe", "c": "Naval", "st": "Reported", "time": "25 Sep", "t": "Fincantieri–Leonardo venture wins €3.7 billion Italian Navy DDX destroyer contract", "s": "Orizzonte Sistemi Navali will build two 13,500-tonne ships, due in 2033 and 2035.", "p": ["Orizzonte Sistemi Navali, a Fincantieri–Leonardo joint venture, has won a €3.7 billion OCCAR contract for two DDX destroyers, about €1.3 billion of it in options. The scope covers development, production, logistics studies and initial in-service support. Fincantieri is platform integrator and Leonardo designs the combat system, and sub-supply contracts of about €1.8 billion for Fincantieri and €1.7 billion for Leonardo are expected in the coming weeks.", "The first ship is due in 2033 and the second in 2035. Each is 180 m long, displaces 13,500 tonnes and has a range over 4,000 nautical miles, with a SADOC 5 C5I S-band radar, an MBDA weapon system and an Elt Group electronic warfare suite."], "cav": "It is not stated whether the €1.3 billion in options will be exercised, the sub-supply contracts are still to come, and delivery risk is not discussed.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/fincantieri-leonardo-ddx-destroyer-occar/"]]},
{"id": "greece-fremm", "r": "Europe", "c": "Naval", "st": "Official claim", "time": "25 Sep", "t": "Greece and Italy sign the transfer of two FREMM frigates", "s": "Carlo Bergamini and Virginio Fasan move to the Hellenic Navy in 2028 and 2029.", "p": ["Greece and Italy have signed an agreement to transfer two Italian Navy FREMM frigates, Carlo Bergamini (F-590) and Virginio Fasan (F-591), to the Hellenic Navy, formalising a deal outlined in 2025. Bergamini is due to transfer in the first half of 2028 and Fasan in the first half of 2029. The contract includes initial and follow-on support, Greek shipyards will take part in maintenance and integrating new systems, and Fincantieri, which built the ships, will support the transfer and lifecycle.", "The deal follows a September 2025 memorandum in La Spezia that also included an option for two more vessels. It sits within a wider Greek naval programme that includes four French-built FDI frigates and MEKO upgrades."], "cav": "The article says financial terms are set but gives no price. The option for two more ships is unconfirmed, and it does not say which systems Greek yards will integrate or how Italy covers the capability gap.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/greece-italy-fremm-frigates-2/"]]},
{"id": "us-estonia-rotation", "r": "Europe", "c": "Land", "st": "Reported", "time": "25 Sep", "t": "US to resume full troop rotations in Estonia from November", "s": "A new unit arrives after a pause during a US force review. Estonia says it will cover hosting costs if needed.", "p": ["A new US military unit will arrive in Estonia in November, ending a pause in rotations. The US Army’s 6th Squadron, 9th Cavalry Regiment finished its rotation earlier this year and its replacement was suspended during a US force review, while a smaller American contingent stayed at Camp Reedo. Estonia’s Defence Ministry has not said how many troops will arrive; the article says the arrival will restore the rotational presence to roughly its pre-pause level.", "Foreign Minister Margus Tsahkna said Tallinn argued for a continued US presence in the Baltic states and Poland and would cover hosting costs if needed. Estonia plans to spend 5.4% of GDP on defence this year, and Lithuanian President Gitanas Nausėda said another American unit is on its way to Lithuania."], "cav": "No troop numbers or unit identity for the November deployment, nothing on the conclusions of the US force review, and no detail on the Latvian intelligence warning the article cites from June.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/us-troop-rotations-estonia/"]]},
{"id": "diehl-flanq", "r": "Europe", "c": "Naval", "st": "Company claim", "time": "25 Sep", "t": "Diehl Defence and FLANQ team up on uncrewed sea platforms", "s": "A memorandum of understanding targets surveillance, mine countermeasures and strike roles.", "p": ["Germany’s Diehl Defence and FLANQ have signed a memorandum of understanding to combine their autonomous maritime expertise. The partnership targets uncrewed surface and underwater platforms that can carry sensors and effectors for naval missions, including area surveillance, minesweeping and strike. The companies intend to upgrade existing systems and adapt them for new maritime roles."], "cav": "No timeline, funding or contract value, and a memorandum does not commit either firm to production. No platforms, specifications or allied customers are named, and the work split and plans for prototypes are not described.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/diehl-flanq-sea-drones/"]]},
{"id": "av-thundertiger-mou", "r": "Far East", "c": "Drones", "st": "Company claim", "time": "16 Oct", "t": "AeroVironment and Thunder Tiger explore Switchblade launchers on Taiwanese drone boats", "s": "The memorandum signed at AUSA covers unmanned boats, ground vehicles and joint drone production in Taiwan.", "p": ["AeroVironment and Taiwan’s Thunder Tiger signed a memorandum of understanding at the Association of the US Army exhibition in Washington. The companies will explore mounting Switchblade loitering munitions on unmanned boats and ground vehicles, and joint drone production and technology development in Taiwan. One proposal is a Thunder Tiger unmanned surface vessel carrying a launcher with several Switchblade rounds, which AeroVironment says would add launch options on land and at sea.", "The next steps are to assess whether the systems work together and to consider demonstrations. The article notes that President Lai Ching-te inaugurated the Minxiong aerospace and drone campus at the National Chung-Shan Institute of Science and Technology last month, designed to host 100 companies."], "cav": "A memorandum is exploratory: there is no contract value, production volume, timeline or approval status. The article does not say how the deal would meet Taipei’s aim of avoiding Chinese-sourced parts or address US export approval.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/16/aerovironment-taiwan-switchblade-drone/"]]},
{"id": "korea-ai-staff-officer", "r": "Far East", "c": "Military AI", "st": "Company claim", "time": "16 Oct", "t": "South Korea puts an AI “staff officer” aboard a Pohang-class corvette", "s": "MakinaRocks’ on-device assistant lets crew look up equipment procedures and manuals without searching documents by hand.", "p": ["South Korea has deployed an on-device AI “staff officer” aboard the Pohang-class warship ROKS Pohang. MakinaRocks, a South Korean physical-AI company, developed the system, which works as a digital reference assistant that lets crew check equipment procedures and consult manuals and guidelines. The project targets information gaps caused by shrinking military manpower and warships that carry hundreds of pieces of equipment."], "cav": "No accuracy, speed or usability results are given. The article does not say how long the deployment runs, whether it will spread to other ships, how classified manuals are handled or how wrong answers are caught, and it relies on the developer’s announcement.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/16/south-korea-ai-officer/"]]},
{"id": "korea-hgv", "r": "Far East", "c": "Missiles", "st": "Reported", "time": "15 Oct", "t": "South Korea reportedly flies its first homegrown hypersonic glide vehicle", "s": "The vehicle reportedly separated from its booster, manoeuvred horizontally and vertically and hit its mark.", "p": ["South Korea has reportedly flown its first homegrown hypersonic glide vehicle. According to the report, the vehicle separated from its booster and flew a planned path at high speed, including at lower altitudes. On the way to a designated target it performed horizontal and vertical manoeuvres and reportedly hit its mark precisely. The article describes the test as pushing the country a step closer to reinforcing its defence capabilities, and links to a longer version on NextGen Defense."], "cav": "It relies on “reportedly” phrasing with no official statement cited. No speed, range, altitude, date or location is given, and nothing is said about production, deployment or which units would operate it.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/15/south-korea-hypersonic-glide-vehicle/"]]},
{"id": "taiwan-mp-overhaul", "r": "Far East", "c": "Land", "st": "Reported", "time": "12 Oct", "t": "Taiwan plans to double its Military Police Command to defend Taipei in wartime", "s": "The force would grow from 5,600 to 11,000 and shift from policing to motorised infantry against “decapitation strikes”.", "p": ["Taiwan plans to expand its Military Police Command from 5,600 to 11,000 troops under a five-year force-structure plan. Its role is shifting from policing to combat, focused on defending the Greater Taipei area against Chinese decapitation strikes. It would become a motorised infantry force guarding government buildings, bridges and power stations in the capital and work with the 66th Marine Brigade and the Army’s Guandu Area Command; dedicated air-defence and drone units have been created.", "Planned weapons include the US-made M-ACE counter-drone vehicle with 30 mm chain guns, Stinger and Javelin missiles and T112 rifles with smart optics. A draft budget allots NT$140 million (about $4.3 million) for vehicle maintenance and anti-armour integration, and funding also covers an armoured presidential command vehicle disguised as a civilian car with anti-jamming satellite communications."], "cav": "The NT$140 million figure comes from a draft budget, so final amounts are unconfirmed. The article gives no phasing timeline and does not explain the threat assessment behind the decapitation concern or coordination with civilian police.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/12/taiwan-military-police-overhaul/"]]},
{"id": "thales-japan-base", "r": "Far East", "c": "Industry", "st": "Reported", "time": "12 Oct", "t": "Thales plans a maintenance and support base in Japan", "s": "CEO Patrice Caine told the Japan Times it would be the first such base set up by a foreign defence firm.", "p": ["Thales plans a base in Japan to maintain and support equipment used by the Self-Defense Forces, according to the Japan Times. The report says it would be the first dedicated maintenance and operational support base established in Japan by a foreign defence company. Chairman and CEO Patrice Caine outlined the plans in a local interview, and the base could later extend to civilian uses.", "Technology will transfer to partner Japan Steel Works, with Japanese production of the 2R2M heavy mortar due to start in 2027. Caine named radar and sonar as possible areas of cooperation. Other recent Thales moves include a connectivity lab in Ballerup, Denmark, and a September agreement with Kalyani Strategic Systems in India for 70 mm rocket production, with first local assembly targeted for early 2027."], "cav": "No investment figure, site or opening date. The details rest on a second-hand Japan Times report and one interview with no official confirmation, and the civilian applications are not specified.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/12/thales-defense-equipment-japan/"]]},
{"id": "paf-s70i-trainers", "r": "Far East", "c": "Helicopters", "st": "Company claim", "time": "12 Oct", "t": "Philippine Air Force to get Black Hawk simulator and maintenance trainer", "s": "Lockheed Martin’s first S-70i training order includes courseware and support through 2032.", "p": ["The Philippine Air Force is set to receive S-70i Black Hawk training devices and services from Lockheed Martin under a signed Direct Commercial Sale contract. The package includes a full flight simulator that digitally mirrors the aircraft and a virtual maintenance trainer with 3D models of airframe subsystems, with courseware, sustainment and spares through 2032. It is Lockheed Martin’s first order for S-70i training devices, and until in-country training starts PAF pilots will keep training at the Sikorsky Training Academy in the US.", "Manila received the final batch of its 32-unit 2022 order in August 2026; with 15 S-70i helicopters already in service, the PAF has 47, which the article says makes the Philippines the largest S-70i operator in the world. The Black Hawks are used for troop transport, search and rescue and humanitarian aid."], "cav": "The contract value and delivery timeline are not disclosed, and the “largest operator” claim is not independently verified.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/12/paf-black-hawk-simulator-training/"]]},
{"id": "minxiong-campus", "r": "Far East", "c": "Drones", "st": "Official claim", "time": "1 Oct", "t": "Taiwan opens the Minxiong drone campus to build a supply chain free of Chinese parts", "s": "The campus at NCSIST is designed to host 100 companies and took more than three years to build.", "p": ["Taiwan has launched an aerospace and drone industrial campus named Minxiong, with an opening ceremony on 28 September. President Lai Ching-te led the ceremony at the state-run National Chung-Shan Institute of Science and Technology, described as the country’s leading developer of missiles and military drones. The campus is designed to host 100 companies and to build a supply chain without Chinese components. Construction took more than three years, and facilities include research sites, hangars and testing labs covering drone development from design to airframe assembly."], "cav": "The article does not say how many of the 100 target companies have committed, how “free of Chinese components” is defined or verified, or what the campus cost.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/01/taiwan-drone-campus/"]]},
{"id": "thai-little-bird", "r": "Far East", "c": "Helicopters", "st": "Reported", "time": "30 Sep", "t": "Thailand takes eight AH-6i Little Bird helicopters, the last of a line Boeing may close", "s": "The delivery comes under a $400 million US package approved in 2019. Thailand wants 31 armed scouts in total.", "p": ["The Royal Thai Army has received eight Boeing AH-6i Little Bird light attack and reconnaissance helicopters at Kerry Siam Seaport. The deal is part of a $400 million foreign military sales package the US State Department approved in 2019, covering spares, training, AGM-114R Hellfire missiles, APKWS guided rockets, M134 mini guns, launchers and support equipment. The AH-6i is meant to replace seven Bell AH-1F Cobras, of which only three are operational.", "Thailand is the second international AH-6i operator after the Saudi Arabian National Guard and seeks 31 armed reconnaissance helicopters in total, though more purchases depend on budget approval. Boeing plans to close the AH-6i line at Mesa, Arizona, after this order unless new contracts arrive; Janes attributes this to few orders and limited export sales over nearly two decades."], "cav": "The delivery report comes from Vietnam’s state news agency and is not independently verified. The article does not give a commissioning date or say how the remaining helicopters would be funded.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/30/thailand-little-bird-helicopters/"]]},
{"id": "japan-humanoid", "r": "Far East", "c": "Military AI", "st": "Reported", "time": "29 Sep", "t": "Japan studies AI humanoid robots for the Self-Defense Forces", "s": "Base patrols and logistics are the first roles under consideration as the forces face a personnel shortage.", "p": ["Japan is studying AI-equipped humanoid robots for the Self-Defense Forces, which face a personnel shortage, according to Japan Today citing unnamed government and ruling-party sources. Initial roles are non-combat, such as base patrols and logistics, with reconnaissance and rescue possible later. The Acquisition, Technology and Logistics Agency is expected to lead the research and run a competition in which private companies and universities demonstrate their robotic systems."], "cav": "No timeline, budget or procurement figures, and no size for the personnel gap. The sourcing is anonymous and second-hand, and it is not said how autonomous the robots would be or whether combat roles are ruled out.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/29/japan-ai-humanoid-robots/"]]},
{"id": "dmz-blast", "r": "Far East", "c": "Land", "st": "Reported", "time": "29 Sep", "t": "South Korean troops and the UN Command struggle to reach a suspected mine blast site in the DMZ", "s": "Two South Korean officers were seriously injured near the Military Demarcation Line in Paju.", "p": ["South Korean troops and the United Nations Command inspected an area near a suspected mine blast in the Demilitarised Zone but, according to Seoul’s Joint Chiefs of Staff, could not safely reach the site. About 40 personnel took part, according to Yonhap. Crews used mine detectors and cleared a route from morning until sundown, then stopped, with the JCS citing possible unidentified mines and exhausted personnel.", "The explosion happened near the Military Demarcation Line in Paju, north of Seoul, and seriously injured two South Korean officers among roughly a dozen troops returning from a route-clearing mission. Seoul has previously accused Pyongyang of planting tens of thousands of mines along the border."], "cav": "The cause of the blast is not established and the mines are described as suspected, not confirmed as North Korean. The “tens of thousands” figure comes from earlier Seoul accusations, and the article does not say whether the site was reached or how the officers are.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/29/s-korea-un-probe-blast/"]]},
{"id": "kf21-delivery", "r": "Far East", "c": "Air", "st": "Reported", "time": "24 Sep", "t": "South Korea accepts its first production KF-21 Boramae fighter", "s": "Two-seat 26-001 went from KAI’s Sacheon plant to Yecheon Air Base. Full operational capability is expected in late 2027.", "p": ["The Republic of Korea Air Force has received its first mass-produced KF-21 Boramae, tail number 26-001, in a two-seat configuration. Korea Aerospace Industries delivered it from Sacheon to Yecheon Air Base, where Maj. Han Jae-seok signed the acceptance papers and flew it, escorted by FA-50, TA-50 and T-50 aircraft. Development began in December 2015, about a decade before the handover, tracing back to a 2001 initiative announced by former President Kim Dae-jung.", "KAI plans 40 Block I air-to-air aircraft by 2028 and 80 Block II multirole fighters through 2032. The jet will serve with the reactivated 156th Fighter Squadron of the 16th Fighter Wing, with full operational capability expected by late 2027. Listed specifications are about 17 m length, 11 m wingspan, twin Hanwha/GE F414 engines, Mach 1.8, a range of about 1,500 nautical miles and an M61A2 20 mm cannon."], "cav": "No unit or programme cost is given, the 2027, 2028 and 2032 timelines are presented without discussion of risk, and the performance figures have no stated sources or test conditions.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/24/korea-accepts-kf21-boramae/"]]},
{"id": "akane-landing-craft", "r": "Far East", "c": "Naval", "st": "Reported", "time": "24 Sep", "t": "Japan rolls out the first Akane landing craft", "s": "The 35 m aluminium craft is meant to move forces among the southwestern islands, with handover planned for March 2027.", "p": ["Japan Marine United has unveiled the first Akane (MSV-2051) landing craft at its Yokohama shipyard, with the naming ceremony held on 17 September. It is based on the Caimen transport vessel designed by UK firm BMT and is being built under a December 2025 contract for four platforms. It has a 35 m aluminium tri-bow hull, an 8 m beam, three diesels and three waterjets producing 7,600 hp, a top speed of 18 knots, a crew of 10 and room for up to 200 personnel.", "It will serve the Maritime Transport Group moving forces across southwestern islands with limited port infrastructure. Handover is planned for March 2027, with deployment to Amami Oshima in Kagoshima Prefecture, and the remaining vessels follow later that year."], "cav": "No contract value is disclosed. The article does not say whether 18 knots applies at full load or how the 200-person capacity relates to vehicles and cargo, and the Amami detail rests on one cited report.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/24/japan-akane-landing-craft/"]]},
{"id": "taiwan-stinger-sims", "r": "Far East", "c": "Air defence", "st": "Reported", "time": "24 Sep", "t": "Taiwan’s army shows Stinger simulators for drone-defence training", "s": "Instructors can vary weather, terrain and targets, including drones. Operator training takes 30 to 45 days.", "p": ["Taiwan’s Army Artillery Training Command showed simulators for shoulder-fired and dual-mounted Stinger systems, according to the Taipei Times. The portable simulator replicates a launcher weighing nearly 16 kg, which requires strength and balance, and the dual-mounted version uses a screen to recreate Jioupeng Bay in southern Taiwan, a live-fire drill site. Instructors can vary weather, terrain and target type, including drones, and operator training takes 30 to 45 days.", "Taiwan received several dozen portable FIM-92 Stingers through a $500 million US aid package in 2023, and in 2024 US officials reportedly weighed local assembly or production. Taiwan also fields Stingers on dual launchers, Avenger vehicles and Apache helicopters."], "cav": "The article does not give the number of simulators, personnel trained or costs, local production is only “reportedly” considered, and dual-mounted deliveries are not confirmed. It does not assess training effectiveness against drones.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/24/taiwan-army-stinger-simulators/"]]},
{"id": "taiwan-attack-drones-drill", "r": "Far East", "c": "Drones", "st": "Official claim", "time": "23 Sep", "t": "Taiwan shows attack drones in a joint live-fire drill days before the Trump–Xi summit", "s": "The three-day exercise in Pingtung County linked drones, radars and precision weapons into a full kill chain.", "p": ["Taiwan’s armed forces used several types of attack drones in a joint live-fire exercise in Pingtung County, which the article describes as a first for these systems. The three-day drill came days before a meeting between US President Donald Trump and Chinese leader Xi Jinping. It linked attack uncrewed aircraft and precision weapons with reconnaissance assets and command networks, using shipborne and mobile radars, drones and a battlefield awareness system to practise finding, identifying, assigning and striking targets."], "cav": "No drone models, quantities or ranges are given. The photo is labelled representative and shows a Coast Guard VTOL launch, so it is not confirmed as part of the drill. The summit date and any signalling intent are not addressed, and the “first” claim is unsourced.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/23/taiwan-attack-drones-trump-xi/"]]},
{"id": "edge-mk82-penetrator", "r": "Middle East", "c": "Missiles", "st": "Company claim", "time": "8 Oct", "t": "UAE’s EDGE completes a MK 82 penetrator bomb for hardened targets", "s": "The 500 lb bomb is designed to defeat more than a metre of reinforced concrete. An MK 83 version is in advanced development.", "p": ["EDGE has completed development of the MK 82 Penetrator, an aircraft munition designed to penetrate reinforced concrete more than 1 m (3.28 ft) thick. It is based on the 500 lb (227 kg) US-built MK 82 general-purpose bomb and keeps compatibility with its aircraft and precision-guidance kits. EDGE subsidiary LAHAB develops and makes it, and it supports guidance kits from EDGE’s AL TARIQ and THUNDER families. Unlike general-purpose versions aimed at soft targets such as troops, fuel and radars, it targets hardened structures such as bunkers.", "EDGE reports that trials showed no “J” effect, meaning the munition kept its trajectory after penetration without significant deflection. In February 2025 the UAE Ministry of Defence awarded EDGE a 4.36 billion dirham (about $1.19 billion) contract for MK 81 to MK 84 general-purpose munitions, and EDGE says an MK 83 Penetrator is at an advanced stage. LAHAB chief executive Mohammed Arbabi said the product expands capabilities while remaining familiar and easy to use."], "cav": "The penetration and trajectory results are EDGE’s own, with no independent test data or target specifications. No production, delivery or export timeline is given, and the article does not say whether the 2025 contract covers the Penetrator.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/08/edge-mk-82-munition/"]]},
{"id": "us-arms-egypt-uae-kuwait", "r": "Middle East", "c": "Missiles", "st": "Official claim", "time": "6 Oct", "t": "US approves $2.27 billion in possible arms sales to the UAE, Egypt and Kuwait", "s": "The packages are 10,000 APKWS guidance sections, 2,020 Javelins with 200 launch units, and Patriot repair services.", "p": ["The US State Department approved three possible sales totalling $2.27 billion. The UAE could buy up to 10,000 APKWS II guidance sections, estimated at $1.041 billion, in air-to-air and air-to-ground configurations with warheads, rocket motors, fuzes, training and technical support. Egypt could buy up to 2,020 FGM-148F Javelin missiles and 200 Lightweight Command Launch Units for $832 million, plus training, spares and system integration.", "Kuwait could receive $400 million of Patriot missile repair and return services with repair parts, support equipment, training and technical help. Kuwait also received a separate $800 million Patriot sustainment proposal in January, and RTX says 19 countries use Patriot."], "cav": "These are proposed approvals, not signed contracts, and the article does not give final pricing or delivery timelines. It does not discuss the effect on US stockpiles or regional security implications.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/06/us-arms-sales-egypt-uae-kuwait/"]]},
{"id": "us-airstrike-civilians", "r": "Middle East", "c": "Air", "st": "Analysis", "time": "2 Oct", "t": "Investigation counts at least 3,336 civilian casualties from US-led airstrikes in four countries", "s": "An ARIJ-supported study of 884 operations in Yemen, Syria, Iraq and Somalia from 2007 to May 2025 found the highest civilian-to-combatant ratio early in Trump’s second term.", "p": ["US airstrikes and coalition operations killed or wounded at least 3,336 civilians in Yemen, Syria, Iraq and Somalia between 2007 and May 2025, according to an investigation supported by ARIJ that analysed 884 air operations using Airwars data. By country the toll is 1,336 in Syria, 991 in Yemen, 793 in Iraq and 216 in Somalia. Attacks against Islamic State produced the largest civilian toll, and children accounted for 1,286 documented casualties.", "In the early months of Donald Trump’s second term the study found about 2.3 civilians dying for every combatant killed, the highest ratio in the period. Night and early-morning operations were linked to heavier civilian losses, and former Pentagon official Wes Bryant said targets are easier to locate at home, where families also are. The article recalls a 2009 strike at Al-Ma’jalah in Yemen in which a parliamentary committee recorded 41 civilian deaths."], "cav": "Using the lowest casualty estimates and excluding disputed incidents may understate the total. The article says children are 42 percent of casualties, but 1,286 of 3,336 is about 39 percent, and researcher Nour Kelzi notes the figures alone do not establish unlawful attacks. The links to policy and night tactics are interpretation.", "src": [["The Defense Post", "https://thedefensepost.com/2026/10/02/civilian-casualties-us-airstrikes/"]]},
{"id": "uvision-lendurai", "r": "Middle East", "c": "Drones", "st": "Company claim", "time": "30 Sep", "t": "Uvision and Estonia’s Lendurai partner on AI autonomy for loitering munitions", "s": "Lendurai’s software uses computer vision to cut reliance on satellite navigation and radio control.", "p": ["Israel’s Uvision and Estonia’s Lendurai announced a partnership to add AI-enabled autonomy to Uvision’s unmanned systems. Lendurai will develop the autonomy software and Uvision will integrate it into its platforms. Lendurai’s technology uses computer vision and machine learning to aid navigation and reduce operator workload, and its Neocortex stack reduces reliance on satellite navigation and continuous radio control.", "Uvision makes the Hero loitering-munition family, used against armoured vehicles and personnel. Lendurai says Neocortex has been combat-tested in Ukraine, and the companies say the project supports the armed forces of an unnamed NATO member."], "cav": "The NATO customer and Uvision platform are not named, no value or delivery timeline is disclosed, and the Ukraine combat-testing claim is Lendurai’s own.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/30/uvision-lendurai-ai-drones/"]]},
{"id": "korkut-35", "r": "Middle East", "c": "Air defence", "st": "Company claim", "time": "30 Sep", "t": "Aselsan live-fires its Korkut 35 air-defence system against drones", "s": "The 35 mm wheeled system engaged several drone types in motion before delegations from 12 countries.", "p": ["Turkish firm Aselsan live-fired its Korkut 35 air-defence system against drones. Targets included fixed-wing, delta-wing, mini and micro UAVs, with a focus on kamikaze drones. The system fired at a moving ground target while both it and the target were moving. It is mounted on an 8×8 tactical wheeled vehicle, and delegations from 12 countries attended.", "Aselsan says the system can also engage fighters, cruise missiles, air-to-ground missiles, helicopters and other UAVs. Korkut 35 uses a 35 mm automatic cannon firing programmable airburst ammunition with sensors and fire-control equipment. The original Korkut is a tracked vehicle with twin 35 mm guns in service with Türkiye’s armed forces."], "cav": "No hit rates, outcomes or effective ranges are given and “representative operational conditions” are undefined. The information comes largely from Aselsan, the claimed capability against jets, cruise missiles and helicopters was not shown, and the 12 countries are not named.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/30/aselsan-korkut-35-drone-test/"]]},
{"id": "karaok-air-hit", "r": "Middle East", "c": "Missiles", "st": "Company claim", "time": "25 Sep", "t": "Roketsan says its KARAOK anti-tank missile hit an air target for the first time", "s": "The shoulder-fired, 2.5 km fire-and-forget missile has an imaging infrared seeker and a tandem warhead.", "p": ["Turkish firm Roketsan said its KARAOK anti-tank missile hit an aerial target for the first time, in a company post dated 23 September, calling it a direct hit on land and in the air. KARAOK uses an imaging infrared seeker and fire-and-forget guidance, has a range of 2.5 km with direct and top-attack profiles, is 125 mm in diameter, is designed for shoulder firing and carries a tandem anti-tank warhead.", "Roketsan began development in 2016. The missile was used in a military exercise by May 2026 and appeared in a December 2025 strike involving several uncrewed ground vehicles."], "cav": "Roketsan did not disclose the aerial target type, engagement range or other test details. The “first air hit” claim is the manufacturer’s, and the article does not say whether the test was part of an acceptance or operational programme.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/25/turkey-karaok-missile-air-target/"]]},
{"id": "arbe-alerion", "r": "Middle East", "c": "Air defence", "st": "Company claim", "time": "18 Sep", "t": "Israel’s Arbe unveils a 4D radar for fibre-optic and FPV drones", "s": "The Alerion tracks the aircraft itself, so it can spot drones that fly without a radio link.", "p": ["Israeli firm Arbe Robotics has unveiled the Alerion Radar, a 4D imaging radar designed to detect first-person-view and fibre-optic drones in difficult environments. It tracks the aircraft itself rather than the signals it emits, so it can detect fibre-optic drones that fly without a radio link, and the company says these drones cannot hide from it. It has a compact solid-state design that reportedly meets size, weight, power and cost requirements."], "cav": "No detection range, resolution or update rate is given despite the “ultra-high-resolution” label. Performance claims are the vendor’s with no independent testing, and the size, weight, power and cost compliance is only “reportedly” met, with no price, availability or customers.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/18/israeli-4d-radar-drones/"]]},
{"id": "egypt-intel-ai", "r": "Middle East", "c": "Military AI", "st": "Official claim", "time": "17 Sep", "t": "Egypt’s military-production ministry signs an AI localisation memorandum with Intel", "s": "Intel would provide training and technology transfer, with possible local assembly of edge AI systems.", "p": ["Egypt’s Ministry of Military Production is working to build domestic AI capabilities, and Intel has signed a memorandum of understanding with Toya Technology, a company affiliated with the ministry. The agreement covers AI training, technology transfer and possible local assembly of edge AI systems. Intel would provide training, technical guidance and knowledge transfer to help set up an AI ecosystem across the ministry’s affiliated organisations."], "cav": "No financial value, no commitment on when or whether local assembly will happen, and no word on which military applications the AI would serve or what oversight governs the technology transfer.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/17/egypt-local-military-ai-production/"]]},
{"id": "skystriker-germany", "r": "Middle East", "c": "Drones", "st": "Company claim", "time": "15 Sep", "t": "Elbit and Diehl demonstrate the SkyStriker loitering munition for Germany", "s": "Launched from a canister, the electric drone engaged targets autonomously and handed over at 80 km, the companies say.", "p": ["Elbit Systems and Diehl Defence jointly offer the SkyStriker loitering munition to Germany under a June 2026 partnership. In a live demonstration the drone launched from a canister and autonomously recognised, tracked and engaged targets, performed a hand-over function at 80 km and interacted with the SkyLark 1 reconnaissance drone. Electric propulsion gives it an extremely low acoustic and thermal signature, with a stated range over 200 km and loiter time over two hours. One operator can run it, and it can launch from ground vehicles, aircraft and the EuroPULS rocket artillery system.", "Diehl would manufacture, assemble, integrate and qualify the drone in Germany, with Elbit driving market development. Diehl’s Gunnar Pappert said the demonstration confirms the system’s maturity, and Elbit Systems Germany chief Marian Rachow called it a milestone toward German production."], "cav": "No contract value, order size or German procurement decision is reported. Performance figures come from the companies, and no production timeline, payload details or demonstration date and place are given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/15/elbit-diehl-demonstrate-skystriker/"]]},
{"id": "dominion-x", "r": "Middle East", "c": "Military AI", "st": "Company claim", "time": "14 Sep", "t": "Elbit unveils Dominion-X, an AI operating system for large autonomous formations", "s": "The FUSE unit’s software would coordinate drones and ground vehicles in real time and support manned-unmanned teaming.", "p": ["Elbit Systems’ FUSE unit has unveiled Dominion-X, an AI-powered operating system meant to bring large formations of autonomous aircraft and ground vehicles under real-time coordinated control. Autonomous platforms exchange mission data and carry out distributed operations over a shared network. It supports manned-unmanned teaming, linking autonomous systems with manoeuvre forces and crewed vehicles, and militaries would not need to reorganise existing formations or command structures."], "cav": "There are no figures on how many platforms it can coordinate or on latency, no word on testing, fielding or customers, and nothing on cybersecurity or the decision authority left to human operators.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/14/elbit-ai-operating-system/"]]},
{"id": "aselsan-arsus-poland", "r": "Middle East", "c": "Land", "st": "Reported", "time": "10 Sep", "t": "Türkiye’s Aselsan and Poland’s AMZ-Kutno expand a surveillance-systems deal", "s": "Industry reports put the new order at 24 ARSUS sets for the Kleszcz light reconnaissance vehicle.", "p": ["Aselsan signed a new deal with AMZ-Kutno for more ARSUS reconnaissance and surveillance systems. Neither company disclosed the value, but industry reports put the order at 24 sets. ARSUS uses sensors and other equipment to help vehicle crews detect, identify and track objects at longer ranges, and it is being integrated into Poland’s Kleszcz light reconnaissance vehicle, built on AMZ-Kutno’s 4×4 platform. A 2024 contract for radar and electro-optical systems on the same vehicles was valued at €16.6 million.", "Aselsan plans to expand in Poland through a local office, existing projects and partnerships with Polish firms. In July 2026 Türkiye’s defence industry chief Haluk Görgün met Poland’s defence minister in Warsaw, following a December 2025 security cooperation agreement."], "cav": "The 24-set figure comes from industry reports, not from either company. The deal’s value is undisclosed and no delivery timeline is given.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/10/poland-turkey-aselsan-arsus/"]]},
{"id": "space-ai-constellation", "r": "Middle East", "c": "Space", "st": "Company claim", "time": "16 Sep", "t": "UAE-led group plans a $1 billion, 50-satellite constellation with AI processing in orbit", "s": "Marlan Space and Loft Orbital describe it as the world’s largest AI infrastructure in space.", "p": ["A planned constellation of 50 satellites would use AI to analyse sensor data in orbit and transmit results to Earth. The $1 billion initiative is led by UAE-based space investor Marlan Space and space-systems company Loft Orbital, and the companies call the goal the world’s largest AI infrastructure in space. Intended uses include maritime domain awareness, disaster response and critical-infrastructure security for government and commercial customers."], "cav": "No launch or deployment schedule is given, France’s role appears only in the headline, and the split of the $1 billion is not explained. “World’s largest” is the companies’ claim, and the AI models, sensors and orbits are not described.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/16/ai-satellite-space-constellation/"]]},
{"id": "iran-captures-dive-ld", "w": "Iran and Gulf", "c": "Underwater", "st": "Official claim", "time": "28 Sep", "t": "Iran says it will reverse-engineer a captured US underwater drone", "s": "The IRGC says its navy holds an Anduril Dive-LD recovered near the Strait of Hormuz.", "p": ["The Islamic Revolutionary Guard Corps plans to reverse-engineer a captured American uncrewed underwater vehicle recovered near the Strait of Hormuz. IRGC spokesperson Brig. Gen. Hossein Mohebbi said the navy has taken possession of the submersible, which Tehran says holds advanced military technology. Iranian state media identified it as an Anduril Industries Dive-LD, a platform about 6 m (19 ft) long."], "cav": "No date, precise recovery location or account of the capture is given. The identification and the “advanced technology” claim rest on Iranian statements, with no US confirmation or response and no assessment of what reverse engineering could achieve.", "src": [["The Defense Post", "https://thedefensepost.com/2026/09/28/iran-drone-submarine-us/"]]},
