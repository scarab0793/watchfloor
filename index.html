{id:"denmark-nsm",r:"Europe",c:"Missiles",st:"Reported",time:"19 Oct",
t:"Denmark orders more Naval Strike Missiles from Kongsberg",
s:"A contract worth about NOK 400 million adds to Denmark’s existing order for its frigates and coastal batteries.",
p:["Denmark has ordered additional Naval Strike Missiles from Norway’s Kongsberg to expand the strike capability of its navy and coastal defence. Kongsberg Defence & Aerospace and Denmark’s Defence Acquisition and Logistics Organisation announced the order on 19 October. Kongsberg puts its value at about NOK 400 million. The number of missiles was not disclosed, and the contract is a government-to-government arrangement with Norway.",
"It builds on earlier purchases. In March 2025 Denmark placed a major order for its Iver Huitfeldt-class frigates, valued by Kongsberg at about NOK 2.1 billion, including missiles and equipment. Denmark became the 14th country to select the NSM, choosing it to replace the Harpoon missiles it gave to Ukraine. In December 2025 it ordered the NSM Coastal Defence System in a contract worth more than €100 million, with deliveries from 2026. Kongsberg says Denmark is the fifth NATO country to buy that system, and Danish authorities named the Danish Straits and the western Baltic as strategically important waters for it.",
"The NSM is a high-subsonic missile with a published range above 300 km, weighing about 407 kg and measuring 3.96 m. It can hit ships and land targets, flies low over the sea and carries an imaging infrared seeker with automatic target recognition. The article says the order is meant to help Denmark deny hostile warships access to the Baltic and North Sea approaches, and that using one missile family at sea and ashore simplifies training, logistics and interoperability. Using the existing Norwegian channel is described as a quick way to expand an established system.",
"At NATO’s Military Committee Conference in Copenhagen in September, Alliance leaders described Denmark as the gateway between the Baltic Sea, the North Atlantic and the High North."],
cav:"The quantity is undisclosed and the contract values are Kongsberg’s figures. The article’s views on deterrence and NATO’s push for faster delivery are the author’s interpretation, not official statements.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/denmark-expands-maritime-strike-capability-with-new-kongsberg-naval-strike-missile-order"]]},

{id:"prince-of-wales",r:"Europe",c:"Naval",st:"Reported",time:"19 Oct",
t:"Royal Navy sends HMS Prince of Wales to the Arctic and North Atlantic",
s:"The carrier strike group, with more than 1,200 personnel, will work under NATO command in the second phase of Operation Firecrest.",
p:["The Royal Navy has sent the aircraft carrier HMS Prince of Wales to the Arctic and North Atlantic, where it will operate under NATO command to reinforce the Alliance’s northern flank. Army Recognition, citing a Royal Navy statement of 17 October, says this is the second phase of Operation Firecrest. The first phase ended in July, when the carrier worked with the Type 45 destroyer HMS Duncan and the tanker RFA Tidespring.",
"The strike group has more than 1,200 personnel and mixes fixed-wing aircraft, helicopters and uncrewed systems. HMS Dauntless is the main escort, and Commodore Richard Hewitt commands the group. Norway, Denmark and Germany are among the countries taking part. The air group includes F-35B fighters, Merlin Mk2 anti-submarine helicopters, Merlin Mk4 Commando helicopters, Wildcat helicopters and Malloy uncrewed aircraft. The carrier displaces about 65,000 tonnes, is 284 metres long and uses a ski-jump ramp rather than catapults for F-35B take-offs. Dauntless carries the Sea Viper air-defence system.",
"Planned activities include NATO’s Neptune Strike exercise series, along with the Atlantic Future Forum and the International Sea Power Conference in Oslo. The article argues that the Arctic and North Atlantic matter because of transatlantic shipping, undersea cables, energy routes and Russian naval movements between the Arctic and the Atlantic. It also notes other British NATO commitments, such as personnel in Estonia, RAF Typhoons supporting air policing in Romania and P-8 Poseidon patrol aircraft."],
cav:"This is an analysis piece. The phase-two dates and the length of the deployment are not given, there are no direct quotations from officials, and the author’s descriptions of sensor and intelligence roles are not independently verified.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/uk-deploys-hms-prince-of-wales-carrier-strike-group-to-strengthen-nato-defenses-in-arctic-waters"]]},

{id:"rubis-launch",r:"Europe",c:"Submarines",st:"Reported",time:"16 Oct",
t:"France moves its fifth Suffren-class attack submarine Rubis towards launch",
s:"Naval Group and the DGA shifted the boat from the Cherbourg construction hall to the launch basin on 16 October.",
p:["On 16 October Naval Group and the French armaments agency DGA moved Rubis (S639), the fifth Suffren-class nuclear-powered attack submarine, from the construction hall in Cherbourg to the Cachin basin launch site. The move comes before first flotation, outfitting, dockside and propulsion checks, and sea trials, after which the Navy will accept the boat. Armed Forces Minister Catherine Vautrin and DGA chief Patrick Pailloux attended, along with senior naval commanders. Naval Group builds the hull and TechnicAtome supplies the nuclear propulsion plant.",
"The Barracuda programme is costed at €9.1 billion for six boats. It began in October 1998, entered design in 2002 and construction in 2007, and delivered its lead boat after 13 years. Army Recognition gives an indicative recurring cost of about €1 billion per submarine, excluding development and infrastructure.",
"Suffren was delivered in November 2020 and entered service in 2022, Duguay-Trouin followed in 2024 and Tourville in 2025. De Grasse was delivered in June 2026 but still awaits operational admission, and Casabianca is under construction with delivery expected by 2030. The class is about 99.5 m long and displaces roughly 5,300 tonnes submerged, nearly double the Rubis class it replaces. A 150 MW reactor drives a pump-jet, and endurance rises from 45 to 75 days. Four 533 mm tubes can launch up to 24 weapons, including F21 torpedoes, SM39 Exocet missiles and naval cruise missiles reported to reach beyond 1,000 km.",
"The name Rubis has a history: the earlier minelayer of that name joined the Free French forces in 1940, is credited with sinking 22 ships and was scuttled in 1958."],
cav:"Several performance figures, including a 120% gain in time on station, rest on assumptions in the article and are theoretical. The first boat of the class needed nearly two years between delivery and active service.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/france-to-launch-fifth-suffren-class-nuclear-attack-submarine-rubis-in-normandy-for-long-range-strikes"],[DIE,"https://defence-industry.eu/french-nuclear-powered-attack-submarine-rubis-begins-transfer-to-launch-lift-at-naval-groups-cherbourg-shipyard/"]]},

{id:"sodermanland-poland",r:"Europe",c:"Submarines",st:"Reported",time:"15 Oct",
t:"Sweden agrees to lease HMS Södermanland to Poland until new A26 boats arrive",
s:"The six-year lease, signed on 12 October, gives Poland a second submarine from 2028 and a training boat for its future Saab A26 crews.",
p:["On 12 October Sweden’s Defence Materiel Administration and the Swedish Armed Forces signed an agreement to prepare the submarine HMS Södermanland for lease to Poland. The lease runs from October 2026 to October 2032, with Polish operational use starting in 2028. It implements a 29 June 2026 contract between the Swedish agency and Poland’s Armament Agency and covers refurbishment, crew training, maintenance, logistics, torpedoes and support. Polish sources put its value at SEK 1.9 billion.",
"The boat will supplement ORP Orzeł, a Kilo-class submarine commissioned in 1986 and Poland’s only remaining one. Poland’s submarine force fell from five boats to one after four Kobben-class boats retired between 2017 and 2021. Thirty Polish submariners began an 18-month course in Karlskrona on 24 August, and instruction aboard Södermanland starts in October.",
"Södermanland was commissioned in 1989 as the third of four Västergötland-class boats built by Kockums. A 2000–2004 rebuild lengthened the hull by 12 metres and added two Stirling air-independent propulsion units. It displaces about 1,500 tonnes submerged, has a crew of 24 to 28, and Sweden approved SEK 470 million in 2022 for life-extension work.",
"Poland’s long-term answer is three Saab A26 submarines under a SEK 47 billion (€4.26 billion) contract, with deliveries from 2031 to 2038. Poland chose the A26 in November 2025 and is its first export customer. The lease reduces Sweden’s own fleet from four boats to three."],
cav:"The SEK 1.9 billion lease value comes from Polish sources, not an official Swedish statement. The choice between Torped 62 and Torped 63 torpedoes is unresolved, and Sweden’s own A26 programme has been revised three times, with deliveries now set for 2031 and 2033.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/sweden-signs-new-agreement-to-lease-hms-soedermanland-submarine-to-poland-until-new-a26-class-arrives"]]},

{id:"challenger-3",r:"Europe",c:"Land",st:"Reported",time:"21 Oct",
t:"Challenger 3: seven prototypes delivered, but the in-service date is still open",
s:"The Ministry of Defence confirmed the deliveries in a parliamentary answer and gave no new production timetable.",
p:["The UK has confirmed that seven Challenger 3 main battle tank prototypes have been delivered, with an eighth in the final stage of construction. In a written parliamentary answer published on 19 October, Defence Minister Luke Pollard said the vehicles are being used to check performance and safety before production begins. He gave no new schedule for series production or entry into service. The programme aims to replace Challenger 2 with 148 upgraded tanks.",
"Rheinmetall BAE Systems Land, a joint venture of Rheinmetall and BAE Systems, is developing the tank. The Ministry of Defence gave it a contract worth more than £800 million in 2021, and assembly is mainly done at Telford. The first crewed live-fire trials in the UK took place in December 2025.",
"The upgrade combines Challenger 2 parts with new systems. Rheinmetall’s 120 mm L55A1 smoothbore gun replaces the rifled L30A1 and allows NATO-standard ammunition. A redesigned turret has better sights, independent thermal imagers for commander and gunner, and automatic target tracking. Protection includes upgraded modular armour, a laser warning system and provision for Rafael’s Trophy active protection system. Engine and suspension are improved.",
"The programme has had setbacks. In June 2026 the ministry acknowledged that supply-chain delays had disrupted hardware and software for the demonstration phase and that its initial and full operating capability dates were under review. An answer on 8 September said the programme was undergoing a performance review and a renewed approval process, with progress expected in the 2026–27 financial year."],
cav:"The latest answer does not say whether the reviews are finished. With only 148 tanks planned, availability and survivability matter a great deal, and Trophy is not designed mainly against FPV drones and loitering munitions, so its value against them is unproven.",
src:[[AR,"https://www.armyrecognition.com/news/army-news/2026/uk-pushes-british-army-challenger-3-tank-closer-to-combat-with-seven-prototypes-delivered"]]},

{id:"saab-luuv",r:"Europe",c:"Underwater",st:"Reported",time:"16 Oct",
t:"Saab and Sweden finish first sea trials of a large uncrewed undersea vehicle",
s:"The LUUV demonstrator is meant to scout Baltic waters before Swedish submarines enter them and to help protect undersea infrastructure.",
p:["Saab, the Swedish Defence Materiel Administration and the Swedish Armed Forces announced on 16 October that initial sea trials of the Large Uncrewed Undersea Vehicle (LUUV) demonstrator are complete. The work is a SEK 60 million development contract awarded on 29 August 2025, not a production price. The vehicle uses Saab’s Autonomous Ocean Core software and technology from its Autonomous Ocean Drone, which is 7 m long and weighs 6.5 tonnes.",
"Its job is to scout potentially dangerous waters before Sweden’s crewed submarines go in. The preliminary requirements describe a vehicle 6.5 m long and 1.4 m wide, with a top speed of 14 km/h and an operating depth of 500 m. Planned sensors include several sonars, a multibeam echo sounder and navigation aids. The Baltic covers 377,000 km², averages 55 m deep and reaches 459 m at Landsort Deep. Damage to undersea cables and pipelines, including the 2022 Nord Stream explosions and the 2023 Balticconnector damage, is part of the reason for the programme.",
"FMV project manager Martin Nyqvist said further trials will test autonomous functions, sensors and operations in representative environments. Sweden is also studying whether LUUVs could work from its A26-class submarines, and weapons were excluded from the first phase. Sweden joined NATO on 7 March 2024, and the Baltic Sentry mission began in January 2025."],
cav:"Endurance, depth, battery capacity and sonar performance of the Swedish vehicle have not been released. No production quantity, submarine recovery qualification or service-entry date has been announced. Satellite links need the vehicle to surface and acoustic links have little bandwidth, so data may be stored and sent later.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/sweden-and-saab-complete-first-sea-trials-of-new-luuv-undersea-vehicle-to-protect-baltic-sea-infrastructure"]]},

{id:"globaleye-sweden",r:"Europe",c:"Air",st:"Reported",time:"15 Oct",
t:"Saab presents Sweden’s first GlobalEye early-warning aircraft",
s:"Aircraft 061 was shown at Linköping before ground and flight testing. NATO has since decided to buy up to ten GlobalEyes.",
p:["On 15 October Saab presented the first S 106 GlobalEye airborne early warning and control aircraft for the Swedish Air Force at its Linköping site. The aircraft, numbered 061, will go through ground and flight testing before delivery. Defence Minister Pål Jonson, Air Force chief Major General Jonas Wikman and Saab CEO Micael Johansson attended.",
"Sweden ordered two GlobalEyes in June 2022 for SEK 7.3 billion, added a third in June 2024 for SEK 2.6 billion, and holds an option on a fourth. They replace the Saab 340 ASC 890 aircraft, two of which Sweden decided in 2024 to give to Ukraine, widening its surveillance gap. Stockholm brought the programme forward in October 2024, after an original plan for two aircraft in 2027 and one in 2029.",
"The aircraft is based on the Bombardier Global 6000 and carries an Erieye ER radar with a stated instrumented range of 650 km and an endurance above 11 hours. Saab attributes a 70% gain in detection range over earlier Erieye radars. It also carries a maritime radar, signals-intelligence receivers and identification systems. The first two Swedish aircraft will get an interim configuration, and the third will be built to the final standard.",
"The wider market is moving. On 7 July 2026 NATO decided to buy up to ten GlobalEyes for eleven countries, reversing its 2023 choice of six Boeing E-7 Wedgetails. France signed for two aircraft in December 2025, a Middle Eastern customer signed in July 2026, and the Netherlands signed a letter of intent in September for one. Saab has 12 firm orders and plans to lift production from two to six aircraft a year."],
cav:"Real detection ranges depend on target size, altitude and interference. Three aircraft must cover operational sorties, maintenance and training at once. Differences between the interim and final configurations and the cost of modifications were not disclosed.",
src:[[AR,"https://www.armyrecognition.com/news/aerospace-news/2026/saab-rolls-out-swedens-first-globaleye-early-warning-aircraft-to-guard-baltic-sea-and-natos-northern-flank"]]},

{id:"germany-ghost-bat",r:"Europe",c:"Drones",st:"Reported",time:"20 Oct",
t:"Germany drops plan to buy Boeing’s MQ-28 Ghost Bat directly",
s:"Berlin has told Boeing it will not buy the Australian-developed loyal wingman as planned, pushing its combat-drone goal into the 2030s.",
p:["Germany has changed course on its tactical unmanned aircraft plans and told Boeing it will no longer buy the MQ-28 Ghost Bat autonomous aircraft directly. Politico reported the decision first, and a Boeing spokesperson confirmed it to Breaking Defense, adding that the company stands ready to support Germany on next steps. The Defense Post reported it on 20 October.",
"Germany’s procurement agency declined to give the specific reason and pointed to contracting law and parliamentary review requirements. A social media post cited in the article said Berlin had formally dropped plans to buy the aircraft directly from Australia and that the air force had wanted it by 2029.",
"The decision delays Germany’s aim of fielding its own collaborative combat aircraft by 2029, which would have made it the first European nation to deploy loyal-wingman technology. The fast-track plan was a direct government purchase of the Australian-developed aircraft, combined with a local partnership involving Rheinmetall. According to unnamed sources, operational use has moved into the early 2030s, with competitive flight tests due to start in 2027.",
"Other bidders are interested in filling the gap: German firm Helsing with its CA-1 Europa, Airbus and Kratos with the XQ-58A Valkyrie airframe, and General Atomics with its Gambit family."],
cav:"The article gives no details of the bidding process or budget, and the reasons for the reversal are not stated. It relies on Boeing’s confirmation, the agency’s statement on procedure and anonymous sources.",
src:[[DP,"https://thedefensepost.com/2026/10/20/germany-ghost-bat-boeing/"]]},


{id:"kosmos-2612",r:"Europe",c:"Space",st:"Reported",time:"19 Oct",
t:"Russian satellite Kosmos 2612 closes in on the Finnish-built ICEYE X36 radar satellite",
s:"Public tracking data suggest a pass within tens of metres on 19 October. Analysts say intent is unknown.",
p:["Russia’s Kosmos 2612 may have passed about 26 metres from ICEYE X36, a US-registered commercial radar-imaging satellite, at about 16:07 UTC on 19 October, according to public tracking data cited by The War Zone. The private firm LeoLabs could not confirm or contradict those figures but said it had high confidence the objects came within about 500 metres of each other.",
"From around 30 September Kosmos 2612 made a series of manoeuvres that matched ICEYE X36’s orbital plane and altitude. Jonathan McDowell said a manoeuvre on 16 October left it within about 5 km, and Marco Langbroek put the gap at 1 to 2 km at one point. LeoLabs and others say the two satellites are now drifting apart, with Kosmos 2612 in a larger orbit. LeoLabs called it a sophisticated rendezvous and proximity operation but said it does not establish hostile intent. McDowell called it probably the first such rendezvous in low Earth orbit in which one owner did not approve. CSIS’s Clayton Swope said the aim could range from intimidation to sabotage.",
"ICEYE X36 was launched in 2024, was built in Finland and is now registered in the US. Reports that it may be owned or leased by Ukraine are unconfirmed, though Ukraine has used ICEYE imagery for years, including for targeting. ICEYE said it is aware of the situation and tracking it closely. Kosmos 2612 is one of six satellites, Cosmos 2609 to 2614, launched on a single Soyuz-2.1b rocket in April and appears to be an “inspector” type. In 2020 Kosmos 2542 came within 150 to 300 km of the US satellite USA 245, a far larger distance."],
cav:"Distances come from public data and differ between sources. Close approaches do not prove hostile action, and attribution in space is hard.",
src:[["The War Zone","https://www.twz.com/news-features/russias-satellite-unprecedented-shadowing-of-a-very-particular-radar-imaging-satellite-is-a-big-deal"]]},

{id:"mangalia",r:"Europe",c:"Shipbuilding",st:"Company claim",time:"19 Oct",
t:"Rheinmetall and MSC to buy the Mangalia shipyard in Romania for about €138 million",
s:"The dual-use yard is meant to build four Romanian government vessels and serve as a hub for naval projects in South-Eastern Europe.",
p:["Rheinmetall, through its Naval Systems division, and the Swiss shipping company MSC have won an auction to acquire the Mangalia shipyard south of Constanța in Romania. They will pay about €138 million jointly, and the deal is expected to close in a few weeks. The stated aim is a dual-use site where civil and military shipbuilding run in parallel for domestic and international customers, with the site later divided into sectors and security zones.",
"The yard is to build four vessels ordered by the Romanian government: two 96-metre offshore patrol vessels and two 43-metre diver-support vessels. It is also intended as a hub for further military shipbuilding. Tim Wagner, CEO of Rheinmetall Naval Systems, said the company plans to expand and upgrade the yard comprehensively, including infrastructure, production conditions and capacity, and called it a potential long-term base in South-Eastern Europe.",
"Rheinmetall has operated in Romania since 2024 through Rheinmetall Automecanica in Mediaș. Naval Today links the deal to a €5.7 billion Romania–Rheinmetall agreement from June 2026 covering defence systems and naval vessels."],
cav:"The sale is not yet complete and the price is approximate. The report does not describe the yard’s current workforce, capacity or ownership history, or the other bidders, and rests on the companies’ announcement.",
src:[["Naval Today","https://www.navaltoday.com/2026/10/19/rheinmetall-to-acquire-romanian-shipyard-to-boost-naval-shipbuilding"]]},

{id:"korea-lasers",r:"Far East",c:"Lasers",st:"Reported",time:"14 Oct",
t:"South Korea’s laser weapons bring down three drones in an army exercise",
s:"Hanwha’s Cheongwang Block-I and a 30 kW prototype intercepted three target drones at the TIGER+ exercise in Yangpyeong.",
p:["South Korea’s Hanwha Systems intercepted three target drones on 14 October during the Army’s TIGER+ Future Warfare Integrated Combat Exercise in Yangpyeong, Gyeonggi Province. Two lasers did the work: the operational Cheongwang Block-I, originally rated at 20 kW, and a separate 30 kW vehicle-mounted prototype developed under the Korea Research Institute for Defense Technology Planning and Advancement. About 500 attendees watched, including Army Chief of Staff General Kim Gyu-ha. Results for each shot, ranges and target speeds were not disclosed. Army Recognition counts nine successful laser interceptions across September and October.",
"The Cheongwang began in 2019 as a programme led by the Agency for Defense Development and Hanwha Systems. It entered service in December 2024 near Seoul’s government and defence sites, and five installations were operational by June 2026, with ten more planned. The 20 kW-class fibre laser engages small multicopters, FPV drones and fixed-wing aircraft at 2 to 3 km. The programme was prompted by a December 2022 incursion by five North Korean drones that South Korean aircraft failed to intercept.",
"In June 2026 the procurement agency said a domestic laser oscillator had replaced a German-origin part, with output and other characteristics improved by more than 50%. Reported dwell times fell from 2–4 seconds to 1–2 seconds against FPV drones. Whether the October demonstration used the new part is unconfirmed. Hanwha is also developing a 50 kW laser on the Tigon 8×8 armoured vehicle, targeting series production in late 2027, and a firing cost of about 2,000 won, roughly $1.50, per shot is reported.",
"South Korea’s proposed 2027 defence budget is 73.28 trillion won, up 8.2%, including 8.06 trillion won for drone and counter-drone programmes and 121 billion won for high-power laser research."],
cav:"Key data are unknown: how many targets the laser can handle at once, power and cooling endurance, firing from a moving platform and weather effects. Coverage and beam-time calculations in the article are the author’s own illustrations. No foreign orders are confirmed.",
src:[[AR,"https://www.armyrecognition.com/news/army-news/2026/south-koreas-new-laser-weapons-intercept-three-drones-during-integrated-combat-exercise"]]},

{id:"nuri-recon-sats",r:"Far East",c:"Space",st:"Reported",time:"21 Oct",
t:"South Korea plans to launch military reconnaissance satellites on its own Nuri rocket",
s:"Four electro-optical microsatellites are planned for the rocket’s 11th flight in 2031, ending reliance on foreign launchers for this role.",
p:["South Korea plans to use its domestically developed Nuri rocket to launch four military reconnaissance microsatellites in 2031, according to a Yonhap report cited by The Defense Post. The aim is a domestic launch capability, since Seoul has relied on foreign rockets for its military satellites. Korea AeroSpace Administration chief Oh Tae-seok set out the schedule, under which the electro-optical satellites would fly on Nuri’s 11th mission. At least one Nuri launch a year is planned through 2032.",
"The plan follows Nuri’s fifth flight earlier in October, which put five Earth-observation microsatellites into orbit. Later missions include five more such satellites in the second half of 2027, the fifth satellite of the next-generation medium-sized series in 2028, and a 2032 flight expected to carry three satellites to work with the Arirang 8 multipurpose satellite. Arirang 8 will use synthetic aperture radar, which can image at night and through cloud.",
"Separately, Seoul is looking at military satellite communications. Earlier in 2026, Hanwha Systems and Canada’s MDA Space signed a memorandum to study cooperation on K-LEO, South Korea’s planned low-Earth-orbit defence constellation, including whether MDA’s AURORA software-defined platform meets its requirements."],
cav:"These are plans and expected schedules, not confirmed commitments. The Hanwha–MDA memorandum is only an assessment, not a contract. The article gives no costs, payload details for the 2031 satellites or manufacturers’ names.",
src:[[DP,"https://thedefensepost.com/2026/10/21/s-korea-satellites-nuri-rocket/"]]},

{id:"yj-9er",r:"Far East",c:"Missiles",st:"Unverified",time:"18 Oct",
t:"China shows the YJ-9ER, an anti-ship missile said to double the range of the YJ-9",
s:"Reported ranges of 30 km from helicopters and 60 km from aircraft would aim at small, fast vessels such as Taiwan’s missile corvettes.",
p:["China has shown the YJ-9ER, an extended-range air-launched anti-ship missile that reportedly doubles the reach of the YJ-9, according to an Army Recognition article of 18 October. Reported ranges are 30 km from helicopters and 60 km from fixed-wing aircraft, up from 15 km and 30 km. The missile appears to target small, fast surface ships such as patrol vessels, fast attack craft and missile boats.",
"The YJ-9ER evolves from the YJ-9, reported at about 105 kg and 2.58 m, with a warhead of around 30 kg and a subsonic speed of Mach 0.7 to 0.85. The new version was reportedly displayed at the 2026 Egypt International Airshow, and Chinese defence media discussed the upgrade in September. The PLA Navy has previously shown Z-9D helicopters firing YJ-9 missiles at moving surface targets.",
"The article names Taiwan’s Tuo Chiang-class corvettes as a relevant target. They displace about 685 tonnes, can exceed 40 knots, and carry Hsiung Feng II and III anti-ship missiles, a 76 mm gun, a Phalanx close-in weapon and Sea Sword II air-defence missiles. It frames the YJ-9ER as part of China’s effort to counter Taiwan’s dispersed corvette strategy without relying only on heavier missiles, and suggests Taiwanese commanders could respond with more attention to air-defence coordination, electronic warfare and dispersion."],
cav:"Almost nothing about the missile is confirmed: public information does not show where the extra range comes from, and dimensions, propulsion, warhead and weight are unconfirmed. No independent test has verified the ranges, and a public appearance does not show the missile is in PLA Navy service. A 30 km helicopter launch would not automatically keep the aircraft outside a corvette’s defences.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/china-unveils-yj-9er-anti-ship-missile-with-double-range-against-fast-moving-warships"]]},

{id:"taiwan-fpv",r:"Far East",c:"Drones",st:"Company claim",time:"16 Oct",
t:"Taiwanese-led team delivers 1,520 FPV attack drones to the US Drone Dominance Program",
s:"Thunder Tiger and partners finished an order estimated at $7.6 million, about $5,000 per drone, as Taiwan tries to build a supply chain that avoids China.",
p:["Taiwan’s Thunder Tiger Technology, working with US-based Farage Precision and Taiwan’s Rehfeldt Group, has completed delivery and acceptance of 1,520 first-person-view attack drones for the US Department of Defense. Thunder Tiger announced it on 16 October. The order is estimated at $7.6 million, about $5,000 a unit, and Pentagon figures updated on 1 October showed all 1,520 accepted, up from 760 in September.",
"The drones came through the Drone Dominance Program, which buys drones in successive competitions rather than one long-term contract. The partners placed 11th in the first competition, Gauntlet I, which picked 11 suppliers for 22,320 initial drones. The delivered drones are customised 10-inch Overkill quadcopters using Blue UAS-approved hardware and Auterion flight controllers, although the exact variant is unconfirmed. Production did not follow the competition ranking: by 1 October Farage Precision had finished its whole order while the top-ranked Skycutter had accepted 480 of 2,560.",
"The obstacle for Taiwan’s industry is China, which supplies an estimated 70% to 90% of the global commercial drone market. Non-Chinese parts can cost 25% to 70% more, and Taiwanese makers estimate a fully domestic FPV drone would need a price of $2,000 to $3,000 to break even. Batteries are especially hard to replace. Taiwan backed 31 drone projects in 2024–2025 and set up a six-year NT$44.2 billion industrial programme.",
"Thunder Tiger signed an agreement with Michigan’s economic development agency on 13 October on possible US manufacturing and testing, and one with AeroVironment on 14 October on possible co-production in Taiwan. Neither sets a production quantity. The company is also developing the Papadelta PD-136 long-range attack drone, with a claimed 500 km range."],
cav:"Order value and drone specifications come from company and Pentagon figures cited in the article. A good result in a trial does not guarantee a contract, since suppliers must also pass compliance checks by the Defense Contract Management Agency.",
src:[[AR,"https://www.armyrecognition.com/news/army-news/2026/taiwan-delivers-1-520-fpv-attack-drones-for-u-s-drone-dominance-program-to-reduce-reliance-on-china"]]},

{id:"vbat-taiwan",r:"Far East",c:"Drones",st:"Company claim",time:"19 Oct",
t:"Shield AI delivers the first of 13 V-BAT drones to Taiwan’s coast guard",
s:"The ship-launched drones will be used for maritime surveillance, coastal patrol and law enforcement.",
p:["US defence company Shield AI has delivered the first of 13 V-BAT drones to Taiwan’s Coast Guard Administration, The Defense Post reported on 19 October. The other 12 are expected over the coming months, though no schedule was given.",
"According to Shield AI, the V-BAT will operate from ships and support maritime surveillance, coastal patrols and law enforcement missions. Its vertical take-off and landing means it does not need a runway, which gives the coast guard more flexibility to launch from vessels and other confined spaces."],
cav:"This is a short report that relies on Shield AI’s description. It gives no contract value, no delivery timetable beyond “the coming months” and no reasons for the purchase beyond the mission types listed.",
src:[[DP,"https://thedefensepost.com/2026/10/19/shield-ai-vbat-drone-taiwan/"]]},

{id:"japan-skyfall",r:"Far East",c:"Drones",st:"Official claim",time:"16 Oct",
t:"Japan moves to acquire interceptor drones from Ukraine’s SkyFall",
s:"Defence Minister Shinjiro Koizumi said delivery is being arranged as soon as possible. The models have not been named.",
p:["Japan is moving to acquire interceptor drones from SkyFall, a Ukrainian developer, The Defense Post reported on 16 October. Defence Minister Shinjiro Koizumi said delivery is being arranged as soon as possible, according to a Japanese Ministry of Defense press release.",
"The ministry did not say which models it wants. It noted that SkyFall makes its P1-SUN interceptors in several variants, including one with AI-powered features. The ministry highlighted the P1-SUN JetKiller, a faster variant that has been credited with intercepting Russian Geran attack drones."],
cav:"The report is very short. It gives no contract value, quantity or timeline beyond “as soon as possible”, does not say whether a contract has been signed, and offers no independent confirmation of the Geran interception claims or any comment from SkyFall.",
src:[[DP,"https://thedefensepost.com/2026/10/16/japan-interceptor-drones-skyfall/"]]},

{id:"keen-sword-2027",r:"Far East",c:"Exercises",st:"Reported",time:"19 Oct",
t:"Keen Sword 2027 begins with 56,000 personnel from Japan, the US and seven partners",
s:"The biennial exercise opened on Ishigaki Island and runs to 29 October, covering air and missile defence, maritime operations and logistics.",
p:["Japan and the United States began Exercise Keen Sword 2027 on 19 October with about 56,000 personnel. Around 45,000 are Japan Self-Defense Force members and 11,000 are US service members. Australia, Canada, France, Germany, the Netherlands, New Zealand and the Philippines are contributing forces, and South Korea and the UK are observers. Defence Industry Europe reported it on 20 October.",
"An opening ceremony took place on Ishigaki Island, and the exercise runs through 29 October. Training covers air and missile defence, maritime operations and the logistics needed to keep forces supplied under realistic conditions. Scenarios will test information sharing and defensive coordination across several domains, along with facility protection and repair, resupply and casualty evacuation. Keen Sword is the 18th edition of a biennial field exercise that has run for four decades.",
"US Marine Corps Lt. Gen. George Rowell, deputy commander of US Pacific Command, called it the pinnacle of combat-ready exercises in the Pacific and said deterrence depends on demonstrated competence, cohesion and warfighting readiness rather than statements. Japan’s Admiral Tawara Tateki, commander of the Joint Operations Command, said the exercise is dedicated to preserving peace and stability and should let participants draw on each other’s strengths."],
cav:"The article names no adversary and gives no cost, equipment or specific threat scenarios. Its account of the exercise’s purpose comes mainly from statements by participants.",
src:[[DIE,"https://defence-industry.eu/u-s-and-japan-launch-keen-sword-2027-with-56000-personnel-and-partner-forces-to-strengthen-deterrence-and-combat-readiness/"]],
img:"https://defence-industry.eu/wp-content/uploads/2026/10/U.S.-and-Japan-launch-Keen-Sword-2027-with-56000-personnel-and-partner-forces-to-strengthen-deterrence-and-combat-readiness.jpeg",cr:"US Air Force, as credited by Defence Industry Europe (US government work, public domain)"},

{id:"nk-slcm",r:"Far East",c:"Missiles",st:"Official claim",time:"14 Oct",
t:"North Korea says it tested two submarine-launched strategic cruise missiles",
s:"State media reported the launches in the Sea of Japan on 14 October. South Korea’s military assessed that one came from a vertical launcher and one from a torpedo tube.",
p:["North Korea reported testing two types of submarine-launched strategic cruise missiles on 14 October in the East Sea, also called the Sea of Japan. State news agency KCNA said the Missile Administration carried out the launches. It is Pyongyang’s first publicly disclosed underwater missile test since January 2024. KCNA did not name the missiles or give ranges, and said the test examined the readiness of underwater combat systems and helped the navy prepare for strategic missions. Kim Jong Un was not reported to attend, and Pyongyang framed the event as a readiness exercise rather than the debut of a new weapon.",
"South Korean analysts believe the submarine was the Hero Kim Kun Ok, unveiled in September 2023 as a modified diesel boat that Pyongyang called a “tactical nuclear attack submarine”. South Korea’s Joint Chiefs of Staff tracked the launches and, according to Yonhap and Reuters, assessed that one missile came from a vertical launch system and the other from a torpedo tube.",
"The missiles’ identity is unconfirmed. One may be the Pulhwasal-3-31 shown in January 2024, and some South Korean analysts suggest the other could be a longer-range weapon of the Hwasal-2 family. Reuters cited analysts who said vertical launchers could allow larger salvos and cut warning time. Army Recognition’s author, Teoman S. Nicanci, calls the test a step in weapons-system integration rather than proof of a mature sea-based deterrent."],
cav:"Independent evidence does not establish the submarine’s patrol endurance, repeatable submerged launches, salvo size, missile stock or survivability. Repeat trials, long patrols and any ballistic-missile launches would be better indicators. The account of the test itself comes from North Korean state media.",
src:[[AR,"https://www.armyrecognition.com/news/navy-news/2026/north-korea-tests-two-types-of-submarine-launched-strategic-cruise-missiles-in-the-sea-of-japan"]]},


{id:"china-uuv-mothership",r:"Far East",c:"Underwater",st:"Analysis",time:"18 Oct",
t:"A second Chinese ship that looks like an uncrewed-submarine mothership appears",
s:"Photos show a smaller sister of the Shanghai-built vessel at Guangzhou Shipyard International.",
p:["The War Zone reported on 18 October that China appears to have a second large uncrewed underwater vehicle (UUV) mothership nearly complete. It follows a report about a month earlier on a vessel under construction at Hudong-Zhonghua Shipyard in Shanghai, assessed as able to deploy a handful of very large vehicles or many smaller ones through a stern garage door and well deck, with large pylons lifting vehicles in and out of the water.",
"The new ship was photographed in Guangzhou. TWZ describes it as a scaled-down version of the first, with a near-identical shape, minor changes to the hull lines and an estimated one-third smaller overall. It has six lift towers against twelve on the Shanghai ship. Satellite imagery confirms the builder as Guangzhou Shipyard International, a subsidiary of China State Shipbuilding Corporation, on Longxue Island; Planet Labs imagery from 2 October shows it in a covered graving yard before launch.",
"The article says large UUVs could map the seabed, hunt submarines and ships, search for mines, launch cruise missiles and drones, or serve as strategic weapons. It says the US has no comparable large-UUV launch and recovery system in its inventory. Chinese UUVs such as the HSU100 and AJX002 were shown at the 3 September 2025 parade in Beijing."],
cav:"Most images come from the Chinese internet, and the conclusions about function are inferences from the design, not confirmed mission details. Two ships could still be largely experimental.",
src:[["The War Zone","https://www.twz.com/sea/second-chinese-submarine-drone-mothership-emerges"]]},

{id:"ghost-shark-payloads",r:"Oceania",c:"Underwater",st:"Official claim",time:"19 Oct",
t:"Australia reveals payload work for Ghost Shark and Speartooth uncrewed submarines",
s:"Some payloads will be tested in a US exercise under AUKUS Pillar II. Canberra has set aside up to A$5.8 billion over a decade.",
p:["Australia is integrating mission-specific payloads into its Ghost Shark and Speartooth uncrewed underwater vehicles and its BlueBottle uncrewed surface vessels, Naval Today reported on 19 October. The government revealed the work while preparing for Exercise Maritime Big Play Pacific in San Diego, a multinational activity under the AUKUS Pillar II framework, where some payloads will be tested.",
"The platforms are modular. Examples given are systems for delivering supply caches remotely, sea mines and uncrewed aerial vehicles. The work supports undersea warfare, seabed operations, sea denial and protection of critical undersea infrastructure, and advances the first AUKUS Pillar II Signature Project, announced by defence ministers in May, on payloads and enabling systems for uncrewed undersea vehicles.",
"Under its 2026 National Defence Strategy and Integrated Investment Program, Australia has allocated up to A$5.8 billion over the decade for autonomous and uncrewed undersea warfare, including A$1.7 billion for a fleet of Australian-designed and built Ghost Sharks. The announcement was made at Anduril’s facility in New South Wales. Deputy Prime Minister Richard Marles called the payload work a critical part of AUKUS cooperation, and Defence Industry Minister Pat Conroy called Ghost Shark a flagship Australian success story, saying vehicles are leaving the factory, which opened less than a year ago, at an increasing rate."],
cav:"The article does not say which payloads will be tested, how many vehicles will receive them or when they will enter service. The payload types are examples, and the A$5.8 billion is an upper bound.",
src:[["Naval Today","https://www.navaltoday.com/2026/10/19/australia-unveils-new-payloads-for-ghost-shark-and-speartooth-uuvs"],["Naval News","https://www.navalnews.com/naval-news/2026/10/australia-advances-undersea-warfare-capabilities"]]},
