<style>
:root{--bg:#e8e9e2;--surface:#f3f4ee;--ink:#1d2822;--muted:#5b675f;--line:#c4c8bc;--accent:#c8431f;--ok:#2f6b46;--warn:#9a6a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b17;--surface:#1c2621;--ink:#e6e9e1;--muted:#97a399;--line:#33403a;--accent:#ff7a52;--ok:#6fc08f;--warn:#e0b04a}}
:root[data-theme="dark"]{--bg:#141b17;--surface:#1c2621;--ink:#e6e9e1;--muted:#97a399;--line:#33403a;--accent:#ff7a52;--ok:#6fc08f;--warn:#e0b04a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Serif 4",Georgia,serif}

header{padding:28px 0 18px;border-bottom:3px solid var(--ink)}

h1.logo a{color:inherit;text-decoration:none}
h1.logo span{color:var(--accent)}
.demo{background:var(--surface);border-left:4px solid var(--warn);padding:10px 14px;margin:18px 0;font-size:14px;color:var(--muted)}

button,input{font:inherit;color:inherit}

.lead h2 a:hover,article h3 a:hover{text-decoration:underline}

article{padding:20px 0;border-bottom:1px solid var(--line)}

.side h4{font:700 20px "Barlow Condensed",sans-serif;margin:0 0 8px}
.side ul{margin:0;padding-left:18px;font-size:15px}
figure{margin:0 0 12px}figure img{width:100%;height:210px;object-fit:cover;display:block;background:var(--surface)}.full figure img{height:auto;max-height:340px}.lead figure img{height:auto;max-height:300px}figure.logo img{height:96px;object-fit:contain;background:#fff;padding:14px;border:1px solid var(--line);border-radius:4px}.full figure.logo img,.lead figure.logo img{height:96px;max-height:96px;width:auto;max-width:100%}.hp{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;align-items:start}.hpmain{min-width:0}

.feed h4{font:700 22px "Barlow Condensed",sans-serif;margin:0}.fsub{margin:0 0 10px;font-size:13px;color:var(--muted)}
.feed ul{list-style:none;margin:0;padding:0}.feed li{padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.3}
.feed li a{color:inherit;text-decoration:none;font-weight:600}.feed li a:hover{text-decoration:underline}
.fmeta{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}.fmeta b{text-transform:uppercase;letter-spacing:.04em}.fmeta b.ua{color:var(--ok)}.fmeta b.ir{color:var(--accent)}.fmeta b.ga{color:var(--warn)}
@media(max-width:900px){.hp{grid-template-columns:1fr;gap:0}.feed{position:static;max-height:none}.feed li:nth-child(n+6){display:none}}
.art svg{width:100%;height:auto;display:block}figcaption{font-size:12px;color:var(--muted);margin-top:4px}

.cav{background:var(--surface);border-left:4px solid var(--warn);padding:12px 16px;margin:22px 0;font-size:15px}
.cav b{display:block;margin-bottom:4px}
.srcs{border-top:1px solid var(--line);padding-top:14px;margin-top:22px;font-size:15px}
.srcs ul{margin:6px 0 0;padding-left:18px}
.note{color:var(--muted);font-size:13px;margin-top:14px}
footer{padding:28px 0 40px;color:var(--muted);font-size:14px}
@media(max-width:720px){.lead{grid-template-columns:1fr}input[type=search]{width:100%}}
.band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:18px}.band img{width:100%;height:clamp(100px,17vw,180px);object-fit:cover;display:block;background:var(--surface)}.bandcap{font-size:12px;color:var(--muted);margin:6px 0 0}.bandcap a{color:inherit}

const items=[
{"id":"nn-houthi-missile-primula","w":"Iran and Gulf","c":"Red Sea","st":"Reported","time":"27 Oct","t":"French warship reportedly shot down a ballistic missile fired near Belgian minehunter BNS Primula in Bab el-Mandeb","s":"Naval News relays a Belgian press report; the date, the French ship and the launcher are not officially confirmed.","p":["A French Navy warship reportedly shot down a ballistic missile launched near the Belgian minehunter BNS Primula in the Bab el-Mandeb Strait, Naval News reported on 27 October, relaying an article by Belgium's De Morgen dated 26 October. The incident is placed 'halfway through October', with no casualties or damage. The missile was 'most likely' fired by the Houthis, which is an inference rather than a confirmed attribution.","The Primula, a Tripartite-class minehunter that cannot defend itself against such threats, was reportedly transiting with an escort, and the French ship made the interception. Naval News analyst Frederik Van Lokeren suggests the minehunter may not have been the target and that the launch could have been a warning shot or aimed at another vessel, because the Houthis have mostly used ballistic missiles against static targets; that reading is his analysis. The ship was recalled from the Baltic and has operated in the region for several weeks, sent in anticipation of a multinational mine-clearing operation in the Strait of Hormuz that lacks political approval while there is no ceasefire there.","Naval News also notes an earlier reported incident on 1 October, when the French frigate FS Languedoc allegedly shot down a drone heading for the CMA CGM container ship Champs Elysées, as reported by Le Monde on 15 October. France has deployed two frigates and a minehunter to the Red Sea alongside Italian and Greek ships in EU Operation Aspides; European forces may use force only to defend themselves and merchant ships. Both incidents surfaced about two weeks after they occurred."],"cav":"Rests on unnamed sources cited by De Morgen; Naval News did not independently confirm it. The French ship, the exact date, the launcher and the intended target are unidentified, and the warning-shot idea is the analyst's view.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/houthi-ballistic-missile-intercepted-near-belgian-minehunter-in-bab-el-mandeb/"]]},
{"id":"nn-exail-marins-m1","r":"Europe","c":"Naval","st":"Company claim","time":"26 Oct","t":"Exail unveils Marins M1, a compact fibre-optic-gyro inertial navigation system for small boats and uncrewed vessels","s":"The company says drift is at most 1 nautical mile after 3 hours with no external aiding; no price, size or customers are given.","p":["French firm Exail has introduced the Marins M1, a compact inertial navigation system for smaller naval platforms and uncrewed craft, Naval News reported on 26 October, in what is largely a reprint of an Exail press release. It targets rigid-hulled inflatable boats, fast interception craft, patrol boats, and uncrewed surface and underwater vehicles, and is meant to keep navigation accurate when satellite positioning is degraded or unavailable.","The system builds on Exail's fibre-optic gyroscope technology and outputs position, heading, roll and pitch. The only quantified figure is a maximum position drift of 1 nautical mile after 3 hours without any external aiding. Exail says it pairs a compact design with a more accessible price than its larger systems, and that the wider Marins family is used by more than 50 navies.","The release gives no dimensions, weight, power draw, price, test conditions, delivery dates or customers, and terms such as 'military-grade' are the manufacturer's own."],"cav":"Manufacturer press-release material, not independently tested; the drift figure is a claimed maximum under unstated conditions.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/exail-unveils-marins-m1-compact-ins-for-smaller-naval-platforms-and-uxvs/"]]},
{"id":"pn-aramuss-2026","r":"USA","c":"Naval","st":"Official claim","time":"26 Oct","t":"Brazilian Navy to hold second ARAMUSS unmanned-maritime-systems event at Aratu Naval Base on 9-13 November","s":"Poder Naval, a Portuguese-language Brazilian blog, relays the Navy announcement; the programme lists demonstrations, a symposium and named companies.","p":["The Brazilian Navy will hold the second edition of ARAMUSS (Aratu Maritime Unmanned Systems Simulation) at the Aratu Naval Base in Salvador, Bahia, from 9 to 13 November 2026, according to Poder Naval, a Portuguese-language Brazilian naval blog, which published the announcement on 26 October. It is organised by the Navy's 2nd Naval District Command and covers unmanned maritime systems and dual-use technology for defence, research, environmental monitoring, maritime security and the blue economy.","The programme includes live operational demonstrations, a technology exhibition, 'ARAMUSS Talks' on robotics, artificial intelligence and autonomy, and a symposium on unmanned systems on 9-10 November. Companies listed are AEL/Elbit, Atech, Kongsberg Naval, Leonardo, Safran, Sonardyne and Xmobots, alongside the universities USP, UFBA, UFRJ and UnB and the SENAI CIMATEC institute. The first edition, in 2025, reportedly drew more than 2,000 visitors.","This item is based on one Portuguese-language blog post that relays an organiser's announcement; no technical results or contracts are involved."],"cav":"Event announcement relayed by a Portuguese-language blog; the participant list and programme are the organiser's and may change.","src":[["Poder Naval (Portuguese)","https://www.naval.com.br/blog/2026/10/26/marinha-do-brasil-realiza-2a-edicao-da-aramuss-em-salvador-ba/"]]},
{"id":"cmsi-quarterly-review-1-8","r":"Far East","c":"Research","st":"Analysis","time":"25 Oct","t":"CMSI Quarterly Review 1.8 (Fall 2026): 20th-anniversary issue lists new reports on the PLA Navy and sets a May 2027 conference","s":"The US Naval War College's China Maritime Studies Institute issue was dated 22 October; Andrew Erickson posted it on 25 October.","p":["The China Maritime Studies Institute (CMSI) at the US Naval War College has released Volume 1, Issue 8 of its CMSI Quarterly Review (Fall 2026), dated 22 October, which Andrew S. Erickson posted on his blog on 25 October. In the director's notes, Christopher Sharman says CMSI marked its 20th anniversary on 24 September with a lecture by Adm. Gary Roughead (Ret.) and Dr. Peter Dutton, and has launched a multimedia webpage. A book based on CMSI's 2023 conference, Chinese Undersea Warfare: Narrowing the Gaps (25 chapters), is to be published by the Naval War College Press.","The issue's contents index China Maritime Reports 56 to 59. These cover the PLA Navy's influence in the Central Military Commission (Natalie Shen, Joel Wuthnow), the Party Standing Committee (Jeffrey Becker, Brian Waidelich), its Discipline Inspection Commission (Eric Hundman, Connor Akiyama) and submariner careers and training (Phil Yu, Benjamin Rosen). CMSI Notes 22 to 25 are listed, including Ryan Martinson on the Lan Hai 201 mission and a new PLA 'preclusion' concept, and Ian Easton on PLA views of US concepts for defending Taiwan. Translations 29 to 37 are also indexed.","CMSI's next conference, 'Military-Civil Fusion at Sea: China's Asymmetric Advantage?', is set for 11-12 May 2027 in Newport. This item summarises the issue's contents list, not the findings of each paper; several of these reports have been covered separately on this site."],"cav":"Summary of an issue index and director's notes; the individual papers' conclusions were not reviewed here.","src":[["Andrew S. Erickson blog","https://www.andrewerickson.com/2026/10/cmsi-quarterly-review-1-8-fall-2026-new-multimedia-webpage-pix-account-2027-conference-info/"],["USNWC Digital Commons","https://digital-commons.usnwc.edu/cmsi-quarterly-review/vol1/iss8/1/"]]},
{"id":"cmsi-translation-37-type039b","r":"Far East","c":"Submarines","st":"Analysis","time":"20 Oct","t":"CMSI Translations #37: Chinese article traces the technical path to the PLA Navy's Type 039B submarine","s":"A translated Chinese-language paper by Yin He, published by the US Naval War College's China Maritime Studies Institute.","p":["CMSI Translations #37, published by the China Maritime Studies Institute at the US Naval War College on 20 October, translates a Chinese article by Yin He titled 'The Technical Evolution and Future Development of the Chinese Navy's Third Generation Conventional Submarine'. It is one of the institute's series of translations of PLA-related writing.","According to the abstract, the Navy began researching and developing a new generation of submarine technologies while the Type 039A was still being built, guided by expected advances in conventional submarines, operational needs and perceived threats. By about 2010, it says, several key technologies and systems had either broken through or been fully developed, which allowed construction of the Type 039B to begin, marking the start of large-scale production of the core conventional submarine force for the 2020s.","This is a Chinese author's account as translated, and the abstract gives no numbers on hulls built or capabilities; CMSI publishes translations for study and does not endorse their claims."],"cav":"Based on the abstract page only; the full text was not reviewed, and the claims are the Chinese author's.","src":[["USNWC Digital Commons","https://digital-commons.usnwc.edu/cmsi-translations/92/"]]},
{"id":"babcock-arrowhead140-us-navy","r":"Europe","c":"Naval","st":"Reported","time":"27 Oct","t":"Babcock plans to pitch its Arrowhead 140 (Type 31) frigate to the US Navy, reportedly with HII as a US builder","s":"An expression of interest is expected before the end of October; the Navy's assessment is due 12 November and no contract exists.","p":["Babcock intends to offer the Arrowhead 140 general-purpose frigate, the design behind the Royal Navy's Type 31 class, for the US Navy's future small-combatant effort, The War Zone reported on 27 October, citing The Telegraph and Navy Lookout. The company has reportedly held preliminary talks with Pentagon officials and is expected to submit an expression of interest before the end of October.","Babcock has no US shipyard, so the approach is said to involve Huntington Ingalls Industries building the ship under licence, with Babcock supplying design and engineering. The two already cooperate on Virginia-class submarine components. The Navy is looking at smaller surface combatants after cancelling the Constellation-class frigate; reported rivals include Japan's Mogami class, South Korea's Chungnam class and Turkey's Istanbul class, plus Fincantieri and Rheinmetall's GMF 140. The Navy's assessment is due by 12 November.","The Arrowhead 140 is about 455 ft long with a displacement of roughly 5,700 tonnes, diesel propulsion and a speed above 28 knots. The article lists caveats: the Type 31 is not yet in operational service, no US weapons fit has been established, serious changes sank the Constellation programme, and an August presidential memorandum limits overseas construction to no more than two ships tied to US shipbuilding investment."],"cav":"Based on press reports of Babcock's plans; the bid, the HII role and the timetable are not confirmed by the companies or the Navy.","src":[["The War Zone","https://www.twz.com/sea/british-type-31-frigate-variant-offered-to-the-u-s-navy"]]},
{"id":"safran-aasm-hammer-2000","r":"Europe","c":"Munitions","st":"Reported","time":"27 Oct","t":"Safran reportedly plans up to 2,000 AASM Hammer guided bombs a year from 2027, up from 200 in 2022","s":"Militarnyi, citing La Tribune, gives forward-looking targets; 2026 output is expected, not confirmed, at 1,400.","p":["Safran aims to raise output of the AASM Hammer guided bomb kit to as many as 2,000 a year from 2027, Militarnyi reported on 27 October, citing the French business daily La Tribune. Production was 200 a year in 2022 and is expected to reach 1,400 in 2026. The report says Safran plans to double its defence production between 2025 and 2030, with seven projects by 2028 to expand capacity in Europe and the United States.","Other figures quoted: rocket-engine output tripled between 2022 and 2026 with a tenfold goal by 2030; missile seeker output rose sixfold and Geonix inertial navigation output sevenfold over four years; Rafale's M88 engine output is to double between 2025 and 2029. A Safran–MBDA consortium was selected to develop the Thundart rocket launcher system (range up to 150 km), with 26 launchers and 300 munitions planned. A new Safran factory in Germany and a TR40 turbojet line in Texas by 2028 are also mentioned.","These are targets relayed second-hand; the report gives no investment amounts or customer details."],"cav":"Secondary report of company plans; figures for 2026 and later are expectations, and Thundart is at development-selection stage.","src":[["Militarnyi (citing La Tribune)","https://militarnyi.com/en/news/safran-to-produce-2-000-aasm-hammer-bombs-annually/"]]},
{"id":"nl-cv90-engineer-vehicles","r":"Europe","c":"Land","st":"Official claim","time":"27 Oct","t":"Netherlands to buy more CV90s plus bridge-layers, engineer and recovery vehicles for its brigades","s":"The Dutch defence ministry's letter to parliament gives no quantities, prices or delivery dates.","p":["The Royal Netherlands Army will receive additional CV90 infantry fighting vehicles, Leguan tank bridge-layers, new engineer vehicles and heavy recovery platforms, Militarnyi reported on 27 October, based on a written notice from State Secretary for Defence Derk Boswijk to parliament dated 26 October. The stated aim is to raise the combat power of the heavy and medium infantry brigades.","The extra CV90s are for a new mechanised battalion at Budel. The Leopard 2-based Kodiak engineer vehicles are to be replaced because of reliability and protection problems. Leguan bridge-layers (Leopard 2 chassis, one 26 m or two 14 m bridges) are being bought through an intergovernmental contract with Germany. Flensburger Fahrzeugbau will supply Wisent 2 recovery vehicles and its Armored Combat Support Vehicle, already in Norwegian service, in command, medical, minelayer and driver-training versions; Van Halteren Technologies will do final assembly in the Netherlands.","Quantities, contract values and delivery timelines are not given, and the performance figures quoted are general manufacturer specifications."],"cav":"Relayed from a ministry letter by a secondary outlet; no numbers of vehicles or costs are stated.","src":[["Militarnyi","https://militarnyi.com/en/news/the-netherlands-to-procure-additional-cv90-ifvs-and-engineering-equipment-to-strengthen-brigades/"]]},
{"id":"uss-colorado-srf-west","r":"Oceania","c":"Submarines","st":"Official claim","time":"27 Oct","t":"US Navy picks USS Colorado as first Virginia-class boat for AUKUS rotations at HMAS Stirling from late 2027","s":"Submarine Rotational Force-West is to host up to four US and one UK attack submarines in Western Australia.","p":["The US Navy has selected the Virginia-class attack submarine USS Colorado (SSN 788) as the first boat assigned to Submarine Rotational Force-West, starting in late 2027, Naval Today reported on 27 October. The announcement came ahead of a US Submarine Maintenance Period meant to show Australia's growing ability to maintain US and UK nuclear-powered submarines.","SRF-West is expected to host up to four US fast-attack submarines and one UK boat on a rotational basis at HMAS Stirling in Western Australia. The programme is intended to help Australia eventually operate, maintain and regulate its own nuclear-powered submarines under AUKUS Pillar I. It operates under agreements among the three countries, including the US–Australia Force Posture Agreement, and must comply with the Non-Proliferation Treaty and the Treaty of Rarotonga.","An unnamed official called the selection a significant milestone. The 'up to' numbers are not firm commitments, and no precise arrival date, cost or infrastructure detail was given."],"cav":"Based on a short report quoting an unnamed official; arrival date beyond 'late 2027' and the final rotation numbers are not specified.","src":[["Naval Today","https://www.navaltoday.com/2026/10/27/first-virginia-class-submarine-selected-for-aukus-rotational-force"],["Army Recognition","https://www.armyrecognition.com/news/navy-news/2026/us-navy-selects-uss-colorado-as-first-nuclear-submarine-for-aukus-rotations-in-australia-from-2027"]]},
{"id":"blackbeard-f16-feasibility","r":"USA","c":"Hypersonics","st":"Company claim","time":"27 Oct","t":"Castelion to study fitting its Blackbeard hypersonic missile to the F-16","s":"The work is a feasibility assessment under an existing Air Force Research Laboratory contract; the modification's value was not disclosed.","p":["Castelion will assess whether its Blackbeard hypersonic missile can be integrated on the F-16, Militarnyi reported on 27 October, based on the company's announcement of a contract modification with the Air Force Research Laboratory. The financial terms were not disclosed. AFRL earlier raised the baseline contract by $16.4 million to a total of $37.2 million, running through June 2028 and focused on a precision long-range strike weapon built for high-volume production.","Blackbeard was previously associated with the Navy's F/A-18E/F Super Hornet and the M142 HIMARS launcher. Earlier tests mounted two missiles on a carrier fighter; the released footage showed carriage only, not a launch. Up to four missiles are said to fit one Super Hornet, and the report cites Navy procurement plans for more than 4,000 missiles in fiscal years 2028–2031, which is a plan rather than a signed order.","The article gives no range, speed or warhead data."],"cav":"A feasibility study is not a commitment to integrate; the 4,000-missile figure is a planning number and no launch from any aircraft has been shown.","src":[["Militarnyi","https://militarnyi.com/en/news/blackbeard-hypersonic-missile-to-be-integrated-on-f-16-fighters/"],["Army Recognition","https://www.armyrecognition.com/news/aerospace-news/2026/u-s-air-force-expands-f-16-long-range-strike-potential-with-castelion-blackbeard-hypersonic-missile"]]},
{"id":"kadena-byd-ban","r":"Far East","c":"Security","st":"Official claim","time":"27 Oct","t":"US military bars BYD vehicles from Kadena Air Base in Okinawa, citing security risks","s":"A base spokesperson says the risks could not be adequately mitigated; BYD says it will challenge its Pentagon listing.","p":["The US military will bar vehicles made by Chinese carmaker BYD from Kadena Air Base in Okinawa, The Defense Post reported on 27 October, following a Reuters report of 23 October. Base spokesperson Lt. Col. Alli Stormer said the risks posed by the vehicles could not be adequately addressed. Kadena is a major hub for US air operations along Japan's southwestern island chain.","In June 2026 the Pentagon placed BYD on a list of companies it considers linked to China's military, alongside NIO, Baidu and Alibaba. BYD rejected the designation and said it will challenge it through administrative and legal channels. The article notes that Beijing restricted Tesla vehicles at some government compounds in 2021 over camera concerns before lifting the limits in 2024.","The report does not give an effective date, say whether private vehicles are covered, or describe the specific security risks."],"cav":"A short report relying on one Reuters story; the nature of the risk and the scope of the ban are not specified.","src":[["The Defense Post","https://thedefensepost.com/2026/10/27/us-bans-byd-vehicles-okinawa/"]]},
{"id":"serpukhov-75th-arsenal-damage","w":"Ukraine","c":"Strikes","st":"Reported","time":"27 Oct","t":"Satellite images reportedly show air-defence repair workshops at Serpukhov's 75th Arsenal damaged after a 22 October drone raid","s":"Militarnyi relies on OSINT imagery; no Russian statement, casualty figure or damage assessment is cited.","p":["Two workshops and an adjacent hangar at the 75th Arsenal in Serpukhov, Moscow Region, were damaged in a drone attack on 22 October, Militarnyi reported on 27 October, citing satellite images from the monitoring group Exilenova+ and the OSINT project CyberBoroshno. A UAV-threat warning was in force from 21:21 on 21 October until 04:12 on 22 October, and a fire was reported on the grounds.","The damaged buildings, numbered 24 and 25, are described as housing lines for dismantling, diagnosing and overhauling air-defence equipment. The plant services Russian ground-forces systems such as the S-300V, Buk-M1/M2 and Tunguska-M, plus radars and command posts, and falls under the Defence Ministry's missile and artillery directorate.","The report is from a single Ukrainian outlet, gives no official Russian comment and does not state how badly production was affected."],"cav":"Single-outlet report based on unverified satellite and social-media imagery; the attacker is implied rather than named, and the importance of the workshops is the outlet's characterisation.","src":[["Militarnyi","https://militarnyi.com/en/news/moscow-air-defense-repair-workshops-75th-arsenal-damaged/"]]},
{"id":"fairford-plot-charges","w":"Iran and Gulf","c":"Security","st":"Reported","time":"27 Oct","t":"Two men charged in UK over alleged plot against RAF Fairford; one accused of assisting Iranian intelligence","s":"Charges under the National Security Act 2023 are unproven; police call Iranian involvement 'highly likely'.","p":["Two London men aged 24 have been charged over an alleged plot to attack RAF Fairford in Gloucestershire, a base used by US forces, Militarnyi reported on 27 October, citing Sky News and the Crown Prosecution Service. Mohmed Abdulkarim is accused of assisting an Iranian intelligence service, and Nouman Essghir of entering a prohibited place for a purpose prejudicial to the UK. A first hearing was due at Westminster Magistrates' Court on 27 October.","Essghir was among those detained on 27 September near the airfield, where police stopped three vans and found petrol but no explosive devices. Counter Terrorism Policing considers Iranian involvement 'highly likely', while motives and circumstances are still being established. Militarnyi notes that US strategic bombers left Fairford in early October, which President Trump attributed to security threats; British authorities said the base remained secure.","All the charges are allegations; no pleas or hearing outcomes are reported."],"cav":"Charges are unproven and the Iran link is a police assessment. Secondary report; the headline's word 'attack' describes an alleged plot with no explosives found.","src":[["Militarnyi","https://militarnyi.com/en/news/two-men-charged-over-attack-on-raf-fairford-one-accused-of-assisting-iranian-intelligence/"]]},
{"id":"un-coi-gaza-post-ceasefire","w":"Gaza","c":"Politics","st":"Reported","time":"27 Oct","t":"UN inquiry tells General Assembly Israel's actions in Gaza continued to amount to genocide after the October 2025 ceasefire","s":"The Commission of Inquiry cites 1,431 deaths since the ceasefire; the article carries no Israeli response.","p":["The UN Independent International Commission of Inquiry on the occupied Palestinian territory told the General Assembly that Israel continued to commit genocide in Gaza after the October 2025 ceasefire, The Defense Post reported on 27 October. It also found war crimes and crimes against humanity across the occupied territory. Commission chair Srinivasan Muralidhar presented the findings, as relayed by Anadolu Agency.","The commission said Israeli airstrikes, artillery, drones and gunfire after the ceasefire killed more than 1,431 people, including at least 300 children and 130 women, and wounded 5,026. It said expanding Israeli control kept causing civilian casualties near the 'Yellow Line'. Across the occupied territory it gave a toll of more than 75,000 Palestinians killed since 7 October 2023, including at least 21,500 children. For the West Bank it recorded 254 Palestinians killed in airstrikes to 30 September and 34,176 people displaced this year.","The article does not include an Israeli response, and the casualty figures were not independently verified in it. The genocide finding is the commission's conclusion, not a court ruling."],"cav":"Secondary report of a UN commission's findings via Anadolu; figures are the commission's and unverified here, and Israel's position is not given.","src":[["The Defense Post","https://thedefensepost.com/2026/10/27/israel-genocide-gaza-ceasefire-un/"]]},
{"id":"ru-rosoboronexport-africa-summit","r":"Russia","c":"Exports","st":"Official claim","time":"27 Oct","t":"Rosoboronexport to show drones, anti-drone systems and special-forces kit at the Russia–Africa Summit in Moscow","s":"TASS relays the exporter's press release for the 28–29 October event; capabilities are manufacturer claims.","p":["Russia's state arms exporter Rosoboronexport will take part in the third Russia–Africa Summit and Economic and Humanitarian Forum on 28–29 October at Moscow's Gostiny Dvor, TASS reported on 27 October, citing the company's press service. It says it will show security solutions and a framework for joint development and production at customers' sites.","The listed exhibits include the Kub-2E loitering munition system, the Skat-350M reconnaissance drone, the Lancet-E strike system and the S350M-E drone. An 'Anti-Drone Dome' concept combines Pantsir-SMD-E and Pantsir-S1M air defences, Verba man-portable missiles, the TKB-1167 and ZAK-30 Citadel anti-drone guns, and electronic-warfare sets such as Silok and Repellent-Patrol. Special-forces items include Kalashnikov rifles, the Shturm rifle and a sniper system, and there are also cybersecurity and open-source intelligence products.","This is a state exporter's own description of its offer; no contracts, buyers or performance data are given, and the claims are unverified."],"cav":"Russian state-media relay of a company press release; capabilities and any export interest are unverified.","src":[["TASS","https://tass.com/defense/2208823"]]},
{"id":"ru-perekop-pointe-noire","r":"Russia","c":"Naval","st":"Official claim","time":"27 Oct","t":"Russian Baltic Fleet training ship Perekop calls at Pointe-Noire, Congo, on a 30,000-mile cadet cruise","s":"TASS cites the fleet press service; the deployment began in July and runs to mid-December with 11 foreign port calls.","p":["The Baltic Fleet training ship Perekop docked at Pointe-Noire in the Republic of the Congo on 27 October, TASS reported, citing the fleet's press service. A welcome ceremony was attended by Russia's chargé d'affaires, Sofia Sitnikova, and representatives of the Congolese naval command; crew members showed guests the ship, and a football match and a visit by Congolese sailors were planned.","Cadets of the Admiral Ushakov Baltic Naval Institute are doing navigation training aboard, together with naval students from Namibia who study at the Kuznetsov Naval Academy. The deployment started in early July and runs to mid-December, covering about 30,000 nautical miles via the Northern Sea Route, four oceans and 14 seas, with calls at 11 foreign ports.","The details come only from the Russian fleet's own press service and have not been independently confirmed."],"cav":"Russian military press-service account relayed by state agency TASS; unverified by independent sources.","src":[["TASS","https://tass.com/defense/2208387"]]},
{"id":"nn-sh-defence-naval-group-mou","r":"Europe","c":"Naval","st":"Company claim","time":"25 Oct","t":"SH Defence and Naval Group sign MoU on modular mission systems and launch-and-recovery gear","s":"The memorandum, signed in Copenhagen on 21 October, sets a framework only; no value, quantities or specific programme are disclosed.","p":["SH Defence, part of SH Group, has signed a memorandum of understanding with France's Naval Group to strengthen cooperation on modular solutions for naval operations, Naval News reported on 25 October. The MoU was signed in Copenhagen on 21 October at an industry event hosted by Naval Group.","It sets up a framework for exploring opportunities in mission modularity, containerised mission solutions, and launch and recovery systems, including for unmanned systems and diving operations. SH Defence says it works with platform providers and capability partners to integrate capabilities into naval platforms. Its vice president, Dennis Bernhardt Kristensen, said the company was proud to deepen its cooperation with Naval Group.","The article draws on an SH Defence press release and gives no financial figures, contract sizes, quantities or named ship programmes."],"cav":"Company press-release material; an MoU is a statement of intent, not a contract, and no programme, customer or timeline is named.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/sh-defence-strengthens-cooperation-with-naval-group/"]]},
{"id":"pn-npa500br-patrol-ships","r":"USA","c":"Naval","st":"Reported","time":"24 Oct","t":"Brazilian blog says three NPa500BR patrol ships are in a financing portfolio approved in July, but no shipyard or price is set","s":"Poder Naval (a Portuguese-language blog) says the 500-ton design is complete; the funding approval is only a first step.","p":["Poder Naval, a Portuguese-language Brazilian naval blog, reported on 24 October that three 500-ton NPa500BR patrol ships were included in a portfolio approved by the board of the Merchant Navy Fund (CDFMM) on 16 July 2026. They were among 15 proposals cleared at the board's 63rd ordinary meeting, which the Ministry of Ports and Airports announced on 17 July; the portfolio also covers other ship construction, modernisation and repair and port infrastructure. The project is led by the state naval-projects company Emgepron.","The design was conceived by the Navy's naval systems design centre (CPSN), with engineering owned by Emgepron, and is meant to replace ageing patrol vessels gradually. Listed roles are patrol, inspection and enforcement in Brazilian jurisdictional waters, protecting oil and gas platforms, search and rescue, and civil-defence support. A defence-industry catalogue cited by the blog gives a maximum displacement of 587 tonnes, 20 days' endurance, accommodation for 43 people and a 30-year design life. Basic engineering is reportedly finished and was certified by an IACS-member classification society.","Approval is only one step: beneficiaries have 450 days to sign contracts with financial agents, extendable by 180 days to a maximum of 630. The July announcement did not give the ships' value, the shipyard or construction and delivery dates. The blog links the ships to the PRONAPA programme under the Novo PAC, which plans eight nationally designed patrol ships and the resumption of three Macaé-class ships at Rio de Janeiro's Navy arsenal."],"cav":"Based on one Portuguese-language blog post that itself relies on a July announcement and a defence-industry catalogue; the blog's reader comments were not used. Cost, builder and delivery dates are not stated.","src":[["Poder Naval (Portuguese)","https://www.naval.com.br/blog/2026/10/24/fmm-aprova-projeto-de-tres-navios-patrulha-para-a-marinha-do-brasil/"]]},
{"id":"ru-kherson-alyoshki-ceasefire","r":"Russia","c":"Operations","st":"Official claim","time":"27 Oct","t":"Russian MoD says its forces halted fire in the Kherson direction from 04:00 Moscow time for a humanitarian operation at Alyoshki","s":"TASS relays the Russian Defense Ministry's account; no Ukrainian response, duration or details of the operation are given, and the claims are unverified.","p":["TASS reported on 27 October that Russian forces ceased fire in the Kherson direction at 04:00 Moscow time (01:00 GMT), citing a Russian Defense Ministry statement. The stated purpose is to prepare a humanitarian operation near the town of Alyoshki in Kherson Region. The ministry said Chief of the General Staff Valery Gerasimov had announced the arrangement on 23 October. The report does not say how long the pause lasts.","The ministry accused Ukrainian forces of shelling roads leading to Alyoshki, destroying vehicles with drones and mining roads, which it says blocks civilian evacuation and deliveries of food and medicine. It claimed that over the previous week Ukraine carried out 18 artillery strikes and more than 120 drone strikes on the town and its approaches. Kremlin spokesman Dmitry Peskov had called the situation in Alyoshki critical in September, and on 26 October said the arrangement could set a precedent for similar missions elsewhere, praising what he called a direct and constructive US role in coordinating it.","These are Russian state claims. The TASS item contains no Ukrainian statement, no independent confirmation of conditions in Alyoshki, and an unclear reference to Russian troops having 'devised over 300 landmines'."],"cav":"Russian MoD and Kremlin statements relayed by state agency TASS; the allegations against Ukraine, the strike counts and the humanitarian situation are unverified. Duration, scope and Ukrainian position are not reported.","src":[["TASS","https://tass.com/defense/2208287"]]},
{"id":"tehran-mecca-quad-meeting","w":"Iran and Gulf","c":"Diplomacy","st":"Reported","time":"26 Oct","t":"Saudi, Pakistani and Turkish officials meet Iranian leaders in Tehran as the US weighs resuming strikes","s":"The War Zone reports the first four-way meeting since the August Mecca Joint Defense Agreement; the joint statement was sparse and US intentions remain unclear.","p":["Officials from Saudi Arabia, Pakistan and Turkey met Iranian leaders in Tehran on 26 October in what The War Zone calls a last-ditch effort to prevent renewed all-out fighting between Iran and the US and Israel. Named participants were Saudi Defense Minister Prince Khalid bin Salman, Pakistani Army Chief Field Marshal Asim Munir, Turkish intelligence chief Ibrahim Kalın and Iran's Supreme National Security Council secretary Mohsen Rezaei; the delegations also met President Masoud Pezeshkian. It was the first such meeting since the four formed the Mecca Joint Defense Agreement in August. The joint statement said only that they agreed to continue dialogue, and Iranian state TV quoted Rezaei saying the talks were 'very good'. Reports say Iranian officials told Munir there would be no talks with Washington until Tehran's demands are met.","Washington's posture is mixed. President Trump said on 25 October he must decide whether to 'finish it off' or make a deal, and that there would be no strike that day. CNN, citing two US officials, reported US forces could launch major operations within 96 hours of an order, and the Wall Street Journal reported that Iranian preparations to attack Americans had reached advanced stages. TWZ also reports, without naming a source, that Trump told aides he expects to resume strikes after the 3 November midterms.","Background: a 14-point memorandum brokered by Qatar and Pakistan on 17 June extended a ceasefire by 60 days but later collapsed. Brent crude was above $115 on Monday evening. CENTCOM says it has helped Gulf partners export over 1.5 billion barrels since summer and cleared shipping lanes of IRGC mines; TWZ says it cannot verify this."],"cav":"Much of the US-side detail is from anonymous officials and other outlets cited second-hand. The substance of the Tehran talks is unpublished beyond brief statements, and CENTCOM's shipping figures are unverified.","src":[["The War Zone","https://www.twz.com/news-features/last-ditch-meeting-in-iran-seeks-to-stave-off-a-restart-of-all-out-fighting-in-the-region"]]},
{"id":"iran-claims-lucas-bandar-abbas","w":"Iran and Gulf","c":"Drones","st":"Official claim","time":"26 Oct","t":"Iran claims its air defences downed a US LUCAS attack drone over Bandar Abbas","s":"The claim comes via Tasnim on 25 October; Army Recognition notes no wreckage, imagery or US response for this incident.","p":["Iran's Tasnim news agency reported on 25 October that Iranian Army air-defence units intercepted and destroyed a US LUCAS one-way attack drone over Bandar Abbas near the Strait of Hormuz, citing a military statement. Army Recognition relayed the claim on 26 October without independent confirmation or a US comment on this incident.","The outlet notes that CENTCOM acknowledged using LUCAS at the start of Operation Epic Fury on 28 February 2026. Iran has made other claims about US unmanned systems, including capturing an Anduril Dive-LD underwater vehicle in September and a REMUS 600, and shooting down an MQ-9 Reaper and an earlier LUCAS; Army Recognition says US officials have disputed several of them, without saying which.","The article gives performance figures for the FLM 136 on which LUCAS is reportedly based: about 800 km range, 18 kg maximum payload, roughly 82 kg takeoff weight and an estimated unit cost near $35,000. These describe the original configuration and are estimates."],"cav":"An Iranian state-media claim with no evidence published. Specifications refer to the base FLM 136 design, not necessarily the LUCAS variant, and the cost is an estimate.","src":[["Army Recognition","https://www.armyrecognition.com/news/army-news/2026/iran-claims-it-shot-down-u-s-lucas-attack-drone-used-in-strikes-near-the-strait-of-hormuz"]]},
{"id":"arrw-production-contract-694m","r":"USA","c":"Hypersonics","st":"Official claim","time":"26 Oct","t":"US Air Force awards Lockheed Martin $694m to put the ARRW hypersonic missile into production","s":"The contract was awarded on 29 September and announced on 26 October; quantities and delivery dates are not disclosed.","p":["The US Air Force announced on 26 October a $694 million contract with Lockheed Martin for production of the AGM-183A Air-launched Rapid Response Weapon (ARRW), awarded on 29 September under the department's Enterprise-Wide Agile Acquisition Contract, The War Zone reported. Air Force Secretary Troy Meink called it a turning point in the advanced weapons roadmap, and the service said the boost-glide programme is moving from prototyping and testing into production.","The Air Force had moved to cancel ARRW in 2023 after a series of failed tests, shifting resources to the air-breathing Hypersonic Attack Cruise Missile (HACM), but later budget documents showed the programme was revived. The FY2027 request seeks $296 million for ARRW Increment 2, which would add a terminal seeker and data link to hit moving targets such as ships. A live AGM-183A was launched from a B-52 near Guam in 2024; B-1 integration has been disclosed.","The report says it is unclear how many missiles will be built or when they will be delivered, and Increment 2 is still at an early technology stage."],"cav":"Contract value and dates come from the Air Force announcement as relayed by The War Zone. Quantity, unit cost and delivery schedule are undisclosed, and the anti-ship role is the author's assessment.","src":[["The War Zone","https://www.twz.com/air/usaf-orders-arrw-hypersonic-missile-into-production-the-same-weapon-it-nearly-cancelled"]]},
{"id":"serbia-student-list-arms-exports","r":"Europe","c":"Politics","st":"Reported","time":"26 Oct","t":"Serbia's election winners say they want to end arms sales to countries at war, which could affect ammunition reaching Ukraine","s":"Militarnyi cites Reuters; the Student List has not formally set an arms-export policy and the new government is not yet formed.","p":["Leading figures of Serbia's Student List movement, which won the 25 October parliamentary election, have called for an end to arms sales to countries where wars are under way, Militarnyi reported on 26 October, citing Reuters. The restriction could also reach sales to Western buyers that pass the weapons on to Ukraine. The movement, formed by students opposed to President Aleksandar Vučić's government, reportedly took about 52–53% of the vote and roughly 138–141 of 250 seats.","The report says the movement has not officially presented a specific policy on arms for Ukraine and the government has not yet been formed. Serbian ammunition has long reached Ukraine indirectly: Ukrainian forces use Serbian ER Grad 2000 122 mm rocket shells and received a shipment of 30 mm AGS-17 grenades. In 2025 Serbian industry opposed halting sales, and Vučić said he had no objection to selling to intermediaries who ship to Ukraine."],"cav":"Based on statements by campaign figures relayed second-hand. Seat and vote shares are given as ranges, and no policy has been adopted.","src":[["Militarnyi (citing Reuters)","https://militarnyi.com/en/news/serbia-election-winners-want-to-halt-arms-exports-to-ukraine/"]]},
{"id":"thailand-iwi-arbel-c-uas","r":"Far East","c":"Counter-drone","st":"Company claim","time":"26 Oct","t":"Thailand fields Israeli Arbel fire-control kits on M4 rifles for counter-drone use","s":"It is described as the system's first deployment in Southeast Asia; the number of rifles and contract value are not disclosed.","p":["Thailand has put Israel Weapon Industries' Arbel counter-UAS system into operational service, The Defense Post reported on 26 October, citing Janes. IWI delivered the equipment and retrofitted it on site earlier this year to Thailand's existing M4 rifles by replacing their lower receivers, according to Janes.","The modification is described as plug-and-play: soldiers keep their 5.56 mm rifles and optics and gain automated fire control for engaging aerial threats by day and night. The report calls it the first Arbel deployment in Southeast Asia. It gives no quantities, contract value, unit allocation or performance data such as engagement range."],"cav":"Secondhand from Janes and an IWI-supplied photo; effectiveness against drones is not demonstrated in the report.","src":[["The Defense Post","https://thedefensepost.com/2026/10/26/thailand-anti-drone-rifles-israel/"]]},
{"id":"m270a1-rocket-valley-counterfire","r":"Far East","c":"Land","st":"Reported","time":"26 Oct","t":"US Army M270A1 crews rehearse rapid reload and counterfire at Rocket Valley in South Korea","s":"Based on DVIDS imagery from 20 October; the munition fired was not identified.","p":["Soldiers of Bravo Battery, 1st Battalion, 38th Field Artillery Regiment, 210th Field Artillery Brigade fired the M270A1 multiple launch rocket system at the Rocket Valley Training Area in South Korea, Army Recognition reported on 26 October from imagery DVIDS released that day and dated 20 October. The training evaluated crew proficiency, rapid reloading and overall readiness.","Army Recognition stresses that fast reloading supports sustained fire and survivability, since a launcher that stays in one place is exposed to counterfire. The unit's stated mission includes counter-preparation and counterfire in support of Combined Forces Command, destroying long-range artillery and engaging time-sensitive targets. The M270A1 can fire GMLRS rockets and ATACMS missiles, though DVIDS does not say what was used."],"cav":"The article is analysis built on a short official photo release; no munition type, range or reload times were published.","src":[["Army Recognition","https://www.armyrecognition.com/news/army-news/2026/u-s-army-sharpens-m270a1-counterfire-readiness-for-high-tempo-operations-on-korean-peninsula"]]},
{"id":"uk-ssn-aukus-12-boats-readiness","r":"Oceania","c":"Submarines","st":"Analysis","time":"26 Oct","t":"UK reaffirms plan for up to 12 SSN-AUKUS submarines while Astute availability and Barrow capacity stay in question","s":"A minister's 12 October written answer stopped short of committing funding after the 2027 spending review; Army Recognition's analysis flags industrial limits.","p":["Armed forces minister Luke Pollard reaffirmed on 12 October that the UK intends to acquire up to 12 SSN-AUKUS attack submarines, up from seven Astute-class boats, Army Recognition reported on 26 October. He did not say whether all 12 would be funded after the 2027 spending review. The UK has committed about £4 billion to development and £6 billion to industrial expansion; steel cutting on the first boat is planned for 2027, with service entry in the late 2030s and a target of one boat every 18 months.","The analysis notes that, as of September, none of the five operational Astutes was confirmed deployed because of maintenance and readiness constraints. Barrow must finish HMS Agincourt, build four Dreadnought-class submarines and start SSN-AUKUS work in parallel, with a workforce meant to grow from 47,000 to 65,000 by 2030.","For Australia, the article says it plans three to five US Virginia-class boats before its own SSN-AUKUS boats in the early 2040s, with US Submarine Rotational Force-West starting at HMAS Stirling in 2027. It puts US Virginia-class output at about 1.2 boats a year against an estimated need of 2.33. Several figures, such as deployment ratios, are the author's illustrations rather than official data."],"cav":"Analysis piece; the deployment arithmetic and some readiness statements are the author's, not official. Funding beyond the 2027 review is not committed.","src":[["Army Recognition","https://www.armyrecognition.com/news/navy-news/2026/uk-reaffirms-plan-to-acquire-up-to-12-ssn-aukus-submarines-to-strengthen-defense-in-north-atlantic"]]},
{"id":"nn-yorktown-cps-magazine","r":"USA","c":"Hypersonics","st":"Reported","time":"26 Oct","t":"Navy plans earth-covered hypersonic missile magazine at Yorktown for Zumwalt and Virginia-class ships","s":"Naval News reads NAVFAC requirements for a two-bay Conventional Prompt Strike store; cost and schedule are not given.","p":["The US Navy plans a storage facility for Conventional Prompt Strike (CPS) hypersonic weapons at Naval Weapons Station Yorktown, Virginia, Naval News reported on 26 October, based on NAVFAC Mid-Atlantic requirements documents. The main structure would be a two-bay, earth-covered Containerized Large Weapons Storage magazine, with two mechanical buildings for climate control and power and an emergency generator building. Each bay would have a 25-ton bridge crane, and the design includes reinforced concrete, ordnance grounding and lightning protection.","The site would serve CPS on Zumwalt-class destroyers and on Block V and VI Virginia-class submarines with the Virginia Payload Module. Each such boat has four canisters holding either seven Tomahawk-sized weapons or three CPS rounds, so 12 CPS rounds per boat; the Navy now designates them SSGNs. The article notes 19 such boats are planned, with the first of nine Block V boats due in 2028. For the Zumwalt class, a July 2026 GAO report put modernisation costs about $200 million higher, at roughly $2 billion, and USS Zumwalt is delayed about ten months with a first CPS firing expected in 2027.","Naval News links the choice of Yorktown to the Atlantic-based Virginia boats at Norfolk and a possible Zumwalt move to the East Coast; the latter is only suggested, not confirmed."],"cav":"Based on procurement documents as read by Naval News. The facility's cost, build schedule and completion date are not stated, and the Zumwalt homeport shift is speculation.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/us-navy-hypersonic-facility-nws-yorktown/"]]},
{"id":"nn-france-smokers-kamikaze-usv","r":"Europe","c":"Naval drones","st":"Official claim","time":"26 Oct","t":"France's DGA takes SMOKERS kamikaze boat from concept to sea trials in six months","s":"The roughly 40-knot composite boat is meant to cost tens of thousands of euros; the Navy has not yet decided to buy it.","p":["France's defence procurement agency DGA has taken the SMOKERS low-cost kamikaze uncrewed surface vessel from concept to sea trials in about six months, Naval News reported on 26 October. Project management was led by the CERDAN expert centre at DGA Naval Techniques in Toulon, which built the first prototype and its remote-control suite, while DGA Hydrodynamic Techniques designed the hull and developed the SMOKERS V1.0 version and its composite production.","The boat has a resin-fibreglass hull and ordinary outboard motors like those on rigid inflatable boats, and runs at around 40 knots in varied sea states. The warhead is described only as enough to inflict significant damage on a first-rate warship, with a 3D-printed pyrotechnic system; mass and range are not given. Target unit cost is a few tens of thousands of euros. The operational grey version carries infrared sensors, satellite antennas and a payload compartment; a white target variant omits them.","Four sea-trial campaigns have been completed in Toulon and Cherbourg, including detectability tests against French Navy sensors. Three boats took part in the WildFire 2026 counter-drone exercise, operating from the destroyer Chevalier Paul, the helicopter carrier Tonnerre and the supply ship Jacques Stosskopf. The DGA owns the design and wants many small yards, including leisure-boat builders, to build it."],"cav":"The programme is funded from DGA's own resources, and procurement is undecided: a Navy buy would come only 'if the French Navy proceeds', and industrialisation talks have just begun. Range and warhead size are undisclosed.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/france-smokers-kamikaze-usv/"]]},
{"id":"nn-aksungur-aselbuoy-turnas26","r":"Middle East","c":"Anti-submarine","st":"Reported","time":"26 Oct","t":"Turkish Aksungur drone drops ASELSAN sonobuoys for the first time during TURNAs-26","s":"Three passive aselBUOY 100P sonobuoys were released off Antalya; details come mainly from Turkish Aerospace video and a TRT report.","p":["Turkish Aerospace's Aksungur medium-altitude drone has released ASELSAN aselBUOY sonobuoys during the Turkish Navy's TURNAs-26 exercise, Naval News reported on 26 October. The exercise, which the article describes as the navy's first built entirely around uncrewed systems, runs 19–27 October in the Gulf of Antalya and the eastern Mediterranean, with 18 ships, 11 aircraft, 41 systems from 17 companies and about 1,300 personnel.","According to the report, the Aksungur flew about 400 km from Ankara under satellite control, descended to 1,000 ft to drop three aselBUOY 100P passive sonobuoys (plus one more in a pod), then climbed to 6,000 ft and stayed on station for roughly four hours. Acoustic data were relayed to the Ankara ground station, where underwater targets were reportedly detected. The 100P is a NATO A-size, 10 kg, 120 mm passive directional buoy that listens at 30 m or 150 m depth, transmits up to 20 km and scuttles after up to eight hours.","The article says this is the first aselBUOY drop from an unmanned aircraft. It also notes Baykar's TB3 released two sonobuoys from the carrier TCG Anadolu in September 2026 and again at TURNAs-26."],"cav":"Test details rest on Turkish Aerospace video screenshots and TRT; the 'first' is Naval News's characterisation, the 400 km is approximate, and no detection ranges or results were published. The headline says UCAV but the body treats it as a UAV.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/aksungur-ucav-drops-aselbuoy-sonobuoys-for-the-first-time/"]]},
{"id":"nn-navantia-avante-7-neom","r":"Middle East","c":"Naval","st":"Company claim","time":"25 Oct","t":"Navantia launches the seventh Avante corvette for Saudi Arabia","s":"The ship, reportedly to be named NEOM, is the second of three in a batch contracted in 2025; the last is due in 2029.","p":["Navantia launched the seventh corvette for the Royal Saudi Naval Forces on 25 October at its Bay of Cádiz yards, Naval News reported. The ship is reportedly to be named NEOM and is the second of a three-ship batch contracted in 2025, after five units built between 2019 and 2024. The ceremony was led by RSNF Chief of Staff Vice Adm. Mohammed Bin Abdulrahman Al-Ghuraybi and Navantia chairman Ricardo Domínguez.","The first ship of the batch will be delivered in Spain; the second and third go to Saudi Arabia for combat-system installation and testing, as with the fourth and fifth ships of the earlier contract. The last ship is scheduled for delivery in 2029. An implementing agreement with the Spanish Navy covers logistics support, crew training and an evaluation period at Rota. Navantia estimates around 4 million working hours and an average of 2,200 skilled jobs a day, with more than 20 subcontractors and 50 suppliers.","The ships are identical to the first batch (Avante 2200) and use Navantia's HAZEM combat system, Hermesys communications, Dorna fire control and Minerva bridge, with MTU engines and Schelde gearboxes."],"cav":"The report is largely based on a Navantia press release. Contract value, signing date and the first ship's delivery date are not given.","src":[["Naval News","https://www.navalnews.com/naval-news/2026/10/navantia-launches-seventh-avante-corvette-for-saudi-arabia/"]]},
{"id":"pn-liaoning-japan-oct","r":"Far East","c":"Naval","st":"Reported","time":"25 Oct","t":"Brazilian blog recounts Liaoning carrier group's mid-October passage past Japan's southwest islands","s":"Poder Naval (a Portuguese-language blog) relays Japanese Joint Staff and PLA Navy statements; its timeline contains an inconsistency.","p":["Poder Naval, a Portuguese-language Brazilian naval blog, reported on 25 October on the Chinese carrier Liaoning's recent movements near Japan, citing Japanese Joint Staff statements and a Chinese Navy statement relayed by Xinhua. The group included two Renhai-class guided-missile destroyers (hull numbers 103 and 104) and a Luyang III destroyer, 123.","Japan says the group was seen around 11:00 on 13 October about 390 km southwest of the Danjo Islands, heading south. On 14 October it passed between Okinawa's main island and Miyako into the Pacific and was about 250 km south of Ishigaki. The Joint Staff counted about ten take-offs and landings by fighters and helicopters and said the group was later heading toward the South China Sea. The destroyer Yugiri, P-1 and P-3C patrol aircraft and fighters monitored it. The PLA Navy called the movement part of its annual training plan, not aimed at any country. The timing fell days before the US-Japan Keen Sword exercise (19–29 October), which the blog notes without claiming a link."],"cav":"The blog's account says the group crossed into the Pacific on 14 October yet was heading for the South China Sea on 15 October, which it does not reconcile; positions are approximate. Reader comments about aircraft numbers are unverified and not used.","src":[["Poder Naval (Portuguese)","https://www.naval.com.br/blog/2026/10/25/china-demonstra-poder-naval-perto-do-japao-com-o-porta-avioes-liaoning/"]]},
{"id":"gaza-deir-al-balah-yellow-line","w":"Gaza","c":"Operations","st":"Reported","time":"26 Oct","t":"Israeli armour reportedly pushes west of Gaza's Yellow Line near Deir al-Balah as 13 are killed in a day","s":"The New Arab cites unnamed sources and civil defence; no Israeli military statement on the advance is quoted.","p":["Israeli tanks and military vehicles moved further west of the 'Yellow Line' in central Gaza on the morning of 26 October, The New Arab reported, citing unnamed sources. Eyewitnesses in eastern Deir al-Balah described heavy gunfire at dawn followed by vehicles and bulldozers entering an area where hundreds of displaced families are sheltering. In the afternoon an Israeli strike on a vehicle in Deir al-Balah reportedly killed two people.","Gaza civil defence spokesman Mahmoud Bassal said at least 13 people were killed and about 60 wounded by Israeli fire and air strikes over the previous 24 hours. The Israeli military, quoted by other outlets, said strikes on Sunday killed three operatives, including a Hamas sniper, and described recent targets as people building up Hamas's force and civil control.","The Yellow Line was set up under the US-brokered ceasefire of October 2025 to separate Israeli-held areas from the rest of the Strip, and estimates now put Israeli control at close to two-thirds of the territory. A resident told the outlet the army has crossed the line several times in the past week and fears a gradual westward shift; an analyst linked the activity to Israel's election, which the article says is due on Tuesday. That link is the analyst's opinion."],"cav":"Casualty figures come from Gaza civil defence and cannot be independently verified; the advance rests on unnamed sources and residents, with no Israeli military comment quoted on it.","src":[["The New Arab","https://www.newarab.com/news/israel-army-advances-beyond-gazas-yellow-line-15-killed"]]},
{"id":"houthi-east-west-pipeline-riyadh-airport","w":"Iran and Gulf","c":"Strikes","st":"Official claim","time":"26 Oct","t":"Houthis claim strikes on East–West pipeline pumping stations and Riyadh airport; coalition says it hit launchers in Sanaa","s":"Militarnyi relays Reuters; there is no Saudi confirmation of damage, and the 1,200 km pipeline is the main export route that avoids Hormuz.","p":["The Houthis said they struck oil pumping stations on Saudi Arabia's East–West Pipeline and King Khalid International Airport in Riyadh, Militarnyi reported on 26 October, relaying Reuters. The pipeline, about 1,200 km long, is an alternative way to export Middle Eastern oil without passing through the Strait of Hormuz, which is why attacks on it matter for energy markets.","The Saudi-led coalition responded by saying it destroyed two ballistic-missile launchers in Sanaa, one of which it said had been used against the capital. It also reported a series of strikes on Houthi facilities that destroyed five tunnels used to store missiles, four launchers and ammunition depots.","The report gives no damage assessment, casualty figures, number of stations hit, timing, or any disruption to oil flows or flights."],"cav":"Both sides' accounts are unverified claims. No Saudi statement on the alleged attacks, and no independent confirmation of damage or of the coalition's results, is given.","src":[["Militarnyi","https://militarnyi.com/en/news/houthis-attack-east-west-oil-pipeline-an-alternative-export-route-bypassing-the-strait-of-hormuz/"]]},
{"id":"hegseth-patriot-nasams-signature","w":"Ukraine","c":"Air defence","st":"Reported","time":"26 Oct","t":"Zelensky says Ukraine has waited nearly a month for Hegseth to sign off Patriot and NASAMS missile deliveries","s":"Ukraine says only 24 Patriot missiles arrived from the US in 90 days; the Pentagon has not responded in the source.","p":["President Volodymyr Zelensky said on Facebook that he has been waiting nearly a month for US Secretary of War Pete Hegseth's signature on missile deliveries for the Patriot and NASAMS air-defence systems, Militarnyi reported on 26 October. Contracts for Patriot missiles are reportedly on Hegseth's desk, and Washington is also said to be holding up missiles Ukraine has already paid for. Zelensky added that Kyiv is working with European and other partners holding PAC-2 and PAC-3 stocks and has told his team to raise the matter again with the US.","An unnamed senior Ukrainian official called the awaited batch 'significant' and said it is hard to call it a monthly delivery, since no standard monthly quantity exists. Militarnyi says the US transferred only 24 Patriot interceptors in the past 90 days, and quotes Zelensky comparing that with about 2,000 missiles he says were used in the first 48 hours of the Middle East war.","NASAMS also depends on US missiles: the AIM-120 AMRAAM, the extended-range AMRAAM-ER and the AIM-9X Sidewinder Block II."],"cav":"The delay is described by Ukrainian officials only. Hegseth and the Pentagon are not quoted, and the size, value and specific contracts of the pending batch are not given.","src":[["Militarnyi","https://militarnyi.com/en/news/ukraine-waiting-month-hegseth-signature/"]]},
{"id":"helsing-contra-ad1-ad2","r":"Europe","c":"Air defence","st":"Company claim","time":"26 Oct","t":"Helsing presents Contra, an AI-run air-defence system, with AD-1 Inferno and AD-2 Ambush interceptors","s":"The Berlin presentation gave no ranges, prices or customer; the interceptors are still in testing, though Helsing says a supply contract is signed.","p":["Helsing presented Contra, an air-defence system that independently controls interceptors, at its new Berlin office, Militarnyi reported on 26 October. The company says it can detect and engage hundreds or thousands of aerial targets, including drones and missiles, fusing sensor and effector data into one picture and deciding on interceptions autonomously while humans keep oversight. It runs on Helsing's Altra platform, takes radar, electro-optical, infrared and acoustic sensor feeds through open interfaces, works with SitaWare and national combat management systems, and is designed to keep operating under electronic warfare or lost links.","Two new interceptors accompany it. The AD-1 Inferno is a jet-powered interceptor that launches on detection, can loiter, operate in swarms and re-engage, and is meant for mass production in Europe. The AD-2 Ambush is a solid-fuel rocket for high-altitude, high-speed targets and subsonic cruise missiles beyond AD-1's reach. Both are said to use radar seekers built from commercial components, with mid-course guidance from Contra's ground radars and AI-optimised flight paths.","Contra can also command third-party interceptors, lasers, guns and net systems, as well as Helsing's HX-1 and HX-2 strike drones used by Ukraine. Helsing says it has signed a contract to supply Contra, but AD-1 and AD-2 remain in testing."],"cav":"Everything is the company's description from a presentation. No range, speed, altitude, unit cost, contract value, customer or delivery date was disclosed, and no test results were shown.","src":[["Militarnyi","https://militarnyi.com/en/news/helsing-contra-autonomous-ai-controlled-air-defense-system/"]]},
{"id":"helma-p-charles-de-gaulle","r":"Europe","c":"Directed energy","st":"Reported","time":"26 Oct","t":"French carrier Charles de Gaulle tests the HELMA-P laser anti-drone system on its flight deck","s":"The trial ran on 4–8 June during the La Fayette 26 mission, per French Navy magazine Cols Bleus; the report is second-hand and partly inconsistent.","p":["The aircraft carrier Charles de Gaulle tested the HELMA-P laser anti-drone system on its flight deck during the La Fayette 26 mission, Militarnyi reported on 26 October, citing the French Navy magazine Cols Bleus via Zone Militaire. The trial ran from 4 to 8 June, with the ship operating in the Gulf of Oman. A team from the Centre for Military Aviation Expertise (CEAM) and the ground-based air-defence division fitted the system in about four hours. It comprises a camera turret, a LIDAR, a laser emitter, a cooling unit and a control console.","HELMA-P (High Energy Laser for Multiple Applications – Power) has been developed by CILAS since 2017 under the L2AD programme to counter small drones. It passed ground tests in 2020 and 2021, helped protect the 2024 Paris Olympics and was first tried at sea on the frigate Forbin in June 2023. Militarnyi compares it with the LOCUST laser trialled on USS George H.W. Bush in October 2025."],"cav":"Militarnyi notes that Cols Bleus called this the first shipboard test while earlier sea trials are documented, and that its 'docked' wording for the Gulf of Oman is unexplained. No engagement results or power figures were published.","src":[["Militarnyi","https://militarnyi.com/en/news/france-tests-helma-p-laser-anti-drone-system-aboard-charles-de-gaulle-aircraft-carrier/"]]},
{"id":"sweden-saildrone-baltic-360","r":"Europe","c":"Maritime","st":"Company claim","time":"26 Oct","t":"Sweden picks Saildrone to run four Voyager uncrewed boats on a 360-day Baltic surveillance mission","s":"It is the first national use of Saildrone under the NORDEFCO framework; Naval Today gives no price.","p":["Sweden's Defence Materiel Administration (FMV) has chosen Saildrone to operate four Voyager uncrewed surface vessels for 360 days to monitor Swedish territorial waters and its exclusive economic zone in the Baltic Sea, Naval Today reported on 26 October. It is the first national deployment under the Nordic Defence Cooperation (NORDEFCO) framework, which lets members buy Saildrone maritime-awareness services quickly.","The vessels will patrol continuously and feed real-time maritime intelligence to the Swedish Armed Forces. Saildrone runs the service, handling maintenance, deployment and tasking, so Sweden need not commit extra crewed ships. FMV project manager Johan Wahren called it a persistent maritime surveillance service.","Saildrone has also registered four Voyager vessels in Denmark under the Danish flag, and says more will be flagged in the coming weeks and that further national deployments will follow."],"cav":"Details come from the company and FMV statements as relayed by Naval Today. Contract value, start date and sensor fit are not given, and the 'more deployments will follow' line is the company's expectation.","src":[["Naval Today","https://www.navaltoday.com/2026/10/26/sweden-selects-four-saildrone-usvs-to-monitor-baltic-sea"]]},
{"id":"taiwan-artillery-drone-restructure","r":"Far East","c":"Land","st":"Reported","time":"26 Oct","t":"Taiwan to reorganise artillery and field more drone units, citing HIMARS and M109 crews of three","s":"The Defense Post relays an unnamed official quoted by the Taipei Times; part of the air-defence plan depends on a $14bn US arms package not yet approved.","p":["Taiwan is restructuring its army to add firepower while relying less on large troop numbers, The Defense Post reported on 26 October, citing an unnamed defence official quoted by the Taipei Times. The 6th, 8th and 10th army corps will reorganise artillery as they introduce HIMARS and M109 self-propelled howitzers, which need three crew compared with nine to eleven for a towed gun. The freed personnel will let rocket-artillery companies grow into battalions.","Drone units will come under corps artillery headquarters, with reconnaissance aircraft, attack drones, guns and rocket launchers linked by a digital network. Army drone battalions will field reconnaissance and first-person-view drones from the National Chung-Shan Institute of Science and Technology and Altius-600M loitering munitions, with Altius-700M and Altius-600ISR on order.","The navy's Littoral Combat Command will form a fourth combat group with its own drone units, and the Air Force Security Guards will grow into a brigade-sized force with Stinger and Kestrel weapons to protect bases against Chinese drones and special forces. Extra air-force units for PAC-3 MSE and NASAMS depend on Washington approving a $14 billion arms package."],"cav":"Based on a single unnamed official quoted second-hand; unit numbers, timelines and budgets are not given, and the air-defence expansion is conditional on US approval.","src":[["The Defense Post","https://thedefensepost.com/2026/10/26/taiwan-artillery-drone-units/"]]},
{"id":"pascagoula-sub-propulsor-facility","r":"Oceania","c":"Submarines","st":"Reported","time":"26 Oct","t":"US and Australia break ground on a $60m submarine propulsor facility in Mississippi, with Australia paying $22m","s":"The 38,000 sq ft site at Fairbanks Morse Defense's Bird-Johnson plant in Pascagoula supports AUKUS industrial capacity.","p":["The United States and Australia have broken ground on a $60 million submarine manufacturing facility in Pascagoula, Mississippi, The Defense Post reported on 26 October. It is the third centre of excellence at Fairbanks Morse Defense's Bird-Johnson Propeller Company site, covers 38,000 square feet and will make propulsors, propellers and rotors for several submarine and shipbuilding programmes. Australia is funding $22 million of it.","Representatives of the US Navy's Team Submarine and the Australian Mission to the United States attended. The project falls under Australia's commitment of $3 billion to expand US submarine production and maintenance, of which the first $2 billion was paid in 2025. AUKUS plans include selling Virginia-class submarines to Australia and helping it build a nuclear-powered submarine capability in the early 2030s."],"cav":"Figures are from the report on the groundbreaking; completion date and output rates were not given, and the link to specific Australian boats is not stated.","src":[["The Defense Post","https://thedefensepost.com/2026/10/26/australia-us-submarine-manufacturing-expansion/"]]},
{"id":"israel-cyprus-opv-deal","r":"Middle East","c":"Naval","st":"Official claim","time":"26 Oct","t":"Israel and Cyprus sign deal for a new offshore patrol vessel built by Israel Shipyards","s":"The vessel will carry Rafael systems and the existing OPV Ioannides is to be upgraded; value and delivery date are not disclosed.","p":["Israel's Ministry of Defense and Cyprus's Ministry of Defence signed an agreement for Israel to supply a new offshore patrol vessel, Naval Today reported on 26 October. The signatories were Maj. Gen. (res.) Amir Baram, director general of the Israeli ministry, and Stelios Kountouris, acting permanent secretary of the Cypriot ministry.","Israel Shipyards will build the ship, fitted with Rafael defence systems, and the systems of Cyprus's existing Israel Shipyards-built OPV Ioannides will be upgraded. The announcement says the deal strengthens the Cyprus Naval Command's ability to respond to maritime security challenges, with expanded patrol, surveillance and search-and-rescue missions."],"cav":"A government announcement relayed by Naval Today; the contract value, schedule and vessel specifications were not published.","src":[["Naval Today","https://www.navaltoday.com/2026/10/26/israel-and-cyprus-sign-deal-for-offshore-patrol-vessel"]]},
{"id":"iran-arash-upgrade-100kg","r":"Middle East","c":"Drones","st":"Official claim","time":"26 Oct","t":"Iranian state media says upgraded Arash drone carries a 100 kg warhead; a jet version is in development","s":"Military Review (Russia) relays IRIB, Fars and Tasnim; no flight-test data, range or production numbers were published.","p":["Iranian state television IRIB and the Fars agency reported on 22 October that the Arash one-way attack drone has been upgraded, with the warhead of one variant raised from 50 kg to 100 kg and improved high-explosive and incendiary warheads, according to a Military Review article by Anatoly Blinov. An army spokesman said the range of navigation without GPS is growing and accuracy is improving with artificial intelligence, without saying what the AI does. A jet-powered version is said to be in development, with no specifications. Foreign media call the upgraded model Arash-3, but the sources do not clearly tie the pictures and figures to one aircraft.","IRIB footage showed assembly lines with army commander-in-chief Maj. Gen. Amir Hatami, who spoke of expanding facilities and training with universities and companies. The earlier Arash-2 is described as a tailless delta-wing drone with a piston pusher engine and a booster, with reported ranges of around 1,400 to 2,000 km for earlier versions. The article also lists Artesh claims of Arash strikes on US-linked targets in the UAE, Kuwait and Bahrain during the war, which it stresses are claims and do not confirm damage."],"cav":"All performance figures are Iranian state claims, relayed by a Russian outlet; the 2.3x lethality estimate has no stated method, and no production or cost data exist.","src":[["Military Review (en.topwar.ru)","https://en.topwar.ru/292304-iranskij-arash-posle-modernizacii-tjazhelaja-boevaja-chast-i-novye-sistemy-navedenija.html"]]},
{"id":"ru-ochamchire-grain-containers","r":"Russia","c":"Maritime","st":"Reported","time":"26 Oct","t":"Russia reportedly eyes Abkhazia's Ochamchire naval base for container grain exports as Ukrainian strikes hit ports","s":"Bloomberg (via Militarnyi) cites anonymous sources and a logistics firm; the plan is a proposal under consideration, not an official decision.","p":["Russia plans to use the Ochamchire naval base in occupied Abkhazia, Georgia, to export grain, Militarnyi reported on 26 October, relaying Bloomberg of 23 October. The logistics operator Modern Way proposed shipping grain in containers to Turkey, and several Russian traders and brokers are considering it. Bloomberg says Ukrainian attacks have virtually halted grain shipments from Russia's main export hubs, which once handled about 90% of its exports according to Militarnyi.","The route has drawbacks: the port has limited capacity, and container shipping is costlier than bulk carriers, with a 20-foot container holding about 23 tonnes. A Modern Way employee said the terminal is ready to ship to Gebze, Turkey, with a product-quality service expected by the end of next month. Construction of the container port at the base was completed last year with Russian financial support.","Traders are also sending containers across Russia by rail from St Petersburg to Vladivostok, but those routes have not matched required volumes."],"cav":"Anonymous sources and a company employee are cited; no Russian or Georgian official statement is quoted. The 90% figure is not attributed, and the claim that Ukrainian strikes have halted exports is Bloomberg's and unverified here.","src":[["Militarnyi (citing Bloomberg)","https://militarnyi.com/en/news/russia-grain-ochamchire-naval-base-abkhazia/"]]},
{"id":"ru-filin-cruise-missile","r":"Russia","c":"Missiles","st":"Analysis","time":"26 Oct","t":"Russian state-aligned outlet describes the Filin low-cost cruise missile that Ukrainian intelligence says Russia has used since late summer","s":"Specifications come from Ukraine's HUR wreckage analysis; Russian officials have not commented and serial production is unconfirmed.","p":["Military Review, a Russian outlet, published an overview of the Filin cruise missile after Ukraine's Main Intelligence Directorate (HUR) released wreckage photos, a 3D model, a parts list and estimated characteristics on 22 October. HUR says Russia has used the missile since late summer 2026, a conclusion drawn from debris. The developer is reportedly NPO Molniya, citing Telegram channels Military Chronicle and BMPD.","Published estimates: length up to 3.5 m, wingspan up to 3 m, launch weight up to 210 kg, a 50 or 100 kg warhead, speed up to 800 km/h, ranges of 600–1,200 km, a carbon and fibreglass airframe with some 3D-printed parts, an R500 turbojet and ground launch with a solid booster. HUR counts 35 US-made and 22 Chinese-made components, including a Chinese inertial unit. Russian commentators quoted by Vzglyad see a convergence of jet drones and light cruise missiles.","The article itself warns that the parts list does not establish cost, accuracy or production scale."],"cav":"The figures are Ukrainian intelligence estimates and Russian commentary, not Russian MoD data. No Russian official has commented, and serial production, launch counts and hit rates are unconfirmed.","src":[["Military Review (en.topwar.ru)","https://en.topwar.ru/292214-krylataja-raketa-filin-nedorogoe-sredstvo-bolshoj-dalnosti.html"]]},
